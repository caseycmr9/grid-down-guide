## Coast
### Seaweed
Kelp, dulse, nori, sea lettuce, and many other seaweeds are edible and rich in minerals.
- Gather attached or freshly washed-up seaweed, not rotting piles.
- Avoid water near sewage outfalls, harbors, or oil spills.
- Rinse in treated water, then eat raw, dry, or boil in soup.
- Eat moderate amounts. Seaweed is high in iodine.
- Do not eat unfamiliar tropical seaweeds.

### Shellfish
Mussels, clams, cockles, oysters, limpets, and periwinkles are found at low tide.
- Gather from clean areas away from outfalls.
- Choose live ones. Tap open shells: they should close.
- Cook until the shells open. Throw away any that do not open.
- **Red tide and harmful algae** can contaminate shellfish with toxins that cause tingling, numbness, paralysis, and breathing failure. Heed local closures. If there are none to check, avoid shellfish in discolored water or when fish and birds are dying. The "months with R" rule is not reliable.
- Raw oysters can carry *Vibrio* bacteria. Cook them.
- Avoid the yellow-green organs of crabs and lobsters during algal blooms.

### Tide pool food
Crabs, sea snails, and limpets can be cooked and eaten. Cook crabs alive in boiling water.

## Desert
### Prickly pear cactus (*Opuntia*)
- **Look for:** flat paddles with spines and tiny hair-like spines (glochids). Red-purple pear-shaped fruit.
- **Prepare:** wear thick gloves or use tongs. Burn off or scrape the spines and glochids. Slice and boil or grill the pads. Peel fruits and eat the pulp and seeds.
- Cactus is not a good water source. The liquid is slimy and alkaline.

### Cholla buds
Flower buds of cholla can be roasted or boiled after removing spines by rolling them in sand.

### Mesquite
The sweet, dry pods can be ground into flour. Do not use moldy pods.

### Agave
Roast the heart in a pit for 1 to 2 days. Raw agave sap and leaves can irritate the skin and gut. The cooked heart is sweet and starchy.

### Danger in desert foods
Wild desert gourds and cucumber-like fruits that taste very bitter can contain cucurbitacins that cause severe poisoning. Spit out anything very bitter. Oleander and jimsonweed also grow in deserts ([[deadly-plants]]).

## Arctic and tundra
- **Berries:** crowberry, cloudberry, bearberry, lingonberry, and blueberry are safe.
- **Reindeer lichen:** boil and leach it in water with baking soda or wood ash if you have it. It is poor food. Wolf lichen (bright yellow-green) is poisonous.
- **Labrador tea:** a small amount of leaf tea is traditional. Large amounts are toxic. Avoid during pregnancy.
- **Willow leaves** and inner bark can be eaten in emergencies.
- **Polar bear, bearded seal, and walrus liver** is toxic from vitamin A. Do not eat it ([[game-meat-safety]]).

## Salt
Seawater can be boiled down to make salt ([[making-staples]]).

See also [[fish-cleaning-cooking]] and [[foraging-safety-rules]].

## Do this first
If you touched a plant you think is poison ivy, oak, or sumac:
1. Wash the skin right away with cool running water and soap. The sooner the better, ideally within minutes.
2. Wash under fingernails.
3. Wash clothes, boots, tools, and pets that touched the plant. The oil sticks for weeks to months.
4. Do not scratch. See "Treat the rash" below.

> DANGER: Never burn poison ivy, oak, or sumac. The smoke carries the oil into your lungs and can cause severe, life-threatening breathing problems. Never use them as firewood, skewers, or toilet paper.

## Poison ivy, oak, and sumac
All three contain **urushiol**, an oil that causes an itchy, blistering rash in most people. It is in every part of the plant, even dead plants and roots, and in all seasons.

- **Poison ivy:** "Leaves of three, let it be." Three pointed leaflets, with the middle leaflet on a longer stalk. Edges may be smooth, toothed, or lobed. Shiny or dull. Red in spring and fall. It grows as a ground cover, shrub, or a vine that clings to trees with hairy "rope-like" roots. Berries are greenish-white.
- **Poison oak:** three leaflets with rounded lobes like oak leaves. Shrub or vine, mostly in the West and Southeast.
- **Poison sumac:** swamps and wet areas in the east. Leaves have 7 to 13 smooth-edged leaflets. Drooping clusters of white-gray berries. See [[trees-inner-bark]] for harmless staghorn sumac.

The rash usually shows 12 to 72 hours after contact, lasts 1 to 3 weeks, and is not contagious once the oil is washed off. Fluid from blisters does not spread it.

## Treat the rash
- Cool compresses and cool baths.
- Calamine lotion or 1% hydrocortisone cream.
- An oral antihistamine may help sleep. It does not stop the itch on the skin.
- Oatmeal baths.
- Keep the area clean and covered. Do not pop blisters.

> CALL: Get medical help right away if the rash is on the face, eyes, or genitals, covers a large part of the body, shows signs of infection (pus, fever), or if there is swelling of the face or throat, or trouble breathing.

## Cutting or removing the plant
Wear long sleeves, long pants, gloves, and eye protection. Do not cut vines on trees ("hairy ropes"). Bag the plant and throw it away. Never burn it.

## Stinging nettle
Hairs release an acid that stings for minutes to hours. Wash with soap and water, remove hairs with tape, and rub on dock leaves, plantain leaves, or baking soda paste. Cooked nettle is safe to eat ([[safe-wild-greens]]).

## Giant hogweed, wild parsnip, and cow parsnip
These carrot-family plants carry sap that makes skin extremely sensitive to sunlight. Contact followed by sun causes painful burns and blisters that scar.
- **Giant hogweed:** up to 15 ft (4.5 m) tall, hollow stems with purple blotches and stiff white hairs, and huge umbrella flower clusters up to 2.5 ft (75 cm) wide.
- **Wild parsnip:** yellow flowers.
- **If touched:** wash immediately with soap and cold water. Keep the area out of sunlight for at least 48 hours. Cover it. Get medical care for blisters. Sap in the eyes can cause blindness: rinse for 15 minutes and seek care.

## Other skin hazards
- **Spurges:** milky sap irritates skin and eyes. Do not rub your eyes.
- **Manchineel** (Florida Everglades, the Caribbean): every part is toxic. The sap blisters skin, and even rain dripping from the leaves burns. Do not shelter under it or burn it. The apple-like fruit is deadly.
- **Monkshood:** touching can cause tingling and numbness ([[deadly-plants]]).

## Prevent it
- Learn the plants where you live.
- Wear long sleeves and pants in brush.
- Wash tools and clothes after working in brush.
- Keep pets out of known patches. They carry the oil on their fur.

See [[first-aid-basics]] and [[wound-care]] if skin breaks or becomes infected.
`

## Do this first
Timing changes with your climate and the weather. The seasons below are for temperate North America and are a rough guide. Check the details in a regional field guide. See [[foraging-safety-rules]].

## Wild food in reality
Most wild greens give only 20 to 50 calories per 3.5 oz (100 g). A pound of dandelion greens is about 200 calories. They add vitamins and variety, but you cannot live on them. **Nuts, acorns, starchy roots, and fish and game provide the calories.** Plan for those.

## Seasons
| Season | What to look for | Notes |
|---|---|---|
| Late winter | Maple and birch sap, evergreen needles, rose hips still on the bush, sumac berries, stored nuts | Sap flows when days are above and nights below freezing ([[trees-inner-bark]]) |
| Spring | Dandelion, chickweed, nettle tops, violets, dock, garlic mustard, wild onions and ramps, cattail shoots, spruce tips, fiddleheads, young plantain | Greens are most tender before flowers form |
| Early summer | Strawberries, mulberries, serviceberries, cattail flower spikes and pollen, daylily buds, elderflowers, clover, mallow, purslane, lamb's quarters | Berries begin ([[wild-berries-fruit]]) |
| Late summer | Blackberries, raspberries, blueberries, wild plums, purslane, amaranth, wild grapes | Preserve extra by drying ([[drying-dehydrating]]) |
| Fall | Acorns, walnuts, hickory, hazelnuts, beechnuts, chestnuts, pawpaw, persimmon (after frost), rose hips, crabapples, hawthorn, elderberries, seeds | Peak calorie season ([[wild-nuts-seeds]]) |
| Late fall and winter | Burdock, dandelion and chicory roots, Jerusalem artichokes, groundnuts, cattail roots, pine needle tea | Roots are best after the plant dies back ([[wild-roots-tubers]]) |

## Fiddleheads
Only the fiddleheads of **ostrich fern** are safe to eat, and only when cooked.
- **Ostrich fern:** smooth stalk with a deep U-shaped groove on the inside, brown papery scales that rub off, and a clump of several coiled heads from one crown, often near rivers.
- **Bracken fern:** woolly or fuzzy fiddleheads that come up singly. Bracken contains a suspected carcinogen and is not recommended as food.
- **Cook:** boil for at least 15 minutes or steam for 10 to 12 minutes and discard the water. Raw or undercooked fiddleheads cause illness.

## Preparing wild foods
1. Wash in treated water. See [[water-safety]].
2. Cook greens that are bitter or high in oxalates, such as dock, sorrel, lamb's quarters, and amaranth. Boil 5 to 10 minutes and pour off the water.
3. Leach bitter foods such as acorns until mild.
4. Cook roots and tubers thoroughly.
5. Eat a variety of plants.
6. Dry leaves and berries for storage ([[drying-dehydrating]]) or make soups and teas.
7. Add fat and starch from other sources to make a meal ([[stretching-food]]).

## Ethical harvest
- Take no more than about 10% of any patch, and leave the roots of leafy plants when you can.
- Do not strip rare plants. Ramps and ginseng are slow to recover.
- Ask permission on private land. Laws on public land vary.
- Keep a log of where and when you found each plant. This helps next year.

## Practice now
Pick one new plant each season, learn it with a guide, and taste it safely. In a real emergency, a forager who knows ten plants is far better off than one who has to guess.

## Square corners: the 3-4-5 method
A triangle with sides 3, 4, and 5 units always has a perfect right angle between the 3 and 4 sides.

1. Drive a stake at the corner. Run a string along one wall line.
2. Measure 3 ft (or 6 ft, or 9 ft) along that string and mark it.
3. Run a second string roughly at right angles from the corner.
4. Measure 4 ft (8 ft, 12 ft) along it and mark it.
5. Measure the straight line between the two marks. It must be exactly 5 ft (10 ft, 15 ft).
6. Move the second string until it is, then stake it.

Bigger triangles are more accurate. Use 6-8-10 or 9-12-15 for buildings.

## Check a whole rectangle
Measure both diagonals corner to corner. If they are equal, the rectangle is square. If not, push the long diagonal's corners inward a little and measure again.

## Level without a level
- **Water level:** Fill a clear hose (3/8 in or larger) with water, no bubbles. Water in both ends always sits at the same height. Mark each end at the water line and you have two level points, even around corners and 50 ft apart.
- **Line level:** Hang a small bubble level in the middle of a taut string.
- **A-frame level:** Join three sticks as an A. Stand it on two marks and note where a hanging weight crosses the crossbar. Swap legs end for end. When the string crosses the same spot both ways, mark the middle of that spot. Now it reads level.
- **Plumb (straight up and down):** Hang a weight (plumb bob or a rock) on a string.

## Stakes and string lines
Set a stake at each corner. Stretch strings between them at the height you want the work. Check the 3-4-5 and diagonals before you dig. Move the strings to batter boards (two stakes with a board across, set back 3 ft from each corner) so the strings stay put while you dig.

## Quick math
- Area of a rectangle = length × width.
- Area of a circle = 3.14 × radius × radius.
- Soil or gravel needed in cubic yards = length (ft) × width (ft) × depth (ft) ÷ 27.
- Board feet = thickness (in) × width (in) × length (ft) ÷ 12.
- Diagonal brace or rafter length = square root of (a × a + b × b).
- Roof pitch is rise per 12 in of run. A 6:12 roof rises 6 in for every 12 in across.

## Measuring with your body
Check yours now and write the numbers down.
- A comfortable pace is about 2.5 ft (75 cm). Count double paces for long distances.
- Hand span (thumb to little finger) is about 8–9 in.
- Arm span fingertip to fingertip is about your height.
- A thumb width is about 1 in.

> TIP: Cut a story stick, a board marked with every length of a job (wall height, window opening, stud spacing). Mark and cut every piece from the stick instead of measuring again each time. It prevents most mistakes.

Measure twice, cut once.

    body: `
## Hardwood and softwood
- **Softwoods** (pine, spruce, fir, cedar): lighter, grow fast, split and saw easily. Good for framing, boards, and beams.
- **Hardwoods** (oak, hickory, maple, ash, locust): dense, strong, hard to cut. Good for tool handles, tool parts, flooring, and the best firewood.

## Wood that resists rot
Use these where wood touches the ground or stays wet.

- Black locust (best), osage orange
- Eastern red cedar, juniper, western red cedar
- White oak (the red oaks rot fast)
- Bald cypress, redwood, chestnut

Poor in contact with soil: pine, spruce, fir, maple, birch, ash, beech, red oak. Use them for framing that stays dry and for firewood.

## Real lumber sizes
Store-bought lumber is smaller than its name.

| Name | Actual size |
|---|---|
| 1×4 | 3/4 × 3 1/2 in |
| 2×4 | 1 1/2 × 3 1/2 in |
| 2×6 | 1 1/2 × 5 1/2 in |
| 2×8 | 1 1/2 × 7 1/4 in |
| 2×10 | 1 1/2 × 9 1/4 in |
| 4×4 | 3 1/2 × 3 1/2 in |

Wood you saw from your own logs is true to size. Rough-sawn boards are the full thickness you cut them.

## Drying (seasoning) wood
Green wood is heavy, shrinks, and warps as it dries. Dry before you build furniture or floors.

1. Stack boards or logs off the ground on flat blocks.
2. Put 1 in thick sticks (stickers) between each layer so air flows.
3. Cover the top only, so rain stays off but wind passes through.
4. Paint or wax the ends of logs and boards. Ends dry fastest and crack.
5. Wait. A rough rule is about a year per inch of thickness for hardwood, less for softwood. Do not rush it.

Targets: below 20% moisture for framing and firewood, 12–15% for indoor work. A seasoned log sounds hollow when two pieces are clapped together, and the ends show cracks.

## Splitting versus sawing
Split (rived) wood follows the grain, so it is stronger and sheds water better than sawn wood of the same size. Straight-grained oak, cedar, and chestnut split into fence rails, shakes, and stakes with a froe or an axe and wedges. Sawing gives smooth boards but cuts across the grain.

## Making posts last
- Use rot-resistant species, with the bark stripped.
- Set posts on a flat stone or gravel, backfill with gravel and tamp it so water drains away.
- Keep post tops sloped or capped so rain runs off.
- Charring the buried end helps a little for some people, but evidence is mixed. Species and drainage matter far more.

> WARNING: Never burn pressure-treated, painted, or glued wood (plywood, particle board). It gives off toxic smoke. Wood treated with CCA before 2004 contains arsenic. Do not use it for garden beds, cutting boards, or fuel.

> DANGER: Felling trees kills people every year. Dead branches ("widowmakers"), hung trees, and kickback do it. Never fell a tree alone, in wind, or when tired. If the lean or the surroundings look wrong, leave that tree.

## Before you cut
1. Look up. Check for dead limbs, broken tops, and tangled neighbors. A dead branch can fall when the trunk is hit.
2. Decide the fall direction. A tree falls the way it leans. Do not try to force it more than a few degrees.
3. Check wind. If gusts are strong (about 15 mph or more), wait.
4. Clear brush around the trunk so you can swing and move.
5. Plan two escape paths at 45° angles, behind the fall line. Clear them of brush and rocks.
6. Keep everyone at least 2 tree-heights away.

## Cutting (axe or crosscut saw)
1. **Notch (undercut)** on the side of the fall direction. Cut a wedge about 1/4 to 1/3 of the trunk's diameter deep. The top cut angles down, the bottom cut is level, and they meet cleanly.
2. **Back cut** on the opposite side, level, about 1–2 in (3–5 cm) above the notch's level cut.
3. Stop with a strip of uncut wood about 1/10 of the diameter. This is the hinge. It steers the tree. Never cut through it.
4. As the saw pinches, tap in a wedge behind it. Keep tapping as the tree starts to move.
5. When the tree begins to fall, stop, shout a warning, drop the tool, and walk away along an escape path. Watch the top, not your feet.

## Hung trees and bent trees
- A tree caught in another tree is a trap. Do not walk or work under it. Do not fell a second tree onto it.
- Move it with a long lever or pull it down with a rope and come-along from far away.
- A bent or pinned tree can spring back with force. Cut it slowly from the side, never standing in line with the bend.

## Cutting to length (bucking)
Look at where the log is held up. If it is supported at both ends, the top is in compression: cut a third of the way down from the top first, then finish from the bottom. If it is supported in the middle, cut a third up from the bottom first, then finish from the top. This prevents the saw from pinching.

## Limbing
Stand on the opposite side of the trunk from the limb you cut. Leave limbs that hold the log off the ground until last.

## Splitting
- Use a 6–8 lb maul on a solid chopping block about knee high.
- Stand with feet apart, swing in a smooth arc, and let the weight do the work.
- Aim for cracks. Start from the edges of knotty rounds.
- For stubborn rounds, drive in a steel wedge with a sledgehammer.
- Wear eye protection, keep onlookers back 10 ft, and keep your legs out of the swing path.

## Seasoning and stacking
- Split wood dries much faster than whole rounds.
- Stack in single rows, off the ground, in sun and wind. Cover only the top.
- Softwoods: 6–12 months. Oak and other dense hardwoods: 1–2 years.
- Burn wood under 20% moisture. Wet wood smokes, coats chimneys with creosote, and gives little heat.

## How much do you need?
A full cord is a stack 4 ft high × 4 ft wide × 8 ft long, or 128 cubic feet. A well-insulated home heated mainly by wood can use 3–6 cords a winter; a drafty one more. See [[heating-home]] and [[fire-management]].

> WARNING: An axe cut can sever an artery. Treat bleeding fast with [[severe-bleeding]].
`

    body: `
## Nails
Nail sizes use the "penny" (d) system.

| Size | Length |
|---|---|
| 6d | 2 in |
| 8d | 2 1/2 in |
| 10d | 3 in |
| 12d | 3 1/4 in |
| 16d | 3 1/2 in |
| 20d | 4 in |
| 40d | 5 in |
| 60d | 6 in |

Use a nail about 2 1/2 to 3 times as long as the board it goes through, so about two thirds of it sinks into the second piece. Drive nails at a slight angle toward each other (toenailing) for corners. Pull and straighten old nails, because you cannot make more.

## Screws
Screws hold better than nails and can be backed out. Drill a pilot hole a little thinner than the screw shaft so the wood does not split, and rub soap on the threads. A hand brace with a screwdriver bit drives screws with power.

## Wooden pegs (trunnels)
Dry hardwood pegs (oak, locust) make joints that need no metal. Drill a hole through both pieces, then drive in a slightly oversize, tapered peg. Pegs of 1/2 to 1 in work for beams. In green timber, the wood shrinks tight around a dry peg.

## Basic joints
- **Butt joint:** Two ends meet. Weak. Reinforce with cleats or nails.
- **Half-lap:** Each piece loses half its thickness where they cross. Strong and simple.
- **Notch (saddle):** A round log sits in a notch cut across another. Log cabins use these.
- **Mortise and tenon:** A square tongue (tenon) fits a square hole (mortise). The best frame joint.
- **Scarf joint:** Overlapping angled cuts for lengthening a beam.
- **Wedges:** Drive them into a slot in a tenon end to lock a joint.

### Cutting a mortise and tenon
1. Mark a mortise one third as wide as the timber, centered. Depth about 2/3 of the timber thickness.
2. Drill a row of holes inside the lines to remove most of the waste.
3. Chisel the walls square, working from both faces.
4. Mark the tenon to fit snugly. Saw the cheeks (sides) and shoulders (steps).
5. Test the fit. It should push in by hand and need light taps. Add a peg through the joint.

## Lashing poles together
Lashing uses cord and no nails. Wrap tightly. Frapping turns (wrapped between the poles, across the wraps) pull everything tight.

**Square lashing** (poles cross at right angles): Start with a clove hitch on the upright just below the crossing. Wrap 3–4 turns around both poles, over the horizontal and behind the upright. Make 2–3 tight frapping turns between the poles. Finish with a clove hitch on the horizontal.

**Diagonal lashing** (poles cross at an angle): Start with a clove hitch around both poles at the crossing. Wrap 3 turns one way, then 3 turns the other way across them. Frap between the poles. Finish with a clove hitch.

**Shear lashing** (two poles for an A-frame or bipod): Lay two poles side by side. Start with a clove hitch on one. Wrap 8 loose turns around both. Frap twice between the poles. Finish with a clove hitch. Spread the legs.

**Tripod lashing:** Lay three poles side by side. Wrap loosely around all three, frap between each pair, and spread the legs.

Get the clove hitch and others in [[knots]], and make cord in [[cordage-rope]].

## Glues and other fastening
- **Hide glue** (from animal hides): melt in a double boiler, apply warm.
- **Pine pitch glue:** Melt pine resin gently in a pot set in hot water (never over open flame, it burns fiercely) and mix in a little powdered charcoal.
- **Wire:** Soft steel baling wire twists tight and holds poles, fences, and repairs.
- **Cleats:** A short board nailed across a joint.
`

    summary: 'Build a small weather-tight cabin or shed: foundation, floor, walls, rafters, and roof covering from tarp to metal.',

    body: `
## Order of work
1. Foundation → 2. Floor → 3. Walls → 4. Roof → 5. Make it weather-tight (cover, door, window) → 6. Insulate and add heat.
Get the roof on before the weather turns. A 12 × 16 ft cabin (192 sq ft) is a practical size, the biggest most people can build with hand tools. Check local codes in normal times. Many places exempt buildings up to about 200 sq ft.

## Foundations
Frost depth runs from near zero in the Deep South to 4 ft or more in the North. Ask local builders. Frozen ground heaves a shallow footing.

- **Piers:** Concrete, or flat stones on gravel, at corners and every 6–8 ft. Fast and good for floors off the ground.
- **Skids:** Two rot-resistant timbers on a gravel bed. Good for sheds, easy to move.
- **Rubble trench:** A trench filled with gravel or stones, topped with a timber.
- **Posts in the ground (pole building):** Posts 3–4 ft deep (deeper in cold areas), spaced 8 ft apart. The posts carry the roof, and walls are just fill.

Always shed water away from the base. Slope the ground so it flows away.

## Floor
Joists (the beams under the floor) are laid on edge, 16 in apart on center. About how far they span without help: 2×6 about 9 ft, 2×8 about 12 ft, 2×10 about 15 ft. Check span tables if you can. Cover with 1 in boards or plywood.

## Walls
1. Cut studs 2×4 (or 2×6) to the wall height. Build each wall flat on the floor: bottom plate, studs every 16 in, top plate.
2. Frame door and window openings with a header over the top (doubled 2×6 or 2×8 for openings up to 4 ft).
3. Nail it all, check square (equal diagonals), raise the wall, and brace it with a diagonal board.
4. Add a second top plate overlapping the corners.
5. Cover with sheathing (boards or plywood). Diagonal bracing or sheathing stops racking (walls sliding sideways).

## Roof
Pitch is rise over 12 in of run. 4:12 is the minimum for shingles. 6:12 sheds water and snow well. Steeper is better for snow.

1. Find the rafter length. For a 12 ft wide building with a ridge board in the middle: run = 6 ft. Rise at 6:12 = 3 ft. Rafter = square root of (6 × 6 + 3 × 3) = 6.7 ft, plus overhang.
2. Cut a pattern rafter. Test it, then copy.
3. Nail rafters to the ridge board and to the wall plate. Put collar ties (horizontal boards) across every third pair.
4. Roof rafters at 24 in on center can span about 8 ft (2×6), 11 ft (2×8), or 14 ft (2×10) horizontally with light snow. Use closer spacing or bigger lumber where heavy snow falls. Wet snow can weigh up to 20 lb per cubic foot, so a foot of it puts about 15–20 lb on each square foot.

## Roof coverings
- **Metal:** Lasts decades. Overlap panels and use screws with washers.
- **Split wood shakes:** Overlap like fish scales so every spot has 2–3 layers. Leave gaps of about 1/4 in between shakes so wood can swell.
- **Asphalt shingles:** Salvage when possible. Start at the bottom edge, overlap upward.
- **Thatch:** Needs a steep roof (45° or more) and thickness of about 12 in.

## Why build with earth
Soil, sand, clay and straw are free almost everywhere. Earth walls hold heat and do not burn. They need a good foundation and a roof that keeps the rain off. As builders say, a cob house needs "good boots and a good hat": a dry stone base and a wide roof overhang.

## Find and test your soil
1. Fill a jar a third with soil, add water, shake, and let it settle for a day. Sand falls first (bottom), silt next, clay last and stays cloudy on top.
2. Cob and adobe need roughly 15–25% clay and the rest sand and gravel.
3. Ball test: roll a damp ball the size of a golf ball. If it crumbles, add clay. If it cracks badly as it dries, add sand and straw.

## Cob
1. Mix soil, sand, and chopped straw on a tarp by treading it with bare feet. Add water until stiff but workable, like heavy dough.
2. Build a stone foundation at least 12–18 in above the ground.
3. Stack loaves of cob (cobbits) 12–24 in high in a day, then let the course stiffen before adding more.
4. Push each layer into the one below. Trim sides with a flat stick.
5. Walls should be 18 in (45 cm) thick or more. Leave openings for doors and windows with wooden lintels.
6. Protect the walls with a plaster of clay and sand, or lime plaster. Lime burns skin and eyes, so use gloves and goggles.

## Adobe bricks
Mix as for cob but with less straw. Press it into a wooden mold (about 10 × 14 × 4 in), lift the mold, and let the brick dry in shade 3–4 days then in sun, turning, for 3–4 weeks. Each brick weighs 25–30 lb. Lay with a mud mortar of the same soil.

## Rammed earth
Use a damp mix (it should hold a ball when squeezed and crumble when dropped from waist height). Pack it in 4–6 in layers between sturdy wooden forms, tamping each layer hard. Walls are usually 12–24 in thick.

## Wattle and daub
Weave thin sticks (wattle) between upright stakes. Plaster both sides with a clay, straw and dung mixture (daub). Good for infill walls and small outbuildings.

## Clay bread oven
1. Build a base of stone or brick with a top at about hip height.
2. Lay an insulating layer (clay mixed with straw, or glass bottles in clay) 4 in thick.
3. Lay firebricks on sand for the floor.
4. Pile damp sand into a dome and cover it with wet newspaper.
5. Build a 3–4 in thick wall of clay and sand over the sand dome.
6. Cut the door opening so its height is about 63% of the dome height. This helps smoke leave and air enter.
7. Dig out the sand. Dry slowly with small fires over a week or two.

Fire the oven for 1–2 hours until the black soot inside burns to white, rake out the coals, mop the floor, then bake at 450–500 °F (230–260 °C). It holds heat for hours of baking.

## Rocket mass heaters
A very efficient heater: a hot, clean-burning fire feeds a hot gas path through a heavy cob bench, which stores heat for hours. Only build one from tested plans, and test it with a smoky fire and a smoke match before you rely on it. A leak or blocked flue can fill a room with carbon monoxide.

## Chimney and stove safety (any stove)
- Keep a wood stove at least 36 in (90 cm) from anything that can burn, unless a listed heat shield reduces that.
- Single-wall stovepipe stays at least 18 in (45 cm) from combustible walls.
- The chimney should rise at least 3 ft above the roof where it passes through, and at least 2 ft above anything within 10 ft. This is the 3-2-10 rule.
- Use a masonry or insulated listed chimney through walls and ceilings.
- Install a battery carbon monoxide alarm. See [[heating-home]].

## How a rocket stove works
A rocket stove is a short horizontal tunnel where you feed sticks, leading into a tall insulated vertical chimney (the riser). The hot riser pulls air in fast, the fire burns hot and almost smokeless, and the flame goes straight up to your pot. A handful of twigs can boil a liter of water in about 10–15 minutes.

3. Leave a gap between the riser top and the pot bottom equal to about one quarter of the riser width (about 1 in for a 4 in pipe). Too small chokes the fire, too big wastes heat.

## Bucket rocket stove
You need:
- A steel 5-gallon bucket (not plastic, it melts)

3. Fill the space between pipe and bucket with insulation. Pack it lightly and leave the riser top open.
4. Cut three notches in the bucket top and set the rebar so a pot sits about 1 in above the riser.
5. Place the stove on bare ground or bricks, far from anything that can burn.

## What you can do with sun
Full sun can cook food, dry food, warm water, and heat a room. It costs nothing to run, but it works only with a clear sky and a few hours of sun, so plan around the weather.

## Box solar oven
**Materials**
- Two cardboard boxes, one that fits inside the other with 1–2 in of space all around
- Crumpled newspaper or straw for insulation
- Aluminum foil or reflective sheeting, glued shiny side out
- A sheet of glass or a clear oven bag to cover the top
- A dark, thin metal pot with a lid (dark enamel or blackened by fire). Shiny pots reflect the heat away
- A flap of cardboard covered with foil as a reflector

1. Set the small box inside the big box. Fill the gap on the sides and bottom with crumpled newspaper.
2. Line the inside with foil, shiny side up, glued smooth.
3. Make a hinged lid from the top flaps and cover the inside with foil. Prop it up at an angle so it reflects sunlight into the box (the reflector).
4. Fit the glass over the top opening, or stretch an oven bag across it. This traps heat.
5. Set a dark pot with food inside, close, and aim the box at the sun. Turn it toward the sun every hour.

**Use**
- A well-made box cooker reaches 250–300 °F (120–150 °C) in strong sun.

## Panel cooker
Fold a big piece of foil-covered cardboard into a bowl shape around a dark pot placed inside a clear oven bag. It is cheaper, lighter, and works for a pot of rice or beans. It reaches 200–250 °F (95–120 °C).

## Solar dehydrator
1. Build a shallow wooden box about 2 × 4 ft with vent holes along the bottom (air in) and the top (air out).
2. Paint the inside flat black. Cover the top with glass or clear plastic.
3. Set trays of food-safe screening (stainless steel or plastic mesh, not galvanized or aluminum) inside, off the floor.
4. Tilt the box toward the sun. Warm air rises through the food and out the top vent.

6. Bring food in at night. See [[drying-dehydrating]].

## Solar water heating
- Fill a black bag or black-painted metal tank and leave it in the sun. It may warm 20–30 °F above air temperature in a few hours.

- South-facing windows (in the Northern Hemisphere) let in winter sun. Put dark stone, brick, or water barrels behind them to store heat.

- **Width:** 4 ft maximum, so you can reach the middle from either side without stepping in.
- **Length:** Any, 8 ft is easy with standard lumber.
- **Height:** 8–12 in is a good start. 18 in or more helps poor soil or sore backs.
- **Wood:** Rot-resistant cedar, black locust, or oak, about 2 in thick. Avoid creosote railroad ties and any CCA (pre-2004) pressure-treated lumber.
- **Paths:** 2–3 ft wide, wide enough for a wheelbarrow.

- Teepee: Lash 4–6 poles (6–8 ft) at the top and spread the bottoms in a circle. Plant pole beans around it.

A bottomless box 3 × 6 ft with a clear sloped lid (an old window). Make the back 18–24 in and the front 12–16 in high, facing south. Prop the lid open on warm days (above 70 °F / 21 °C) or plants cook. See [[season-extension]].

- **Deer:** 8 ft high, or two 4 ft fences about 4 ft apart.
- **Rabbits:** 2 ft tall chicken wire with the bottom 6 in bent outward under the ground.
- **Gophers and moles:** Line the bed bottom with 1/2 in hardware cloth.
- Set posts 8–10 ft apart. Brace the corners.

A pile needs a size of about 3 × 3 × 3 ft to heat up. Wire four pallets together with one side hinged for turning. A three-bin system (new, cooking, finished) lets you rotate. See [[compost-fertilizer]].

- Roosts: 8–12 in of bar per bird, set higher than the nest boxes.

## Lever
A lever is a stiff bar over a pivot (fulcrum).

**Mechanical advantage = length of bar on your side ÷ length on the load side.**

Example: a 6 ft pry bar with the pivot rock 1 ft from the load. You push on 5 ft. Advantage = 5. Your 100 lb push lifts about 500 lb.

- Put the pivot as close to the load as you can.
- Lift a little, slide a block under the load (cribbing), repeat. Never put your hands or feet under it.
- A wheelbarrow is a lever, too. Put the load over the wheel and your hands at the end.

## Pulleys and block and tackle
- A fixed pulley only changes the direction of pull.
- A movable pulley attached to the load halves the effort.
- A block and tackle (two sets of pulleys) gets an advantage about equal to the number of rope strands holding the moving block. Four strands: about 4:1 on paper, about 3:1 in real life because of friction.
- You pull four times as much rope as the load rises.

Use rope with a safe working load of at most one fifth of its breaking strength, and treat old or unknown rope as weak. Never stand under a hanging load. See [[knots]] for the trucker's hitch.

## Come-along and snubbing
A ratchet winch (come-along) pulls a heavy load with a short handle. For a lowering load, wrap rope 3 turns around a post or tree and let it slide through your hands: friction lets one person hold thousands of pounds.

## Ramps (inclined plane)
Advantage = ramp length ÷ height. A 12 ft ramp up to a 3 ft trailer gives 4:1. Keep ramps no steeper than about 20° and stable.

## Rollers and sledges
- Lay logs or pipes crossways. Roll the load over them and move rollers from back to front.
- Drag a heavy load on a flat sledge or boat-shaped skid. Wet the ground or use snow for slide.
- To move a tall object, tilt it onto one edge and pivot it ("walk" it) a few inches at a time.

## Tripod hoist
Lash three strong poles into a tripod (see [[fasteners-joinery]]), and hang a pulley from the top. It lifts a bucket from a well, a deer carcass, or a log. Spread the legs wide and tie them so they cannot slide.

## Weights to know

| Material | Weight |
|---|---|
| Water | 8.3 lb per gallon (1 kg per liter) |
| Dry sand | about 100 lb per cubic foot |
| Gravel | about 100 lb per cubic foot |
| Dry soil | about 75–100 lb per cubic foot |
| Wet clay | 110–130 lb per cubic foot |
| Concrete | about 150 lb per cubic foot |
| Seasoned oak | about 45–50 lb per cubic foot |
| Seasoned pine | about 25–35 lb per cubic foot |
| Steel | about 490 lb per cubic foot |

A cubic yard of dry soil weighs roughly 2,000–2,500 lb.

## Lift without hurting yourself
- Bend knees, keep your back straight, hold loads close.
- Do not twist while lifting.
- One person should not lift more than about 50 lb repeatedly. Get a second person or use a lever.

## Carts and wheelbarrows
A wheelbarrow with a pneumatic tire carries 150–200 lb. Large wheels roll more easily over rough ground. Put heavy loads over the axle. Keep a patch kit and a hand pump. See [[getting-around]] for bicycle and cart use.

    body: `
Practice each knot now with a 3 ft piece of cord until you can tie it without thinking. A knot weakens a rope, often by a third or more.

> WARNING: Never trust a knot you have only read about with a load that can hurt someone (climbing, hoisting people, overhead loads). Practice, test it low to the ground, and check it every time.

Terms: the **standing part** is the long, load-bearing end. The **working end** (tail) is the end you tie with. A **bight** is a U-shaped bend. A **turn** is one pass around an object.

## 1. Square knot (reef knot)
Joins two ends of equal-size rope. Good for bandages and bundles. Not for loads that matter.
1. Hold one end in each hand.
2. Cross the right end over the left, tuck it under, and pull.
3. Now cross the left end (the one that ended on the left) over the right, tuck it under, and pull.
4. "Right over left, left over right." It should lie flat with each end beside its own standing part. If it looks twisted, it is a granny knot and can slip.

## 2. Bowline
Makes a loop that will not slip or tighten. Easy to untie.
1. Hold the standing part. Twist a small loop (the "hole") so the working end is on top.
2. Pass the working end up through the loop ("the rabbit comes up out of the hole").
3. Go behind the standing part ("around the tree").
4. Go back down through the loop ("back into the hole").
5. Hold the tail and the loop and pull the standing part to tighten.
Leave a tail of at least 4 in (10 cm). A bowline can work loose if the rope goes slack, so add a stopper knot on the tail for important jobs.

## 3. Clove hitch
Quickly ties a rope to a post, pole, or rail. The base of most lashings.
1. Pass the rope around the post.
2. Cross over the standing part and wrap around the post a second time.
3. Tuck the working end under that second wrap, between the wraps.
4. Pull both ends snug.
It can slip if the load goes on and off. Back it up with two half hitches.

## 4. Two half hitches
Ties a rope to a ring, post, or tree. Strong and quick.
1. Pass the working end around the object.
2. Take the end around the standing part, then up through the loop you made. Pull snug (one half hitch).
3. Do the same again beside the first.
4. Slide both tight against the object.

## 5. Taut-line hitch
An adjustable loop for tent guy lines and ridgelines. It slides when you move it and grips when loaded.
1. Pass the end around a stake or tree and bring it back alongside the standing line.
2. Wrap the end twice around the standing line, working toward the stake (inside the loop).
3. Make one more wrap around the standing line on the far side of the first two, away from the stake. Tuck the end under that last wrap.
4. Pull it snug. To adjust, slide the knot along the line.
It grips poorly on very slick rope.

## 6. Sheet bend
Joins two ropes of different thickness.
1. Make a bight (U) in the thicker, stiffer rope.
2. Pass the end of the thinner rope up through the U.
3. Go behind both parts of the bight.
4. Tuck the end under its own standing part and pull tight.
For slippery or very different ropes, take an extra turn around the bight (double sheet bend).

## 7. Figure-eight
A stopper at the end of a rope so it cannot slip through a hole or pulley. Easy to untie even after a heavy load.
1. Make a loop.
2. Take the working end around behind the standing part.
3. Pass it back down through the loop from the front.
4. Pull tight so it makes a figure 8.
**Figure-eight follow-through** makes a strong loop: tie a loose figure-eight with a long tail, pass the tail around a tree or ring, and trace the same path back through the knot with the tail. Snug each strand.

## 8. Trucker's hitch
Pulls a line tight, giving about a 3:1 mechanical advantage. Use for tarps, loads, and ridgelines.
1. Make a slip knot in the standing part a few feet from the anchor: form a loop, push a bight of rope through it, and pull it snug. You now have a loop in the middle of the line.
2. Pass the working end around the anchor (a tree, post, or hook), and bring it back up through the loop.
3. Pull down hard on the working end. The loop acts as a pulley and cinches the line.
4. Holding tension, tie two half hitches around the standing line near the loop to lock it.

## 9. Double fisherman's knot
Joins two ropes or cords of any thickness and is very hard to slip. Good for slick cord and fishing line (add a third wrap for monofilament).
1. Lay the two ends side by side, overlapping about 12 in.
2. With end A, wrap twice around the other rope and tuck the end back through its wraps. Pull snug.
3. Do the same with end B around rope A, in the opposite direction.
4. Pull on both standing parts. The two knots slide together and lock. Leave tails of 3 in or more.

## 10. Whipping (stops frayed ends)
1. Cut a 12 in piece of thin cord. Lay a loop of it along the end of the rope, with the loop pointing toward the rope end.
2. Wrap the working part tightly around the rope and loop, working toward the end, for about 1 1/2 times the rope's diameter.
3. Pass the working end through the loop.
4. Pull the tail at the other end to drag the loop under the wraps. Trim both ends.
For nylon rope, you can also melt the end with a flame. Press the soft end flat with a wet finger only after it has cooled for a few seconds, because molten nylon burns skin badly.

See [[cordage-rope]] to make your own rope, and [[fasteners-joinery]] for lashings.
`

## Why cordage matters
Cord ties shelters, lashes tools, makes snares, fishing line, bowstrings, nets, and sewing thread. Learn it now.

## Sources of fiber
- **Inner bark** (the stringy layer under the outer bark): basswood (linden), cedar, willow, mulberry, slippery elm.
- **Stalk fibers:** dogbane (Indian hemp), milkweed, stinging nettle, flax, hemp.
- **Leaf fibers:** yucca, cattail leaves, dried grasses, sedges.
- **Roots:** spruce and pine roots (split and soaked) are strong.
- **Animal:** sinew, rawhide strips, hair. See [[leather-hides]].
- **Man-made:** paracord, baling twine, shoelaces, strips cut from fabric or plastic bags.

Use bark from fallen or already-cut trees. Stripping a ring of bark from a living tree kills it.

## Prepare the fiber
1. **Stalks (dogbane, milkweed, nettle):** Let dried stalks stand or lie until brittle. Crush them with a stone or mallet and rub or scrape away the woody bits until only silky fibers remain.
2. **Inner bark:** Peel strips, then soak them in water for 1–2 weeks. The layers separate into long ribbons.
3. **Yucca and cattail leaves:** Pound, scrape away the green flesh, and rinse. Dry.
4. Keep all fiber dry until you twist, and slightly damp while twisting.

## The reverse wrap (two-ply cordage)
1. Make a bundle of fibers about as thick as a pencil lead (many thin fibers, not one fat one). Fold it in half and pinch the fold between thumb and finger. You now have two strands.
2. With your free hand, twist the top strand away from you (clockwise).
3. While holding that twist, wrap the twisted top strand over the bottom strand toward you (counterclockwise).
4. Swap: the bottom strand is now on top. Twist it clockwise, then wrap it over the other counterclockwise.
5. Keep going. Each strand twists one way, and the two strands wrap around each other the opposite way. That opposite twist is what stops it from unraveling.
6. When a strand thins to half thickness, lay new fibers alongside it, overlapping about 2 in, and twist them in. Stagger so both strands never run out at once.
7. Finish with an overhand knot.

Twist firmly and keep the thickness even. Weak spots break first.

## Stronger rope
- **Three-strand braid (plait):** Tie three cords at the top. Cross the left cord over the middle, the right cord over the new middle, and repeat. This makes a flat, strong rope that does not twist.
- **Laid rope:** Twist three cords together in the opposite direction to the twist of the individual cords.
- **Doubling:** Hold a loop of cord and twist two strands together to double the strength.

## Paracord
Standard 550 paracord (Type III) has a minimum breaking strength of 550 lb (250 kg) and 7 inner strands. Pull the inner strands out to use as thread, fishing line, or snare wire. The outer sheath keeps the strands protected.

## Leather thong
Cut a spiral from a round of leather or hide, from the outside toward the center, about 1/4–1/2 in wide, to get a very long strip.

## Strength and safety
Good hand-twisted cord of pencil thickness from dogbane or nettle can be very strong, but strength varies. Test every cord with a load close to the ground. Never trust homemade cord to hoist people or heavy loads over anyone's head.

## Care
Natural cord rots when damp. Dry it, store it off the ground, and rub it with beeswax or tallow to resist moisture and rodents. See [[knots]] for tying and [[fasteners-joinery]] for lashing.
`

    body: `
A sharp tool cuts with little force and rarely slips. A dull tool needs more force and is the one that injures you.

## What you need
- A coarse stone (about 200–400 grit) for repairing nicks and a medium to fine stone (1,000–6,000 grit) for finishing. Any fine-grained river stone or flat sandstone works in a pinch.
- Water or a few drops of oil on the stone. Pick one and stick with it.
- A leather strop: a strip of leather or an old belt glued to a board. Cardboard also works.
- A mill bastard file (10–12 in) for axes, shovels, mattocks, and hoes.

## Know the angle
Knives take about 15–20° per side. Lay the knife flat on the stone, then raise the spine until it is about 1/3 of the blade's width above the stone (about 20°) or 1/4 of the width (about 15°). Axes and hatchets take about 20–25° per side. Splitting mauls and wedges stay blunt but should be free of nicks.

## Sharpening a knife
1. Set the stone on a damp cloth so it cannot slide.
2. Wet the stone.
3. Hold the knife at the angle. Push the edge across the stone as if you are slicing a thin layer off it, from the heel to the tip, with light pressure. Keep the angle steady. This matters more than force.
4. Do about 10 strokes on one side.
5. Find the burr: slide a fingertip gently across the edge, away from the edge on the opposite side from where you were sharpening (never along the edge). A fine ridge, like a wire, means you have reached the edge.
6. Flip the knife and repeat until a burr forms on the other side.
7. Switch to the finer stone with lighter strokes, then alternate sides with fewer strokes.
8. Pull the knife backwards (spine first) across the strop for 10–20 strokes per side to remove the burr.
9. Test: it should slice paper or shave a few arm hairs. Do not test on your thumb.

## Sharpening an axe or hatchet
1. Clamp the axe or lay it firmly on a stump. Wear gloves.
2. Use a file held at the existing bevel. Push in one direction, lifting on the return. Count strokes so each side matches.
3. Work until a small burr appears on the other side.
4. Remove the burr with a stone.
5. Do not grind the edge sharp enough to fold. A thin sharp edge chips in cold and in knots.

## Garden and farm tools
- Shovels, hoes, and spades: file a bevel on the working edge with the file angled about 45°.
- Scythes and sickles: touch up with a whetstone often while mowing.
- Saws: replace or send to someone with a set and a file. Keep spare bow saw blades.

## Field sharpening
- A smooth, fine river stone, wetted, hones a knife.
- The unglazed ring on the bottom of a ceramic mug works as a fine stone.
- A leather belt or the back of a jeans leg strops an edge.

## Caring for tools
- Dry steel and wipe it with oil to prevent rust. Remove light rust with vinegar and steel wool.
- Oil wooden handles with boiled linseed oil. Do not leave oily rags in a pile: they can ignite.
- Replace loose or cracked handles. Never use a tool with a loose head.

> WARNING: A cut from a sharp edge can be deep. For heavy bleeding, press hard and see [[severe-bleeding]]. Use [[wound-care]] for minor cuts.
`

## A repair kit worth building
- Needles: assorted sharps, a darning needle, and a sailmaker's or leather needle with a triangular point
- Heavy thread: nylon or polyester upholstery thread and waxed thread (unwaxed dental floss is a strong emergency thread)
- A thimble or a leather palm guard
- Beeswax for waxing thread
- Scissors and a seam ripper
- Safety pins, buttons, snaps, and patch fabric
- An awl for leather and canvas
- Duct tape and fabric tape

## Getting started
1. Cut thread about as long as your arm (18–24 in). Longer thread tangles.
2. Run it across beeswax to strengthen it and stop tangles.
3. Thread the needle, knot the end, or double the thread and knot both ends.
4. Finish by sewing a few small stitches on top of each other, then cut.

## Basic stitches
- **Running stitch:** In and out, about 1/8–1/4 in apart. Good for seams in light cloth and for basting.
- **Backstitch:** The strongest hand seam. Bring the needle up, go back one stitch length, and come up one stitch length ahead. Repeat. Looks like a machine seam.
- **Whipstitch (overcast):** Wrap thread over the edge in slanting stitches. For patches and closing seams.
- **Blanket stitch:** Loops along an edge for finishing and strengthening.
- **Slip stitch:** Nearly invisible stitches for hems.

## Patching a tear or hole
1. Trim loose threads.
2. Cut a patch about 1 in larger than the hole on all sides. Use similar thickness.
3. Place it inside the garment and pin it.
4. Fold the raw edges under and whipstitch around the patch. For heavy wear, sew a second row.
5. For tents and tarps, use a sailmaker's needle and waxed thread. Seal the stitching with seam sealer, pine pitch, or beeswax.

## Darning socks
1. Put a smooth egg-shaped object (a darning egg, a smooth stone, or a light bulb) inside the sock under the hole.
2. Sew lines of parallel stitches across the hole, extending 1/2 in beyond each side.
3. Weave stitches across the first lines, over and under, until the hole is covered.
4. Darn early. Thin spots become holes.

## Buttons
Mark the spot. Put a matchstick or toothpick on top of the button and sew over it so the thread has slack. Remove the stick and wind thread around the stalk under the button. Knot.

## Zippers
A stuck zipper often frees up with graphite from a pencil, a candle, or soap rubbed along the teeth. If the slider no longer closes, squeeze it a little with pliers.

## Shoes
- Re-sew soles with waxed thread and an awl. Glue first with contact cement if you have it.
- Patch worn soles with pieces of old tire or heavy leather.
- Replace broken laces with cord or leather.
- Add warm insoles of wool felt, cardboard, or dry straw.
- Foot wraps (squares of wool or flannel, 20 × 20 in) work as emergency socks. Wrap them around each foot and tuck in.

## Waterproofing and wax
- Rub dubbin (2 parts tallow or oil melted with 1 part beeswax) into warm leather boots.
- Rub beeswax or paraffin into canvas and warm it with the sun or near (not over) a fire.
- Wool stays warm when damp, which makes it the best cold-weather cloth.

## Clothing from blankets
A wool blanket can become a hooded coat, trousers, mittens, a hat, or a tarp. Cut rectangles that fit your body measurements, add seam allowances, and backstitch the seams.

Keep spare buttons, thread, and patches in a small tin. See [[improvised-repair]] for broader fixes and [[clothing-layers]] for staying warm.
`

Soap and candles are worth learning now. The lye in soap is dangerous, so read the safety rules first.

## Lye safety (read first)
> DANGER: Lye (sodium hydroxide) burns skin and blinds eyes. Fumes irritate the lungs. Keep it away from children and pets.

- Wear chemical goggles, rubber gloves, long sleeves, and closed shoes.
- Work outdoors or in a well-ventilated space.
- Add lye to water slowly, never water to lye. Mix with a stainless steel or heavy plastic (HDPE #2 or #5) spoon.
- Use stainless steel, heavy plastic, or glass containers only. Never aluminum, tin, copper, or non-stick.
- Use 100% sodium hydroxide with no additives (check the label).
- Skin contact: Flush with cool running water for at least 15–20 minutes. Do not use vinegar on skin.
- Eye contact: Flush with water for at least 15–20 minutes and get medical help. See [[chest-abdomen-eye]].
- Weigh every ingredient on a kitchen scale in grams. Never measure by cups or spoons.

## Cold-process soap with a safety margin
These amounts include about a 6–8% superfat (extra fat) so the soap is mild and a small mistake does not leave it lye-heavy. Use a lye calculator whenever you can, especially for mixed oils or other fats. These figures cover a single fat only.

| Fat (1,000 g) | Lye | Water |
|---|---|---|
| Olive oil (Castile) | 123 g | 246 g |
| Tallow (beef or mutton) or lard | 130 g | 260 g |

1,000 g is about 2 lb 3 oz (35 oz by weight). 123 g of lye is about 4.3 oz and 130 g is about 4.6 oz.
If you mix fats and have no calculator, use the smaller lye amount to stay on the safe side.

### Steps
1. Put on your protection. Weigh the water into a stainless or heavy plastic container.
2. Weigh the lye. Slowly pour it into the water, stirring. It will fume, get very hot (about 180–200 °F), and turn clear. Set it aside to cool to about 100–110 °F (38–43 °C).
3. Melt the fat gently. Let it cool to about 100–110 °F (38–43 °C).
4. Slowly pour the lye solution into the fat while stirring steadily.
5. Stir (or use a stick blender if you have power) until the mix thickens to the texture of thin pudding and a drizzle leaves a trail on the surface ("trace"). Castile can take hours.
6. Pour into a mold lined with parchment or freezer paper. Cover and wrap in a towel for 24 hours.
7. Unmold when firm (1–2 days). Wear gloves because the soap is still caustic. Cut into bars.
8. Cure on a rack with air flowing around the bars for 4–6 weeks, turning now and then.

### Is it safe to use?
Use pH paper if you have it (aim for 10 or below). Without paper, rub a wet cured bar on your forearm. If it stings or leaves skin raw, it is lye-heavy: do not use it on skin. Grate it, remelt it with a little water and more fat (a rebatch), and use it as laundry soap.

## Soap from wood-ash lye
Wood-ash lye (potash) is real, but its strength is unknown, so results vary and failure is common. Keep manufactured lye in reserve. See [[home-industries]] for making ash lye. Ash-lye soap with fat is usually soft and needs hours of cooking.

## Candles
- **Beeswax:** burns clean, slow and bright. Roll a sheet of wax around a wick, or pour into a mold.
- **Tallow:** cheap and smoky. Render fat clean first (see [[fats-pemmican]]).
- **Wick:** braided cotton cord or twisted cotton string. A wider candle needs a thicker wick. Trim the wick to 1/4 in before lighting.
- **Dipped candles:** Melt the fat in a tall pot, dip the wick, let it cool a few seconds, and dip again. Repeat 30–50 times until thick.
- **Jar candle:** Center a wick in a glass jar and pour in melted wax. Safe and simple.
- **Shortening or lard in a tin** with a cotton wick burns for many hours.
- **Rush light:** Dip dry rush pith or a twisted rag in melted fat. It burns for about 15–30 minutes.

> WARNING: Never leave a flame unattended. Use a stable holder, keep it away from curtains, and put it out before sleeping. See [[fire-safety]] and [[lighting]].

## Natural cleaners
- White vinegar (5%) cuts grease and mineral scale.
- Baking soda scrubs and deodorizes.
- Washing soda and borax boost laundry.
- Wood ash with water scrubs pots.
- Bleach disinfects (see [[laundry-dishes]]).

> DANGER: Never mix bleach with vinegar, ammonia, or other cleaners. The gas can kill.
`

    body: `
Hides are a by-product of hunting and butchering. Skin, scrape and preserve them right away. A fresh hide begins to spoil within a day in warm weather.

> WARNING: Wear gloves when handling raw hides and wash your hands afterward. Animals can carry diseases (see [[game-meat-safety]]). Do not handle hides from sick animals. Lye and lime burn skin.

## Step 1: Skin and preserve
1. Skin the animal as described in [[small-game-processing]] or [[field-dressing-big-game]]. Cut away holes and cut cleanly.
2. Scrape off all fat and flesh with a dull knife, the edge of a bone, or a spoon. Lay the hide over a smooth log (a fleshing beam).
3. Rub a 1/4 in layer of coarse non-iodized salt over the flesh side. Fold flesh side in. Let it drain for 24 hours, then lay flat out of the sun.
4. Or stretch and dry it flat as rawhide (see below). Keep flies and animals off.

## Rawhide (the simplest)
Rawhide is dried, untanned skin. It is hard when dry and strong. It shrinks as it dries and holds like glue.
1. Flesh the hide thoroughly.
2. To remove the hair, soak the hide in water with wood-ash lye or slaked lime for 3–7 days until the hair slips off easily. Wear gloves and goggles. Scrape the hair off over a beam.
3. Rinse the hide thoroughly in many changes of water for a day. This removes the lye.
4. Stretch it flat on a frame with cord and let it dry in the shade.
5. Use: lashings (they shrink tight when dry), drum skins, containers, snowshoe webbing, straps, and tool covers. Soak it again to cut or sew.

## Brain tanning (soft, flexible leather)
This traditional method produces soft buckskin. Every animal's brain is enough to tan its hide, and the method works on small hides.
1. Flesh the hide, and remove the hair (see rawhide) or keep it on for fur.
2. Mash or blend the brain with warm water until milky, about a cup of water per brain. Do not boil it.
3. Work this solution into the wet hide for 15–30 minutes and let it soak 2–4 hours.
4. Wring the hide in a cloth to remove moisture.
5. Keep stretching and pulling the hide while it dries. Rub it over a rope or smooth edge. This takes hours. It must be worked until dry. If it dries still, it stiffens and has to be wetted again.
6. To make it more water resistant, smoke it. Hang the hide as a sleeve over a smoky fire of punky wood for about an hour per side.

## Bark (vegetable) tanning
Tannins in bark preserve a hide and make it durable leather.
1. Collect oak, hemlock, willow or chestnut bark, or sumac leaves. Crush it small.
2. Steep it in water for a day or more until it makes a dark tea.
3. Soak the dehaired, fleshed hide in a weak solution first, then in stronger solutions over days to weeks. Thick hides can take months.
4. Cut a small piece to check. The cross-section should be brown all the way.
5. Rinse, dry slowly, and work it soft with fat or oil.

## Fur-on small hides
Rabbit and squirrel skins can be brain tanned with the fur on. Keep the hair side dry and never put it in lye. Use a tested alum or tanning recipe if you have one, and follow its measurements.

## Sinew
The long tendons along a deer's back and legs make strong thread.
1. Peel off the tendons. Dry them hard.
2. Pound the dried tendon until it splits into fine fibers.
3. Wet a few fibers in your mouth and twist them into thread. As it dries it sets hard like glue.

## Leather care
Keep leather dry. Rub it with tallow, neatsfoot oil, or a mix of tallow and beeswax when it stiffens. Do not leave it near fire. See [[sewing-mending]] for sewing, and [[cordage-rope]] for thongs.
`

These are the old trades that turn raw materials into useful things. Start with one or two.

## Charcoal
Charcoal burns hotter and cleaner than wood. It stores well and is lightweight.
1. Use a steel can or drum with a tight lid. Punch a small hole (1/4 in) in the lid.
2. Fill it with dry hardwood pieces, thumb to wrist thickness.
3. Set it in a hot fire. Wood gas and smoke come out of the hole and burn as a flame.
4. When the flame and smoke stop (usually 1–2 hours), pull the can from the fire and plug the hole with mud or a stopper.
5. Let it cool completely, several hours, before you open it. Air will ignite hot charcoal.
Expect 15–25% of the wood weight. A pit works too: dig a trench, burn wood until it is a deep bed of coals, cover with green wood and a layer of dirt, and let it smolder.

> DANGER: Burn charcoal only outdoors. It gives off deadly carbon monoxide.

Charcoal can improve the taste of water but does not make it safe. See [[water-filters]].

## Wood-ash lye and potash
1. Burn hardwood to white ash. Keep it dry.
2. Set up a wooden barrel or bucket with a hole near the bottom. Put straw and gravel in the bottom as a filter.
3. Fill with ash. Slowly pour rainwater over the top.
4. Collect the brown liquid that drips out. This is lye.
5. A traditional strength test: the lye should float an egg so that a spot the size of a quarter shows above the surface. If it is weaker, pour it through the ash again or boil it down.
6. Boil the lye dry in an iron pot and you get potash (potassium carbonate), the crude salt left behind.
Use it for soap (see [[soap-candles]]), nixtamalizing corn ([[making-staples]]), and removing hair from hides ([[leather-hides]]).

> WARNING: Ash lye is caustic. Wear gloves and goggles and use no aluminum.

## Salt
Seawater is about 3.5% salt. A gallon yields about 4–5 oz (about 130 g). Boil it down in a wide pot or dry it in shallow pans in the sun. See [[making-staples]].

## Vinegar
Put apple scraps and cores in a jar with water and a little sugar. Cover with cloth. Stir daily for a week or two, strain, and let it sit for several weeks until sour. A "mother" (gelatinous layer) forms. Use it to start the next batch. See [[fermenting-pickling]].

## Pine pitch glue
Collect hard pine resin. Heat it very gently in a can set in a pot of hot water, never over an open flame because resin burns fiercely. Stir in powdered charcoal (about 1 part to 2 parts resin) and a little fine fiber. Dip it onto a stick. It hardens on cooling and softens when heated again.

## Lamp oil
- A cotton wick floating on a dish of olive oil or other vegetable oil gives a small, steady flame.
- Rendered fat makes poor lamp oil because it smokes.
- Kerosene lamps need a proper lamp. See [[lighting]].

## Clay and pottery
1. Find clay: a stream bank or road cut. Roll a pencil-thick piece and wrap it around your finger. If it does not crack, it is clay.
2. Remove stones and roots. Knead it to remove air bubbles (wedging).
3. Build pots with coils: roll ropes, stack them, blend with your thumb. Keep walls 1/4–3/8 in thick.
4. Dry slowly out of sun and wind, for several days.
5. Fire: warm the pots near a fire for an hour, then bury them in a bonfire and keep it hot for several hours. Let the fire die and cool.
6. Unglazed pottery is porous. Good for storing water and cooling it, and for dry goods.
7. Do not use lead glazes on anything that touches food.

> WARNING: Quicklime (made by burning limestone) reacts violently with water and burns skin. Wear protection and add lime to water, not water to lime.
`

    body: `
## What to expect
In short outages, cash and cards mostly still work. In long ones, many people trade goods and labor. Barter is a supplement to preparation, not a plan. It works best among people who know and trust each other.

## What holds value
- **Consumables:** salt, sugar, coffee, tea, spices, cooking oil, honey
- **Hygiene:** soap, toothpaste, toilet paper, razors, feminine products, diapers
- **Medical:** bandages, OTC medicines, thermometers, first aid supplies
- **Light and fire:** lighters, matches, candles, batteries, lamp oil
- **Hardware:** nails, screws, wire, rope, tape, saw blades, files, needles
- **Food:** seeds, rice, beans, eggs, fresh produce, preserved food
- **Fuel:** firewood, charcoal, propane (see [[fuel-storage]])

Alcohol and tobacco hold value but can cause problems. Think before you stock them.

## Skills are the best currency
Skills nobody can take: repair (mechanic, electrician, plumber), medical care, sewing, butchering, preserving, carpentry, gardening, teaching children, midwifery, haircutting, sharpening tools, radio operation, and cooking.

## Money in a crisis
- Keep small bills ($1, $5, $10, $20). Nobody can make change for a $100.
- Coins: US dimes, quarters, and half dollars minted before 1965 are 90% silver ("junk silver") and are handy small units.
- Gold is too valuable per unit for everyday trades.

## Setting fair value
Decide what an item is worth by how useful and scarce it is and how much effort it took. A simple unit helps: "a dozen eggs", "a pound of rice". Do not gouge people in need. Mutual aid builds a reputation, and reputation protects you.

## Trading safely
- Meet in a public, well-lit place in daylight with a friend. Keep your supplies hidden. Never reveal where you store them (see [[opsec-low-profile]]).
- Bring only what you plan to trade.
- Inspect goods. Check expiration dates, rust, and signs of spoilage. Test batteries.
- Never trade medicine you cannot identify. Never trade on credit.
- Trust is built through repeated fair dealing. Pick a regular spot and time with neighbors, and agree on simple rules.
- Do not trade with anyone who pressures you or becomes aggressive. Walk away.

## In normal times
The IRS treats the fair market value of bartered goods and services as taxable income. Selling food, alcohol, medicine, and some goods is regulated by law.

## Trade-goods checklist
- [ ] Salt (1 lb bags)
- [ ] Bar soap
- [ ] Lighters and matches
- [ ] Sewing needles and thread
- [ ] Razors and blades
- [ ] Coffee and tea
- [ ] Sugar and honey
- [ ] Seeds
- [ ] Batteries (AA, AAA)
- [ ] Candles
- [ ] Nails, screws, wire
- [ ] Small bills and silver coins
- [ ] Over-the-counter pain relievers and bandages

See [[community-security]] for building a trusted local network.

Fuel may be scarce for weeks or longer. Here are ways to move without it.

## Walking
Walking speed is about 3 mph on flat ground, about 20 miles in a long day. A pack should weigh at most 20–25% of your body weight. See [[traveling-on-foot]].

## Bicycles
A bicycle moves a person several times more efficiently than walking. You can ride 10–15 mph and carry 50–100 lb in panniers (saddlebags) or a trailer.

**Basic care**
- Keep tires pumped to the pressure on the sidewall.
- Lubricate the chain with a light oil, wiping off the excess.
- Check brakes and bolts before every trip.

**Fixing a flat**
1. Take off the wheel. Let the air out. Use two tire levers to pry one side of the tire off the rim.
2. Pull out the tube. Inflate it and listen or put it in water to find the leak. Mark it.
3. Run your fingers inside the tire to find the thorn, glass, or wire. Remove it.
4. Roughen the tube around the hole, apply glue, and wait 1–2 minutes until tacky.
5. Press a patch on firmly for a minute.
6. Slightly inflate the tube, tuck it in the tire, and push the tire back onto the rim by hand. Pump up and check.

Carry a spare tube, tire levers, a patch kit, a pump, a multitool, and a chain link. For a bent or broken spoke, wrap it around the neighboring spoke and loosen the opposite one to straighten the wheel.

## Carts and wheelbarrows
A wheelbarrow carries 150–200 lb. A two-wheeled hand cart or a bicycle trailer can move about 200 lb on roads. Large wheels roll best. In snow, a sled slides more easily than wheels. A travois (two poles dragged behind a person or animal) is a last resort. See [[simple-machines]].

## Pack animals
Animals carry about this share of their body weight:
- Horses and mules: 15–20%
- Donkeys: up to about 20%
- Llamas and goats: about 20–25%
- Dogs: 10–25% for strong, fit dogs

Animals need daily water (a horse may drink 5–10 gallons), hay or forage (about 2% of body weight a day), hoof care, and a well-fitted pack or saddle. They are a big commitment you cannot get quickly. Get experience first.

## Boats
Canoes, kayaks, and rowboats move people and cargo on lakes and rivers. A river carries you 2–4 mph with the current.

- Wear a life jacket (PFD) at all times.
- Cold water kills fast. The "1-10-1" rule: 1 minute of cold shock, about 10 minutes of useful movement, and about 1 hour before unconsciousness from hypothermia (in water at about 60 °F or colder).
- If you capsize, stay with the boat and climb on it.
- Load low and keep your weight centered. Do not stand in a small boat.
- Stay away from rapids, low-head dams, and "strainers" (trees in fast current).
- Watch the weather. Wind and waves build fast.
- Treat all river water before drinking. See [[water-safety]].

## When you still have a vehicle
- Keep the tank above half. Drive about 55 mph.
- Combine trips, remove roof racks, and keep tires inflated.
- Know your route. See [[vehicle-kit]] and [[fuel-storage]].
`

## A repair kit

## Roof leaks
1. Trace the leak. Water travels along rafters. Look for stains and follow them uphill.
2. For a temporary fix, run a tarp over the whole damaged section, over the ridge by 2–3 ft and past the eave. Pin it down with furring strips (1×3 boards) screwed through the tarp into the roof. Never nail through a bare tarp.

## Broken windows
1. Wear gloves and goggles. Remove loose glass.
2. Cover the opening with 6-mil plastic stapled or taped around the frame, or screw plywood or cardboard from the inside.
3. Later, fit salvaged glass with glazing points and putty.

## Plumbing
- Know where the main water shutoff is.
- For a leak, shut off the water. Wrap a rubber patch (a cut piece of bicycle tube or garden hose) around the pipe and clamp it with two hose clamps or wire.
- Epoxy putty seals pinholes on a dry pipe.
- Never use open flame to thaw a frozen pipe. Use warm towels or a hair dryer.
- Use a plunger, not chemical drain cleaner.
- To flush a toilet without water pressure, pour 1–2 gallons quickly into the bowl.

## Vehicle: changing a flat
1. Park on level, firm ground. Set hazard lights, parking brake, and put rocks behind the wheels.
2. Loosen the lug nuts half a turn while the tire is on the ground.
3. Put the jack at the frame's jack point. Raise it until the tire clears the ground by about 2 in.
4. Remove the nuts and the wheel. Mount the spare.
5. Tighten the nuts by hand in a star pattern. Lower the car. Tighten fully.
6. Check the spare's pressure. A compact spare usually needs about 60 psi.

> DANGER: Never get under a car held only by a jack.

A plug kit fixes a small puncture in the tread: ream the hole, push in the plug, trim it, and inflate.

## Vehicle: jump starting
1. Park the cars close but not touching. Turn both off.
2. Connect red to the dead battery's positive (+) terminal, then red to the good battery's positive (+).
3. Connect black to the good battery's negative (−), then the other black clamp to bare metal on the dead car's engine, away from the battery.
4. Start the good car, then the dead one.
5. Remove the clamps in reverse order. Let the engine run 20–30 minutes.
Do not jump a cracked, frozen, or leaking battery.

## Overheating engine
Turn the car off. Wait 30 minutes before opening the radiator cap, because steam and scalding coolant can spray out. Refill with coolant or water.

## Tools
- Replace a broken handle with a straight-grained piece of hickory or ash. Drive a wooden wedge across the end of the handle and a metal wedge into it.
- Wrap a cracked handle with cord or tape as a stopgap.
- Remove rust with vinegar and steel wool, then oil.

Fix it enough to get through, then fix it right when you can. See [[fasteners-joinery]] and [[sewing-mending]].

## Ethics first
Salvage means reusing what is yours, free, or given with permission. In a disaster, taking other people's property is theft, even when stores are closed. If the owner or authorities can be reached, ask. If you must take something to survive, take only what you need and leave a note. Do not break into homes that are occupied.

Right now, you can build a stockpile of materials legally: ask neighbors for scrap, shop at salvage yards and habitat reuse stores, take free pallets with permission, and watch for demolition sites and curb piles.

## What is worth salvaging
- **Lumber** (remove every nail), doors, windows, roofing metal
- **Wire and pipe** (copper), hardware, hinges, fasteners
- **Pallets:** Look at the stamp. "HT" means heat treated and is safe. "MB" means methyl bromide, a toxic fumigant: do not use it for food, gardening, or burning.
- **Barrels, drums, and totes:** Find out what was in them. Use only food-grade containers for water and food.
- **Tarps, rope, plastic sheeting**
- **Bricks and stone**
- **Bicycles, tools, wheelbarrows, carts**
- **Solar panels, batteries, wire**
- **Sheet metal for stoves, cans for stoves**

## Hazards
| Hazard | Where | What to do |
|---|---|---|
| Collapse | Damaged or fire-weakened buildings | Do not enter if walls lean, floors sag, or there are large cracks |
| Asbestos | Pre-1980 insulation, pipe wrap, vinyl floor tile, popcorn ceilings | Do not break, sand, or sweep. Leave it alone |
| Lead paint | Houses built before 1978 | Do not sand, burn, or scrape. Wash hands |
| Electricity | Downed or damaged wires | Assume every wire is live. Stay back |
| Gas | Smell of rotten eggs | Leave at once. Do not turn on switches |
| Chemicals | Unlabeled bottles | Do not open, smell, taste, or mix |
| Floodwater and mold | Flooded buildings | Wear boots, gloves, mask. Discard soaked porous items |
| Sharp metal and nails | Everywhere | Heavy gloves and boots. Keep tetanus shots up to date (see [[wound-care]]) |
| Rodents | Closed buildings | Do not sweep dry droppings. See [[pests-vectors]] |
| Carbon monoxide | Enclosed spaces with engines or fires | Ventilate |

## Protective gear
- Leather gloves and thick-soled boots
- Safety glasses
- A dust mask (N95 helps with dust, but it does not protect against asbestos)
- A headlamp and a crowbar
- A partner who knows where you are

## Working method
1. Scout in daylight. Tell someone your plan.
2. Assess the structure from outside and above before going in.
3. Plan your route out. Never go in alone.
4. Take apart, do not smash. Pull nails or bend them flat.
5. Sort and stack materials as you remove them.
6. Do not burn painted, treated, or glued wood. See [[fire-management]].

## Food and water from salvage
Use only sealed, intact containers. Do not use cans that are bulging, leaking, or deeply dented on the seam. Treat all found water ([[water-safety]]). See [[food-safety-basics]].

See [[tools-essentials]] for tools and [[improvised-repair]] for reuse.

    body: `
## Do this first
1. **Stop.** Sit down. Do not keep walking "just a little farther." Most people who get seriously lost make it worse in the first hour by moving fast while panicked.
2. **Think.** Breathe slowly for a full minute. When did you last know exactly where you were? Which way did you come from? Does anyone know where you went?
3. **Observe.** Check yourself for injuries. Check how much water, food, and daylight you have. Look at the weather, the terrain, and any landmark you recognize.
4. **Plan.** Decide whether to stay or move (below). Then take care of shelter, water, and signals before anything else.

## Stay or move?
**Stay where you are if:**
- Someone knows where you went and when you were due back.
- You are hurt, exhausted, or it is nearly dark or storming.
- You are a child, or you are with one.
- You have a vehicle. It is bigger and easier to spot than a person.

**Move if:**
- Nobody knows where you are and no one is coming (for example, after a widespread disaster).
- Where you are is dangerous: flood path, fire, rockslide, avalanche slope, unstable building.
- You can see or hear a road, building, or trail and can reach it safely before dark.
- You cannot get water or shelter where you are, but you know where to find them.

## If you stay
- Pick a spot that is visible from the air and from a distance: an open area, a clearing, a rock outcrop. Avoid dense forest if you can.
- Build shelter first if it is cold, wet, or windy. See [[shelter-priorities]] and [[emergency-shelters]].
- Make signals. See [[signaling-rescue]]. Three of anything (whistle blasts, fires, flashes) means distress.
- Find and treat water ([[finding-water]], [[water-safety]]). You can go three weeks without food but only about three days without water. See [[rule-of-3s]].
- Stay put through the night. Moving in the dark is how people fall, get hurt, and drift farther away.

## If you must move
1. Leave a note at your starting point with the date, time, direction, and your plan. If you have no paper, build an arrow out of sticks or rocks.
2. Mark your trail as you go: scrape arrows, stack rocks, tie bright cloth, break twigs on the side facing back the way you came.
3. Pick a distant landmark in a straight line and walk to it. Then pick the next. People walking without a landmark tend to curve and end up going in circles.
4. Use "handrails": rivers, ridgelines, fences, power lines, pipelines, and roads. Following one usually leads to people.
5. Following a stream downhill often leads to larger water and settlements, but watch for waterfalls, cliffs, swamps, and thick brush that can trap you.
6. Travel in daylight. Stop at least an hour before dark to build shelter.

> WARNING: Do not cross fast or deep water, steep ice, or unstable slopes to "save time." A rescue takes days. A fall or drowning takes seconds.

## Children who are lost
Teach every child this rule now: **hug a tree.** If you are lost, stay in one place, hug a tree, blow your whistle, and answer when searchers call. Do not hide. Do not run. Put a whistle and a bright piece of clothing in every child's coat or pack.

## Before you ever go out
- Tell a reliable person your route and return time.
- Carry a whistle, a lighter or ferro rod, a space blanket, water, and a map and compass. See [[map-compass]].
- Learn how to find direction without a compass: [[direction-sun-stars]].

## If help is not coming
In a widespread disaster, there may be no search team. Treat being lost as a self-rescue problem: shelter, water, signals, then a careful, planned move toward a place you know. See [[traveling-on-foot]].
`
