    --danger: #ff6b5e; --danger-bg: #3a1a17; --warn: #ffb454; --warn-bg: #3a2a12;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); }
img { max-width: 100%; }
h1, h2, h3 { line-height: 1.25; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

#app { min-height: 100vh; display: flex; flex-direction: column; }
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: .5rem; padding: .35rem .75rem; min-height: 3rem; }
#hdr-title { flex: 1; font-weight: 750; font-size: 1.02rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  min-width: 2.6rem; min-height: 2.6rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font: inherit; font-weight: 700; cursor: pointer;
}
.chip { display: inline-block; padding: .15rem .6rem; border-radius: 999px; background: var(--surface-2); font-size: .74rem; color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--tip-bg); color: var(--tip); font-weight: 700; }
.chip.bad { background: var(--warn-bg); color: var(--warn); font-weight: 700; }

main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 1rem 1rem calc(5.8rem + env(safe-area-inset-bottom)); outline: none; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface);
  border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
  min-height: 3.5rem; padding: .35rem .2rem; font-size: .72rem; color: var(--muted); text-decoration: none;
}
nav.tabs a .ic { font-size: 1.4rem; line-height: 1; }
nav.tabs a.active { color: var(--accent); font-weight: 800; }
nav.tabs a.sos { color: var(--danger); font-weight: 800; }
nav.tabs a.sos.active { background: var(--danger-bg); }

/* Home */
.hero h1 { margin: .2rem 0; font-size: 1.7rem; }
.hero p { margin: .2rem 0 .9rem; }
.search {
  width: 100%; padding: .85rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font: inherit; font-size: 1.05rem;
}
.search:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.sos-btn {
  display: flex; align-items: center; gap: .85rem; margin: .9rem 0 .6rem; padding: 1rem 1.1rem; border-radius: 16px;
  background: var(--danger); color: #fff; text-decoration: none; font-weight: 850; font-size: 1.2rem; box-shadow: var(--shadow);
}
:root[data-theme="night"] .sos-btn { color: #000; }
.sos-btn small { display: block; font-weight: 500; font-size: .86rem; opacity: .95; }
.sos-btn .big-ic { font-size: 2rem; }
.start-card {
  display: block; margin: .6rem 0; padding: .85rem 1rem; border-radius: 14px; background: var(--accent-2);
  border: 1px solid var(--accent); color: var(--text); text-decoration: none;
}
.start-card small { display: block; color: var(--muted); }
h2.sec { font-size: 1.1rem; margin: 1.5rem 0 .6rem; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .65rem; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.tile {
  display: block; min-height: 5.4rem; padding: .8rem; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); text-decoration: none; color: inherit; box-shadow: var(--shadow);
}
.tile .ic { font-size: 1.7rem; line-height: 1.1; }
.tile .tt { font-weight: 750; margin-top: .2rem; line-height: 1.2; }
.tile .bl { font-size: .8rem; color: var(--muted); line-height: 1.25; margin-top: .15rem; }

/* Lists */
.list a, a.row {
  display: block; padding: .8rem 1rem; margin-bottom: .5rem; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; text-decoration: none; color: inherit;
}
.list .t { font-weight: 700; }
.list .s { color: var(--muted); font-size: .9rem; margin-top: .1rem; }
.list .m { color: var(--muted); font-size: .76rem; margin-top: .25rem; }
.list .flag { color: var(--danger); font-weight: 800; font-size: .72rem; margin-left: .35rem; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.page-title { font-size: 1.45rem; margin: .2rem 0 .2rem; }
.page-sub { margin: 0 0 1rem; color: var(--muted); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem; padding: .5rem 1rem;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit;
  font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.big { min-height: 3.6rem; width: 100%; font-size: 1.15rem; }
.btn.small { min-height: 2.2rem; padding: .25rem .7rem; font-size: .88rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .7rem 0; }

/* Emergency */
.emg-num { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
.emg-num a { flex: 1 1 8rem; text-align: center; padding: .75rem .5rem; border-radius: 12px; background: var(--danger); color: #fff; font-weight: 800; text-decoration: none; }
:root[data-theme="night"] .emg-num a { color: #000; }
.emg-num a small { display: block; font-weight: 500; opacity: .95; }
.quick { display: grid; grid-template-columns: 1fr; gap: .45rem; }
@media (min-width: 520px) { .quick { grid-template-columns: 1fr 1fr; } }
.quick a {
  display: flex; align-items: center; gap: .65rem; padding: .7rem .85rem; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; text-decoration: none; color: inherit; font-weight: 650; min-height: 3.2rem;
}
.quick a .ic { font-size: 1.5rem; }

/* Article */
.crumb { font-size: .82rem; color: var(--muted); margin-bottom: .3rem; }
.crumb a { color: var(--muted); }
.article h1 { font-size: 1.6rem; margin: .1rem 0 .4rem; }
.article .lede { color: var(--muted); margin: 0 0 .8rem; font-size: 1.02rem; }
.article h2 { font-size: 1.22rem; margin: 1.7rem 0 .4rem; padding-top: .6rem; border-top: 1px solid var(--border); }
.article h3 { font-size: 1.06rem; margin: 1.1rem 0 .3rem; }
.article p { margin: .6rem 0; }
.article ul, .article ol { padding-left: 1.35rem; margin: .6rem 0; }
.article li { margin: .3rem 0; }
.article hr { border: 0; border-top: 1px solid var(--border); margin: 1.4rem 0; }
.article a.xref { font-weight: 650; }
ol.steps { list-style: none; padding-left: 0 !important; counter-reset: s; }
ol.steps > li { counter-increment: s; position: relative; padding-left: 2.5rem; margin: .7rem 0; min-height: 1.9rem; }
ol.steps > li::before {
  content: counter(s); position: absolute; left: 0; top: .05rem; width: 1.8rem; height: 1.8rem; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); font-weight: 800; display: grid; place-items: center; font-size: .92rem;
}
.callout { border-left: 5px solid var(--note); background: var(--note-bg); padding: .7rem .9rem; border-radius: 10px; margin: .95rem 0; }
.callout .co-title { font-weight: 850; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .15rem; color: var(--note); }
.callout.warning, .callout.caution, .callout.important { border-color: var(--warn); background: var(--warn-bg); }
.callout.warning .co-title, .callout.caution .co-title, .callout.important .co-title { color: var(--warn); }
.callout.danger, .callout.stop, .callout.call { border-color: var(--danger); background: var(--danger-bg); }
.callout.danger .co-title, .callout.stop .co-title, .callout.call .co-title { color: var(--danger); }
.callout.tip { border-color: var(--tip); background: var(--tip-bg); }
.callout.tip .co-title { color: var(--tip); }
.tbl-wrap { overflow-x: auto; margin: .9rem 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: .5rem .65rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 750; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.checklist { list-style: none; padding-left: 0 !important; }
.chk { display: flex; gap: .65rem; align-items: flex-start; padding: .3rem 0; cursor: pointer; }
.chk input { width: 1.4rem; height: 1.4rem; margin: .1rem 0 0; flex: none; accent-color: var(--accent); }
.chk input:checked + span { text-decoration: line-through; opacity: .6; }
.art-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .7rem 0 .2rem; }
.art-note { margin-top: 1.6rem; padding: .75rem .9rem; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: .86rem; }
.pager { display: flex; gap: .6rem; margin-top: 1.4rem; }
.pager a { flex: 1; padding: .7rem .8rem; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; text-decoration: none; color: inherit; font-size: .9rem; }

.pager a.next { text-align: right; }

/* Settings / forms */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem 1rem; margin: .7rem 0; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 .4rem; font-size: 1.02rem; }
label.f { display: block; font-weight: 650; margin: .55rem 0 .2rem; }
input[type="number"], input[type="text"], input[type="date"], select, textarea {
  width: 100%; padding: .65rem .75rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.kv { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; border-bottom: 1px dashed var(--border); }
.kv:last-child { border-bottom: 0; }

/* Toast & modal */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(4.6rem + env(safe-area-inset-bottom)); z-index: 60;
  background: #222; color: #fff; padding: .7rem 1rem; border-radius: 12px; max-width: min(92vw, 30rem); box-shadow: 0 4px 18px rgba(0,0,0,.35); font-size: .92rem;
}
.toast button { margin-left: .6rem; background: transparent; color: #8fd5a0; border: 0; font: inherit; font-weight: 800; cursor: pointer; }
.modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: var(--surface); color: var(--text); border-radius: 16px; padding: 1.1rem 1.2rem; max-width: 30rem; max-height: 90vh; overflow: auto; }
.modal h2 { margin-top: 0; }

/* Tools */
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.cpr-circle {
  width: min(62vw, 15rem); aspect-ratio: 1; margin: .6rem auto 1rem; border-radius: 50%; background: var(--danger); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 900;
  transition: transform .08s;
}
:root[data-theme="night"] .cpr-circle { color: #000; }
.cpr-circle.pulse { animation: pulse .22s ease-out; }
@keyframes pulse { 0% { transform: scale(1.1); } 100% { transform: scale(1); } }
.cpr-circle .n { font-size: 4.2rem; line-height: 1; }
.cpr-circle .m { font-size: 1.1rem; margin-top: .2rem; padding: 0 .6rem; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin: .5rem 0; }
.seg button { flex: 1; padding: .6rem .4rem; border: 0; background: var(--surface); color: var(--text); font: inherit; font-weight: 650; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.timer-row { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin: .45rem 0; }
.timer-row .tm { font-size: 1.5rem; font-weight: 850; font-variant-numeric: tabular-nums; min-width: 5.2rem; }
.timer-row .lb { flex: 1; font-size: .9rem; }
.timer-row.done { background: var(--danger-bg); border-color: var(--danger); }
.light-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2rem; font: 600 .9rem system-ui, sans-serif; cursor: pointer; }
.compass-wrap { position: relative; width: min(78vw, 17rem); aspect-ratio: 1; margin: .8rem auto; }
.compass-dial { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--text); background: var(--surface); transition: transform .12s linear; }
.compass-dial span { position: absolute; left: 50%; top: 50%; width: 2rem; margin-left: -1rem; text-align: center; font-weight: 900; font-size: 1.15rem; }
.compass-needle { position: absolute; left: 50%; top: -.4rem; transform: translateX(-50%); width: 0; height: 0; border-left: .7rem solid transparent; border-right: .7rem solid transparent; border-top: 1.5rem solid var(--danger); }
.heading-read { text-align: center; font-size: 2.2rem; font-weight: 900; }
.res-table td:last-child { text-align: right; font-weight: 750; font-variant-numeric: tabular-nums; }
.win-now { background: var(--tip-bg); }

@media print {
  header.top, nav.tabs, .noprint, .toast, .pager, .art-actions { display: none !important; }
  body { background: #fff; color: #000; }
  main { max-width: none; padding: 0; }
  .callout, .tbl-wrap { break-inside: avoid; }
  a { color: #000; text-decoration: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

</style>

## What this app is
A reference handbook for emergencies and long-term self-reliance: first aid, water, shelter, food, sanitation, power, navigation, and more. It is written for people with **no prior experience**. It works with **no internet, no cell signal, and no power grid** once it has been saved to your device.

> IMPORTANT: Most of this guidance is meant to be learned and practiced *before* a crisis. Reading a guide for the first time in the dark, in the cold, while frightened, is the hard way.

## How to use it in an emergency
1. Tap the red **Emergency** tab. Pick what is happening ("Heavy bleeding", "Choking", "The power is out").
2. Every guide starts with **what to do first**. Do those steps, then read on.
3. Use **Search** if you do not know which guide you need. Short words work best: "burn", "bleach", "canning".
4. **Tools** has a CPR metronome, timers (including a tourniquet clock), a screen flashlight with SOS, a compass, and calculators.
5. Use **Save** on the guides you need most. Use **Print** to make paper copies for your kit.

## What this app cannot do
- **It has no pictures.** For anything you could get badly wrong, such as wild plants, mushrooms, snakes, or knots, also keep printed field guides and manuals for your region.
- **It is not a doctor, a lawyer, or an instructor.** It cannot examine anyone. When emergency services can be reached, call them.
- **It cannot cover every place.** Weather, plants, animals, laws, and building codes differ by region. Learn what applies where you live.
- **Phones fail.** Batteries die, screens crack, and devices get lost. Keep paper backups of the most important pages.

## Five things to do this week
- [ ] Open the app once with a connection, wait for **✓ Offline ready**, then switch on airplane mode and test it (More → Install & offline help).
- [ ] Add it to your home screen and print the guides for CPR, severe bleeding, water treatment, and the master checklist.
- [ ] Put a charged power bank and a charging cable in your emergency kit.
- [ ] Store at least **1 gallon (4 L) of water per person per day for 3 days**. Then keep building toward 2 weeks.
- [ ] Sign up for a hands-on first aid and CPR class in your area.

## Where to go next
- [[grid-down-timeline]]: what to do hour by hour if the power fails.
- [[prep-start-here]]: a step-by-step plan for getting ready.
- [[master-checklist]]: everything you might want, in one checklist.
- [[learning-plan]]: a 12-week plan for practicing the key skills.
`

    body: `
Most outages end within hours, and most are local. This plan is written so you can start with the easy steps and keep going if the outage lasts. **Do not assume it will be short.**

## The first hour
1. **Check safety.** Is anyone hurt? Smell for gas. Is anything burning? If you smell gas, leave and call from outside.
2. **See how big it is.** Look outside. Is the whole street dark? Ask neighbors. Text the utility rather than calling, because texts often get through when calls do not.
3. **Keep the fridge and freezer closed.** This is what protects your food. See [[power-outage-basics]].
4. **Unplug sensitive electronics.** Leave one lamp switched on so you notice when power returns.
5. **Get light.** Use flashlights and headlamps. If you use candles, never leave them unattended ([[fire-safety]]).
6. **Save phone battery.** Lower the brightness, close apps, use low-power mode, and put it in airplane mode when not in use. Use a battery radio for news ([[getting-information]]).
7. **Fill containers with water now,** before pressure drops: bathtub, pots, pitchers, jugs ([[water-storage]]).
8. **Think about medical needs.** Oxygen, insulin, refrigerated medication, powered devices ([[chronic-conditions]]).

## The first day
- **Eat perishables first:** fridge items, then the freezer, then the pantry. Cook what is thawing and share with neighbors.
- **Pick one room** to live in during extreme heat or cold ([[heating-home]], [[staying-cool]]).
- **No running water or sewer?** Set up a bucket toilet ([[human-waste]]) and a handwashing station ([[handwashing-hygiene]]).
- **Fuel and cash:** if stations and ATMs still work, fill the car above half and get small bills. Card readers and pumps stop with the power.
- **Write a check-in plan:** who texts whom, and when ([[family-plan]]).
- **Never run a generator, grill, or camp stove indoors.** Carbon monoxide kills ([[generator-safety]]).

## Days 2 and 3
- **Water first.** Count what you have. Use 1 gallon (4 L) per person per day as your target. Treat anything you collect ([[water-safety]], [[boiling-water]]).
- **Expect empty store shelves** within a few days of a widespread outage. Do not wait in crowds for what you already have.
- **Check on neighbors,** especially older adults, people with medical needs, and families with infants.
- **Pool skills and supplies.** Who has a generator, a wood stove, medical training, tools, a well?
- **Decide whether to stay or leave** ([[stay-or-go]]).

## Week 1
- Build routines: water, cooking fuel, waste, hygiene, lighting, sleep.
- Ration the pantry, protecting calories and children first ([[stretching-food]]).
- Watch for illness. Diarrhea and infection spread fast without clean water and sanitation ([[disease-prevention]]).
- Medications will start to run low. Plan around that ([[meds-stockpile]]).
- Keep a low profile ([[opsec-low-profile]]) and organize neighborhood help ([[community-security]]).
- Look after morale ([[mental-health]], [[mindset]]).

## Weeks 2 to 4
- Move from emergency mode to a **sustainable routine:** reliable water, fuel (firewood), sanitation, food stretching, and shared work.
- If it is growing season, plant now ([[garden-planning]]). Fast crops and sprouts give food in weeks ([[season-extension]]).
- Preserve any food you can before it spoils ([[drying-dehydrating]], [[canning-basics]]).
- Keep records: what you have, what you use, who needs what.

## Month 2 and beyond
This is long-term self-reliance: gardens, animals, preserved food, trade, and community. The Growing Food, Animals, Preserving, and Building sections are for this phase.

> NOTE: Long widespread outages are rare. Regional disasters usually see help arrive in days to weeks. Plan for two weeks without help. Hope for three days. Be glad for anything shorter.
`

    body: `
## The Rule of 3s
A rough guide to how long a healthy adult can last without each basic need. It varies with age, health, and weather, but it shows what to fix first.

| Without... | Roughly | So the priority is |
|---|---|---|
| Air (or breathing) | 3 minutes | Airway, breathing, severe bleeding |
| Shelter in harsh weather | 3 hours | Get out of wind, rain, snow, or heat |
| Water | 3 days | Find, treat, and store safe water |
| Food | 3 weeks | Important, but last |

Add a fourth, **3 seconds: decision.** Stop and think before acting. Panic makes things worse.

## What to do first, in order
1. **Stop, think, observe, plan.** Take five slow breaths. Look around. What is the biggest danger right now?
2. **Remove immediate danger:** fire, gas, floodwater, unstable buildings, traffic, other people.
3. **Life threats to people:** not breathing, severe bleeding, shock ([[first-aid-basics]], [[cpr]], [[severe-bleeding]]).
4. **Temperature:** too cold or too hot kills faster than thirst. Get shelter, insulation, and shade ([[shelter-priorities]], [[hypothermia-frostbite]], [[heat-illness]]).
5. **Water:** secure and treat it ([[water-needs]], [[water-safety]]).
6. **Signals and communication:** let people know where you are ([[signaling-rescue]]).
7. **Fire and light:** warmth, cooking, boiling water, morale ([[fire-starting]]).
8. **Food:** after the above ([[stretching-food]]).

## Using the rule
- **Lost in cold rain with no food?** Shelter first. You will not starve in three days, but you could die of hypothermia in hours.
- **Desert heat?** Shade and rest matter more than searching for water at midday.
- **Winter power outage?** Heat one small room before you worry about the pantry.
- **Flood or storm?** Move yourself and your family out of danger before you save belongings.

> TIP: Teach this order to everyone in your household. A simple rule that all of you know is better than a perfect plan that only you remember.
`

    body: `
**Bugging in** means staying where you are. **Bugging out** means leaving. For most emergencies, most people are safer and better supplied at home. But some situations require leaving *now*.

## Leave immediately if
- Authorities order an evacuation. Do not wait.
- Fire, flood, tsunami, chemical release, or a gas leak threatens your home.
- Your home is damaged or unsafe.
- You cannot keep anyone warm enough or cool enough, and cannot fix it.
- A medically fragile person needs care you cannot provide.
- You have a safe, known destination and a clear route.

## Stay if
- Your home is structurally sound and safe from the current hazard.
- You have water, food, a heat or cooling plan, and sanitation.
- Roads are blocked, flooded, icy, or dangerous.
- Authorities say to **shelter in place** (chemical, radiation, severe weather).
- You have neighbors who can help and shared resources.
- You have nowhere safe to go.

## Think before you walk away
Travel in a crisis is risky: traffic, fuel shortages, crowds, weather, injuries, and no certainty of what is ahead.

- **Walking is slow.** A fit adult with a pack might manage 8 to 12 miles (13 to 19 km) a day on good roads. Children, injuries, and weather cut that down.
- **Water and shelter** are harder to arrange on the road than at home.
- **You are more exposed** to crime and accidents when moving.
- **Leaving your supplies behind** usually means starting from zero.

## Decide in advance
Write answers to these *before* you need them:
1. What events would make us leave? (Name them.)
2. Where would we go first? Second? Is there someone expecting us?
3. Which routes avoid bridges, floodplains, and chokepoints?
4. Who is in the car, and who rides with whom?
5. What is our trigger point? (For example, "Mandatory evacuation order" or "Water at the top step.")
6. Who do we notify? Where do we leave a note?

## If you leave
- Go **early**. The first hours have the fewest crowds.
- Take the go bag, medications, documents, cash, water, and food ([[bug-out-bag]], [[documents-money]]).
- Fuel the car above half before it becomes a problem.
- Take pets or arrange for them ([[pets-disaster]]).
- Tell someone outside the area your route and destination.
- Turn off utilities only if told to ([[evacuation]]).

## If you stay
- Make your home **safe, warm or cool, dry, and clean**.
- Keep a low profile ([[opsec-low-profile]]).
- Organize with neighbors ([[community-security]]).
- Keep a go bag packed in case you must leave quickly.

> TIP: Decide your "go" trigger when you are calm, not at 3 a.m. with smoke in the hall.
`

Skills and supplies matter, but **people in crises usually fail from panic, exhaustion, or poor decisions** before they run out of gear. These habits help.

## When you feel panic rising
1. **Stop.** Do not move or act for a few seconds.
2. **Breathe.** In through your nose for 4 counts, hold 4, out for 4, hold 4. Repeat four times.
3. **Look and listen.** What is actually happening right now?
4. **Name the next step.** Not the whole plan, only the next safe action.
5. **Do it.** Action reduces fear.

## STOP: the four-letter plan
- **S**top. Sit down if you can.
- **T**hink. What are the dangers? What do I have?
- **O**bserve. Weather, terrain, people, time of day.
- **P**lan. Priorities ([[rule-of-3s]]), then act.

## Good decision rules
- **Fix what is killing you first.** Not what is annoying you.
- **Do not make big, irreversible choices when exhausted, hungry, or thirsty.** Sleep, eat, and drink first if you can do so safely.
- **Make small, reversible moves** and check results.
- **Ask: what is the worst realistic outcome?** If it is death or serious injury, pick the slower, safer option.
- **Write things down.** Stress shrinks memory. Keep lists of supplies, tasks, and times.
- **Assign jobs.** Everyone has a role: water, fire, cooking, children, watch, medical. Jobs reduce fear and arguments.

## Leading a group
- Be calm and clear. People copy the person who looks in charge.
- Give short, specific instructions.
- Listen to people who know more than you do.
- Share the plan and the reasons.
- Praise effort. Correct privately.
- Rotate rest. Tired people make dangerous mistakes.

## Children and others
- Tell children the truth in simple words. Give them a real job.
- Keep routines: meals, bedtimes, stories, games.
- Hugs and your presence help more than explanations.
- Watch for panic, withdrawal, and nightmares. Normal reactions pass ([[mental-health]]).

## Mistakes that hurt people in emergencies
- **Waiting too long** to leave when told to evacuate.
- **Taking foolish risks** to save belongings.
- **Ignoring warnings** because it "usually isn't that bad."
- **Splitting up** without a plan to reunite.
- **Overspending energy** early. Pace yourself.
- **Giving up.** Many survivors are people who simply kept going, one step at a time.

> NOTE: Fear is normal and useful. Your goal is not to feel no fear. It is to act well while afraid.
`

## Do this first
1. **Check for danger.** Look for traffic, fire, smoke, fallen power lines, gas, deep or moving water, unstable walls, or an angry person. If it is not safe, make it safe or stay back. You cannot help anyone if you become the next victim.
2. **Protect yourself.** Put on gloves if you have them (plastic bags work in a pinch). Avoid contact with blood. Wash your hands afterward.
3. **Check for a response.** Tap their shoulders firmly and shout, "Are you OK?"
4. **No response? Get help.** Shout for someone to call 911 and bring a first aid kit and an AED (automatic defibrillator). If you are alone and have phone service, put the phone on speaker and call. If you cannot call, see "When you cannot call for help" below.
5. **Look for life-threatening bleeding:** spurting blood, blood pooling on the ground, soaked clothing. Stop it now. See [[severe-bleeding]].
6. **Check breathing.** Tilt the head back and lift the chin to open the airway. Look at the chest, listen, and feel for breath for no more than 10 seconds. If they are not breathing, or only gasping, start [[cpr]].
7. **Check for shock** ([[shock]]), then find and treat other injuries, worst first.

## Why the order matters
Treat what kills fastest first: severe bleeding, then airway, then breathing, then shock. A broken bone or a gory but minor wound can wait. People who are screaming are usually breathing; the quiet one often needs help first.

## Opening the airway
- **Normal method (head tilt, chin lift):** one hand on the forehead tilts the head back, fingertips of the other hand lift the chin.
- **If you suspect a neck or spine injury (jaw thrust):** kneel at the head, place your fingers behind the angles of the jaw, and lift the jaw forward without tilting the head. If this does not open the airway, use the head tilt anyway. **Breathing comes before the spine.**

## Recovery position
Use it for a person who is **unresponsive but breathing normally** and who has no suspected spine injury (or if you must leave them or they are vomiting).
1. Kneel beside them. Straighten their legs. Place the arm nearest you at a right angle to the body, palm up.
2. Bring the far arm across the chest and hold the back of that hand against their near cheek.
3. With your other hand, pull the far knee up with the foot flat on the ground.
4. Keeping their hand pressed to the cheek, pull the knee toward you to roll them onto their side.
5. Tilt the head back slightly so the airway stays open. Adjust the top leg so the hip and knee are at right angles.
6. Keep checking that they are breathing. If they stay in this position more than about 30 minutes, roll them to the other side.

## Talk to them: SAMPLE history
If the person is awake, ask these questions (or ask family or bystanders) and write down the answers.

| Letter | Ask about |
|---|---|
| **S**igns and symptoms | What hurts? What do you feel? When did it start? |
| **A**llergies | Medicines, foods, stings, latex |
| **M**edications | What do you take? Insulin, blood thinners, heart pills? Any today? |
| **P**ast history | Heart disease, diabetes, asthma, seizures, pregnancy, recent surgery |
| **L**ast intake | Last food, drink, alcohol, or drugs |
| **E**vents | What happened? Fall? Collapse? How far? |

Look for a medical ID bracelet or necklace.

## Head-to-toe check
Once life threats are handled, check the whole body, gently, for bleeding, deformity, swelling, bruising, and pain: scalp, face, neck, collarbones, chest (does it move evenly?), belly, pelvis (press gently on the sides, do not rock it), arms, legs, and back (slide a hand under without rolling them if you suspect a spine injury). Note pulse, breathing rate, skin color, and temperature. **Write down what you find and the times.** Recheck every 5 to 15 minutes; people can get worse.

## Do not move them unless
- There is immediate danger (fire, rising water, unstable building, traffic, gas).
- You must move them to give CPR or to reach life-saving care.

Otherwise leave them where they are, keep them warm and calm, and see [[head-spine-injury]] and [[moving-patients]].

## When you cannot call for help
> CALL: If you can reach 911 or a doctor, do so now. If the phone network is down, send a runner to the nearest fire station, clinic, or neighbor with medical training, or use a radio ([[emergency-frequencies]]).

Do not leave a seriously injured or unresponsive person alone unless it is the only way to get help. Send two people if you can, with a written note: what happened, when, what you did, and where the patient is. See [[triage-no-help]] if there are several injured people.

## Do this first (adult)
1. **Confirm cardiac arrest:** the person is unresponsive and is **not breathing, or only gasping.** Gasping is not breathing.
2. **Send someone to call 911 and get an AED.** If you are alone with a phone, put it on speaker. If there is no phone service, start CPR anyway.
3. **Lay them on their back on a firm, flat surface.**
4. **Compress:** kneel beside them. Put the heel of one hand on the center of the chest (lower half of the breastbone), the other hand on top, fingers interlocked. Lock your elbows, shoulders directly over your hands.
5. **Push hard and fast:** at least **2 inches (5 cm)** but not more than 2.4 inches (6 cm) deep, at **100 to 120 pushes per minute**. Let the chest fully rise between pushes. Keep interruptions under 10 seconds.
6. **Keep going** until an AED is ready, the person starts breathing or moving, trained help takes over, you are too exhausted to continue, or the scene becomes unsafe.

The **CPR Metronome** in the Tools tab gives you the beat. Without it, push to the beat of "Stayin' Alive" (about 103 per minute).

## Hands-only or with breaths?
- **Untrained, or unwilling to give breaths:** hands-only CPR. Push continuously, no stopping.
- **Trained:** give **30 compressions, then 2 breaths**, and repeat.

### Giving breaths
1. Tilt the head back, lift the chin, pinch the nose closed.
2. Seal your mouth over theirs (use a face shield or pocket mask if you have one).
3. Blow for about 1 second, just enough to see the chest rise. Give 2 breaths.
4. If the chest does not rise, re-tilt the head once and try again. Do not spend more than 10 seconds on breaths. Go straight back to compressions.

## Child (age 1 to puberty)
- Same steps. Use **one or two hands**, pushing about **2 inches (5 cm)**, or one-third of the chest depth.
- Rate 100 to 120 per minute. **30 compressions to 2 breaths** (15:2 if two trained rescuers).
- Children usually stop breathing first (choking, drowning, asthma), so **breaths matter more** for children. If you are alone and unable to call, do about 2 minutes of CPR before leaving to find help.

## Infant (under 1 year)
- Lay the baby on a firm surface. Use **two fingers** in the center of the chest just below the nipple line (or two thumbs with your hands wrapped around the chest if two rescuers).
- Push about **1.5 inches (4 cm)**, one-third of the chest depth, at 100 to 120 per minute.
- **30 compressions to 2 breaths** (15:2 with two rescuers). Cover the baby's mouth and nose with your mouth and give gentle puffs, just enough to see the chest rise.

## Using an AED
1. Turn it on and follow the voice prompts. Keep doing CPR until the pads are ready.
2. Bare the chest, dry it if wet, and remove medication patches. Apply the pads as shown on the pad pictures (usually upper right chest and lower left side). For a small child, use child pads or a child mode; adult pads are acceptable if nothing else is available, but they must not touch. For an infant, one pad on the chest and one on the back.
3. Let the AED analyze. **Stand clear** and make sure no one is touching the person. Press the shock button if it says to.
4. Start compressions again **immediately** and continue for 2 minutes until the AED prompts again.
5. Move the person away from standing water. If there is a pacemaker lump under the skin, place pads at least 1 inch (2.5 cm) away.

> NOTE: AEDs need batteries but not mains power. Find out where public AEDs are in your community now.

## Special situations
- **Drowning:** give 5 rescue breaths first, then CPR ([[drowning-electric]]).
- **Opioid overdose:** give naloxone if available, and breaths ([[poisoning-overdose]]).
- **Hypothermia:** keep going longer; a very cold person can be revived ([[hypothermia-frostbite]]).
- **Choking that becomes unresponsive:** start CPR ([[choking]]).
- **Serious injury with major bleeding:** stop the bleeding first ([[severe-bleeding]]).

## Realistic expectations
You may hear ribs crack. That is common and acceptable; keep pushing. CPR can keep blood moving to the brain until a shock or advanced care is available. When no ambulance is coming, survival is low, and you are not at fault if the person does not live. Wilderness medicine guidelines generally consider it reasonable to stop after about 30 minutes with no response (but not for hypothermia, lightning, or drowning in cold water), or sooner if you are exhausted or in danger. If several people are present, **swap the person doing compressions every 2 minutes.**

    body: `
## Mild or severe?
- **Mild choking:** the person can cough forcefully, speak, or breathe. Do not slap their back or put fingers in their mouth. Encourage them to keep coughing and stay with them.
- **Severe choking:** they cannot cough, speak, cry, or breathe, make no sound, or grab their throat. Lips may turn blue. **Act at once.**

## Adult or child over 1 year: severe choking
The Red Cross teaches 5 back blows alternating with 5 abdominal thrusts. The American Heart Association teaches abdominal thrusts alone. Both are in use. This guide gives the Red Cross sequence; if you were trained another way, use what you know and keep going until the object comes out.

1. Ask, "Are you choking?" If they nod, say you will help. Send someone to call 911 if possible.
2. **Give 5 back blows.** Lean the person forward, support the chest with one hand, and strike hard between the shoulder blades with the heel of your other hand.
3. **Give 5 abdominal thrusts.** Stand behind them and wrap your arms around the waist. Make a fist with the thumb side just above the navel and well below the breastbone. Grasp the fist with your other hand and pull sharply inward and upward.
4. **Repeat** 5 back blows and 5 thrusts until the object comes out or the person becomes unresponsive.

### Pregnant or very large person
Use **chest thrusts** instead: arms around the chest, fist in the center of the breastbone, pull straight back.

### If you are alone and choking
Make a fist and give yourself abdominal thrusts, or lean hard over the back of a chair, counter edge, or table and thrust your belly against it. Try several times.

### If the person becomes unresponsive
1. Lower them carefully to the ground. Call 911 if you have not.
2. **Start CPR** with chest compressions ([[cpr]]).
3. Each time you open the airway for breaths, look in the mouth. **If you see the object, remove it.** Never do blind finger sweeps; they can push it deeper.

## Infant (under 1 year): severe choking
**Never do abdominal thrusts on a baby.**
1. Sit and hold the baby face down along your forearm, resting on your thigh, supporting the head and jaw. The head should be lower than the chest.
2. Give **5 back blows** between the shoulder blades with the heel of your hand.
3. Turn the baby face up along your other forearm, still head-low. Give **5 chest thrusts** with two fingers on the center of the breastbone just below the nipple line, about 1.5 inches (4 cm) deep.
4. Repeat 5 back blows and 5 chest thrusts until the object comes out or the baby becomes unresponsive. Then start infant CPR ([[cpr]]). Look in the mouth before each set of breaths.

## After choking
Anyone who needed abdominal thrusts, passed out, or has a lingering cough, pain, or trouble swallowing should be checked by a clinician if possible. Thrusts can bruise or injure internal organs. Watch for belly pain, vomiting, coughing, or noisy breathing over the next day.

## Prevention
- Cut food for young children into small pieces. Children under 4 should not eat whole grapes, hot dogs, nuts, popcorn, hard candy, or raw carrot chunks.
- Sit down to eat. Chew well. Avoid talking and laughing with a full mouth.
- Keep small objects (coins, batteries, magnets, balloon pieces) away from babies and toddlers.

## Do this first
Blood loss can kill in minutes. Act before anything else except scene safety.
1. **Expose the wound.** Cut or tear away clothing so you can see where the blood is coming from.
2. **Press hard directly on it** with the thickest cloth you have (gauze, shirt, towel). Use both hands and your body weight. Do not peek.
3. **If blood soaks through, add more cloth on top** and keep pressing. Do not remove the first layers.
4. **If it is a deep wound, pack it** (see below), then press.
5. **If it is a limb and bleeding is spurting, pooling, or will not stop, apply a tourniquet** (see below).
6. Once controlled, wrap firmly with a pressure bandage. Treat for [[shock]].

Wear gloves or use plastic bags if you can. Wash up afterward.

## Pressure and wound packing
- Direct pressure alone stops most bleeding if it is hard enough and kept up without peeking.
- **For a deep wound (stab, gunshot, big gash):** stuff gauze or clean cloth **into the wound** with your fingers, pushing it all the way to the bleeding source and filling the whole cavity. Then press hard on top for **at least 3 minutes** (longer if it keeps bleeding). Hemostatic (clotting) gauze works the same way: pack it in, then press for 3 minutes.
- Wrap tightly with an elastic bandage or strips of cloth. Check that fingers or toes below the wrap are still warm and pink.
- Elevating the limb and pressing on "pressure points" are not reliable. Do not use them in place of direct pressure.
- Do not remove embedded objects. Pad around them and press beside them.

## Tourniquet: for life-threatening limb bleeding
Use it when pressure fails, when blood is spurting or pooling, or when a hand, foot, or limb has been cut off.
1. **Place it 2 to 3 inches (5 to 7 cm) above the wound**, between the wound and the heart. **Never put it over a joint** (knee, elbow); go higher on the limb. If you cannot find the exact spot, put it high on the limb.
2. Pull the strap tight, then twist the windlass rod until **the bleeding stops completely**. It will hurt a lot. That is normal. Tight enough to stop the bleeding is the goal.
3. Lock the rod in place.
4. **Write the time** on the person's forehead or on the tourniquet (use the Tourniquet Clock in the Timers tool).
5. If bleeding continues, put a **second tourniquet** just above the first.
6. **Do not loosen or remove it.** Tell the next medical person the time it was applied. Never cover it up.

> WARNING: Tourniquets are for arms and legs only. Never use one on the neck, head, chest, or belly.

### Improvised tourniquet
A narrow cord, wire, or thin belt can cut skin and fail. Use a **wide strap (at least 1.5 to 2 inches / 4 to 5 cm)**: a belt, a folded triangular bandage, or a strip torn from a shirt.
1. Wrap it twice around the limb above the wound and tie a half-knot (like the first half of tying a shoe).
2. Lay a strong rod (stick, screwdriver, spoon handle, about 6 inches / 15 cm) on the knot. Tie a full knot over it.
3. Twist the rod until bleeding stops. Secure the rod so it cannot unwind (tie it down with another strip, or tape).

### How long can a tourniquet stay on?
A limb can usually tolerate a tourniquet for about 2 hours without lasting harm. Risk of permanent damage rises after that, and it grows sharply by 6 hours. **Keep it on and get to care.** Only a trained person should try to convert it to a pressure dressing, and only if the person is not in shock, the limb is not amputated, and the tourniquet has been on under 6 hours. If you are not sure, leave it.

## Neck, armpit, and groin wounds
A tourniquet will not work. Pack the wound with gauze and press firmly with your hand or knee for at least 3 minutes and then keep pressing until help arrives. For a neck wound, press on the wound only; do not squeeze the whole neck.

## Nosebleed
1. Sit up and lean **forward** (not back).
2. Pinch the soft part of the nose just below the bone, with a finger on each side, for **10 to 15 minutes without letting go.** Breathe through the mouth.
3. If it is still bleeding after 20 minutes, or it follows a head injury, get medical care.

## Internal bleeding: warning signs
Bruising or swelling of the belly or flank, a rigid or very painful belly, vomiting blood or coffee-ground material, black or bloody stools, coughing up blood, or signs of shock after an injury (pale, clammy, fast pulse, confusion). Lay the person flat, keep them warm, give nothing by mouth, treat for [[shock]], and get them to care urgently.

## When to get help
All severe bleeding is an emergency. See also [[wound-care]], [[improvised-first-aid]], [[triage-no-help]].

    body: `
## What shock is
Shock means the body is not getting enough blood flow to the organs. It is **not** the same as being emotionally upset. It can follow heavy bleeding, burns, severe infection, serious allergic reaction, heart attack, or severe vomiting and diarrhea. It can kill even after the original injury has been treated.

## Signs
- Pale, cool, clammy (sweaty) skin; sometimes bluish lips or nails
- Fast, weak pulse (over 100 beats per minute at rest in an adult is a warning; over 120 is serious; normal is 60 to 100)
- Fast, shallow breathing
- Anxiety, restlessness, confusion, then drowsiness
- Weakness, dizziness, nausea, thirst
- Little or no urine

## Do this
1. **Treat the cause.** Stop bleeding ([[severe-bleeding]]), treat the burn, give epinephrine for a severe allergy ([[allergic-reaction]]).
2. **Call for help** if you can ([[first-aid-basics]]).
3. **Lay the person flat on their back.** Raise the legs about 12 inches (30 cm) if it does not cause pain. **Do not raise the legs** if you suspect a head, neck, or spine injury, a broken leg or pelvis, or if they are having trouble breathing. In that case, keep them in the most comfortable position (sitting up if they struggle to breathe).
4. **Keep them warm.** Cover them and put a blanket or pad under them as well. Cold makes shock and bleeding worse.
5. **Loosen tight clothing** (belt, collar).
6. **Give nothing by mouth** at first; they may need surgery or may vomit. Wet their lips. If help is many hours away and the person is fully alert, can swallow, and has no belly or head injury, small sips of water or oral rehydration solution ([[dehydration-ors]]) are reasonable.
7. **Stay with them.** Reassure them. Recheck breathing and pulse every 5 minutes. Be ready to start [[cpr]].
8. If they vomit or become drowsy, roll them onto their side (recovery position, see [[first-aid-basics]]). A pregnant woman should lie on her **left side.**

## When it is an emergency
Always. Shock is a life threat. Get the person to advanced care as fast as safely possible. If you cannot, keep doing the steps above, keep them hydrated if awake and able, keep warm, and recheck often.

## Fainting is different
Simple fainting (from heat, fear, standing too long) causes a brief loss of consciousness, and the person recovers within a minute or two once lying flat. Lay them down, raise the legs, loosen clothing, and give them water when they are fully awake. If they do not wake up quickly, are injured, or have chest pain or a very slow or irregular pulse, treat it as an emergency.
`

## Do this first
1. **Stop the bleeding** with firm pressure (small cuts stop in 5 to 10 minutes). If it will not stop, see [[severe-bleeding]].

3. **Flush the wound with lots of clean water**, under pressure if you can. Use drinking-quality or boiled-and-cooled water. Use at least a quart (1 liter) for a small wound and more for a large or dirty one. A squeeze bottle with a pinhole in the cap, a plastic bag with a pinhole, or a large syringe all work. Good flushing is the most important step in preventing infection.

## To close or not to close?
Closing a dirty wound traps germs inside and causes abscesses. **When in doubt, leave it open**, keep it covered, and let it drain.

You may close a wound with adhesive strips (butterfly or wound-closure strips) or tape **only if all of these are true**:

- It is not a bite, a puncture, or a crush injury.

## Wounds that need real medical care if you can reach it
- Deep enough to see fat, muscle, or bone
- Gaping wounds more than about 1/2 inch (1 cm) across or on the face, hands, joints, or genitals
- Bites by animals or people
- Puncture wounds (nails, fishhooks, sharp sticks) and anything contaminated with soil or manure
- Spurting or uncontrolled bleeding

## Dressing and daily care
- Keep the wound clean and covered. A moist, covered wound heals faster and with less scarring than one left to dry.
- **Change the dressing once a day**, and any time it gets wet or dirty. Gently flush it each time and look closely.
- A thin layer of honey (ideally medical-grade, otherwise raw) on a dressing helps with burns and wounds that are slow to heal.
- Keep injured hands and feet clean and dry; wear shoes.

## Signs of infection
Watch for:
- Pain, redness, swelling, or warmth that **increases after day 2**
- Redness spreading outward (mark the edge with a pen and check again in a few hours)
- Pus or a foul smell
- Red streaks moving up the limb toward the body
- Fever, chills, swollen glands

**If infection starts:** remove strips or stitches, open the wound edges, flush well, apply warm soaks for 15 minutes three or four times a day, elevate the limb, and keep it covered. Red streaks, fever, confusion, or rapid spread mean **sepsis may be starting; this is an emergency.** See [[infection-antibiotics]].

## Tetanus
Tetanus ("lockjaw") is deadly and lives in soil and manure. A booster is recommended if your last tetanus shot was more than **10 years ago, or more than 5 years for a dirty wound.** Check your records now. Symptoms (jaw stiffness, painful muscle spasms) start 3 to 21 days after the injury. Needs hospital care.

## Scrapes (road rash)
Scrub gently with soap and water, remove all grit (embedded dirt tattoos the skin and invites infection), and cover with a non-stick dressing. Change daily.

See also [[bites-stings]], [[burns]], [[improvised-first-aid]], [[disease-prevention]].

    body: `
## Do this first
1. **Stop the burning.** Move away from the heat source. If clothing is on fire: **stop, drop, and roll.** Turn off electricity before touching someone in contact with it.
2. **Cool the burn with cool running water for 10 to 20 minutes.** Use cool tap water or any clean cool water. This reduces pain and damage, even up to 20 minutes after the injury.
3. **Remove rings, watches, bracelets, and tight clothing near the burn** before it swells. Do not pull off clothing stuck to the skin.
4. **Cover loosely** with a clean, non-stick dressing, a clean dry cloth, or plastic wrap laid over (not wrapped tightly around) the burn.
5. **Treat pain** with ibuprofen or acetaminophen according to the label ([[meds-stockpile]]).
6. **Keep the person warm,** especially with large burns. Do not let someone with a big burn get chilled while you cool it; cool the burned area only.

> WARNING: Do not use ice or ice water (it deepens the injury). Do not apply butter, oil, toothpaste, egg, or powders. Do not pop blisters. Do not use fluffy cotton or adhesive bandages directly on the burn.

## How deep is it?
| Type | Looks like | Feels like |
|---|---|---|
| First degree | Red, dry, no blisters (like sunburn) | Painful |
| Second degree | Red, wet, blisters, swollen | Very painful |
| Third degree | White, brown, black, or leathery | May be numb because nerves are destroyed |

## Serious burns: get care if you can reach it
- Any burn on the **face, hands, feet, genitals, or over a major joint**
- Larger than the **person's palm** (the palm with fingers is about 1 percent of body surface)
- **Third-degree** burns of any size
- Burns that **wrap all the way around** a limb, finger, or the chest (they can cut off circulation or breathing as swelling builds)
- **Chemical and electrical burns** (see below)
- **Inhalation burns:** soot around the nose or mouth, singed nose hairs, hoarse voice, cough, noisy breathing. Airway swelling can close the throat within hours. **This is an emergency.**
- Burns in babies, young children, and elderly people
- More than 10 percent of the body in second-degree burns

## Large burns and fluids
Large burns leak fluid. If the person is awake and able to swallow, give frequent sips of water or oral rehydration solution ([[dehydration-ors]]). Watch for [[shock]].

## Chemical burns
1. Brush off any dry powder first, then flush with large amounts of running water for **at least 20 minutes.**
2. Remove contaminated clothing and jewelry while flushing.
3. Keep flushing even if pain lessens. If the eyes are involved, see [[chest-abdomen-eye]].
4. Never mix chemicals to "neutralize" a burn. Call Poison Control (1-800-222-1222 in the US).

## Electrical burns
Small entry and exit marks can hide serious damage along the path of the current, including heart rhythm problems and muscle injury. Anyone with an electrical burn needs medical evaluation. See [[drowning-electric]].

## Blisters and later care
- Leave blisters intact; they protect the skin underneath. If one breaks, wash gently with soap and water, apply a thin layer of antibiotic ointment or honey, and cover with a non-stick dressing.
- Change dressings once a day. Watch for infection: increasing pain, spreading redness, pus, fever ([[wound-care]]).

## Sunburn
Cool compresses, cool showers, aloe or moisturizer, plenty of fluids, ibuprofen. A blistering sunburn over a large area is a second-degree burn and the person may become dehydrated and feverish.

## Prevention
Set the water heater to 120 °F (49 °C) or below. Keep pot handles turned in. Keep matches, lighters, and candles away from children. See [[fire-safety]].

## Signs of a fracture
Pain at one spot, swelling, bruising, a bent or odd-looking limb, a grating feeling, inability to use or put weight on it, or bone through the skin. **If you cannot tell a break from a sprain, treat it as a break.**

## Do this first
1. **Control any bleeding** first ([[severe-bleeding]]). Treat for [[shock]] if needed.
2. **Keep the injured part still.** Do not try to straighten a broken bone (exceptions below).
3. **Check circulation, sensation, and movement below the injury** (fingers or toes): Are they warm and pink? Press a nail until white and release; color should return in about 2 seconds. Can the person feel your touch and wiggle the fingers or toes? Check the pulse at the wrist, or at the ankle or top of the foot.
4. **Splint** (see below). Recheck circulation, sensation, and movement right after, then every 15 to 30 minutes.
5. **Apply a cold pack** wrapped in cloth for 20 minutes at a time to reduce swelling and pain, and elevate the limb.
6. **Pain relief:** ibuprofen or acetaminophen ([[meds-stockpile]]).

## How to splint
- **Immobilize the joint above and below the break.**
- Splint the limb in the position you found it. If it is badly bent and the hand or foot is cold, blue, or has no pulse, a **single gentle, steady pull in line with the limb** may restore blood flow. Stop if pain or resistance is severe.
- Pad the splint with clothing or cloth, especially over bony spots.
- Tie it firmly **but not tight enough to cut off circulation.** Tie above and below the injury, not on it. Leave fingers and toes visible.
- Rigid options: boards, sticks, rolled magazines, cardboard folded into a U, a SAM splint, a pillow or rolled blanket. See [[improvised-first-aid]].

## By body part
- **Collarbone or upper arm:** place the forearm across the chest in a sling, then bind the arm to the body with a swathe (wide strap) around the chest.
- **Forearm or wrist:** splint from the elbow to past the fingers with the palm facing the body, then support in a sling.
- **Fingers:** tape ("buddy tape") the injured finger to its neighbor with padding between.
- **Ribs:** do not wrap tightly. Let the person hug a pillow. Have them take deep breaths and cough every hour or so to avoid pneumonia. If breathing becomes hard, see [[chest-abdomen-eye]].
- **Lower leg or ankle:** a pillow or folded blanket wrapped around the leg and foot and tied in 3 or 4 places works well; or splint from knee to foot.
- **Thigh bone (femur):** a life threat, because it bleeds heavily. Splint the whole leg to the uninjured leg with padding between, tied at several points; keep the person flat and treat for [[shock]]. Proper traction splints need training.
- **Pelvis:** suspect it after a hard fall or crash if the hips or groin hurt. Do not rock or lift the person. Lay them flat, bind a sheet or wide strap snugly around the hips (over the hip bones, not the waist), tie the knees together, and get help.
- **Hip fracture in older adults:** the leg may look shorter and the foot turned outward. Keep still and pad around the hip.
- **Neck and back:** see [[head-spine-injury]].

## Open fractures (bone through the skin)
Do not push the bone back in. Control bleeding with pressure **around** the bone, not on it. Cover with a moist clean dressing and splint in the position found. Infection risk is high, so flush well with clean water if help is delayed, and get to care as soon as you can.

## Sprains and strains
A sprain is a stretched or torn ligament; a strain is a stretched muscle.
- **Protect:** rest the joint for a day or two. Use a wrap for support (snug, not tight) and a splint or crutch if walking hurts.
- **Elevate** above the heart level when resting, and use cold for comfort, 15 to 20 minutes at a time.
- **Gradually** begin gentle movement as pain allows after the first couple of days.
- **Ankle rule of thumb:** if the person cannot take 4 steps, or has pain directly over the bony bumps on the back of the ankle bones, suspect a fracture and splint.

## Dislocations
A joint knocked out of place looks deformed, locks, and is very painful. **Do not force it.** Splint in the position found and get care. In a true remote emergency a trained person may attempt to reduce a shoulder or kneecap; a kneecap often returns when the leg is gently straightened. A dislocated finger can be gently pulled in line and buddy-taped. If circulation is cut off, seek help urgently.

## Warning signs after splinting
Severe pain, tight swelling, numbness, tingling, or a cold, pale, or blue hand or foot. **Loosen the splint at once.** Persistent tight swelling with severe pain is compartment syndrome, an emergency.

## Healing
Most broken bones need 6 to 8 weeks of immobilization. See [[moving-patients]] to carry someone out.

## Suspect a spine injury if
- A fall from higher than standing (more than about 3 feet / 1 meter), a car or bike crash, diving into shallow water, or a hard blow to the head or neck
- Neck or back pain, numbness, tingling, weakness, or inability to move any part of the body
- The person is unconscious, confused, or intoxicated after an injury
- Another painful injury is distracting them from neck pain

## Do this first
1. **Do not move them** unless there is immediate danger (fire, rising water, gas, unstable structure) or they cannot breathe.
2. **Tell them to stay still.** Hold their head steady in line with the body with your hands on both sides, or pack rolled clothing on both sides of the head.
3. **Open the airway with a jaw thrust** if they are unresponsive (see [[first-aid-basics]]). If they are not breathing and you cannot open the airway that way, tilt the head back anyway. **Breathing comes before the spine.**
4. **Check circulation, feeling, and movement** in all four limbs: Can they feel your touch? Squeeze your fingers? Wiggle toes?
5. **Keep them warm.**
6. **If you must move them,** roll them as a single unit ("log roll") with at least three people, one holding the head and directing, keeping the head, neck, and trunk in a straight line. If they vomit, roll them onto their side the same way.
7. **Do not remove a helmet** unless it blocks the airway or you cannot give CPR.

## Can I rule out a spine injury?
If a person is fully awake and alert, sober, has no neck tenderness when you press gently along the middle of the spine, no numbness or weakness, no other painful injury distracting them, and can turn their head about 45 degrees each way without pain, a serious neck injury is unlikely. If **any** of these is not true, treat it as a spine injury. When in doubt, stabilize.

## Moving someone with a suspected spine injury
Use a rigid board, door, or flat stretcher; pad hollows (under the neck, knees, small of back); strap the chest, hips, and legs; and stabilize the head with rolled cloth on both sides. Move slowly and keep the head from rotating. See [[moving-patients]].

## Concussion
A concussion is a brain injury from a blow or violent shaking. The person does not need to lose consciousness.

**Signs:** headache, confusion, memory loss of the event, dizziness, balance problems, nausea or vomiting, blurred vision, sensitivity to light or noise, drowsiness, "seeing stars," slow answers.

**Care:**
- Rest for 24 to 48 hours. No screens, sports, or heavy work.
- Stay with them for the first 24 hours. Sleeping is fine; if you are worried, wake them once or twice to check that they wake easily and make sense.
- Acetaminophen for headache. Avoid alcohol. Avoid aspirin and ibuprofen for the first day (they can raise bleeding risk).
- Return to activity gradually. Another blow before recovery can cause serious injury, especially in children.

## Danger signs: get urgent care
Watch for the next 24 to 72 hours:
- Headache that gets worse, or vomiting more than twice
- Drowsiness, cannot be woken, or increasing confusion
- One pupil larger than the other, double vision, or new vision loss
- Weakness, numbness, slurred speech, clumsy walking
- Seizure
- Clear or bloody fluid from the nose or ears, or bruising behind the ears or around both eyes
- In babies: repeated vomiting, will not feed, bulging soft spot on the head

Bleeding inside the skull can start slowly and the person may seem fine for hours before getting worse.

## Scalp wounds
The scalp bleeds heavily. Press firmly with a thick pad. If the skull feels dented or soft, or you see bone fragments, press around the edges and do not push on it. Cover and get care.

## Unconscious after a head injury
Check airway and breathing. If breathing and no spine injury is suspected, use the recovery position. Otherwise keep them still, keep the airway open with a jaw thrust, and get help.

    body: `
## Do this first
1. **Get out of the wind, rain, and cold.** Handle the person gently. In severe hypothermia, rough handling can trigger a fatal heart rhythm.
2. **Remove wet clothing** (cut it off if needed) and dry the skin.
3. **Insulate from the ground** with a pad, pack, branches, or blankets.
4. **Wrap the whole body,** including the head, in dry blankets, sleeping bags, or coats. Add a waterproof or plastic outer layer to hold heat in.
5. **Add heat to the chest, neck, armpits, and groin** with warm (not hot) water bottles or heat packs wrapped in cloth, or share body heat in a sleeping bag skin to skin.
6. **If they are awake and can swallow,** give warm sweet drinks and high-calorie food. No alcohol.
7. **Keep them lying flat and still** if they are confused, drowsy, or severely cold.

## Stages of hypothermia
| Stage | Signs |
|---|---|
| Mild (core about 90 to 95 °F / 32 to 35 °C) | Shivering, cold hands and feet, clumsy ("the umbles": stumbles, mumbles, fumbles, grumbles), poor judgment |
| Moderate (about 82 to 90 °F / 28 to 32 °C) | Shivering slows or stops, confusion, slurred speech, drowsiness, irrational behavior (some people undress) |
| Severe (below about 82 °F / 28 °C) | Unconscious, stiff muscles, very slow shallow breathing, faint or no pulse; may look dead |

**Mild:** once warm and dry, eating and light movement help rewarm. **Moderate and severe:** do not let them walk or exert; treat as above and get to care.

## Mistakes that kill
- **Do not rub the arms or legs or massage them.**
- **Do not use a hot bath or direct high heat** on a severely cold person.
- **Do not give alcohol.**
- **Do not leave them alone** or let a confused person wander off.

## Not breathing?
Check the breathing and pulse for **up to 60 seconds** because both can be very slow. If none, start [[cpr]]. **A very cold person can be revived after a long time, so keep going longer than usual** until they are rewarmed or you are unable to continue, unless there are obvious fatal injuries, the chest is frozen solid, or it is unsafe.

## Falling into cold water
You have about 1 minute to control your breathing, 10 minutes of useful movement, and about 1 hour before you lose consciousness. Get out, hold onto anything floating, and treat for hypothermia right away.

## Frostnip and frostbite
- **Frostnip:** pale or red, numb skin that tingles; warms with skin contact. No lasting damage.
- **Superficial frostbite:** white or waxy skin that feels hard on top but soft underneath.
- **Deep frostbite:** hard, cold, numb, no feeling; blisters (clear or blood-filled) after rewarming; may turn black over days.

### Treatment
1. Treat hypothermia first.
2. Get out of the cold. Remove rings, tight boots, and wet clothing.
3. **Rewarm only if there is no chance it will freeze again.** Soak in warm (not hot) water at **99 to 102 °F (37 to 39 °C)**, about as warm as a comfortable bath, for 15 to 30 minutes until the skin is soft and color and feeling return. Rewarming hurts a lot; give ibuprofen.
4. **Never rub or use dry heat** (fire, heater, heating pad); numb skin burns easily.
5. Dress loosely with dry, clean gauze, put gauze between toes and fingers, and elevate. Do not break blisters.
6. **If you must walk to safety,** do it on frozen feet rather than thawing them and having them refreeze. Thaw, then refreeze, causes much worse damage.

## Trench foot (immersion foot)
Caused by feet staying wet and cold (but not freezing) for hours or days. Feet are numb, pale or blue, swollen, and may blister. Dry the feet, warm them gently, elevate, and keep them dry. Pain returns as they warm. Prevent it by changing to dry socks at least twice a day, airing the feet, and wearing waterproof boots.

## Who is at highest risk
Infants, older adults, people who are exhausted, hungry, drunk, or soaked, and people in cotton clothing. See [[clothing-layers]], [[heating-home]], [[winter-storm]].
`

## Heat stroke is an emergency
**Signs:** body temperature over 104 °F (40 °C) plus **confusion, agitation, slurred speech, strange behavior, seizure, or passing out.** Skin may be hot and dry, or the person may still be sweating (common when it happens during exertion).

**Cool first, transport second.** Brain damage and death come from how long the body stays overheated.

### Do this
1. **Move the person into shade or a cooler place.** Remove excess clothing.
2. **Cool as fast as you can:**
   - **Best:** immerse in a tub, stream, or pool of cold water up to the neck (ice water if you have it) until the temperature drops to about 102 °F (39 °C), typically 10 to 15 minutes.
   - **If you cannot immerse:** soak the skin with cold water and fan constantly, put ice packs or wet cold towels on the neck, armpits, and groin, and swap them as they warm. Wet sheets with ice are very effective.
3. **Call for help** or arrange transport once cooling has started.
4. **Do not give anything by mouth** if they are confused or not fully awake. Do not give aspirin or acetaminophen; they do not work for heat stroke.
5. **Stop active cooling when they reach about 101 to 102 °F (38.3 to 38.9 °C)** so you do not overcool them. Keep monitoring.
6. If they have a seizure or vomit, turn them onto their side. If they stop breathing, start [[cpr]].

## Heat exhaustion
**Signs:** heavy sweating, pale and clammy skin, headache, dizziness, nausea or vomiting, muscle cramps, weakness, fast weak pulse, temperature up to about 104 °F (40 °C). They are still thinking clearly.

### Do this
1. Move to shade or a cool room. Lie down with legs raised.
2. Loosen or remove extra clothing.
3. Cool with wet cloths, a fan, or a cool shower.
4. **Sip water or oral rehydration solution** ([[dehydration-ors]]), about a cup every 15 minutes if they are not vomiting.
5. Rest for the remainder of the day.

**Treat it as heat stroke** if there is any confusion, if they cannot keep fluids down, or if they are not better in about 30 minutes.

## Heat cramps
Painful muscle spasms during or after hard work in the heat. Rest in the shade, gently stretch, and drink water or an electrolyte drink with some salt (or eat a salty snack). Do not return to heavy work for several hours.

## Drinking too much plain water
Sweating for hours and replacing it with plain water only can lower blood sodium (**hyponatremia**): headache, nausea, confusion, swollen hands and feet, seizures. Drink to thirst, and eat salty foods or use oral rehydration solution during long hot work. Stop drinking plain water if symptoms appear and get urgent care for confusion or seizures.

## Prevention
- Drink steadily; pale yellow urine is the goal. Do not wait for thirst.
- Rest in shade during the hottest hours (noon to 4 pm). Work early morning and evening.
- Wear loose, light-colored clothing and a hat. Allow 1 to 2 weeks to adapt to heat gradually.
- Check on older adults, young children, and people on certain medications (diuretics, antihistamines, some psychiatric drugs).
- **Never leave a child, pet, or anyone in a parked car.** The inside can rise 20 °F in 10 minutes.

See [[staying-cool]], [[extreme-heat]].

## Make oral rehydration solution (ORS) now
This is the World Health Organization home recipe. It has saved millions of lives.

**Mix:**
- **1 liter (about 1 quart) of clean water** (boiled and cooled, or treated: see [[water-safety]])
- **6 level teaspoons of sugar**
- **1/2 level teaspoon of salt**

Stir until dissolved. A 1-quart (32 oz) bottle is close enough. It should taste **less salty than tears.** **Do not add extra salt;** too much salt is dangerous. Always use level measuring spoons.

Packets of oral rehydration salts work too; mix with the amount of water on the label. Make a fresh batch each day and discard after 24 hours.

## How to give it
- **Small, frequent sips.** For a child who is vomiting, give a teaspoon every 1 to 2 minutes. If they vomit, wait 10 minutes, then start again slowly. Vomiting often stops once they are rehydrated.
- **After each loose stool:**
  - Under 2 years: about 1/4 to 1/2 cup (50 to 100 mL)
  - 2 to 10 years: about 1/2 to 1 cup (100 to 200 mL)
  - Older children and adults: as much as they want
- Continue **breastfeeding** babies, and keep feeding normally (starchy foods, rice, bananas, soup) as soon as they will eat. Do not starve a person with diarrhea.
- If zinc tablets are available, children with diarrhea should take 20 mg a day for 10 to 14 days (10 mg a day for babies under 6 months).

## Stopgaps if you have no sugar or salt
Sip clean water. Eat something salty and something sweet separately: salted crackers, broth, ripe fruit, rice water with a pinch of salt. Avoid sodas and undiluted juice, which can make diarrhea worse. Avoid caffeine and alcohol.

## Signs of dehydration
| Level | Adults | Children and babies |
|---|---|---|
| Mild to moderate | Thirst, dry mouth, dark yellow urine, less urine, headache, tiredness, dizziness on standing | Irritable, thirsty, fewer wet diapers, no tears when crying |
| Severe | Very little or no urine for 8 hours, sunken eyes, very dry mouth, fast weak pulse, confusion, fainting, cold hands and feet | Very sleepy or limp, sunken eyes and soft spot, no wet diaper in 3 hours (infants), cold blotchy hands and feet |

Pinch the skin on the back of the hand: in dehydration it stays "tented" for more than 2 seconds.

## When it is an emergency
- Cannot keep any fluid down for several hours
- Blood in the stool or black stools
- High fever, stiff neck, severe belly pain
- Extreme sleepiness, confusion, or fainting
- Infants under 6 months with diarrhea or vomiting
- No urine for 8 hours

If professional care is reachable, go. If not, keep giving ORS in tiny, steady amounts, even by teaspoon or oral syringe, around the clock. See [[common-illness-care]] and [[disease-prevention]].

## Preventing dehydration
- Treat all drinking water ([[chemical-disinfection]], [[boiling-water]]).
- Wash hands with soap after the toilet and before food ([[handwashing-hygiene]]).
- Drink extra in heat, during illness, and when working hard ([[water-needs]]).

    body: `
## Snakebite
In North America the dangerous snakes are rattlesnakes, copperheads, cottonmouths (water moccasins), and coral snakes.

### Do this
1. **Move away** from the snake. Do not try to catch or kill it; you do not need to identify it, and most bites happen when people handle snakes.
2. **Stay calm and keep still.** Walking or running speeds the spread of venom. Have others carry you if possible.
3. **Remove rings, watches, and tight clothing** from the bitten limb before it swells.
4. **Keep the bitten limb still, at about heart level or slightly lower.** Do not raise it.
5. **Mark the edge of the swelling with a pen and write the time.** Repeat every 15 to 30 minutes.
6. **Get to medical care and antivenom as fast as possible.** Call 911 if you can.

> WARNING: Do NOT cut the bite, suck out the venom, apply a tourniquet, pack in ice, apply electric shock, drink alcohol or caffeine, or use "snakebite kits." These make things worse.

Symptoms include pain, swelling, fang marks, bruising, tingling, a metallic taste, nausea, weakness, and trouble breathing; coral snakes cause drooping eyelids, slurred speech, and weakness more than pain. Pit viper bites (rattlesnakes, copperheads, cottonmouths) mostly damage local tissue; a firm pressure wrap is **not** advised for these. For coral snakes and other nerve-toxin snakes, a firm elastic wrap over the whole limb, with the limb kept still, may slow spread.

If antivenom is out of reach: keep the person still, calm, warm, and hydrated, treat for [[shock]], keep the wound clean and loosely covered, and monitor breathing. Many healthy adults survive a rattlesnake bite without antivenom, but children, small people, and bites to the head, neck, or trunk are far more dangerous.

## Spiders and scorpions
- **Black widow** (shiny black with a red hourglass): pain, muscle cramps, rigid belly, sweating. Wash, apply a cold pack, take pain relief, and get care; high risk for children and the elderly.
- **Brown recluse** (tan with a violin mark): often painless at first, then a blister and slowly growing ulcer over days. Wash, cool, elevate; seek care if the sore grows.
- **Scorpions** (bark scorpion in the Southwest): intense pain, numbness, tingling. Cool the area. Watch children closely for trouble breathing, twitching, or drooling.

## Bee, wasp, and fire ant stings
1. **Scrape out the stinger** with a fingernail or card edge. Speed matters more than the method.
2. Wash, apply a cold pack, and use hydrocortisone cream and an antihistamine for itching and swelling.
3. Watch for a severe allergic reaction (trouble breathing, widespread hives, swelling of the face or tongue, dizziness). **If it happens, use epinephrine** ([[allergic-reaction]]).
4. Do not pop fire ant blisters.

## Ticks
1. Use fine-tipped tweezers and grasp the tick **as close to the skin as possible.**
2. **Pull straight up with steady pressure.** Do not twist, squeeze, burn, or smother it with oil.
3. Wash the area. Save the tick in a sealed bag if you can.
4. Watch for 30 days for fever, fatigue, a spreading rash (including a "bull's-eye"), or joint pain. The risk of Lyme disease rises after the tick has been attached about 36 hours or more; ask a clinician about a preventive antibiotic if you can reach one.

## Mosquitoes, chiggers, fleas
Wash and use hydrocortisone cream, calamine, or an oral antihistamine for itching. Avoid scratching to prevent infection. See [[pests-vectors]].

## Animal bites
1. **Control bleeding** with direct pressure.
2. **Wash the wound with soap and running water for 15 minutes.**
3. Cover loosely. **Do not close a bite wound.** Get care within 24 hours; bites often need antibiotics.
4. **Rabies:** bats (even a tiny scratch or waking up with a bat in the room), raccoons, skunks, foxes, and coyotes are the usual carriers; unvaccinated dogs and cats too. Rabies is almost always fatal once symptoms start, but treatment works if started promptly after the bite. **Do not wait for symptoms.** A healthy-looking dog or cat that bit someone should be confined and watched for 10 days.
5. **Human bites** are more infection-prone than many animal bites. A cut on the knuckle from punching a tooth needs prompt medical care.

## Marine stings
- **Jellyfish:** rinse with seawater (not fresh water), lift off tentacles with tweezers or a gloved hand, and treat pain with hot water at about 110 to 113 °F (43 to 45 °C) for 20 to 45 minutes. Vinegar helps with box jellyfish and many other species.
- **Stingray and spiny fish:** soak the wound in the hottest water the person can stand without scalding (test with an uninjured hand, about 110 to 113 °F) for 30 to 90 minutes. Watch for a retained barb, and clean well; infection is common.

## Prevention
Wear boots and long pants in snake country, watch where you put your hands and feet, shake out shoes and clothes, and use repellent. Treat clothing with permethrin for ticks. See [[pests-vectors]].
