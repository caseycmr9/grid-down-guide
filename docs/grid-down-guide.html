    body: `
## Do this first
1. **Add or remove layers to avoid sweating.** Sweat soaks insulation and chills you later.
2. **Cover your head, neck, hands and feet.**
3. **Keep dry.** Wet clothes lose most of their insulation. Change into dry clothes as soon as you can.

## The layering system
| Layer | Job | Good choices | Avoid |
|---|---|---|---|
| Base (next to skin) | Moves sweat away | Wool, polyester, polypropylene | **Cotton** |
| Middle | Holds warm air | Fleece, wool sweater, synthetic puffy jacket, down (only if dry) | Cotton hoodies |
| Outer | Blocks wind and rain | Waterproof shell, poncho, rain suit | Tight non-breathable gear while working hard |

## The COLD rule
- **C**lean: dirt and sweat reduce insulation.
- **O**verheating: vent or remove layers before you sweat.
- **L**oose: layers should be loose, because trapped air is what insulates and tight clothes block blood flow.
- **D**ry: wet kills warmth.

## Extremities
- **Head**: wear a hat or hood. A balaclava or neck gaiter helps.
- **Hands**: mittens are warmer than gloves. Wear thin liner gloves under them.
- **Feet**: wool socks, never cotton. If boots are tight, do not add thick socks, because they cut circulation. Keep a spare dry pair and sleep with damp socks inside your shirt to dry them.

## Improvised insulation
- Stuff **dry leaves, grass, straw, shredded paper or crumpled newspaper** between layers or into a jacket and pants. Remove it if it gets wet.
- A **trash bag with a head hole** is a quick rain layer. A plastic bag over a sock keeps feet dry in an emergency, but check often for sweat build-up.
- Space blankets reflect body heat. Wrap one inside your outer layer; they do not breathe, so watch for sweat.
- Cardboard, foam or branches under you stop heat loss to the ground.

## Sleeping warm
1. Your **sleeping pad is as important as the bag**. Without insulation underneath, the ground drains your warmth.
2. Wear dry base layers to bed, not the clothes you sweated in.
3. Eat a snack before sleeping; digestion makes heat.
4. Put a warm (not boiling) bottle of water at your feet.
5. Keep your boots, batteries and water bottle in the bag or under it so they do not freeze.
6. Do not breathe into the bag; moisture soaks it.

## Rain
A cold rain can cause hypothermia even above freezing (at 30-50 °F / 0-10 °C). A wet cotton hoodie is dangerous. Get under cover and into dry clothes. See [[hypothermia-frostbite]].

## Children
Kids lose heat faster than adults. Dress them in one more layer than you need and check their neck and chest, not hands, to judge whether they are warm.

## Hot-weather clothing
- Wear **loose, lightweight, light-colored** clothing, a wide-brim hat and sunglasses.
- Covering your skin protects it from sunburn better than bare skin does, and a wet neck cloth helps cool you.
- See [[staying-cool]].

## Repairs
Keep needle and thread and learn basic stitches: [[sewing-mending]].

    body: `
## Do this first
1. Move to the **coolest place**: lowest floor, shade, a basement or a cool public building.
2. **Drink water regularly**, before you are thirsty.
3. **Wet your skin** and let it evaporate: wet cloths on neck, wrists, armpits and groin, or a cool (not ice-cold) shower or bath.
4. Do hard work early in the morning or after sunset; rest from about 11 a.m. to 4 p.m.
5. **Check on neighbors**, elderly people, and anyone alone.

> DANGER: **Never leave a child, an adult who cannot get out, or a pet in a parked car.** The inside can heat by about 20 °F (11 °C) in 10 minutes and quickly become deadly.

## Who is at highest risk
Infants and young children, adults over 65, pregnant women, people with chronic illness, people on some medications (such as diuretics, antihistamines, and some psychiatric medicines), outdoor workers, and anyone without cooling. Watch them closely. Learn heat illness signs in [[heat-illness]].

## Cool the house
- **Daytime**: close curtains and blinds on the sunny side. Aluminum foil or white sheets on windows reflect heat.
- **Night and early morning**: open windows on opposite sides of the house for cross-breeze. A battery fan in an open window helps move air.
- Hot air rises: let it out through upper windows while cool air comes in lower ones.
- Use the **lowest floor** or basement during the day.
- Do not cook indoors if you can avoid it. Use an outdoor stove or eat cold foods.
- Hang a wet sheet over an open window or in front of a fan. Evaporation cools the air, and works best in dry climates.

## Cool your body
- Rinse or mist skin with cool water and let it dry; repeat.
- Soak feet and hands in cool water.
- Wear loose, light-colored cotton clothing and a hat outdoors.
- **Fans help, but in extreme heat a fan alone is not enough.** Above about 95 °F (35 °C) a fan blowing hot air does not protect older adults. Add water to the skin.
- Sleep on the lowest floor, on a damp sheet, or outdoors under a screened shelter.

## Drink and eat
- Drink water often. Sports-style drinks or an oral rehydration drink help if you sweat a lot ([[dehydration-ors]]).
- Avoid alcohol and heavy meals. Eat light food and fruit.
- Do **not** take salt tablets unless a doctor says to.
- If you drink a lot of plain water but are very low on salt, you can become confused or ill. Eat salty snacks if sweating heavily.

## Heat index
When humidity is high your sweat does not evaporate and heat feels worse. The National Weather Service rates a heat index above about 103 °F (39 °C) as dangerous for everyone with prolonged exposure.

## Pets and livestock
- Give plenty of shade and cool water.
- Wet down dogs and livestock if they pant heavily.
- Do not walk dogs on hot pavement; if you cannot hold your hand on it for 5 seconds, it is too hot.

## Do this first
1. **Stop using the toilet normally** if you are not sure the sewer works. After an earthquake, flood, or long outage, pipes may be broken or backed up.
2. If the sewer and drains are working, you can still flush by pouring 1–2 gallons (4–8 L) of non-drinking water (rain, pool, tub water) quickly into the bowl.
3. If water will not drain, or you are unsure, switch to a bucket toilet right away.

> WARNING: Untreated human waste spreads cholera, typhoid, dysentery, and hepatitis A. It is one of the biggest killers after a disaster. Wash hands every time: [[handwashing-hygiene]].

## Bucket toilet (best short-term option)
1. Use a sturdy 5-gallon (19 L) bucket with a lid. Add a toilet seat, or a pool noodle cut along its length and fitted around the rim.
2. Line it with a heavy-duty trash bag.
3. After each use, cover the waste with a scoop of sawdust, wood shavings, ash, dry leaves, or cat litter. This controls smell and flies.
4. Keep the lid closed. Place toilet paper in the bag.
5. When the bag is about half full, tie it tightly, double bag it, and store it in a lidded container away from food, water, and the living area.
6. Wash and disinfect the bucket. See [[laundry-dishes]].

Urine can be kept separate in its own container. It smells less and keeps the bucket drier. Pour urine on the ground well away from water sources and wells.

## Where to put waste
- If trash pickup works, double-bagged waste can go in the regular trash.
- If not, bury it ([[trash-garbage]]) or use a latrine.

## Trench latrine (groups or longer use)
1. Pick a site at least 200 feet (60 m) from streams, lakes, and springs, at least 100 feet (30 m) from wells (more in sandy or rocky soil), downhill from camp, and above flood level.
2. Dig a trench about 1 foot (30 cm) wide, 2–3 feet (60–90 cm) deep, and as long as needed.
3. After each use, cover with a thin layer of soil or ash.
4. Fill in and mark the trench when the waste is within 1 foot (30 cm) of the surface.
5. Place a handwashing station nearby: [[handwashing-hygiene]].

## Cat hole (one-time, away from home)
Dig a hole 6–8 inches (15–20 cm) deep, at least 200 feet (60 m) from water, trails, and campsites. Cover well. Bag and carry out toilet paper or burn it.

## Pit latrine (long term)
Dig a pit about 6 feet (2 m) deep. Cover it with a solid platform and a lid, and add a vent pipe with a screen to control flies and smell. Fill and move it when waste reaches 2 feet (60 cm) from the top.

## Keep flies and smells down
Keep lids closed, cover each deposit, keep the area clean, and keep a handwashing station nearby.

## Composting human waste
> DANGER: Never put fresh human waste on food crops or in a vegetable garden. Hot composting at 130 °F (55 °C) and aging for a year or more can reduce risk, but it is only for long-term, careful use on non-food plants, trees, or ornamentals.

## Special cases
- **Diarrhea:** give the sick person a dedicated bucket. Disinfect and handle with gloves. See [[disease-prevention]].
- **Babies and children:** a small potty, with waste emptied into the latrine.
- **Older or disabled people:** use a raised seat or bedside commode: [[elderly-disabled]].
- **Sewage backup or floodwater:** avoid contact. Wear boots and gloves, and clean with bleach after: [[flood]].

## Why it matters
Handwashing with soap is one of the best ways to prevent diarrhea, vomiting, and respiratory illness. In a crisis, when medical care may be out of reach, it matters even more.

## When to wash
- After using the toilet or changing a diaper
- Before eating or preparing food
- After touching raw meat, animals, trash, or waste
- After caring for a sick person or a wound
- After coughing, sneezing, or blowing your nose
- After touching anything dirty

## How to wash
1. Wet your hands with clean water (cold is fine).
2. Apply soap and lather, covering the backs of hands, between fingers, and under nails.
3. Scrub for **20 seconds**.
4. Rinse with clean water.
5. Dry with a clean cloth or let them air-dry.

A cup (250 mL) of water per wash is enough if you pour it.

## Build a tippy-tap
A hands-free washing station that uses little water:
1. Take a 1–2 gallon jug with a cap. Poke a small hole near the top of the side with a heated nail.
2. Hang the jug from a stick frame with string tied to the cap, with a foot lever connected to the string to tip the jug.
3. Hang soap on a string beside it.
Or simply have a helper pour water from a cup.

## No soap?
Wood ash or clean sand, rubbed over wet hands and rinsed well, helps lift germs off. It is not as good as soap, but much better than water alone.

## Hand sanitizer
Use an alcohol gel with at least 60% alcohol. Rub over all surfaces for 20 seconds until dry. It does not work well on visibly dirty or greasy hands and is less effective against norovirus. If you make your own, the final mix must still be at least 60% alcohol (for example, 2 parts 99% alcohol to 1 part aloe gel). Keep away from flames and children.

## Bathing with little water
Sponge bath with 1–2 quarts (1–2 L) of warm water:
1. Wash face, underarms, groin, and feet first.
2. Use a washcloth and a little soap. Rinse the cloth in a second container.
3. Wash hair every 1–2 weeks. Cornstarch or baking soda can absorb oil between washes.
4. Change underwear and socks daily if you can. Wash them as in [[laundry-dishes]].
5. Never wash with soap in a lake or stream. Carry water at least 200 feet (60 m) away.

## Other personal care
- Teeth: [[dental]]
- Feet: [[foot-care]]
- Period care: [[womens-health]]
- Lice and scabies: [[pests-vectors]]
- Trim fingernails short; dirt hides under long nails.
- Keep skin dry in creases. Rinse and dry well to prevent rashes.

## Water budget
A quick wash uses about 1 cup (250 mL) per use. A sponge bath uses 1–2 quarts. Plan these in your water supply: [[water-needs]].

> DANGER: Never mix bleach with ammonia, vinegar, or other cleaners. It creates toxic gas. Use bleach in a ventilated area, with gloves, and only plain unscented 5–6% household bleach.

## Washing dishes: the three-basin method
1. Scrape food into the trash or a compost bucket.
2. **Basin 1, wash:** hot, soapy water. Wash glasses and cups first, then plates, then greasy pots.
3. **Basin 2, rinse:** clean water.
4. **Basin 3, sanitize:** 1 tablespoon (15 mL) of unscented bleach per gallon (4 L) of water. Soak dishes for 1 minute.
5. **Air-dry** on a clean rack. Do not wipe with a towel.

Alternatives to the bleach step: dip in boiling water for a minute.

## Disinfecting surfaces
Clean first with soap and water. Then disinfect with 1/3 cup (5 tablespoons, 80 mL) of bleach per gallon (4 L) of water. Leave surfaces wet for at least 1 minute, then air-dry. Mix a fresh batch daily because it weakens within a day. Do not use on metal, which corrodes.

Use separate cutting boards for raw meat, and wash hands after touching it: [[safe-cooking-temps]].

1. Sort. Wash soiled diapers, bedding from sick people, and work clothes separately.
2. Shake out dirt and soak in soapy water.
3. **Bucket and plunger washer:** use a 5-gallon bucket with a lid with a hole cut for a clean toilet plunger or mop handle. Fill with 3–4 gallons (11–15 L) of warm water and soap, add clothes, and plunge up and down for 5–10 minutes.
4. Wring out, rinse twice in clean water, and wring again.
5. Hang in sunlight to dry. Sunlight helps kill germs.

For lice, bedbugs, or illness, wash in the hottest water you can, at least 130 °F (54 °C), and dry on high heat or in a hot sun: [[pests-vectors]]. For laundry soiled by feces or vomit, wear gloves, remove solids into the latrine ([[human-waste]]), wash in hot soapy water, and dry fully in the sun. Wash hands afterward.

## Cloths and sponges
Sponges spread germs. Use rags that can be boiled for 5 minutes or soaked in bleach solution and dried in the sun.

## Why it matters
Garbage draws rats, flies, and other pests that carry disease. It can also contaminate water. When pickup stops, plan your waste as carefully as your water.

## Sort it
1. **Reuse:** jars, cans, bottles, buckets, bags, cloth, and cardboard have many uses.
2. **Compost:** vegetable and fruit scraps, eggshells, coffee grounds, and leaves: [[compost-fertilizer]].
3. **Feed animals:** cooked scraps can go to chickens or pigs: [[chickens]]. Do not feed raw meat or spoiled food.
4. **Burn:** only clean paper, cardboard, and untreated wood, in a fire pit away from buildings and dry brush.
5. **Bury:** everything else that cannot be reused.

> DANGER: Never burn plastic, rubber, foam, painted or treated wood, batteries, aerosol cans, or electronics. They release toxic smoke or may explode. Do not burn medical waste in the open.

## Burial site
- At least 200 feet (60 m) from wells, springs, and streams, and above flood level.
- Dig a pit, add waste in layers, and cover each layer with soil. Fill to within 1–2 feet (30–60 cm) of the top and cover with at least 2 feet of soil.
- Flatten cans and rinse them first. Mark the spot.

## Kitchen waste
Keep it in a lidded container. Empty daily and wash the container. Bury or compost scraps. Keep it far from the living area to reduce pests.

## Meat, bones, and fat
Bury at least 3 feet (1 m) deep, or burn. Do not add to compost piles because they attract animals.

## Animal remains
Wear gloves. Bury dead animals at least 3 feet (1 m) deep and well away from water, or burn. For game and butchering waste, see [[field-dressing-big-game]].

## Sharps and medical waste
- Put needles, lancets, and razor blades in a puncture-resistant container (a metal can or thick plastic bottle with a lid). Label it.
- When the container is three-quarters full, seal it and bury it.

## Hazardous items
Keep paint, solvents, pesticides, motor oil, and batteries in closed containers, away from kids and water. Never pour them onto the ground or into water.

## Cut waste at the source
Buy bulk and repack. Reuse containers. Avoid disposable items you can wash.

## Rodents
- Seal gaps. A mouse can enter a hole ¼ inch (6 mm) wide; a rat, about ½ inch (12 mm). Use steel wool, hardware cloth, sheet metal, or cement.
- Store food in glass, metal, or thick plastic containers with tight lids. Clean up crumbs.
- Use snap traps baited with peanut butter, placed along walls. Poison can harm pets and children.
- Keep trash and compost covered and away from the house ([[trash-garbage]]).

> DANGER: Hantavirus is carried in dry rodent droppings and urine. Do not sweep or vacuum. Open windows for 30 minutes, wear gloves and a mask, spray droppings with a mixture of 1 part bleach to 9 parts water (about 1½ cups per gallon), wait 5 minutes, wipe up with paper towels, and bag the waste. Wash your hands. Seek care for fever and trouble breathing.

## Flies
Flies breed in waste, manure, and rotting food. Keep food covered, latrines closed, and trash lidded ([[human-waste]]). Fly traps: a jar with sugar water or overripe fruit and a funnel top. Fly screens help.

## Mosquitoes
- Remove standing water weekly (buckets, tires, gutters, bird baths). Mosquitoes breed in as little as a week.
- Use window screens and bed nets.
- Wear long sleeves and pants at dawn and dusk.
- **Repellents:** DEET (20–30%), picaridin (20%), or oil of lemon eucalyptus (not for children under 3). Put it on over sunscreen.
- Treat clothing with permethrin (never directly on skin).
- Smoke helps keep them off for a while.

## Ticks
1. Tuck pants into socks, wear light-colored clothing, and treat clothes with permethrin.
2. Check your body after being outdoors: scalp, behind ears, armpits, groin, behind knees.
3. **Remove:** grasp with fine-tipped tweezers as close to the skin as possible, pull straight up with steady pressure, and clean the area. Do not twist, squeeze, burn, or use oil.
4. Lyme disease is rarely passed in the first day; risk rises after about 36–48 hours. Watch for a rash, fever, or aches for 30 days. In areas with Lyme disease, ask a clinician about preventive treatment within 72 hours.

## Lice
- **Head lice:** itching and tiny eggs (nits) stuck to hair near the scalp. Use permethrin 1% lotion (repeat in 9–10 days) or comb wet, conditioned hair with a fine-toothed comb every 2–3 days for 2 weeks. Do not share combs, hats, or bedding.
- **Body lice:** live in clothing seams; spread in crowded, unwashed conditions and can carry typhus. Wash clothes in hot water (at least 130 °F / 54 °C) and dry on high heat, or boil. See [[laundry-dishes]].

## Scabies
Intense itching, worse at night, with small burrows between fingers and on wrists. Spreads through close skin contact. Treat with permethrin 5% cream from neck to toes and repeat in a week. Treat all household members at the same time. Wash bedding and clothes hot (at least 122 °F / 50 °C), or seal in a bag for 3 days.

## Bedbugs
Bites in lines, blood spots on sheets, tiny dark spots. Dry clothing and bedding on high heat for 30 minutes, vacuum, and use mattress covers. Keep beds away from walls.

## Fleas
Treat pets, wash bedding in hot water, and vacuum often.

## Snakes and other bites
See [[bites-stings]] for first aid. For disease control overall, see [[disease-prevention]].

## Why this matters
After a disaster or long outage, more people die from diarrhea, respiratory infections, and infected wounds than from the event itself. Most of this is preventable by getting water, waste, hands, food, and pests under control.

## The five fixes
1. **Safe water:** treat everything you drink. [[water-safety]], [[boiling-water]]
2. **Safe waste:** [[human-waste]], [[trash-garbage]]
3. **Clean hands:** soap, 20 seconds. [[handwashing-hygiene]]
4. **Safe food:** cook it, cover it, keep it cold or dry. [[food-safety-basics]], [[safe-cooking-temps]]
5. **Pest control:** [[pests-vectors]]

## Diseases to know
| Disease | How it spreads | Signs | Prevention |
|---|---|---|---|
| Cholera | Contaminated water or food | Sudden, profuse watery diarrhea, vomiting, fast dehydration | Treat water, ORS right away: [[dehydration-ors]] |
| Typhoid | Contaminated food or water | Fever rising over days, headache, belly pain | Boil water, cook food, handwashing |
| Hepatitis A | Feces to mouth | Fatigue, nausea, yellow skin or eyes, dark urine | Handwashing, vaccine |
| Giardia and Cryptosporidium | Contaminated water | Watery, greasy diarrhea, gas, cramps | Filter or boil water |
| Norovirus | Contaminated surfaces, food, vomit | Sudden vomiting and diarrhea for 1–3 days | Soap and water, bleach cleaning; alcohol sanitizer is weak |
| Dysentery (Shigella, E. coli) | Contaminated food or water | Bloody diarrhea, fever, cramps | Clean water, cooked food |
| Respiratory infections | Cough, close contact | Fever, cough, trouble breathing | Ventilation, masks, space, handwashing |
| Skin infections (staph, strep, impetigo) | Skin contact, shared items | Red, crusted, painful sores | Wound care, no shared towels: [[wound-care]] |
| Tetanus | Dirty wounds | Jaw stiffness, muscle spasms | Vaccine every 10 years (5 for dirty wounds) |
| Leptospirosis | Floodwater, rat urine | Fever, muscle pain, red eyes | Avoid floodwater, wear boots |

## Caring for a sick person
1. Put them in a **separate room**, if possible, with a window open. If there is only one room, keep at least 6 feet (2 m) apart and use curtains or sheets as dividers.
2. Choose **one caregiver**, if possible. Everyone else stays away.
3. Caregivers wear gloves and a mask (N95 or cloth) when handling body fluids or when the person is coughing. Wash hands after every contact.
4. Give them their own dishes, cup, towel, and bucket toilet.
5. Wash laundry in hot water and sun-dry. Disinfect surfaces: [[laundry-dishes]].
6. Provide fluids, rest, and food. See [[home-nursing]] and [[common-illness-care]].
7. Stay isolated until they have had no fever for 24 hours and no vomiting or diarrhea for 48 hours.

## If several people get sick
Suspect your water or food. Switch to boiled water, stop shared sources, separate the sick, and wash hands carefully. Track who is sick and when.

## Floodwater and wounds
Avoid contact with floodwater. Cover wounds, and wash with clean water and soap if exposed. Check tetanus status ([[wound-care]]).

## Crowded shelters
Aim for 1 latrine per 20 people, a handwashing station at every toilet and kitchen, sleeping places about 3 feet (1 m) apart, and fresh air.

## Get vaccinated now
Keep records of tetanus, hepatitis A, flu, and other vaccines, and ask your doctor what is due.

## Animals and carcasses
Use gloves and follow [[game-meat-safety]] when handling dead or hunted animals.

This is a hard topic. It matters because a death during a long crisis may fall to you. Treat the dead with dignity and protect the living.

## First, be sure
- Check for breathing and a pulse for at least a minute. Do not give up on people who are cold from hypothermia, who drowned, or who were hit by lightning without trying CPR: [[cpr]], [[hypothermia-frostbite]], [[drowning-electric]].
- If you can, call authorities or a medical examiner. Do not move a body if the death may be suspicious.
- Be honest with children and let them say goodbye if they wish.

## Record what you know
Write down the person's name, date and time of death, place, cause if known, who was present, and any ID or belongings. Photograph an ID if you can. Keep a copy. Later, families and officials will need these facts.

## Safety
- Wear gloves and wash hands afterward. Wear a mask if disease is suspected.
- Bodies of people killed in earthquakes, floods, or storms do **not** cause outbreaks. The main risk comes from the illness the person had, such as cholera or a hemorrhagic fever, which can remain infectious.
- For infectious deaths, limit contact, wrap the body in a sheet or plastic, and avoid washing it unless needed. See [[disease-prevention]].

## Until burial
Keep the body in the coolest, shaded, ventilated place. In warm weather, decay starts within 24–48 hours. Wrap in a clean sheet or tarp and label the wrapping.

## Burial
1. Choose a site at least 100 feet (30 m) from wells, springs, and streams, above the flood level and water table, and away from buildings.
2. Dig 4–6 feet (1.2–1.8 m) deep if possible. The minimum is 3 feet (1 m) of soil over the body. Deeper graves keep animals away.
3. Wrap the body in cloth or a biodegradable shroud. Avoid plastic if you can.
4. Cover with soil and mound it.
5. Mark the grave with stones or a cross, and record its location with a sketch and landmarks.
6. Say a few words. Give people time to mourn.

Keep each grave separate, even if there are many, so the dead can be identified later.

## Animals
Bury livestock and pets at least 3 feet (1 m) deep, away from water. See [[trash-garbage]].

## Grief
Allow time to grieve, hold simple rituals, and support each other. See [[mental-health]].

    body: `
## Do this first
1. **Check if it is just your house**: look at the breaker panel and at your neighbors. If it is only you, check the main breaker. If the whole area is out, report it if you can (texts use less network than calls).
2. Use **flashlights or headlamps, not candles**. Open flames are a leading cause of house fires in outages.
3. **Keep the refrigerator and freezer doors closed.**
4. **Unplug major appliances and sensitive electronics** to protect them from a surge when power returns. Leave one lamp switched on so you know when power is back, and wait a few minutes before plugging things in again.
5. **Never use a generator, grill, camp stove or gas oven indoors** to cook or heat: carbon monoxide. See [[generator-safety]] and [[heating-home]].

## Food safety
| Appliance | Food stays safe about |
|---|---|
| Refrigerator, door kept closed | **4 hours** |
| Full freezer, door closed | **48 hours** |
| Half-full freezer, door closed | **24 hours** |

- **Discard perishable food** (meat, poultry, fish, eggs, milk, soft cheese, cooked leftovers) that has been above **40 °F (4 °C) for 2 hours or more**. A thermometer in the fridge tells you for certain.
- Freezer food that still has ice crystals or is at 40 °F or colder can be cooked or refrozen.
- Use a cooler with ice or frozen water bottles to extend cold time.
- **Eat in this order**: fridge perishables first, then freezer food as it thaws, then pantry food.
- **When in doubt, throw it out.** See [[food-safety-basics]] and [[keeping-cold]].

## Water and toilets
- Water pressure can drop within hours or a day. **Fill tubs, pots and bottles early.** See [[water-storage]].
- If the toilet will not flush, pour 1-2 gallons (4-8 L) of water quickly into the bowl. Or use a bucket toilet: [[human-waste]].

## Keep warm or cool
Read [[heating-home]] in winter and [[staying-cool]] in summer. Pick one room to live in.

## Medical needs
- Oxygen concentrators, CPAP, nebulizers, powered wheelchairs, dialysis, home ventilators and some insulin pumps need power. **Have a backup plan before the outage.** Call your power company's medical priority line and your doctor. If you cannot manage safely, go to a shelter or hospital.
- Refrigerated medicines such as insulin: see [[chronic-conditions]].

## Phones and news
- Put phones in low-power mode, dim the screen, and send **texts instead of calls**. Cell towers have only a few hours of backup power.
- A battery or hand-crank radio keeps you informed: [[getting-information]].
- Charge devices in a car (outdoors, never in a closed garage) or with a power bank. See [[batteries-charging]].

## Around the house
- Learn where the **red release cord** is on your garage door opener so you can open it by hand.
- Do not rely on cards and ATMs; have cash.
- Keep a half tank of fuel in vehicles.
- **Stay at least 35 feet (10 m) away from downed power lines** and anything they touch.
- Check on elderly and ill neighbors, with caution and masks if needed.

## First-day checklist
- [ ] Flashlights and headlamps found and working
- [ ] Doors of fridge and freezer kept shut
- [ ] Thermometer placed in fridge
- [ ] Tubs and containers filled with water
- [ ] Major appliances unplugged
- [ ] One lamp left on
- [ ] Phones in low-power mode, battery radio on
- [ ] CO alarm checked if any fuel will be burned
- [ ] Medications and medical devices planned for
- [ ] Neighbors checked on

## If it lasts more than a day
Go to [[grid-down-timeline]] and [[infrastructure-failure]].

    summary: 'Portable generators kill with carbon monoxide every year. How to place, fuel, connect and size one so it helps instead of harms.',

    body: `
> DANGER: **Portable generators produce carbon monoxide (CO), an invisible, odorless gas that kills dozens of people in the US every year.** Never run one in a house, garage (even with the door open), basement, crawl space, shed, carport, porch, tent or camper, or near any opening.

## Do this first
1. Run the generator **outdoors only**, at least **20 feet (6 m) from your home**, with the exhaust pointed **away** from your home and neighbors, and away from windows, doors, vents and air intakes.
2. Install **battery-powered CO alarms** in each sleeping area and on each level of the house.
3. If anyone feels **dizzy, has a headache, nausea, weakness or confusion**, get them outside into fresh air at once and call 911 if you can.
4. Keep it **dry**. Run it under an open-sided canopy or tent made for generators. Never in rain unprotected, and never touch it with wet hands.

## Connecting power
- **Plug appliances directly into the generator**, or use heavy-duty, outdoor-rated extension cords rated for the load, with three-prong plugs. Keep them as short as practical and check for damage. Thicker cords (lower gauge number such as 12 gauge) are needed for long runs or heavy loads.
- **Never plug a generator into a wall outlet** to power the house (backfeeding). It can electrocute utility workers and neighbors, start fires and destroy the generator.
- To power house wiring safely, have a licensed electrician install a **transfer switch or interlock kit**.
- Do not overload the generator. Add up the **running watts** of everything you will use. Motors (refrigerator, freezer, well pump, sump pump, air conditioner) need **2-3 times more power to start**.

### Typical running watts (check the label on your appliance)
| Item | About |
|---|---|
| LED light bulb | 10 W |
| Phone charger | 10 W |
| Radio | 5-20 W |
| Television | 100-200 W |
| Laptop | 50-100 W |
| Refrigerator or chest freezer | 150-700 W (plus a start surge) |
| Sump pump | 800-1,000 W (plus a bigger start surge) |
| Microwave | 1,000-1,500 W |
| Space heater | 1,500 W |
| Well pump (half horsepower) | 1,000 W (plus a bigger start surge) |

Start the largest load first, then add smaller ones. Do not run the generator at the limit.

## Fuel
- **Turn it off and let it cool** before refueling. Gasoline spilled on a hot engine can ignite.
- Use fresh fuel of the right type, in approved containers. See [[fuel-storage]].
- A typical 5,000-watt generator burns roughly **1/2 to 3/4 gallon (2-3 L) per hour** at half load. Check your manual.
- **Save fuel by running in blocks.** Run the fridge and freezer for a few hours, then shut it off. Keep fridge and freezer doors closed in between. Charge phones and batteries while it is on.
- Add fuel stabilizer to stored gasoline. Run the generator briefly every month, and keep oil and air filter in good shape.

## Safe operation habits
- Keep children and pets away from the hot engine and exhaust.
- Keep a **fire extinguisher** nearby.
- Do not refuel while it is running.
- Follow the maker's instructions for grounding.
- **Inverter generators** are quieter, run more efficiently and give cleaner power for electronics. They are more expensive.

## No generator?
- [[solar-basics]] for power without fuel.
- [[batteries-charging]] for keeping devices running.
- [[power-outage-basics]] for what to do in the first hours.

> WARNING: Generator noise and light can attract attention in a long-term emergency. See [[opsec-low-profile]].

    summary: 'How a small solar setup works, how to size one, and what it can realistically run.',

    body: `
## The parts
1. **Solar panel** turns sunlight into electricity (direct current, DC).
2. **Charge controller** sits between the panel and the battery and stops the battery being overcharged. Required for any panel bigger than a very small trickle charger.
3. **Battery** stores energy for night and cloudy days.
4. **Inverter** (optional) converts the battery's DC into household AC (120 V). Use DC devices and USB directly when you can; it is more efficient.

## Learn two words
- **Watts (W)** is how fast something uses power.
- **Watt-hours (Wh)** is how much energy: watts times hours. A 10 W bulb for 5 hours uses 50 Wh.

To convert a battery: amp-hours times volts equals watt-hours. A 100 Ah, 12 V battery stores 1,200 Wh.

## How much power will you get?
**Daily output (Wh) = panel watts x sun hours x 0.75**

Use "peak sun hours", which is typically 3-6 per day depending on place and season. The 0.75 covers losses.

Example: a 100 W panel with 4 sun hours makes about 100 x 4 x 0.75 = **300 Wh a day**.

### What 300 Wh a day will run
| Use | Energy per day |
|---|---|
| Charge a phone (about 12-15 Wh per full charge) | 15 Wh |
| LED lights, 3 bulbs for 4 hours at 10 W | 120 Wh |
| Radio, 5 W for 4 hours | 20 Wh |
| Laptop, 50 W for 3 hours | 150 Wh |

A full-size refrigerator uses roughly 1,000-2,000 Wh a day, so it needs several hundred watts of panels and a big battery. A small 12 V cooler or compact fridge uses far less.

## Choosing batteries
| Type | Pros | Cons |
|---|---|---|
| Deep-cycle lead-acid (flooded or AGM) | Cheap, widely available | Heavy; only use about half of the capacity; flooded types give off hydrogen gas so need ventilation |
| **Lithium iron phosphate (LiFePO4)** | Light, use 80-100% of capacity, thousands of charge cycles | Costs more; **do not charge below freezing** unless it has a heater |

**Car starter batteries are not made for deep use**; running one down shortens its life.

## Wiring
- Panels in **series** add voltage. In **parallel** they add current. Keep within the controller's limits.
- **Fuse or breaker everything** between the battery and the load. A large battery can deliver enough current to melt wire and start a fire.
- Use thick, short cables between the battery and an inverter.
- Do not connect and disconnect under heavy load. Remove jewelry when working with batteries.

## Placement
- Face panels toward the equator (south in the northern hemisphere). A tilt close to your latitude is a good all-round angle.
- **Shade is the enemy.** Even a small shadow can cut output sharply.
- Clean panels, and keep them where wind will not tip them.

## Easiest start
- A **portable power station** (battery, controller and inverter in one box) plus a folding panel.
- A small **USB solar panel and power bank** for phones, radios and lights.

> WARNING: Never connect solar panels or a battery bank into your home wiring without a proper transfer switch installed by a qualified electrician. See [[generator-safety]] for the same backfeed danger.

## Related
[[batteries-charging]], [[lighting]], [[power-outage-basics]].
`

    summary: 'Which batteries to stock, how to charge phones and radios without the grid, and how to make a phone last for days.',

    body: `
## Stock a standard size
Choose devices that use **AA and AAA batteries** and keep spare sets. Fewer battery types means fewer problems.

| Battery | Strengths | Weaknesses | Shelf life |
|---|---|---|---|
| Alkaline | Cheap, widely sold | Weak in cold; can leak when old or dead | about 5-10 years |
| Lithium (non-rechargeable AA/AAA) | Long shelf life, light, works in extreme cold | More expensive | about 10-20 years |
| NiMH rechargeable (low self-discharge types) | Reusable hundreds of times | Need a charger; standard types lose charge in months | hold charge months to a year |
| Lithium-ion packs (phones, power banks) | High capacity | Slowly self-discharge; wear out with heat; fire risk if damaged | recharge every 3-6 months |

## Power banks
- A power bank is rated in **mAh**. To get watt-hours: mAh x 3.7 / 1000. A 10,000 mAh bank is about 37 Wh.
- A phone battery is around 12-15 Wh, so a 10,000 mAh bank gives about 2 full charges after losses.
- Keep several fully charged. **Top them up every few months.**

## Charging without the grid
- **Solar**: a small folding panel can charge a power bank or phone. See [[solar-basics]].
- **Car**: use the 12 V socket with a USB adapter.
  - Run the engine **outdoors only**, never in a closed garage, and keep the tailpipe clear.
  - Idling uses about 1/4-1/2 gallon an hour, so charge in short sessions, and do not drain the car battery so far that it will not start.
- **Hand-crank and solar-crank chargers**: output is small; good for a radio and a light, slow for a phone.
- A **power station** or a deep-cycle battery with an inverter can run more.

## Make your phone last for days
1. **Low-power mode** and **airplane mode**. Searching for a signal drains the battery fastest. Turn the radio on only a few minutes at set times to check messages.
2. Lower the **brightness**, use dark mode, and close apps.
3. Turn off Bluetooth, Wi-Fi, location and background refresh.
4. **Texts** use less power than calls.
5. Keep it **warm**, in an inside pocket. Cold drains batteries.
6. **Download offline maps** and this guide before you need them.

## Battery safety
- **Lithium batteries can catch fire** if damaged, swollen, overheated or charged with the wrong charger. Do not charge them overnight on a bed or couch. Discard a swollen battery safely.
- **Do not leave devices in a hot car.**
- Lithium-ion batteries should not be charged below freezing.
- Do not mix old and new batteries, or different types, in one device.
- **Tape the terminals of 9 V batteries** before storing them so they cannot touch metal.
- Store batteries cool and dry, in a labeled box. Remove them from devices stored for months, because old batteries leak.
- Recycle dead batteries when you can.

## How many to stock
For two weeks of lights and a radio: a couple of dozen AA, a handful of AAA, plus rechargeable cells and a way to charge them. Check each device's runtime: low LED modes last far longer.

## Related
[[lighting]], [[solar-basics]], [[power-outage-basics]], [[getting-information]].
`

    body: `
## Do this first
1. Put a **flashlight or headlamp at every bedside**, and one in each room.
2. Use **battery lanterns and flashlights as your main light**. Use candles and oil lamps only with care.
3. Keep spare batteries together in a box.

## Choosing light sources
| Source | Notes |
|---|---|
| LED flashlight | Runs for many hours on low modes; use the brightest setting only when needed |
| Headlamp | Hands free; best for cooking and work. A **red mode** keeps your night vision and is less visible |
| LED battery lantern | Lights a room and runs on D or AA cells for dozens of hours on low |
| Solar garden or path lights | Charge outside in the day, bring inside at night; modest light |
| Glow sticks | Single use, give light for hours with no heat or flame; safe around gas leaks and for children |
| Candles | Cheap but a fire hazard |
| Oil lamps | Long burning and refillable; use proper lamp oil or kerosene as the lamp states |

## Fuel for oil lamps
Use clear lamp oil or the fuel the lamp is made for. **Never use gasoline, white gas or alcohol in a lamp.** In an emergency olive or vegetable oil with a cotton wick burns, but poorly and smokily.

## Candle and lamp safety
> WARNING: Fires from candles are a leading cause of house fires in blackouts. Treat every flame as a hazard.

- Use sturdy holders on a flat, non-flammable surface.
- Keep flames **at least 12 inches (30 cm)** from curtains, paper, bedding and anything that can burn.
- **Never leave a flame unattended** and never sleep with one burning.
- Keep candles away from children and pets.
- Put them out before leaving the room.
- Fill and trim lamps when they are cool, and refill outdoors.
- Flames use up oxygen and make a little carbon monoxide; use them only in rooms with fresh air.
- Have smoke alarms with fresh batteries and a fire extinguisher ([[fire-safety]]).

## Stretch your light
- Use **low modes** on LED lights. Many give 10 times the runtime on low.
- Do chores in **daylight**. Go to bed earlier and rise with the sun.
- Gather everyone in **one room** with one lantern rather than many lights.
- Light-colored walls and a mirror reflect more light.
- Hang a lantern from the ceiling so it spreads light.
- Take advantage of the moon outdoors after your eyes adjust (15-30 minutes).

## Light discipline in a long emergency
In a prolonged crisis, a bright house at night can attract attention. Use **blackout curtains**, low light, and red lights, and cover windows. See [[opsec-low-profile]].

## Make your own
Candles and wicks can be made from beeswax or tallow ([[soap-candles]]). A fire or wood stove also gives light, and a headlamp lets you work.

## For signaling
A flashlight and the SOS function in the Tools tab can signal for help: [[signaling-rescue]].

## Related
[[batteries-charging]], [[solar-basics]], [[power-outage-basics]].

## How long fuel keeps
| Fuel | Shelf life | Notes |
|---|---|---|
| Gasoline (pump gas with ethanol) | about 3-6 months untreated; 12 months or more with stabilizer | Absorbs water and forms gum; ethanol-free lasts longer |
| Diesel | about 6-12 months untreated; 1-2 years or more with treatment | Algae can grow in tanks; keep it dry and cool |
| Propane | No practical limit | Does not spoil; the cylinder can last decades but must be inspected and requalified when it ages |
| Kerosene (1-K) | 1-5 years in sealed, clean containers | Use the grade your heater requires |
| White gas (camp stove fuel) | years if sealed | Very flammable |
| Firewood | Season 6-12 months (hardwoods like oak can take longer) | Keep dry |
| Charcoal | Indefinite if kept dry | Outdoor use only |

## Storing fuel safely
- Use **approved fuel containers**: red for gasoline, yellow for diesel and blue for kerosene is the usual US convention. Never use glass, milk jugs or food containers.
- Keep containers closed and labeled, with the date on them.
- Store in a **detached shed or garage**, away from living space and from anything that makes a spark or flame such as a **water heater pilot light**.
- Keep it cool and out of the sun, and away from children.
- **Gasoline vapors are heavier than air** and travel along the floor to a flame.
- Many fire codes limit home storage to about **25 gallons of gasoline** total. Check your local code and your insurance.
- Fill containers on the ground, not in a truck bed with a plastic liner (static spark danger).
- Keep absorbent material such as cat litter for small spills.
- Store oily rags in a closed metal can; they can ignite on their own.

> DANGER: **Never store gasoline or propane inside the house**, a basement or a vehicle trunk. Vapors can explode.

## Fuel stabilizer and rotation
- Add stabilizer to **fresh** fuel, then run the engine briefly so treated fuel reaches the fuel system.
- Rotate: use your oldest fuel in your car and refill containers with new fuel.

## Propane
- A **20-pound cylinder holds about 4.7 gallons** and about 430,000 BTU of energy.
- A 1-pound camp cylinder holds about 21,000 BTU, roughly 1.5-2 hours on high for a single-burner camp stove.
- Store cylinders **outdoors, upright, in the shade**, never in a basement, garage or car trunk.
- Do not use a 20 lb cylinder indoors. Use only equipment labeled for indoor use ([[heating-home]]).

## Wood
- A **cord** is a stack 4 x 4 x 8 feet (128 cubic feet / 3.6 m3).
- Heating a house in a cold climate can take **3-6 cords** a winter.
- Stack it off the ground, covered on top but open on the sides. Keep the pile at least 20 feet from the house to avoid pests and fire spread.

## Rough use rates
- Generator: about 1/2-3/4 gallon per hour at half load ([[generator-safety]]).
- Car idling: about 1/4-1/2 gallon per hour.
- Always check the maker's numbers for your equipment.

## Plan your amounts
Decide what you need fuel for (heating, cooking, generator, vehicle), work out hours and rates, and add a margin. Start small and rotate.

## Related
[[cooking-without-power]], [[power-outage-basics]], [[fire-safety]].

## The big picture
Modern life runs on electricity, and almost everything else depends on it: water pressure, fuel pumps, cell service, refrigeration, banking, store inventory. Most outages last hours. Some last days. A few, after hurricanes, ice storms, or major attacks on the grid, have lasted weeks or (in parts of Puerto Rico after Hurricane Maria) months. This article shows the usual order of failure so you know what to do **before** each step arrives.

> NOTE: Real events vary by cause, season, and place. Use this as a planning pattern, not a prediction.

## Timeline
| When | What stops working | What you do |
|---|---|---|
| Minutes to hours | Lights, heating and cooling, electric stoves, internet, cordless phones, garage door openers, well pumps, sump pumps, medical devices that plug in | Switch to flashlights. Close fridge and freezer doors. Fill tubs and pots with water. See [[power-outage-basics]]. |

| 1 day | City water pressure drops where pumps lose power. Gas stations cannot pump. ATMs and card readers fail. Fridge food starts to warm (about 4 hours closed). | Store water now. Use cash. Fill the car before this point if you can. |
| 2 to 3 days | Freezer food thaws (about 48 hours full, 24 half full). Store shelves empty because stores keep only a few days of stock and trucks cannot refuel. | Eat from the fridge, then freezer, then pantry. See [[food-safety-basics]]. |
| 3 to 7 days | Sewage lift stations fail and sewers back up. Boil-water orders. Fuel is scarce. Pharmacies and dialysis centers strain. Hospital generators depend on fuel deliveries. | Set up a bucket toilet ([[human-waste]]). Boil or treat all water ([[boiling-water]]). |
| 1 to 4 weeks | Stored food and medicine run low. Disease from poor sanitation rises. Tension and crime can rise. | Ration. Work with neighbors ([[community-security]]). Protect your health. |
| Months | Supply chains and banking disrupted. Repairs limited by parts, fuel, and crews. | Grow and preserve food. See [[grid-down-timeline]]. |

## Why it cascades
- **Water:** Pumps and treatment plants need power. Backup generators have limited fuel.
- **Fuel:** Pumps at gas stations are electric. Delivery trucks need fuel. Terminals need power.
- **Food:** Grocery stores run "just in time." They typically hold only a few days of inventory, and panic buying empties shelves in hours.
- **Money:** Without power and networks, cards and ATMs stop. Cash works until stores cannot make change.
- **Communication:** Cell networks overload within minutes, then lose backup power. Landlines that need no power may still work if the phone is a plain corded one.
- **Medical:** Hospitals run on generators, but fuel, staff, and supplies are limits. Home oxygen and dialysis patients are at risk early.

- Store at least 2 weeks of water and food ([[home-stockpile]]).
- Keep a half tank of fuel at all times ([[vehicle-kit]]).

- Make a family plan ([[family-plan]]) and know your neighbors.

> TIP: The first 72 hours decide most outcomes. People who already have water, food, light, warmth, and a plan do fine. Everyone else competes for the same shrinking supplies.

## Do this now (when the shaking starts)
1. **DROP** to your hands and knees.
2. **COVER** your head and neck with your arms. Get under a sturdy table or desk if one is within a few steps.
3. **HOLD ON** to the furniture and move with it until the shaking stops.

Do not run outside. Most injuries happen when people move during shaking and are hit by falling objects. A doorway is not safer than anywhere else in a modern building.

## Where you are
- **In bed:** Stay there. Cover your head with a pillow. Do not get up until it stops and you have shoes on.
- **Indoors, no table:** Crawl next to an interior wall, away from windows, mirrors, and tall furniture. Cover head and neck.
- **Outdoors:** Move to an open area away from buildings, trees, streetlights, and power lines. Drop and cover.
- **In a vehicle:** Pull over in a clear spot away from buildings, bridges, overpasses, and power lines. Stay inside with your seat belt on until it stops.
- **Elevator:** Hit every floor button and get out when the doors open.
- **On the coast:** If shaking is strong or lasts 20 seconds or more, or you cannot stand, **go to high ground right away**. Do not wait for a warning. See [[geologic-hazards]].

2. Check yourself and others for injuries. See [[first-aid-basics]] and [[severe-bleeding]].
3. Expect **aftershocks**. Drop, cover, and hold on each time.
4. Look for fire, the most dangerous secondary hazard. Put out small fires.
5. If you smell gas or hear hissing, open windows, get everyone out, and shut off gas at the meter **only if you can do so safely**. Do not use matches, lighters, switches, or phones inside. Only the gas company should turn it back on.
6. If the building is damaged (cracked walls, leaning, broken foundation), get out and stay out.
7. Use text messages, not calls. Keep phone lines open for emergencies.
8. Listen to a battery radio ([[getting-information]]).

> WARNING: Do not enter damaged buildings, even to get supplies. Aftershocks can bring them down.

## Utilities
- **Water:** If lines may be broken, turn off the main valve to protect your stored water and avoid flooding. Treat any tap water before drinking ([[water-safety]]).
- **Electricity:** If you see sparks or smell burning, shut off the main breaker if it is safe to reach.
- **Water heater:** It holds 30 to 80 gallons of clean water. See [[water-storage]].
- **Sewer:** Do not flush if sewer lines may be damaged. Use a bucket toilet ([[human-waste]]).

## Prepare now
- Bolt bookcases and tall furniture to wall studs. Strap the water heater.
- Move heavy items to low shelves. Put latches on cabinets.
- Keep shoes, a flashlight, and a whistle by the bed.
- Learn where your gas shutoff is, and keep a wrench near it.

## Do this now (tornado warning)
1. Go to the **lowest floor**: a basement or storm cellar if you have one.
2. No basement? Go to an **interior room** with no windows (closet, bathroom, hallway) on the lowest floor.
3. Get under something sturdy. Cover your head and neck with your arms. Add a helmet, mattress, or heavy blankets if you can.
4. Stay there until the storm has fully passed.

> STOP: A **watch** means tornadoes are possible: be ready. A **warning** means a tornado is happening or about to: take shelter **now**.

## Warning signs
- Dark, greenish sky
- Large hail, especially with no rain
- A wall cloud or rotating funnel
- A loud, continuous roar like a freight train
- Debris falling from the sky

## Special situations
- **Mobile or manufactured home:** Not safe in any tornado. Go to a sturdy building before the storm.
- **In a vehicle:** Do not try to outrun a tornado in traffic. If a sturdy building is close, go in. Otherwise, either stay buckled in with your head below the windows and covered, or, if you can get clearly lower than the road, get out and lie flat there with your hands over your head. Do **not** shelter under an overpass.

- **Large buildings (school, store):** Go to an interior hall or room on the lowest floor. Avoid wide-span rooms such as gyms.

Lightning can strike miles from the rain. **When thunder roars, go indoors.**

- Safe places: a substantial building or a hard-topped metal vehicle with windows up.
- Indoors: stay away from plumbing, corded phones, and plugged-in electronics. Avoid windows.

## Prepare now

## Do this now
1. If you are in a flood-prone area and heavy rain is falling, **move to higher ground now**. Do not wait for an official warning.
2. Never walk, swim, or drive through floodwater.
3. Move to the highest floor if trapped. Do not go into a closed attic.
4. Bring phones, a flashlight, medications, and a radio with you.

> DANGER: **6 inches** (15 cm) of fast water can knock an adult off their feet. **12 inches** (30 cm) can float many cars. **2 feet** (60 cm) can carry away SUVs and trucks. Most flood deaths happen in vehicles.

## Types of flood
- **Flash flood:** Rapid rise within minutes or hours from heavy rain, a dam or levee failure, or after wildfires. No time to wait.
- **River flood:** Slower rise. Usually days of warning.
- **Coastal flood / storm surge:** See [[hurricane]].

## If you are caught
- **In a vehicle:** If water is rising around the car, abandon it and move to higher ground. If the car is swept away and floating, you may need to climb out a window and onto the roof. Do not wait for the water to rise inside.
- **On foot:** Move to higher ground. Do not enter fast-moving water, even if shallow.
- **In a dry canyon, wash, or creek bed:** Climb out immediately if you hear a roar or see sudden muddy water.

## Floodwater is dangerous
It carries sewage, chemicals, fuel, and sharp debris. It can hide open manholes and downed lines. Do not play or wade in it. Wash skin well with clean water and soap if exposed. Treat cuts with care and watch for infection ([[wound-care]]). See [[disease-prevention]].

## Electricity and gas
- If water is near outlets, cords, or the breaker panel, do not touch them. If you cannot reach the main switch while standing on dry ground, do not try. Leave the building.
- Do not use flooded appliances, furnaces, or water heaters until a professional checks them.
- Smell gas? Leave and call from outside ([[chemical-hazmat]]).

## Cleanup
- Do not return until officials say it is safe.
- Wear rubber boots, gloves, and eye protection.
- **Drinking water:** Use bottled or treated water until told otherwise ([[water-safety]], [[boiling-water]]). Flooded wells must be tested and disinfected ([[wells-springs]]).
- **Food:** Discard anything that touched floodwater, including food in cardboard, plastic wrap, screw-top jars, bottles with crown caps, and home-canned jars. Undamaged commercial cans can be saved: remove labels, wash, and sanitize in a solution of 1 tablespoon unscented bleach per gallon of water for 15 minutes. Discard dented, swollen, or leaking cans ([[food-safety-basics]]).
- **Mold:** Dry out the building within 24 to 48 hours. Clean hard surfaces with 1 cup of bleach per gallon of water. Never mix bleach with ammonia or other cleaners. Throw away soaked porous materials (carpet, insulation, drywall, mattresses).

Know your flood risk. Store valuables up high. Sandbags help only against shallow water. Keep a go-bag ([[bug-out-bag]]) and plan routes ([[evacuation]]).

    body: `
## Do this now (when fire is near)

2. Take people, pets, medications, documents, and your go bag ([[bug-out-bag]]).
3. Close all windows and doors (do not lock them). Turn off gas at the meter if you know how.
4. Tell someone where you are going.
5. Drive with headlights on and windows up. Set vents to recirculate.

## Defensible space
Most homes ignite from **embers**, not walls of flame. Make your home harder to ignite:
- **0 to 5 feet (0 to 1.5 m) from walls:** Nothing flammable. Gravel, bare soil, or stone. No mulch, wood piles, or dry plants.
- **5 to 30 feet (1.5 to 9 m):** Keep grass short, trim shrubs, remove dead plants, separate trees.
- **30 to 100 feet (9 to 30 m):** Thin vegetation. Keep grass mowed. Remove ladder fuels (low branches under tall trees).
- Clear leaves and needles from roof and gutters. Cover vents with 1/8-inch metal mesh.
- Stack firewood at least 30 feet (9 m) away.

## If trapped
- **In a vehicle:** Park away from trees and brush, on bare ground if you can. Close windows and vents. Turn off the A/C. Lie on the floor, cover with a wool blanket or jacket, and stay in the vehicle until the fire front passes. Call 911 if possible.
- **On foot:** Find a cleared area, a body of water, a rocky area, or ground that has already burned. Lie face down, cover your head, and breathe near the ground.
- **At home:** If you cannot leave, go to a room with an exit, away from windows. Fill tubs and sinks with water. Keep doors closed to slow fire.

## Fire behavior
Fire moves **uphill much faster** than downhill. Wind shifts can trap you. Do not park in a canyon or draw. Escape routes should be planned in two directions ([[evacuation]]).

## Smoke
Smoke is dangerous even far from the flames. It harms the lungs, eyes, and heart.
- Stay indoors. Close windows and doors. Run air conditioning on recirculate with a clean filter.
- Wear a well-fitted **N95 or P100** respirator outdoors. Cloth and surgical masks do not stop fine smoke particles.
- Children, older adults, pregnant people, and those with asthma or heart or lung disease should leave if smoke is thick and persistent.
- Seek care for chest pain, trouble breathing, or severe coughing.

## After the fire
- Return only when officials say so.
- Beware hot spots, ash pits, falling trees, and damaged power lines.
- Wear an N95, gloves, and sturdy boots. Ash is irritating and may contain toxic material.
- Check the roof and attic for smoldering embers for several days.
- Burned slopes are prone to **flash floods and debris flows** during rain ([[geologic-hazards]], [[flood]]).
- Do not drink tap water until cleared. Ash and runoff can contaminate wells and cisterns ([[water-safety]]).
- Burns: see [[burns]]. Fire safety at home: [[fire-safety]].

## Do this now

    body: `
## Do this now
1. Go to the coolest place available (lowest floor, shaded, ventilated, or air-conditioned).
2. Drink water regularly. Do not wait until you are thirsty. Avoid alcohol and heavy sugary drinks.
3. Wear light, loose, light-colored clothing.
4. Stop strenuous work in the hottest hours. Rest often.
5. Check on elderly neighbors, young children, and those who live alone.

> DANGER: **Heat stroke** (hot, red or dry skin, confusion, fainting, body temperature above 104 °F / 40 °C) is a life-threatening emergency. Cool the person immediately ([[heat-illness]]).

## Who is most at risk
- Infants and young children
- Adults over 65
- People with heart, lung, or kidney disease
- People taking certain medications (some blood pressure drugs, diuretics, antihistamines, some psychiatric drugs)
- Outdoor workers and athletes
- People without cooling or reliable water

## Cooling tips
- Close blinds and curtains on the sunny side during the day. Open windows at night when the air is cooler.
- Wet cloths on the neck, wrists, and head. Cool showers or foot soaks.
- Fans help in moderate heat, particularly with a wet cloth or mist. In very high heat (high 90s °F / mid 30s °C and above) fans alone do not prevent heat illness.
- Eat light meals. Cook outdoors or avoid cooking.
- Never leave a person or pet in a parked car. Interior temperatures can climb deadly high within minutes.

## Pets and livestock
Provide shade and cool water. Do not exercise pets in the heat. Hot pavement burns paws. Livestock need much more water in heat ([[animal-health-feed]]).

Power grids strain in heat waves, and rolling blackouts can happen. Cool the house early, then close it up. Have a plan to move vulnerable people to a cool place. Keep water stored ([[water-needs]]).

## Drought

    body: `
## Do this now: Get Inside, Stay Inside, Stay Tuned
This is the official advice of the US government (Ready.gov and CDC).
1. **Get inside** the nearest sturdy building right away. Do **not** look at the flash: it can blind you.
2. **Stay inside.** Move to the basement or the middle of the building, away from outside walls and the roof. The more brick, concrete, and earth between you and the outdoors, the better.
3. **Stay tuned.** Use a battery or hand-crank radio for instructions ([[getting-information]]). Officials will tell you when it is safe to leave.

> IMPORTANT: Stay sheltered for **at least 24 hours**, unless officials say otherwise. They may ask you to stay longer, or to leave in phases or by route.

## If caught outside when it goes off
Take cover behind anything solid. Lie flat, face down, and cover your head. When the blast wave has passed, get into the nearest sturdy building and shelter as above.

## Why shelter works
Fallout is radioactive dust and debris. It is most dangerous in the first hours and decays quickly:
- **7-10 rule:** For every 7-fold increase in time after the detonation, the radiation level falls by a factor of 10. After 7 hours it is about 1/10 of the level at 1 hour. After about 2 days (49 hours) it is about 1/100. After about 2 weeks it is about 1/1,000.
- The best shelters have **mass** (brick, concrete, earth) and **distance** from the outside. A car, wood-frame house without a basement, or mobile home gives little protection. In an apartment building, go to the middle floors away from outside walls.
- Close windows and doors. Turn off fans, heating, and air conditioning that draw in outside air. Close the fireplace damper.

## If you may be contaminated
1. Remove outer clothing as soon as you are inside. This can remove **up to 90%** of contamination. Take it off carefully, do not shake it, and put it in a sealed plastic bag away from people.
2. Wash exposed skin and hair gently with soap and water. Do **not** scrub or scratch. Do **not** use conditioner on hair (it can make radioactive material stick). Blow your nose and wipe eyes and ears.
3. No water? Wipe skin with a damp cloth, and do not use hand sanitizer to clean off dust.
4. Treat life-threatening injuries first. A contaminated person does not endanger rescuers who wear gloves and wash up afterward. Radiation sickness is **not contagious**.

## Food, water, pets
- Packaged food in sealed containers and water in closed containers or enclosed pipes are safe. Wipe containers before opening.
- Avoid open, outdoor water and unprotected food until officials say it is safe.
- Keep pets inside. Wash them if they were outdoors.

## Potassium iodide (KI)
KI protects the **thyroid gland only**, and only from **radioactive iodine**. It does not protect from other radiation. Take it only when authorities say to. Doses approved by the FDA:

| Group | Dose |
|---|---|
| Adults, and pregnant or breastfeeding women | 130 mg |
| Children 3 to 18 years | 65 mg |
| Children 1 month to 3 years | 32 mg |
| Newborns up to 1 month | 16 mg |

Teens who are adult-size (about 150 lb / 68 kg or more) take the adult dose. Adults over 40 are least likely to benefit, so follow what officials say for your group. Follow the package and official directions. One dose protects for about 24 hours. Kelp, iodized salt, and iodine antiseptics are **not** substitutes and can be harmful.

## Other radiation events
- **Nuclear power plant accident:** Follow evacuation or shelter orders for the zone around the plant. Shelter and KI instructions as above.
- **Dirty bomb:** A conventional explosion that spreads radioactive material. Most harm is from the blast. Cover your nose and mouth, get inside, and follow the steps above.
- **Radiation sickness** (nausea, vomiting within hours, fatigue) needs medical care if possible; early vomiting suggests a high dose.

## Prepare now

    body: `
## Do this now
1. Wash hands with soap for 20 seconds, often. Use alcohol hand sanitizer (60% or more) when soap is not available.
2. Stay home if sick. Keep sick people away from others.
3. Improve ventilation: open windows, meet outdoors.
4. Stock 2 to 4 weeks of food, water, and medicines before an outbreak spreads ([[home-stockpile]]).
5. Follow official health guidance. Get routine vaccines.

## How diseases spread
- **Airborne and droplet:** Breathing, coughing, singing, or talking near others. Crowded, indoor, poorly ventilated spaces are riskiest.
- **Contact:** Touching a sick person or contaminated surfaces, then your face.
- **Fecal-oral:** Poor sanitation (cholera, norovirus, hepatitis A). See [[disease-prevention]].
- **Bites:** Mosquitoes, ticks, fleas ([[pests-vectors]]).

## Masks
- An **N95** (or equivalent) with a good seal gives the best protection against airborne spread. Surgical masks protect others and reduce droplets. Cloth masks help less.
- A mask must cover nose and mouth and fit snugly. Replace it when damp or dirty.
- Keep a supply of N95s in a sealed bag.

## Caring for a sick person at home
- Put the sick person in **one room** with the door closed and a window cracked if weather allows. Use a separate bathroom if possible.
- Have one healthy adult care for them. Avoid using someone who is elderly, pregnant, or has chronic illness.
- Both wear masks when close. Wash hands before and after contact.
- Do not share dishes, towels, or bedding. Wash dishes in hot soapy water. Wash laundry in hot water and dry it fully. Do not shake dirty laundry.
- Clean touched surfaces with soap or a disinfectant ([[laundry-dishes]]).
- Care: fluids, rest, fever control, monitoring ([[common-illness-care]], [[home-nursing]], [[meds-stockpile]]).

## Danger signs: get medical care
**Adults:** trouble breathing, chest pain or pressure that does not go away, new confusion, cannot stay awake, blue lips or face, cannot keep fluids down. A fingertip pulse oximeter reading persistently below 94% (or well below your usual) also means seek care. Oximeters can read inaccurately on dark skin, cold fingers, or nail polish, so go by symptoms first.

**Children:** fast or hard breathing, ribs pulling in, not drinking, very sleepy or hard to wake, bluish lips, fever in an infant under 3 months.

If medical care is not available, keep the person hydrated, upright, and monitored ([[dehydration-ors]]).

## Quarantine and isolation
- **Isolation:** separating people who are sick.
- **Quarantine:** keeping apart people who may have been exposed but are not yet sick, for the incubation period.
- Both only work if followed consistently.

## Supplies for a pandemic
Soap, sanitizer, cleaning products, N95 or surgical masks, disposable gloves, thermometer, fever reducers, oral rehydration salts ([[dehydration-ors]]), tissues, trash bags, food, water, and regular medications. Keep your normal routine prepared: do not hoard to the point that others cannot get basics.

## Mental health
Isolation and fear are hard. Keep routines, exercise, and stay connected by phone or message. See [[mental-health]].

    summary: 'A realistic look at EMP, geomagnetic storms, and grid cyberattacks: what is known, what is not, and sensible preparation.',

    body: `
## The honest summary
Three different things get lumped together:
- **High-altitude nuclear EMP (HEMP):** A nuclear detonation high above the Earth can send out pulses that damage electronics and power systems over a wide region.
- **Geomagnetic storm (solar):** Bursts from the sun can induce electric currents in long power lines, damaging transformers, and disrupt satellites, GPS, and radio.
- **Cyberattack on the grid:** Attacks on control systems can cause outages. Real attacks on Ukraine's grid (2015 and later) caused outages of hours.

All three are **low-probability, high-consequence** events. Nobody can say exactly how bad a widespread event would be, and anyone who claims certainty is selling something.

## What we know
- In March 1989, a geomagnetic storm collapsed the Quebec power grid in about 90 seconds and left 6 million people without power for about 9 hours.
- The 1859 Carrington Event was a much larger storm. Telegraph systems failed and sparked. A repeat could be far more damaging to today's grid.
- Large power transformers are custom-built. Replacements can take **months to years**, which is why a wide transformer loss would mean a long outage.
- In government testing, most vehicles kept running when exposed to strong pulses; some stalled or had electronic faults. Real events are harder to predict than test results.
- Small devices turned off or disconnected at the time of a pulse are not guaranteed safe, and devices left on are not guaranteed to fail.

## Faraday cages
A Faraday cage is a closed conductive shell that blocks electromagnetic fields. A metal trash can with a tight lid, lined with cardboard so items do not touch metal, is the common example.
- It must be fully enclosed with no gaps.
- Items inside must be insulated from the metal.
- Effectiveness against real EMP is not well tested for most home-made cages.
- Reasonable use: store a spare **battery radio**, a spare flashlight, and a small solar charger in one. It costs little and does no harm.
- Do not spend large amounts on products that claim to be "EMP-proof."

## Sensible preparation
Prepare the same way you would for any long outage. It covers EMP, storms, attacks, and ordinary disasters:
- Water, food, and sanitation for weeks ([[home-stockpile]], [[water-storage]])
- Heat without electricity ([[heating-home]])
- Light and power ([[lighting]], [[solar-basics]], [[batteries-charging]])
- A radio ([[radio-basics]], [[getting-information]])
- Paper maps, printed first aid information, and hand tools ([[tools-essentials]])
- Cash, paper copies of key documents ([[documents-money]])
- Neighbors and community ([[community-security]])

## What would happen
See [[infrastructure-failure]] for the timeline of cascading failure, and [[grid-down-timeline]] for personal actions.

> TIP: Do not live in fear. Most of the value comes from simple, low-cost steps you can take this month.

## Do this now (evacuation ordered)
1. **Go early.** Roads fill and fuel runs out. Leaving late is the most common mistake.
2. Grab your **go bag** ([[bug-out-bag]]), medications, documents ([[documents-money]]), phone and charger, water, and food.
3. Take everyone, including pets ([[pets-disaster]]).
4. Fill the vehicle with fuel on the way if the tank is below half.
5. Lock up. Turn off utilities only if told to.
6. Leave a note and tell someone your route and destination.

## Types of orders
- **Voluntary or recommended:** Leaving is advised. Go if you have medical needs, small children, are elderly, live in a mobile home, or have special risk.
- **Mandatory:** Leave now. Emergency services may not come for you later.
- **Shelter in place:** Stay inside. Typical for chemical releases or tornadoes ([[chemical-hazmat]]).

## Decide before the emergency
Write a plan for each hazard: wildfire, flood, hurricane, chemical release. For each, know:
- **Triggers:** What makes you leave?
- **Routes:** At least two, with a paper map ([[map-compass]]).
- **Destinations:** A friend or relative outside the area, a hotel, or a public shelter.
- **Timing:** Who leaves when. Practice once.

See [[family-plan]] and [[stay-or-go]].

## What to take
- Water and food for several days
- Medications and copies of prescriptions
- Documents, cash, and keys
- Phone, charger, power bank, battery radio
- Clothing, sturdy shoes, and blankets
- First aid kit ([[first-aid-kit]])
- Baby supplies, pet supplies, and items for people with special needs
- Photos of valuables and your home for insurance

## Traveling
- Avoid flooded roads and downed lines. Do not follow GPS shortcuts that could be blocked.
- Keep the tank above half. If stuck in traffic, turn off the engine when stopped.
- Keep windows up and vents on recirculate if there is smoke or chemicals.
- Check in with your contact when you arrive. Text rather than call.
- See [[vehicle-kit]] for the car kit.

## Public shelters
Bring bedding, medication, ID, snacks, and comfort items. Most shelters do not allow weapons or alcohol, and many do not accept pets other than service animals, so plan pet-friendly options ahead.

## If you cannot drive
Arrange rides now. Local officials may run buses. People with mobility or medical needs should register with local emergency management before disaster strikes ([[elderly-disabled]]).

## Returning home
Do not return until officials say it is safe. Check for gas leaks, structural damage, and contaminated water first. See [[flood]], [[hurricane]], [[wildfire]].

## Is this the right plan?
A go bag is for **leaving**. Most disasters are better survived at home with supplies. Leave when staying is more dangerous: fire, flood, chemical release, or an evacuation order. See [[stay-or-go]] and [[evacuation]].

## Weight limit
- Keep a loaded pack to **20% of your body weight** (25% at most if you are fit). A 150 lb (68 kg) adult should carry about 30 lb (14 kg).
- Children: no more than 10-15% of their body weight.
- Water is the heaviest item (1 L is 2.2 lb). Carry 2 L plus a filter or purification tablets, not 3 gallons.

## The five Cs
1. **Cutting tool:** a knife or multi-tool
2. **Combustion:** a lighter, matches, a ferro rod, tinder
3. **Cover:** shelter and clothing: tarp, space blanket, rain gear
4. **Container:** a metal bottle or pot, and a way to carry water
5. **Cordage:** paracord or strong rope

## Water and food
- [ ] 2 L of water in sturdy bottles
- [ ] Water filter or purifier and tablets
- [ ] A metal cup or small pot

- [ ] Sleeping bag or wool blanket (depending on season)
- [ ] Extra socks (2 pairs), underwear, and a warm layer
- [ ] Rain jacket or poncho
- [ ] Warm hat and gloves
- [ ] Sturdy broken-in boots or shoes (worn, not packed)

## Fire
- [ ] Two lighters
- [ ] Ferro rod and striker
- [ ] Tinder in a waterproof container (dryer lint, cotton balls with petroleum jelly)

## Tools
- [ ] Fixed-blade or folding knife
- [ ] Multi-tool

- [ ] Compact first aid kit with tourniquet

## Navigation and communication
- [ ] Paper map of your area and your routes
- [ ] Baseplate compass
- [ ] Whistle
- [ ] Small radio (NOAA)
- [ ] Phone, charger cable, and a power bank
- [ ] Flashlight or headlamp with spare batteries

## Documents and money
- [ ] Copies of IDs and important papers in a waterproof bag
- [ ] Cash in small bills
- [ ] Paper contact list and family meeting place

- Cotton clothing (stays wet and cold)

## The basic ration
An adult needs about 2,000-2,500 calories a day. This simple, cheap daily ration gives roughly **2,100 calories**:
- 0.5 lb (225 g) white rice
- 0.25 lb (115 g) flour, oats, or other grain
- 0.35 lb (160 g) dry beans or lentils
- 2 Tbsp cooking oil
- 1.5 oz (40 g) sugar
- a little salt

It is monotonous and short on vitamins. Add canned vegetables, fruit, and meat, plus a daily multivitamin, spices, and foods you enjoy. See [[nutrition-basics]]. Children need about 60-75% of an adult ration; teenagers and heavy laborers need more.

## Quantities per adult
| Item | 2 weeks | 3 months | 1 year |
|---|---|---|---|
| White rice | 7 lb (3 kg) | 45 lb (20 kg) | 180 lb (80 kg) |

| Sugar | 1.3 lb | 8 lb | 34 lb |

| Total dry food, approx. | 18 lb (8 kg) | 106 lb (48 kg) | 430 lb (195 kg) |
| Canned vegetables, fruit, meat | 1-2 cans per day | 90-180 cans | as available |
| Multivitamins | 14 | 90 | 365 |

Numbers are rounded. Salt is more if you preserve food. Weights are for dry food and do not include containers.

## Water
Store **1 gallon (4 L) per person per day**. 2 weeks is 14 gallons (53 L) per person, which most households can store. For longer than that, depend on a filter, disinfectant, and a source (rain, well, stream). See [[water-storage]] and [[water-needs]].

## Household and hygiene (per person)
| Item | 2 weeks | 3 months | 1 year |

| Heavy trash bags | 14 | 90 | 365 |

Cooking fuel (propane, white gas, firewood, charcoal), lighters and matches, and a safe outdoor spot. See [[cooking-without-power]] and [[fuel-storage]].

    summary: 'First in, first out, inventory sheets, labeling, and how long common foods last.',

    body: `
## The rule: store what you eat, eat what you store
Food stored and never eaten is wasted money and may fail you when you need it. Build your stockpile from foods your family already eats and rotate it through your normal meals.

## First in, first out (FIFO)
1. Put **new** cans and packages at the **back**, and move older ones to the front.
2. Every time you cook, pull from the oldest first.
3. Write the purchase date (or "use by" date) on every package with a marker.
4. Once or twice a year, check the whole stockpile and use anything within 6 months of its limit.

## Keep an inventory
A simple paper sheet beats memory. Tape a list inside the pantry door.

| Item | Quantity | Date bought | Use by |
|---|---|---|---|
| White rice, buckets | 4 | 03/2025 | 2050 |
| Canned beans | 24 | 06/2025 | 06/2028 |
| Peanut butter | 6 | 09/2025 | 03/2026 |

## "Best by" is not "unsafe after"
Dates on food are mostly about quality, not safety. The one exception in the US is infant formula: use before its date. Canned food is safe as long as the can is intact. Throw out any can that is bulging, leaking, badly rusted, or deeply dented along a seam. If a jar or can spurts, hisses, or smells odd, discard without tasting. See [[food-safety-basics]].

## Typical shelf life
These are common guidelines for good quality in cool storage. Unopened, intact packaging lasts longest.

| Food | Ordinary storage | Sealed with oxygen absorbers, cool |
|---|---|---|
| Canned low-acid food (meat, vegetables, beans, soup) | 2-5 years | n/a |
| Canned high-acid food (tomatoes, fruit, juice, pickles) | 12-18 months | n/a |
| White rice | 4-5 years | 25+ years |
| Brown rice | 6-12 months | 1-2 years |
| Dry beans and lentils | 1-3 years (cooking time rises with age) | 10+ years |
| Dry pasta | 1-2 years | 20-30 years |
| Rolled oats | 1-2 years | up to 20-30 years |
| Wheat berries | 5-10 years | 25-30 years |
| White flour | 6-12 months | 5+ years |
| Whole wheat flour | 3-6 months | 1-2 years |
| Sugar | indefinite | indefinite |
| Salt | indefinite | indefinite |
| Honey | indefinite | indefinite |
| Cooking oil, unopened | 1-2 years | n/a |
| Peanut butter, unopened | 1 year or more | n/a |
| Powdered milk | 1-2 years | 10-20 years |
| Freeze-dried foods | n/a | 20-25 years (manufacturer claim) |
| MREs | 3-5 years at room temperature | n/a |
| Baking powder, yeast | 1-2 years | n/a |
| Dried fruit and nuts | 6-12 months | 2-5 years |
| Vitamins | 1-2 years, losing strength | n/a |

## Heat is the enemy
As a rule of thumb, every 18 F (10 C) hotter reduces shelf life by about half. Store food in the **coolest, darkest, driest** part of the home: ideally 50-70 F (10-21 C). Avoid garages, attics, and spaces next to a furnace or water heater.

## Storage tips
- Keep food off the floor and away from outside walls (flood and dampness).
- Keep food in sealed containers to prevent pests.
- Store bleach, fuel, and chemicals away from food.
- Rotate the oldest items to the front when you shop.
- Keep a manual can opener with the stockpile.

## Checklist
- [ ] Every item has a date written on it
- [ ] An inventory sheet is posted
- [ ] I rotate stock each time I shop
- [ ] Food is stored cool, dark, and dry
- [ ] I check for bulging cans and pests twice a year

See also: [[bulk-dry-storage]], [[home-stockpile]], [[food-safety-basics]].
`
