## Why a plan
In a disaster, family members may be at work, school, and home, with phones overloaded or down. A plan you have talked through and practiced tells everyone what to do without having to ask.

## Step 1: Talk about what could happen
Sit down together and list the hazards in your area. Talk through each one: what do we do, and where do we go?

## Step 2: Write down contacts
Phones die and cell contacts disappear. Put a **paper** list in every wallet, bag, and child's backpack.

- [ ] Everyone's phone numbers
- [ ] One **out-of-area contact** (a friend or relative who lives far away). Local lines jam, so everyone texts or calls this person to check in
- [ ] Work and school numbers
- [ ] Doctors, pharmacy, and insurance
- [ ] Neighbors' numbers
- [ ] Numbers for police, fire, poison control. See [[emergency-numbers]]

> TIP: Text messages often go through when calls will not. Teach everyone, including kids, to text.

## Step 3: Pick meeting places
Choose three, and write them down.
1. **Right outside your home** (for a fire or sudden emergency).
2. **In your neighborhood** (if you cannot go home, such as a park, a school, or a neighbor's house).
3. **Outside your area** (a relative's home or a landmark for when the whole area is closed).

## Step 4: Plan escape and travel routes
- [ ] Two exits from every room, and a clear path to them
- [ ] Two driving routes out of your area, plus a way to go on foot
- [ ] A map showing both routes, and where you would go
- [ ] A rule to leave a note at home telling where you went and when. See [[evacuation]]

## Step 5: Assign roles
- [ ] Who picks up the kids?
- [ ] Who gets the go bags and documents?
- [ ] Who takes care of pets?
- [ ] Who checks on neighbors, especially the elderly?
- [ ] Who shuts off utilities?
- [ ] Who runs the radio and writes things down?

## Step 6: Plan for school, work, and special needs
- [ ] Find your children's school emergency plan and who is allowed to pick them up
- [ ] Make a plan for family members with medical or mobility needs ([[elderly-disabled]])
- [ ] Make a pet plan ([[pets-disaster]])
- [ ] Teach kids to call 911 and give their address

## Know your utilities
- **Gas:** shut it off only if you smell gas, hear hissing, or are told to. Use a wrench to turn the valve a quarter turn. Only the gas company should turn it back on.
- **Water:** know where the main shut-off is, and shut it off if pipes are broken.
- **Power:** know the main breaker. Turn off appliances before restoring power.
Label each one, and keep the wrench in a known place.

## Step 7: Practice
- [ ] Run a home fire drill twice a year, including a nighttime drill
- [ ] Practice earthquake or tornado drills if they apply to you
- [ ] Do a 24-hour power-off drill
- [ ] Practice getting to each meeting place
- [ ] Review the plan every 6 months and when anything changes

## Make it your own
Write your plan on one page and post it inside a cabinet. Keep a copy in each bag. Include contact names and numbers, meeting places, escape routes, who does what, and where the supplies are.

## Important documents
Make copies of these. Keep the originals safe, and keep copies in your go bag and with someone out of town.

- [ ] Driver's license, passport, and other photo IDs
- [ ] Birth certificates, marriage certificates, adoption and custody papers
- [ ] Social Security cards (keep at home, do not carry)

- [ ] Bank and credit card account numbers and the phone numbers to call if lost
- [ ] Wills, powers of attorney, and advance directives
- [ ] Recent tax returns
- [ ] Photos or video of your home and valuables, for insurance claims
- [ ] Pet records and vaccination certificates
- [ ] A contact list with phone numbers and addresses

## Storing documents
- A waterproof, fireproof bag or box at home.
- Photocopies in your go bag, in a waterproof pouch.
- An original set with a trusted person in another town, or in a bank safe-deposit box.
- A password manager with an emergency sheet printed and kept in a safe place. Do not keep a password list in your kit, unprotected.

## Cash
ATMs, card readers, and banks stop working in a power outage or a network failure. Many stores take only cash, or cannot take anything.

- [ ] Keep cash in **small bills** ($1, $5, $10, $20). Stores cannot make change for large bills.
- [ ] Aim for at least a few hundred dollars, and more if you can: enough for several days of food, fuel, and necessities, ideally two weeks.
- [ ] Split it up: some at home hidden, some in your go bag, some in your car.
- [ ] Keep a roll of coins for small purchases.
- [ ] Do not keep so much in one place that losing it would hurt.

## Digital backups
- [ ] Scan important documents and save them to an **encrypted USB drive**. Keep one with you, one in a safe place, one out of town.
- [ ] Use an encrypted cloud backup as well, but remember it needs internet to reach.
- [ ] Back up photos and contacts.
- [ ] Do not store unencrypted passwords or Social Security numbers on a drive that could be lost.

## Prepare your phone
- [ ] Download offline maps for your area and your evacuation routes
- [ ] Save PDFs: insurance cards, medical info, this app's content, key articles
- [ ] Write important phone numbers on paper
- [ ] Keep a charged power bank and cables, and a car charger
- [ ] Turn on low power mode and airplane mode to extend battery

## Insurance
Check whether your policies cover flood, earthquake, and wind. Standard homeowners policies often **do not** cover flood or earthquake. Flood policies typically have a waiting period of about 30 days, so do not wait for a storm to buy one.

## Review
Check everything once a year: update documents, replace expired IDs, refresh copies, and replace cash with fresh, clean bills.

    body: `
## Keep your fuel up
In a power outage or a disaster, gas pumps stop. **Keep your tank above half full** at all times. It gives you range to evacuate, and a car is also a shelter, a phone charger, and a heater in a pinch.

## Basic kit
- [ ] First aid kit ([[first-aid-kit]])
- [ ] Flashlight with extra batteries, or a hand-crank light
- [ ] Jumper cables
- [ ] Tire pressure gauge, a spare tire in good shape, jack, and lug wrench
- [ ] Tire sealant and a small air compressor
- [ ] Tow strap
- [ ] Reflective triangles or flares
- [ ] Multi-tool and basic hand tools
- [ ] Duct tape and zip ties
- [ ] Work gloves
- [ ] Rags or paper towels
- [ ] Water: at least 1 gallon (4 L) per person
- [ ] Non-perishable snacks
- [ ] Blankets or sleeping bag
- [ ] Rain poncho
- [ ] Phone charger and power bank
- [ ] Paper road map
- [ ] Whistle and a bright cloth
- [ ] Small shovel
- [ ] Fire extinguisher (ABC)
- [ ] Cash in small bills
- [ ] Spare glasses and any critical medications
- [ ] Basic pet supplies

## Winter additions
- [ ] Ice scraper and snow brush
- [ ] Folding shovel
- [ ] Sand, cat litter, or traction mats
- [ ] Tire chains if you drive in snow
- [ ] Extra hats, gloves, and wool socks
- [ ] Hand warmers
- [ ] A winter sleeping bag
- [ ] Windshield washer fluid rated for freezing

## Summer additions
- [ ] Extra water
- [ ] Sunshade and hat
- [ ] Sunscreen and insect repellent
- [ ] Coolant

## Car care
- Check tire pressure monthly and replace worn tires.
- Test the battery before winter. Most last 3-5 years.
- Keep up with oil, coolant, and wiper blades.
- Keep a full-size spare, not just a doughnut, if you can.
- Learn to change a tire **before** you need to.

## Jump-starting a dead battery
1. Park the cars close but not touching. Turn both off.
2. Red clamp to the **positive (+)** terminal of the dead battery.
3. The other red clamp to the **positive (+)** of the good battery.
4. Black clamp to the **negative (-)** of the good battery.
5. The last black clamp to a **bare, unpainted metal** part of the dead car's engine, away from the battery.
6. Start the good car, wait a few minutes, then start the dead car.
7. Remove clamps in the reverse order.

> WARNING: Do not let the clamps touch each other. A battery can explode if sparks occur near it. Never jump a frozen or cracked battery.

## If you break down
1. Pull as far off the road as you can. Turn on hazard lights.
2. On a busy highway, stay in the car with your seat belt on if it is unsafe to get out.
3. Raise the hood or tie a bright cloth on the antenna.
4. Place triangles or flares behind the car if it is safe.
5. Call for help. If no signal, wait for a passing vehicle, or walk only if help is clearly close and the conditions are safe.

## If you are stranded in cold or snow
- **Stay with the car.** It is easier to find, and gives shelter.
- Run the engine **about 10 minutes each hour** for heat, with the **tailpipe clear of snow** and a window cracked. Carbon monoxide can kill. See [[poisoning-overdose]].
- Make the car visible: bright cloth, hazard lights when you run the engine.
- Move your arms and legs to stay warm, and keep dry.
- See [[winter-storm]] and [[hypothermia-frostbite]].

## If you are stranded in heat
- Stay in the shade, in or next to the car. Drink water, but do not ration it so tightly you get sick.
- Do not walk in the midday heat unless you have to. See [[heat-illness]].
- **Never leave a child or pet in a parked car.**

See also: [[evacuation]], [[72-hour-kit]], [[improvised-repair]].
`

    body: `
## The golden rule
**If it is not safe for you, it is not safe for your pet.** Never leave an animal behind or chained. Plan ahead so you can take them with you.

## Pet kit
- [ ] 2 weeks of food in an airtight container, rotated every few months
- [ ] Water: plan about 1 ounce per pound of body weight per day for dogs and cats, and more in heat
- [ ] Bowls, preferably collapsible
- [ ] Medications for 2 weeks, plus a written list of dosing
- [ ] Vaccination and medical records, especially rabies certificate (waterproof copy)
- [ ] A current photo of you with your pet, for proof of ownership
- [ ] Collar with ID tags and a **registered microchip** with current phone numbers
- [ ] Sturdy carrier for each cat or small animal, large enough to stand and turn around
- [ ] Leash, harness, and a muzzle if needed
- [ ] Litter, pan, and waste bags
- [ ] Blanket and a favorite toy
- [ ] Pet first aid kit and a book
- [ ] Contact info for your vet and a back-up boarding facility

## Evacuating with pets
- Public emergency shelters usually do not accept pets, except service animals. Some provide a pet area next door. Do not count on it.
- Before a disaster, identify: pet-friendly hotels along your route, friends or relatives who would host pets, and boarding facilities outside your area.
- Leave early. Pets in cars, carriers, and traffic are stressful for everyone.
- Birds need a warm, covered carrier. Reptiles need heat. Small animals need a secure cage and water.
- Keep dogs leashed, and cats in carriers.

## Feeding and water
- Dogs and cats need regular meals. In a pinch, plain cooked rice, cooked meat or fish, and cooked eggs are fine for short periods. Do not feed cats dog food long term.
- Check the feeding guide on the bag, and store extra. A larger dog or a working dog needs much more than the guide in cold weather or hard work.
- Keep water clean and available. Treated water is safe for pets too.

> WARNING: Many foods poison pets: chocolate, grapes and raisins, onions and garlic, xylitol (a sugar substitute in gum and candy), macadamia nuts, alcohol, caffeine, and cooked bones that splinter. Avocado is dangerous to birds.

## Heat and cold
- **Never leave a pet in a parked car.** Temperatures inside rise fast, even on mild days.
- In heat: shade, water, and rest. Signs of heat stroke are heavy panting, drooling, weakness, and vomiting. Cool with water (not ice) and get help.
- In cold: bring pets inside. Short-haired and small animals chill fast. Dry them after being outside.

## Pet first aid basics
- **Bleeding:** press firmly with clean cloth. Wrap with a bandage that is snug but not tight.
- **Injured dog:** even gentle dogs bite when in pain. Muzzle with a soft cloth or leash, except if vomiting or struggling to breathe.
- **Broken limb:** keep the animal still and confined. Carry them on a board or blanket.
- **Poisoning:** call a poison hotline (US): ASPCA Animal Poison Control 888-426-4435 or Pet Poison Helpline 855-764-7661. Fees may apply. Do not induce vomiting unless told.
- **Choking:** look in the mouth for an object, and remove it only if you can see it.

## Livestock and large animals
- Plan routes and a destination that accept livestock. Practice loading trailers.
- Identify each animal (tags, brands, photos, microchips).
- Store at least 3 days of feed and water. See [[animal-health-feed]].
- If you must leave them, provide plenty of food and water, and do not tie or pen them in a flood or fire zone.
- Contact local officials in advance about plans for large animals.

## Checklist
- [ ] Pet kit packed and in an easy place
- [ ] Microchip registered, tags current
- [ ] Pet-friendly places identified
- [ ] Vaccination records copied
- [ ] Practiced loading everyone in the car

See also: [[evacuation]], [[family-plan]], [[72-hour-kit]].
`

    body: `
## You can do this without much money
Preparedness is mostly habits and knowledge. A small, steady plan beats a big one-time purchase that you cannot afford. **Never go into debt for prepping.**

## The $5-10 a week approach
Each week, buy one or two items from the list below, in order. In a few months, you will have a good basic supply.

1. A few gallons of water or clean jugs to fill from the tap (free)
2. A big bag of rice and a bag of dried beans
3. A flashlight and spare batteries
4. A manual can opener
5. Canned vegetables, fruit, and tuna or chicken on sale
6. A battery radio
7. A basic first aid kit, or build one piece by piece ([[first-aid-kit]])
8. Cooking oil, salt, and sugar
9. A gallon of unscented bleach (for water and cleaning)
10. Toilet paper, soap, and a bucket with a lid ([[human-waste]])
11. Peanut butter, oats, and pasta
12. A warm blanket or wool sleeping bag from a thrift store
13. Vegetable seeds
14. A water filter or purification tablets

Keep going from there with the [[master-checklist]].

## Buy smart
- **Stock up on sales.** When something you use goes on a deep discount, buy several.
- **Buy one extra** of something you use every time you shop.
- **Buy generic.** Store brands of rice, beans, flour, oats, and canned goods are as good.
- **Buy bulk staples**, which cost far less per calorie than packaged or freeze-dried food.
- **Shop thrift stores and yard sales** for wool blankets, coats, pots and pans, cast iron, hand tools, canning jars, and books.
- Watch for free items: bakeries and delis often give away food-grade buckets for free.

## What costs the least per calorie
| Food | Cost per calorie |
|---|---|
| Rice, dry beans, oats, flour, pasta | Very low |
| Cooking oil, sugar, peanut butter | Low |
| Canned vegetables and meat | Moderate |
| Freeze-dried meal kits | High |
| Branded "prepper" buckets | Very high |

Freeze-dried food is convenient and lasts decades, but plain staples give you the same calories for a small fraction of the price.

## Reuse and repurpose
- Clean 2-liter soda bottles can hold water (not milk jugs, which break down). See [[water-storage]].
- Glass jars with metal lids can store dry goods.
- Old wool clothes and blankets make warm layers.
- A clean 5-gallon bucket makes a toilet, a water carrier, or a storage container.

## Free skills are worth more than gear
- Take a free or low-cost CPR and first aid class. The Red Cross and local fire departments offer them.
- Join a **CERT** (Community Emergency Response Team) program. FEMA supports it, and training is free in many areas.
- Borrow books from the library, and download this app's content for offline use.
- Learn to garden. Seeds cost very little. See [[garden-planning]] and [[seed-saving]].
- Learn to cook from scratch. See [[cooking-staples]].
- Learn from neighbors, elders, and online videos you can download now.

## Spend first where it matters most
Prioritize in this order:
1. **Prescription medications and medical needs**
2. **Water**: storage and a way to treat it
3. **Warmth and shelter**
4. **Food**: staples first
5. **Light, radio, and power**
6. **Sanitation**
7. **Extras and comfort**

## Money that is not supplies
- [ ] Build a small cash fund in small bills
- [ ] Pay down high-interest debt
- [ ] Keep insurance current and know what it covers ([[documents-money]])
- [ ] Learn skills others will pay for. See [[barter-trade]]

## Community stretches every dollar
Pool resources with neighbors: one family buys the generator, another the water filter, another the first aid supplies, and everybody shares knowledge. See [[community-security]].

See also: [[prep-start-here]], [[home-stockpile]].

    summary: 'Check vital signs, keep a log, prevent dehydration and bedsores, protect yourself, and know when to escalate.',

    body: `
## The basics of good home care
1. Put the person in a clean, quiet, warm (or cool) room with a bed or pad off the floor.
2. Wash your hands before and after every contact.
3. Check vital signs and write them down.
4. Keep them drinking. Offer small sips often.
5. Turn them and check their skin if they cannot move on their own.
6. Watch for the danger signs at the bottom of this page.

## Taking vital signs
- **Pulse:** Place two fingers (not your thumb) on the inside of the wrist, below the thumb. Count beats for 30 seconds and double it, or count a full 60 seconds if the beat is irregular.
- **Breathing rate:** Watch the chest rise and fall for 30 seconds and double it. Do this without telling the person, since people change their breathing when they know they are watched.
- **Temperature:** Use a thermometer under the tongue, in the armpit (add about 1 °F), or in the ear. A fever is 100.4 °F (38 °C) or higher.
- **Skin and alertness:** Note color (pale, flushed, blue-gray), sweating, and whether they are awake, confused, or hard to wake.

| Age | Resting pulse per minute | Breaths per minute |
|---|---|---|
| Infant (under 1 year) | 100–160 | 30–60 |
| Toddler (1–3) | 90–150 | 24–40 |
| Preschool (3–5) | 80–140 | 22–34 |
| School age (6–12) | 70–120 | 18–30 |
| Adult | 60–100 | 12–20 |

Pulse and breathing rise with fever, pain, fear, and dehydration. A fast rate that keeps climbing, or a very slow one, is a warning sign.

## Keep a log
Write down the time and: temperature, pulse, breathing rate, drinks and food taken, urine and stool, medicines given (name, dose, time), and any change in symptoms. A written log lets you spot trends and helps any clinician you can reach later.

## Fluids and food
- Adults need at least 2 quarts (2 L) of fluid a day when ill, more with fever, vomiting, or diarrhea. Pale yellow urine at least 4 times a day means they are drinking enough.
- Use oral rehydration solution for vomiting or diarrhea: [[dehydration-ors]].
- Offer small, frequent meals of soft, easy foods (broth, rice, oatmeal, mashed potato, eggs). Appetite often returns after fluids are steady.

## Preventing bedsores
- If the person cannot change position, turn them every 2 hours, day and night.
- Check skin over bony areas: tailbone, hips, heels, shoulder blades, elbows, back of the head. Redness that does not fade after pressing is the first sign.
- Keep skin clean and dry, sheets smooth and dry, and place a pillow between knees and under heels.

## Hygiene and comfort
- Give a daily sponge bath (face, underarms, groin, feet). See [[handwashing-hygiene]].
- Brush teeth or wipe the mouth and gums daily.
- Change soiled bedding right away. Keep sick people's laundry and dishes separate: [[disease-prevention]].
- Keep them warm but not overheated. Light touch, a calm voice, and company help more than people expect.

## Protect yourself
- Wear gloves for body fluids, wash hands after, and wear a mask when they have a cough or respiratory illness.
- Lift with your legs, not your back. Ask for help moving heavy patients.
- Share the work. Caregivers who do not sleep get sick or make mistakes.

## When to escalate
> CALL: If you can reach emergency help, call now for any of these. If you cannot, treat the cause as best you can and plan to get the person to care.

- Trouble breathing, chest pain, blue lips
- New confusion, cannot be woken, seizure
- Fever above 104 °F (40 °C), or fever lasting more than 3 days
- Fever with stiff neck, severe headache, or a rash that does not fade when pressed
- Signs of sepsis: fast pulse, fast breathing, confusion, cold clammy skin, very little urine (see [[infection-antibiotics]])
- No urine for 12 hours, or signs of severe dehydration
- Uncontrolled bleeding or severe pain

## Comfort care when recovery is unlikely
Keep the person clean, warm, and free of pain as far as possible. Moisten the lips and mouth, reposition gently, offer sips if they can swallow, and stay with them. Presence matters. See [[triage-no-help]] and [[mental-health]].
`

  {
    id: 'common-illness-care',
    cat: 'health',
    title: 'Fever, Flu, Vomiting & Diarrhea at Home',
    summary: 'How to treat common illnesses at home and the red flags that mean the situation is serious.',
    tags: ['fever', 'flu', 'cold', 'cough', 'vomiting', 'diarrhea', 'sore throat', 'headache', 'stomach ache', 'constipation', 'earache'],
    body: `
## Fever
A fever is a body temperature of 100.4 °F (38 °C) or higher. It is a symptom, not a disease, and it helps fight infection. Treat the person, not the number.

1. Offer plenty of fluids.
2. Dress lightly and keep the room comfortably cool. Do not bundle up.
3. If they are uncomfortable, give acetaminophen or ibuprofen. Doses are in [[meds-stockpile]].
4. Rest.

> WARNING: Never give aspirin to anyone under 18. Do not use cold baths, ice, or alcohol rubs to bring down a fever.

> CALL: A baby under 3 months with a fever of 100.4 °F (38 °C) or higher is an emergency. Also seek care for fever above 104 °F (40 °C), fever for more than 3 days, or fever with a stiff neck, severe headache, rash that does not fade when pressed, trouble breathing, confusion, seizure, or being very hard to wake.

## Colds and flu
- Colds: runny nose, sneezing, mild cough. Rest, fluids, and time. They last about a week.
- Flu: sudden fever, body aches, chills, tiredness, cough. Same care, plus rest. Most people recover in 1–2 weeks.
- Honey eases cough in people age 1 and older: ½ tsp for ages 1–5, 1 tsp for ages 6–11, 2 tsp for 12 and up.
- A saltwater nose rinse helps. Use only distilled, sterile, or boiled-then-cooled water, never untreated tap or stream water.
- Danger signs: trouble breathing, fast breathing, chest pain, blue lips, or getting better and then suddenly worse (possible pneumonia, see [[infection-antibiotics]]).

## Sore throat
Gargle with ¼–½ tsp salt in 8 oz (240 mL) warm water. Drink warm liquids and honey. A sore throat with fever, swollen neck glands, white patches, and no cough may be strep throat, which needs antibiotics to prevent complications such as rheumatic fever. See [[infection-antibiotics]].

## Vomiting and diarrhea
The main danger is dehydration, especially in children and older adults.
1. Wait 15–30 minutes after vomiting, then give sips of oral rehydration solution: [[dehydration-ors]].
2. For children, give 1 teaspoon (5 mL) every 1–2 minutes and increase slowly.
3. Return to normal food as soon as they are hungry. Skip the old "BRAT only" diet; rice, bananas, potatoes, bread, eggs, and plain meat are all fine.
4. Wash hands carefully and keep the sick person's dishes and toilet separate: [[disease-prevention]].

Adults age 12 and older with watery diarrhea and no fever or blood may use loperamide per the label. Never use it with bloody diarrhea or high fever.

> CALL: Seek help for blood in stool or vomit, diarrhea lasting more than 3 days (1 day for an infant), signs of severe dehydration (no urine for 8–12 hours, sunken eyes, dry mouth, very sleepy), severe belly pain, or vomiting that will not stop.

## Constipation
Drink water, eat fiber (beans, oats, fruit, vegetables), and walk. A bad belly ache with vomiting and no gas or stool can mean a blockage and is an emergency.

## Cough
Most coughs come from colds and clear in 1–3 weeks. Honey and warm drinks help. Seek care for wheezing, fast or hard breathing, blue lips, coughing blood, or a cough lasting more than 3 weeks.

## Headache
Rest, fluids, and a pain reliever usually work. Dehydration and missed caffeine are common causes.

> CALL: Seek help for a sudden "worst headache of my life," a headache after a head injury, or a headache with fever and stiff neck, confusion, weakness, or trouble speaking. See [[heart-stroke]] and [[head-spine-injury]].

## Belly pain
Pain that starts near the navel, moves to the lower right side, gets worse with movement or coughing, and comes with fever or vomiting may be appendicitis. This is an emergency. Do not give laxatives or heat.

## Earache
Pain relievers and a warm cloth help. See a clinician if there is fever, drainage, or pain for more than 2 days.
`

  {
    id: 'infection-antibiotics',
    cat: 'health',
    title: 'Serious Infections & the Antibiotic Problem',
    summary: 'Which infections are dangerous, what you can do without antibiotics, and why you should plan with a doctor now.',
    tags: ['antibiotics', 'sepsis', 'cellulitis', 'abscess', 'pneumonia', 'UTI', 'strep', 'infection', 'blood poisoning'],
    body: `
## The honest picture
Antibiotics treat **bacterial** infections only. They do nothing for colds, flu, and most sore throats and diarrhea, which are caused by viruses. Without antibiotics, some common bacterial infections that are easily cured today can become deadly again. That is why this article matters, and why you should plan now.

Home care cannot replace a hospital for the serious infections below. Do what you can, and get the person to care when you can.

## Sepsis: the emergency to know
Sepsis is the body's extreme reaction to an infection. It can kill within hours to days.

Signs: fever or very low temperature with shivering, fast pulse (over 90), fast breathing, confusion or drowsiness, clammy or mottled skin, extreme weakness, and very little urine.

> CALL: Sepsis is a medical emergency. If you can reach a hospital, go. If not: give fluids by mouth in small, frequent sips, keep them warm, treat the source (clean and open the wound, drain pus), control fever, and keep trying to reach help.

## Common serious infections

### Skin: cellulitis and abscess
- **Cellulitis:** red, hot, swollen, painful skin that spreads. Use a pen to mark the edge of the redness and check again in 12–24 hours. If the line has moved, it is spreading and needs antibiotics. Red streaks running up a limb, fever, or redness near the eye are emergencies.
- **Abscess:** a painful lump filled with pus. Warm, moist compresses for 15–20 minutes, 3–4 times a day, may help it open and drain on its own. If it opens, let it drain, wash gently, and cover loosely. Large, deep abscesses, or any on the face, spine, groin, or hand, need a trained person to drain them. Never squeeze or cut one on the face.

### Infected wounds
Open the wound edges, flush with plenty of clean water, remove dead tissue and debris, and keep it covered and clean. See [[wound-care]]. Wounds from bites, soil, and farm animals are most at risk.

### Pneumonia
Cough, fever, chills, fast breathing (over 20 breaths a minute in an adult), chest pain when breathing in, and weakness. Supportive care: fluids, rest, sitting upright, and fever control. Worsening breathing, confusion, or blue lips are emergencies.

### Urinary tract infection (UTI)
Burning, frequent, urgent urination, and lower belly pain. Drink lots of fluids. Fever, chills, back or side pain, or vomiting suggest a kidney infection and need antibiotics. UTIs in men, children, and pregnant women should always be seen.

### Strep throat
Sore throat with fever, no cough, swollen neck glands. Untreated strep, especially in children, can lead to rheumatic fever. Antibiotics are the treatment.

### Dental abscess
Swelling and pain around a tooth. See [[dental]] for warning signs of spread to the face and neck.

## What you can do without antibiotics
- Keep the person hydrated, rested, and fed.
- Control fever and pain ([[meds-stockpile]]).
- Clean wounds and drain pus where it is safe.
- Keep infected areas clean, dry, and covered; raise limbs.
- Prevent spread: [[disease-prevention]].

## Planning ahead
- **Talk to your doctor now.** Ask whether they will prescribe a "just in case" supply for travel or remote living, and which drug and dose they would choose for your family's allergies and conditions. Some do.
- Never share antibiotics, use leftovers for a different illness, or stop a course early. Wrong use causes side effects and resistance.
- Antibiotics made for animals or fish are not made or tested for people. Do not rely on them.
- Prevention is your best antibiotic: clean water, clean wounds, handwashing, up-to-date tetanus and other vaccines, and good sanitation.
`

    title: 'Medications: Stockpiling, Storage & OTC Dosing',
    summary: 'How to build and store a medicine supply, what expiration dates really mean, and standard over-the-counter doses for adults and children.',
    tags: ['medication', 'medicine', 'dose', 'dosage', 'acetaminophen', 'Tylenol', 'ibuprofen', 'aspirin', 'expired', 'expiration', 'stockpile', 'children dosing'],
    body: `
> WARNING: Always read the product label and follow it. Doses below are standard for healthy people and are conservative. Check with a doctor or pharmacist when you can, especially for kidney, liver, heart, or stomach problems, pregnancy, and use with other medicines.

## Building a supply
1. Ask your doctor and pharmacist for a 90-day supply of every prescription. Ask about mail-order or "vacation override" refills.
2. Refill as early as your plan allows, so you always carry a small buffer.
3. Keep a written list of every medicine, dose, and the reason for it. Keep a copy in your go bag.
4. Add basic OTC items: acetaminophen, ibuprofen, an antihistamine, anti-diarrheal, antacid, hydrocortisone cream, antibiotic ointment, oral rehydration salts, sterile saline, glucose tablets, vitamins, and naloxone (available without prescription in the US).

## Storage
- Cool, dry, dark. Heat, humidity, and light break medicines down. A cabinet is better than a bathroom or car.
- Keep medicines in their original containers, with any desiccant packet.
- Keep out of reach of children. Label everything.

## Do expiration dates matter?
Expiration dates are the maker's guarantee of full strength. Studies of stored military stocks found that many solid tablets and capsules kept most of their potency for years past the date, but there is no guarantee.

- **Do not rely on expired:** insulin, epinephrine auto-injectors, nitroglycerin tablets, liquid or suspension antibiotics, eye drops, inhalers, and vaccines. Replace these on time.
- Expired solid pills stored well are a last-resort option when nothing else is available, not a plan.

## Adult OTC doses (check the label)
| Medicine | Usual dose | Maximum per 24 hours |
|---|---|---|
| Acetaminophen | 500–1,000 mg every 6 hours | 3,000 mg |
| Ibuprofen | 200–400 mg every 6–8 hours with food | 1,200 mg |
| Naproxen | 220 mg every 8–12 hours with food | 660 mg |
| Aspirin (adults only) | 325–650 mg every 4–6 hours | 3,000 mg |
| Diphenhydramine | 25–50 mg every 4–6 hours | 300 mg |
| Loratadine | 10 mg once a day | 10 mg |
| Loperamide (age 12+) | 4 mg first, then 2 mg after each loose stool | 8 mg |
| Hydrocortisone 1% cream | Thin layer up to 3–4 times a day, up to 7 days | n/a |

- Many cold and flu products also contain acetaminophen. Count all sources.
- Ibuprofen and naproxen can hurt the stomach and kidneys. Avoid in dehydration, kidney disease, ulcers, late pregnancy, and with blood thinners. Do not take ibuprofen and naproxen together.
- Diphenhydramine causes drowsiness and is risky for older adults.
- Aspirin: also used for suspected heart attacks, see [[heart-stroke]].

## Children's doses (by weight)
Use a dosing syringe or cup that comes with the medicine, never a kitchen spoon. Check that the concentration on the bottle matches the table.

| Weight | Acetaminophen 160 mg per 5 mL | Ibuprofen 100 mg per 5 mL (6 months and older) |
|---|---|---|
| 12–17 lb (5.5–8 kg) | 2.5 mL | 2.5 mL |
| 18–23 lb (8–10.5 kg) | 3.75 mL | 4 mL |
| 24–35 lb (11–16 kg) | 5 mL | 5 mL |
| 36–47 lb (16–21 kg) | 7.5 mL | 7.5 mL |
| 48–59 lb (22–27 kg) | 10 mL | 10 mL |
| 60–71 lb (27–32 kg) | 12.5 mL | 12.5 mL |
| 72–95 lb (33–43 kg) | 15 mL | 15 mL |
| 96 lb and up (44 kg+) | 20 mL | 20 mL |

- Acetaminophen: every 4–6 hours, no more than 5 doses in 24 hours. The weight rule is 10–15 mg per kg.
- Ibuprofen: every 6–8 hours, no more than 4 doses in 24 hours. The weight rule is 5–10 mg per kg. Do not give to children who are vomiting or dehydrated.

- Never give aspirin to anyone under 18.
- Do not give cough and cold medicines to children under 4 unless a clinician says so.
- Do not give honey to children under 1 year.

    body: `
## The main rule
If you or a family member depend on a medicine or device, your plan must be made **before** a crisis. Talk to your doctor about this directly. Do not stop any prescribed medicine suddenly. Changes you make without a clinician can be dangerous.

For everyone with a chronic condition:
- Keep a 90-day supply if you can ([[meds-stockpile]]) and a written list of diagnoses, medicines, doses, and allergies.
- Wear a medical alert bracelet or carry a card.
- Keep backup power for any device ([[power-outage-basics]]).
- Teach a family member how to help you.

## Diabetes
- **Insulin:** Unopened insulin keeps best in a refrigerator. Once in use, most insulin stays good for about 28 days at room temperature (check your product), kept below 86 °F (30 °C) and out of sun. Never freeze it. If the power is out, use cool water, a clay pot cooler, or a cool basement: [[keeping-cold]].
- **Low blood sugar** (shaky, sweaty, hungry, confused, pale): give 15 g of fast sugar: 4 oz (120 mL) juice, 3–4 glucose tablets, or 1 tablespoon sugar or honey. Recheck or repeat in 15 minutes. If the person is unconscious or cannot swallow, do not put food in their mouth; use glucagon if you have it and seek help.
- **Very high blood sugar:** extreme thirst, frequent urination, nausea, fruity breath, fast deep breathing. In type 1 diabetes this can quickly become diabetic ketoacidosis, which is an emergency.
- Stock test strips, lancets, meter batteries, glucose tablets, needles, and sharps containers.
- Check feet daily: [[foot-care]].

## Asthma and COPD
- Keep rescue inhalers (and spacers) on hand and track doses. Avoid triggers: smoke, dust, mold, cold air, wood smoke.
- Emergency signs: can't speak in full sentences, using neck or rib muscles to breathe, blue lips, no relief from the rescue inhaler. Seek help.
- Home oxygen concentrators need power. Ask about backup tanks. Never use open flame or smoke near oxygen.

## High blood pressure and heart disease
- Do not stop blood pressure or heart medicines abruptly. Some, such as beta blockers, can cause dangerous rebound if stopped.
- Cut salt, avoid heavy exertion, and manage stress. Keep any prescribed nitroglycerin in a dark glass bottle and replace it as directed.
- Heart failure: weigh daily; fast weight gain or new swelling means fluid is building up.
- Blood thinners such as warfarin need careful monitoring. Ask your doctor for a plan.

## Seizure disorders
- Do not skip or stop anti-seizure medicine; withdrawal can cause seizures.
- During a seizure: time it, move hard objects away, cushion the head, do not hold the person down or put anything in the mouth, and roll them onto their side afterward. A seizure lasting more than 5 minutes is an emergency.

## Thyroid disease
Levothyroxine stays in the body for a long time, so missing a few doses is not an emergency. Missing months causes serious illness. Stock a year's supply if allowed.

## Kidney disease and dialysis
People on dialysis depend on machines and clean water. Ask your dialysis center for an emergency plan and an emergency diet (low potassium, salt, and fluid). Without dialysis, survival is usually days to a couple of weeks. Reduce salt, potassium, and fluid, and try to reach care early.

## Mental health medicines
Never stop antidepressants, antipsychotics, or anti-anxiety medicines suddenly. Some, such as benzodiazepines, can cause seizures if stopped. See [[mental-health]].

## When supplies run out
Seek medical advice as early as possible, before you are in crisis. Reduce physical stress, use diet and lifestyle changes that help your condition, and watch for warning signs. If you are in a group, find out who else has medical training or supplies.
`

> CALL: If you can reach emergency help, call now and keep the phone on speaker. Most births go well with very little help. Your job is to keep everyone warm, calm, and clean.

## Is birth about to happen?
Birth is close if any of these are true:
- Contractions come every 2–3 minutes and last about 1 minute
- She feels a strong urge to push or to have a bowel movement
- The baby's head is visible at the vaginal opening (crowning)
- Her water has broken and the urge to push is strong

Do not try to move her if birth is imminent.

## Prepare
1. Wash your hands well and put on gloves if you have them.
2. Lay clean towels, sheets, or a plastic sheet under her. Have blankets and a hat for the baby.
3. Have two clean ties (string, a clean shoelace, or cord) and clean scissors or a new blade. Boil them for 20 minutes, or hold a blade in a flame and let it cool, if you can.
4. Let her choose her position: half-sitting, on hands and knees, or on her side.

## Delivery
1. **Do not pull the baby.** Let her body do the work.
2. As the head crowns, tell her to pant or breathe through contractions instead of pushing hard. Rest your hand lightly on the head to keep it from coming out too fast.
3. After the head is out, feel the neck. If the cord is around the neck and loose, slip it over the head. If it is tight and will not slip, keep helping the baby out; only if the body cannot be delivered, clamp or tie in two places and cut between.
4. The baby will turn on its own. With the next contraction, the shoulders come out. Hold the baby with both hands. Babies are slippery.
5. Lay the baby on the mother's belly or chest, skin to skin, with the head turned to the side so the airway stays clear.
6. Wipe the mouth and nose with a clean cloth. Dry the baby thoroughly, remove wet cloths, and cover both baby and mother with dry blankets. Put a hat on the baby.

## If the baby does not breathe
Most babies cry within 30 seconds. If not:
1. Dry and rub the baby's back vigorously, and flick the soles of the feet.
2. If still not breathing, give 5 gentle puffs with your mouth over the baby's nose and mouth. Use only the air in your cheeks.
3. If there is no response and no heartbeat, begin infant CPR: [[cpr]].

## The cord
Do not rush. Wait until the cord stops pulsing, usually 1–3 minutes. Tie or clamp it 6 inches (15 cm) from the baby, tie a second knot 8–10 inches (20–25 cm) from the baby, and cut between the ties with clean scissors. Keep the stump clean and dry and fold the diaper below it.

## The placenta
It usually comes out 5–30 minutes after the baby (up to 60 minutes). Do not pull on the cord. Let it come with a contraction, catch it in a bowl, and check that it looks whole. Seek help if it does not come within an hour.

- Have the baby nurse at the breast; this makes the uterus tighten.

## Feeding babies under 12 months
1. **Breast milk is safest** when no clean water or formula is available. Feed on demand, 8–12 times a day for a newborn. A nursing mother needs extra food and fluid.
2. At least 6 wet diapers a day (after the first week) means the baby is getting enough.

### Formula
- **Powdered formula:** mix with water you boiled and let cool for no more than 30 minutes, following the can's directions exactly. Throw away any formula left in the bottle after 1 hour.
- **Ready-to-feed liquid formula** is best if you have no safe water.
- Use opened powder within the time on the can and store it cool and dry.

> WARNING: Never dilute formula to make it last. Never make homemade formula. Both can cause seizures and kidney or brain damage. Do not give water, tea, or juice to babies under 6 months. Do not give honey before age 1 (infant botulism). Do not give plain cow's or goat's milk as a main drink before age 1.

If formula runs out, ask a clinician. For babies older than 6 months, whole cow's milk may serve as a short-term stopgap along with solid foods, but it is a clinician's call.

### Bottles
Wash bottles with soap and hot water. Sanitize by boiling for 5 minutes or soaking in 1 tablespoon unscented bleach per gallon of water for 1 minute, then air dry. See [[laundry-dishes]].

## First foods (around 6 months)
- Mash or puree: rice or oat cereal, cooked beans, potatoes, squash, bananas, well-cooked meat.
- No honey. No salt or sugar. Offer foods that are soft and small enough not to choke.
- Avoid whole nuts, whole grapes, popcorn, hard raw vegetables, and chunks of meat. See [[choking]].

## Children
- Kids dehydrate faster than adults. Offer fluids often and use oral rehydration solution for diarrhea: [[dehydration-ors]].
- Make sure they get calories, protein, and fat. For ages 1–3 aim for roughly 1,000–1,400 kcal a day.
- Children's medicine doses are in [[meds-stockpile]].

## Fever rules
| Age | Action |
|---|---|
| Under 3 months | A temperature of 100.4 °F (38 °C) or higher is an emergency. Seek help immediately. |
| 3–36 months | Seek care for 102.2 °F (39 °C) or higher, or fever lasting more than 24 hours. |
| Older children | Treat for comfort. Seek care if fever lasts more than 3 days or other danger signs appear. |

## Danger signs in babies and children
- Not feeding or vomiting everything
- No wet diaper in 8 hours, no tears, sunken soft spot on the head
- Hard to wake, floppy, or unusually irritable
- Fast breathing, grunting, chest pulling in with each breath, blue lips
- A rash that does not fade when pressed
- Bulging soft spot, high-pitched cry, or seizure
- Yellow skin or eyes after the first 2 weeks

## Safe sleep
- Place babies on their back on a firm, flat surface.
- Keep the sleep area free of pillows, loose blankets, and toys.
- Keep the baby in the same room but on their own sleep surface. Never sleep with a baby on a couch.
- In the cold, dress them in extra layers instead of using loose blankets. Never use heaters near the sleep area. Make sure you have a carbon monoxide alarm.

## Diapers and skin
Cloth diapers work: use absorbent cotton with a waterproof cover, wash in hot water, and sun-dry. Change often, let skin air-dry, and use zinc oxide or petroleum jelly for rash.

- Keep regular routines for meals, sleep, and play.
- Give honest, short answers. Give them small jobs.
- Keep a comfort object with them. Watch for clinging, bed-wetting, nightmares, or play that repeats the event; these are normal and usually fade. See [[mental-health]].
- For CPR and choking, see [[cpr]] and [[choking]].

## Plan before the emergency
For anyone who depends on a device or help to live safely:
1. List every medicine, device, and need. Keep a copy in the go bag.
2. Ask suppliers about backup options (batteries, cylinders, manual equipment).
3. Tell family, neighbors, and local emergency management. Join any "medical needs" registry, and ask your power company about a priority list.
4. Choose a buddy who will check in during an emergency.

## Devices and supplies
- **Oxygen:** concentrators need power. Keep backup cylinders and ask the supplier how long each lasts at your flow rate. Keep oxygen at least 10 feet (3 m) from flame, candles, and smoking. See [[chronic-conditions]].
- **CPAP:** needs power. Ask your supplier about a battery pack. In a pinch, sleep on the side or with the head raised.
- **Wheelchairs and scooters:** keep a manual chair or spare battery, charged. Practice being carried or moved: [[moving-patients]].
- **Hearing aids:** keep spare batteries (zinc-air type usually last a few days to 2 weeks), a drying kit, and a written note to communicate with.
- **Glasses and dentures:** keep a spare pair of glasses. Label dentures and keep them with the person.
- **Hospital bed, feeding tubes, catheters, wound supplies, incontinence supplies:** stock at least a month if possible.
- **Medicines needing refrigeration:** see [[keeping-cold]].

## Heat and cold
Older adults sense temperature poorly and cool or heat up faster. Check them often, use a thermometer, and keep them in a safe temperature range. See [[heating-home]], [[staying-cool]], [[hypothermia-frostbite]], and [[heat-illness]].

## Fluids and food
Thirst weakens with age. Offer drinks regularly. Offer small, frequent meals. Soft or mashed foods may be needed if swallowing is hard.

## Preventing falls
Clear walkways, light the night path (headlamps or glow sticks near beds), and use a commode or bucket toilet at the bedside: [[human-waste]].

## Dementia
- Keep routine, familiar objects, and a calm voice.
- Do not leave the person alone. Use an ID bracelet or label, in case they wander.
- Expect more confusion and distress when the routine changes. Keep noise and crowds down.

## Communication needs
- Deaf or hard of hearing: use written notes, gestures, and a flashlight to get attention.
- Blind or low vision: describe surroundings and keep items in the same places.
- Cognitive or developmental disability or autism: use simple words and pictures, keep routines, and keep headphones or a comfort item handy.

## Evacuation help
- Decide in advance who will help, and how. Practice moving the person.
- Carry a card that lists diagnoses, medicines, allergies, devices, and contacts.
- Find out which shelters can support medical needs.

## Caring for the caregiver
Caregivers burn out. Share the load, take short breaks, and accept help. See [[home-nursing]] and [[mental-health]].

    body: `
## Daily care
- Brush for 2 minutes twice a day with a soft brush. Use fluoride toothpaste if you have it; small tubes keep for years, so stock several. With no paste, use plain water with a pinch of baking soda.
- Floss once a day. Replace toothbrushes every 3 months, and stock extras.
- Rinse with salt water (½ tsp salt in 8 oz / 240 mL warm water) if gums are sore.
- Cut back on sugar, especially sticky sweets. Drink water after eating.
- Babies and toddlers: wipe gums and teeth with a clean cloth.

## Knocked-out permanent tooth
Time matters: reinserting the tooth within 30–60 minutes gives the best chance.
1. Pick it up by the crown (the white chewing part), never the root.
2. If dirty, rinse it very briefly (10 seconds) with milk, saline, or clean water. Do not scrub or use soap.
3. Gently push it back into the socket, facing the right way. Have the person bite gently on a clean cloth to hold it.
4. If you cannot reinsert it, keep it in cold milk or inside the cheek (older children and adults only, not small children who might swallow it).
5. See a dentist as soon as possible.
Do not reinsert baby teeth.

## Broken or chipped tooth
Rinse the mouth with warm water and save pieces. Use a cold compress. Cover sharp edges with dental wax or sugarless gum.

## Toothache
- Rinse with warm salt water and floss to remove trapped food.
- Use a cold compress on the cheek and take ibuprofen or acetaminophen ([[meds-stockpile]]).
- A tiny dab of clove oil on a cotton ball held against the tooth can numb pain. Keep it off the gums and do not swallow it. Avoid in young children.
- Do not put aspirin on the gum; it burns the tissue.

## Abscess warning signs
An abscess is a pocket of infection at a tooth root. Signs: severe throbbing pain, swelling of the gum or face, a pimple on the gum, a bad taste, and fever.

> CALL: Swelling that spreads to the face, eye, jaw, or neck, trouble swallowing or breathing, trouble opening the mouth, or high fever means the infection is spreading and can block the airway or reach the brain. Seek emergency care immediately. See [[infection-antibiotics]].

## Lost filling or crown
- Clean the area and cover the hole with temporary filling material (a dental repair kit, sold in pharmacies).
- Re-cement a crown with temporary dental cement or denture adhesive, never with super glue.
- Chew on the other side until repaired.

## Bleeding after a tooth is pulled
Bite firmly on damp gauze or a damp tea bag for 30 minutes. Avoid rinsing, spitting, straws, or smoking for 24 hours.

## Pulling a tooth
Removing a tooth is a procedure that can cause serious infection and bleeding. Leave it to trained people. Only a tooth that is already extremely loose should ever be removed at home.

## Dental kit to stock
Toothbrushes, toothpaste, floss, dental wax, temporary filling material, temporary cement, cotton rolls, gauze, clove oil, salt, and pain relievers.

## A word of caution
Herbs are medicines. Some help modestly, many do little, and some are harmful. Doses are rarely certain, and plants vary in strength. Home remedies **do not replace** first aid or treatment of serious infection ([[infection-antibiotics]]).

> WARNING: Use only plants you grow yourself or buy from a known source. Misidentifying a wild plant can kill you. Read [[foraging-safety-rules]] before collecting anything. Check pregnancy, breastfeeding, children, and drug interactions first.

## What has some support
| Remedy | Use | Cautions |
|---|---|---|
| Honey | Minor wounds and burns (thin layer under a dressing); cough in age 1 and up | Never for infants under 1. Do not use on deep or badly infected wounds. |
| Ginger | Nausea and motion sickness; tea from 1 tsp grated root per cup | Large amounts can thin blood. |
| Peppermint | Upset stomach, mild headache (tea) | Can worsen heartburn. Do not put menthol on a baby's face. |
| Chamomile | Mild calming, upset stomach (tea) | Avoid if allergic to ragweed or daisies. |
| Aloe vera gel | Sunburn and minor burns | Do not swallow the yellow latex. |
| Willow bark | Mild pain and fever (contains an aspirin-like chemical) | Same cautions as aspirin: not for anyone under 18, ulcers, bleeding, blood thinners, or pregnancy. Dose is unreliable. |
| Plantain leaf | Crushed leaf placed on insect stings and small skin irritations | Low risk. See [[safe-wild-greens]]. |
| Elderberry | Cooked syrup or tea may shorten flu a little | Raw berries, leaves, stems and seeds are poisonous. Only cook the ripe berries. See [[wild-berries-fruit]]. |
| Garlic | Mild antimicrobial in food | Never store garlic in oil; botulism risk. Large amounts thin blood. |
| Slippery elm or marshmallow root | Soothes sore throats | Generally safe. |
| Yarrow | Traditionally used on bleeding; weak evidence | Press on the wound instead. Avoid in pregnancy; allergic reactions with daisy family. |
| Mullein | Tea for cough | Mullein's first-year rosette is sometimes confused with foxglove, which is deadly. See [[deadly-plants]]. |

Other low-risk home measures: salt-water gargles, steam for congestion, oatmeal baths for itching, and a baking-soda paste on stings.

## What to avoid
- Colloidal silver (does not work and can turn skin permanently gray)
- Essential oils taken by mouth
- Comfrey, pennyroyal, tansy, wormwood, coltsfoot, and lobelia, taken internally
- "Miracle" chemical cures such as bleach or MMS products
- Using herbs instead of care for sepsis, severe infection, or heart or breathing problems
- St. John's wort without checking interactions; it weakens many medicines, including birth control

## How to prepare
- **Infusion (tea) for leaves and flowers:** pour 1 cup of just-boiled water over 1–2 teaspoons of dried herb (or 2–3 of fresh). Cover and steep 10–15 minutes.
- **Decoction for roots and bark:** simmer 15–20 minutes in covered water, then strain.
- **Poultice:** crush fresh leaves, place on clean skin, and cover. Change several times a day.
- **Salve:** infuse dried herbs (not fresh, which can spoil or grow botulism) in oil, then melt with beeswax: about 1 part wax to 6–8 parts oil by weight.

## Growing your own
Easy medicinal and culinary herbs: [[herb-garden]]. Dry and store them in jars away from light.

    body: `
## Periods
- Stock more than you think you need: pads, tampons, or menstrual cups. A reusable cup lasts for years.
- **Reusable cloth pads:** sew 4–6 layers of absorbent cotton or flannel with a waterproof layer such as nylon or a cut-up shower curtain on the bottom. Make at least 10–15.
- **To wash:** rinse in cold water first, then wash with soap in hot water, and sun-dry.
- **Cup:** empty every 8–12 hours. Boil for 5–10 minutes between cycles.
- **Improvised:** clean folded cloth held in underwear.
- Change tampons at least every 8 hours; leaving them longer raises the risk of toxic shock syndrome.
- Cramps: heat packs, a warm drink, light exercise, and pain relievers ([[meds-stockpile]]).
- Wash hands before and after. See [[handwashing-hygiene]].

## Contraception
Plan ahead; a pregnancy during a long crisis is risky.
- **Pills:** ask for a 3-month supply. Stopping abruptly can cause pregnancy.
- **Condoms:** keep cool and dry, away from heat; use before the expiration date.
- **IUDs and implants:** last years (copper IUD up to 10 years, implant about 3–5 years). Excellent for the long term; talk to your clinician.
- **Injections** need a renewal every 3 months.
- **Emergency contraception:** pills work best within 72 hours of unprotected sex. Available without prescription in the US; stock some.
- **Fertility awareness** (tracking temperature, cervical mucus, and cycle days) works only if done consistently and is less reliable than other methods.
- **Breastfeeding** prevents pregnancy only if exclusive, around the clock, and the baby is under 6 months with no period yet.

## Pregnancy
- Eat extra: about 300 more calories a day in the second and third trimesters. Include protein, iron, and dairy or beans. Take a prenatal vitamin with folic acid (400 mcg daily) if you can.
- Drink plenty of clean water and avoid raw or undercooked meat, raw eggs, unpasteurized milk, and alcohol.
- Avoid most herbs ([[herbal-remedies]]).

> CALL: Seek help for vaginal bleeding, severe belly pain, fluid leaking before 37 weeks, fever, severe vomiting, severe headache, vision changes or spots, sudden swelling of the face or hands (possible preeclampsia, which can cause seizures), or the baby moving much less than usual (fewer than 10 movements in 2 hours after 28 weeks).

## Miscarriage and bleeding emergencies
Cramping and bleeding in early pregnancy can be a miscarriage. Rest, drink fluids, and watch the amount of blood.

> DANGER: Soaking 2 pads an hour for 2 hours, fainting, or severe one-sided belly pain, especially with shoulder pain, can mean an ectopic pregnancy (outside the uterus) or severe hemorrhage. This is life-threatening and cannot be managed at home. See [[shock]].

For birth, see [[childbirth]].

## Common problems
- **UTIs:** wipe front to back, urinate after sex, drink water. See [[infection-antibiotics]].
- **Yeast infection:** itching and thick white discharge. Wear cotton underwear, avoid douching, and use antifungal cream if you have it.
- **Mastitis (breast infection while nursing):** red, hot, painful breast with fever. Keep nursing or pumping, apply warm compresses, and rest. Seek care if it does not improve in 1–2 days.

    summary: 'Normal stress reactions, routines, panic attacks, grief, helping children, suicide warning signs, and withdrawal dangers.',

    body: `
## What is normal
In a crisis, many people feel fear, anger, numbness, guilt, sadness, trouble sleeping, poor appetite, and jumpy nerves. These are normal reactions to an abnormal situation. They are not weakness. They usually ease with safety, rest, and support.

## What helps most
1. **Meet basic needs:** water, food, sleep, warmth, and safety first.
2. **Keep a routine:** set times for waking, meals, chores, and rest.
3. **Give everyone a job.** Purpose protects the mind.
4. **Stay connected.** Talk daily to people you trust. Share meals.
5. **Move your body** and get daylight.
6. **Limit news.** Check on a schedule rather than constantly.
7. **Help others.** It helps you as well.

## Sleep
- Poor sleep wrecks judgment. Aim for 6–8 hours.
- Set a sleep time, keep the sleeping area dark and quiet, and use earplugs or an eye cover.
- Avoid caffeine late in the day. Keep naps under 30 minutes.
- If you must keep watch, rotate shifts so everyone gets a full block of sleep.

## Panic attacks
Racing heart, short breath, tingling, dizziness, and a sense of dread, usually peaking within 10 minutes. They feel terrible but are not dangerous.
1. Sit down. Tell yourself: this will pass.
2. Breathe in through the nose for 4 counts, hold for 4, and out through the mouth for 6–8 counts. Repeat for several minutes.
3. Ground yourself: name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, and 1 you can taste.
4. Splash cool water on the face.
If you are over 40, have heart risks, or have chest pain that spreads, treat it as a possible heart attack: [[heart-stroke]].

## Grief
Allow it. Share memories, hold simple rituals, and do not rush. Children grieve in bursts, often through play. See [[death-burial]].

## Children
Expect clinging, nightmares, bed-wetting, tantrums, or replaying the event in play. Tell the truth in short, simple words, keep routines, give hugs and small jobs, and limit scary information. See [[babies-kids]].

## Thoughts of suicide
Warning signs: talking about wanting to die or being a burden, hopelessness, giving things away, withdrawal, reckless behavior, or sudden calm after deep depression.
1. **Ask directly:** "Are you thinking about killing yourself?" Asking does not plant the idea.
2. Stay with them and listen without judgment.
3. Remove means: firearms, pills, ropes, and sharp tools, as safely as you can.
4. Get help: in the US call or text **988** (Suicide & Crisis Lifeline) or call 911. If no services work, do not leave the person alone; keep a 24-hour watch with others.

## Withdrawal can be dangerous
> WARNING: Heavy daily drinkers can have life-threatening withdrawal (tremors, sweating, seizures, hallucinations, usually within 6–96 hours). Stopping benzodiazepines (such as Xanax or Valium) suddenly can cause seizures. Stopping antidepressants abruptly causes bad symptoms. Talk to a doctor now. A seizure or confusion is an emergency.

Opioid withdrawal is miserable (vomiting, diarrhea, aches) but rarely fatal; focus on fluids ([[dehydration-ors]]).

## Take care of caregivers
Take breaks, share the load, eat, and sleep. Do not hide exhaustion. See [[home-nursing]].

## When to seek help
Get help when someone cannot function for more than 2 weeks, hears or sees things that are not there, has violent thoughts, or is using alcohol or drugs heavily. See also [[mindset]].

    body: `
## Why feet matter
If you cannot walk, you cannot reach water, safety, or help. Most foot problems start small and are easy to prevent.

## Shoes and socks
- Choose sturdy, broken-in shoes or boots with about a thumb's width of space in front of the toes. Fit them in the afternoon, when feet are largest, with the socks you will wear.
- Keep a spare broken-in pair in your go bag.
- Wear wool or synthetic socks. **Avoid cotton**; it holds sweat and causes blisters. Carry at least 2 spare pairs and change when they get wet.
- Dry wet socks by hanging them from your pack or tucking them in a shirt against your body.
- Trim toenails straight across.

## Prevent blisters
1. Stop at the **first** hot spot or rubbing. Do not wait.
2. Cover the spot with moleskin, athletic tape, or smooth duct tape.
3. Adjust laces and smooth socks.
4. Wash and dry feet each night, especially between the toes. Use foot powder if you have it.

## Treat a blister
- **Small, unbroken blister:** leave it. Protect it with a donut-shaped pad of moleskin around it, then cover with tape.
- **Large, painful blister in the way of walking:**
  1. Wash your hands and the skin. Sterilize a needle with flame or alcohol.
  2. Poke 2–3 small holes at the edge and press out the fluid. Leave the skin roof on.
  3. Apply antibiotic ointment and a nonstick dressing; tape it.
  4. Change it daily and watch for infection (see [[wound-care]]).

## Trench foot
Feet kept wet and cold (not frozen) for many hours or days can become numb, tingly, pale or blue, swollen, and later red and painful. Prevent it with dry socks and dry boots. Treat by drying, gently warming (not hot), and raising the feet. See [[hypothermia-frostbite]].

## Fungus and skin problems
Athlete's foot: itchy, peeling, cracked skin between toes. Keep feet dry, change socks often, air shoes out, and use antifungal powder or cream.

## Ingrown toenail
Soak in warm salt water, then gently lift the edge of the nail with a bit of clean cotton. Cut nails straight across. Redness, pus, or throbbing needs care: [[infection-antibiotics]].

## Overuse injuries
- **Ankle sprain:** [[fractures-sprains]]. For mild ones, tighten laces or use a wrap and walking sticks.
- **Shin splints and knee pain:** slow down, shorten steps on downhill slopes, use poles, and rest.
- **Back pain:** carry no more than 20–25% of your body weight and let the hip belt carry the load. See [[traveling-on-foot]].

## Daily foot check
Look at both feet every day. People with diabetes or poor circulation must check every day; a small sore can become a serious infection ([[chronic-conditions]]).

## Foot care kit
Moleskin, tape, needle, scissors, antibiotic ointment, spare socks, foot powder, and nail clippers.

## Start now, start small
A garden takes seasons to learn. Do not wait for a crisis. Plant a small garden this year (400–1,000 sq ft / 40–90 m²), make your mistakes while the grocery store still works, and grow it every year.

> IMPORTANT: A first-year garden rarely feeds a family. Treat it as practice and as a way to build soil, seed stock, and skill.

## Grow calories first
Lettuce and tomatoes are nice, but people survive on calories and protein. Put most of your space into crops that are **calorie-dense and store well**:

| Crop | Typical yield per 100 sq ft | Calories per lb | Calories per 100 sq ft |
|---|---|---|---|
| Potatoes | 50–150 lb | about 350 | 20,000–50,000 |
| Sweet potatoes | 30–100 lb | about 390 | 12,000–39,000 |
| Dry field corn (grain) | 5–15 lb | about 1,650 | 8,000–25,000 |
| Dry beans | 5–15 lb | about 1,500 | 7,500–22,000 |
| Winter squash | 30–100 lb | about 200 | 6,000–20,000 |
| Carrots and beets | 50–100 lb | about 185 | 9,000–18,000 |
| Wheat | 3–6 lb | about 1,500 | 4,500–9,000 |
| Leafy greens | 30–60 lb | 70–200 | 2,000–10,000 |

These are rough home-garden figures. Your soil, climate, and skill change them a lot. Potatoes give about four times the calories of wheat from the same space and far less labor. See [[growing-potatoes-roots]], [[growing-beans-corn-squash]], and [[growing-grains]].

## How much space?
- An adult eating 2,000 calories a day needs about 730,000 calories a year.
- At 15,000–25,000 calories per 100 sq ft, that is roughly **4,000–8,000 sq ft (370–740 m²) per person** for most of a year's food. Beginners should plan on the high end.
- Vegetables for fresh eating and some preserving: about 200–400 sq ft per person.
- Add perennials (fruit, nuts, asparagus) and a few animals over time. See [[fruit-nuts-perennials]] and [[livestock-overview]].

## Choose the site
1. **Sun:** 6–8 hours of direct sun. More is better for tomatoes, squash, corn.
2. **Water:** close enough to carry buckets. Fewer steps means you will actually water.
3. **Drainage:** avoid spots where water stands. A gentle south-facing slope warms earlier in the north.
4. **Away from big trees:** roots steal water and shade steals light.
5. **Clean soil:** avoid ground near roads, old painted buildings (lead), or old dumps. See [[soil-basics]].
6. **Fence:** plan for deer and rabbits from day one ([[garden-pests]]).

## Layout
- Beds 3–4 ft (1–1.2 m) wide so you can reach the middle without stepping on the soil. Paths 18–24 in (45–60 cm).
- Put tall crops (corn, pole beans) on the north side so they do not shade the others.
- Plant fast crops (radish, lettuce) between slow ones (cabbage, squash).
- **Succession plant:** sow a little every 2–3 weeks instead of everything at once.
- **Rotate:** do not grow the same family in the same bed more than once every 3–4 years (see [[compost-fertilizer]]).

## Keep a garden journal
Write down what you planted, when, where, what died, and when the first and last frosts were. After three years it is worth more than any book. See [[frost-dates-calendar]] and [[veg-quick-reference]].

## Save seed from the start
Grow open-pollinated varieties and learn to save their seed ([[seed-saving]]). Store extra seed packets cool and dry.

## What good soil is
Good garden soil is **loamy**: crumbly, dark, drains well but holds moisture, and is full of earthworms. Most soil can be improved with organic matter (compost, leaves, manure, mulch) more than with anything else.

## Jar test (soil texture)
1. Fill a straight-sided jar one-third full of soil (remove stones).
2. Add water almost to the top and a spoonful of dish soap. Shake hard for 2 minutes.
3. Let it settle. **Sand** settles in 1 minute, **silt** in about 2 hours, **clay** in 1–2 days.
4. Measure each layer. Ideal loam is roughly 40% sand, 40% silt, 20% clay.

## Ribbon test
Squeeze moist soil between thumb and finger and push out a ribbon. No ribbon: sandy. A ribbon under 1 in (2.5 cm): loam. A ribbon over 2 in (5 cm) that holds: heavy clay.

## When is soil ready to work?
Squeeze a handful. If it forms a wet, sticky ball that does not crumble when poked, it is **too wet**. Working wet soil makes hard clods. Wait a few days.

## pH
Most vegetables like pH **6.0–7.0**. Potatoes do better at 5.0–6.0 (less scab). Blueberries need 4.5–5.5.
- **Test kit or meter:** best. Strips and kits are cheap; stock several.
- **Crude kitchen test:** soil that fizzes when vinegar is added is alkaline (above 7). Soil that fizzes when mixed with water and baking soda is acidic (below 7). No fizz either way: roughly neutral.
- **Raise pH:** ground limestone, or a little wood ash (see [[compost-fertilizer]]).
- **Lower pH:** elemental sulfur, pine needles, peat. Slow; change gradually.

## What plants need
- **Nitrogen (N):** leafy green growth. Compost, manure, beans and clover.
- **Phosphorus (P):** roots, flowers, fruit. Bone meal, compost.
- **Potassium (K):** overall health, tubers, fruit. Wood ash, compost, kelp.
Dark leaves and strong growth suggest enough N; pale yellow older leaves suggest low N.

## Improve the soil
- **Add organic matter every season:** 2–4 in (5–10 cm) of compost on top of beds is the single best habit.
- **Heavy clay:** add compost and coarse organic matter, not sand. Clay plus sand makes something like concrete.
- **Sandy soil:** add compost and mulch heavily; it drains fast and holds little.
- **Protect it:** keep soil covered with plants or mulch. Bare soil erodes and dries out.
- **Do not compact it:** never walk on beds.

## Digging or no-dig
- **No-dig:** lay cardboard over grass or weeds, wet it, and pile 4–6 in (10–15 cm) of compost on top. Plant right away into the compost. Less work and it protects soil life.
- **Double digging:** loosen the soil two spades deep once to start a bed. Hard work; worthwhile for compacted ground.
- **Raised beds:** useful for poor soil, wet ground, or contaminated ground. Fill with good soil and compost. See [[garden-structures]].

> WARNING: Soil near old houses (lead paint) or busy roads can hold lead. Avoid growing food there, or use raised beds with imported soil.

## Hot composting
Compost is rotted plant and animal matter that feeds soil. A hot pile works fast and kills most weed seeds and germs.

1. Build a pile at least 3 × 3 × 3 ft (1 m³). Smaller piles do not get hot.
2. Mix **browns** (carbon: dry leaves, straw, cardboard, sawdust) with **greens** (nitrogen: kitchen scraps, grass clippings, manure) at about **3 parts browns to 1 part greens by volume**.
3. Keep it as damp as a wrung-out sponge.
4. The middle should reach **130–160 °F (55–70 °C)**. Turn the pile when it cools or every 1–2 weeks to add air.
5. Finished compost is dark, crumbly, and smells like forest soil. Hot piles finish in 1–3 months; lazy piles take 6–12 months.

**Do not compost:** meat, bones, dairy, oils, diseased plants, weeds gone to seed (unless the pile is truly hot), or dog, cat, or human waste. Never put those on food crops.

## Manure
Manure from plant-eaters (cow, horse, goat, sheep, rabbit, chicken) is excellent fertilizer.
- **Age it** at least 6 months, or compost it. Fresh manure burns plants and can carry germs.
- **Chicken manure** is "hot" (very high nitrogen): compost it at least 6 months.
- **Rabbit manure** is gentler and can go straight on beds.
- **Safety waiting periods (USDA organic rule of thumb):** apply raw manure at least **90 days before harvest** for crops that do not touch the soil and **120 days** for crops that do (lettuce, carrots, strawberries).
- Do not use dog, cat, or human waste on food. See [[human-waste]].

## Wood ash
Wood ash adds potassium and raises soil pH. Use sparingly: no more than about 2 lb (about 2 quarts) per 100 sq ft per year, and none if your soil pH is already above 7. Keep it away from potatoes and acid-loving plants (blueberries).

## Other natural fertilizers
- **Bone meal:** phosphorus. **Blood meal:** fast nitrogen.
- **Seaweed/kelp:** potassium and trace minerals.
- **Fish emulsion:** quick liquid nitrogen.
- **Leaf mold:** rotted leaves, great soil conditioner.
- **Worm bins:** red wiggler worms turn kitchen scraps into rich castings; keep damp and out of freezing temperatures.

## Cover crops (green manures)
Plant them in empty beds and dig or cut them in before they set seed.
- **Legumes** (crimson clover, hairy vetch, field peas) add nitrogen.
- **Winter rye** protects soil, holds nutrients, and adds lots of organic matter. Cut it before seed heads form.
- **Buckwheat** grows in 30 days in summer and smothers weeds.

## Crop rotation
Grow the same family in the same bed only every 3–4 years. A simple 4-bed cycle:
1. Heavy feeders (corn, squash, cabbage family, tomatoes)
2. Legumes (beans, peas)
3. Roots (potatoes, carrots, beets, onions)
4. Cover crop or rest, then repeat

Rotation reduces disease and pests and balances nutrients. See [[garden-pests]] and [[soil-basics]].

## Direct sow or start indoors?
- **Sow directly in the garden:** beans, peas, corn, squash, cucumbers, melons, carrots, beets, radishes, turnips, lettuce, spinach. Roots hate being moved.
- **Start indoors and transplant:** tomatoes, peppers, eggplant, cabbage family, onions, celery. See the week-by-week timing in [[frost-dates-calendar]] and [[veg-quick-reference]].

## Planting depth rule
Plant seeds **2–3 times as deep as the seed is wide**. Tiny seeds (lettuce, carrots, celery) go on the surface or barely covered. Press the soil firm, keep it damp (not soaking) until sprouts appear.

## Soil temperature matters
- **Cool-season crops** (peas, spinach, lettuce, radish) sprout in cold soil, about 40–50 °F (4–10 °C).
- **Warm-season crops** (beans, squash, cucumbers, corn, tomatoes) need soil at least 60 °F (16 °C). Peppers and melons like 70 °F (21 °C) and up. Sowing too early just rots seed.

## Starting indoors
1. Use a clean container with drainage holes and a **seed-starting mix** (sifted compost mixed with sand or vermiculite). Plain garden soil packs hard and carries disease.
2. Sow, label with name and date, and keep warm (70–75 °F / 21–24 °C).
3. As soon as sprouts show, give strong light: a bright south window with foil or white card reflecting light from the sides, or grow lights if you have power. Weak light makes tall, floppy seedlings.
4. Water from below or with a gentle mist. Let the surface dry slightly between waterings.
5. Thin to one seedling per cell by **snipping** the extras with scissors.

> WARNING: **Damping off** is a fungus that makes seedlings collapse at the soil line. Prevent it with clean containers, sterile mix, not overwatering, and fresh air moving over the trays.

## Hardening off (7–10 days)
Seedlings raised indoors are tender. Before planting out:
1. Day 1–2: put outside in shade for 1–2 hours, out of wind.
2. Each day add more time and more sun.
3. By day 7–10 they stay out all day and night (if no frost is coming).
4. Then transplant, preferably on a cloudy day or late afternoon, and water well. Plant tomatoes deeper, up to the first leaves; they root along the buried stem.

## Test old seed first (germination test)
1. Place 10 seeds on a damp paper towel, fold it, and slip it into a plastic bag.
2. Keep it warm and check daily for 7–14 days.
3. Count sprouts. 8 of 10 is 80% (good). 5 of 10: sow twice as thickly.

## How long does seed last?
Stored cool and dry, approximate years:

| Crop | Years |
|---|---|
| Onion, leek, parsnip | 1–2 |
| Corn | 2 |
| Pepper | 2–3 |
| Carrot, beans, peas | 3 |
| Beet, chard, tomato | 4 |
| Lettuce, cabbage family | 4–5 |
| Squash, cucumber, radish, melon | 5 |

Heat, damp, and light shorten seed life. See [[seed-saving]].

    body: `
## Buy and store seed now
In a long crisis, seed is life. Buy a variety of **open-pollinated or heirloom seed** now and store it cool and dry. Seed packets are cheap; a few dozen kinds is among the best preparations you can make.

## Open-pollinated vs hybrid
- **Open-pollinated / heirloom:** seeds grow plants like the parent. Save these.
- **Hybrid (F1):** seeds grow, but plants vary and are often weaker. Fine to eat, not worth saving.

## Easiest seeds to save (they self-pollinate)
- **Beans and peas:** let pods dry brown on the plant, shell them, finish drying indoors until seeds are hard.
- **Lettuce:** let it bolt, shake the fluffy heads into a bag when dry.
- **Tomatoes:** see wet seeds below. Keep varieties about 10–25 ft (3–8 m) apart.
- **Peppers:** scrape seed from fully ripe fruit and dry. Keep varieties 50 ft (15 m) apart.

## Crops that cross with their neighbors
Insects and wind swap pollen between plants of the same species. Seed from crossed plants is unpredictable.
- **Squash, pumpkin, zucchini:** may cross with others of the same species. Hand-pollinate: tape a female flower shut the evening before, in the morning rub a freshly picked male flower on it, tape it shut again, and mark it.
- **Corn:** wind-pollinated; separate varieties by a quarter mile (0.4 km) or plant two weeks apart.
- **Cabbage family (kale, broccoli, cabbage, turnip):** separate varieties by about half a mile, or grow one variety per year.

## Biennials
Carrots, beets, onions, cabbage, kale, and parsnips make seed in their **second year**. Overwinter them (mulch heavily or store roots cool and replant in spring). They flower and set seed. Save from several plants, not one.

## Wet seeds (tomato, cucumber)
1. Scoop seeds and gel into a jar. Add a little water.
2. Leave 2–3 days at room temperature, stirring daily. A white mold on top is fine; the gel breaks down.
3. Add water, stir, and pour off floating debris and bad seed. Good seed sinks.
4. Rinse and spread on a plate (not paper towel, seeds stick) to dry for a week.

Save cucumbers from fully ripe, yellow-orange fruit.

## Drying and storing
- Seeds must be **bone dry**. A dry bean should shatter if hit with a hammer, not mash.
- Store in sealed glass jars with a label (variety and year). Add a packet of silica gel or dry rice.
- Keep **cool, dark, and dry.** A refrigerator or freezer works if seeds are truly dry and kept sealed.
- Check germination yearly ([[seeds-starting]]).

> TIP: Save seed from your **best** plants: strongest, earliest, most productive. Over years your seed adapts to your garden.

Related: [[garden-planning]], [[harvest-curing]].
`

## The two dates that run your garden
- **Last spring frost:** the average date after which 32 °F (0 °C) is unlikely.
- **First fall frost:** the average date of the first 32 °F night in fall.
- A **light frost** is 29–32 °F; a **hard freeze** is 28 °F (-2 °C) or lower and kills most tender plants.

The time between them is your **growing season**. Everything in a planting guide is timed from these dates.

## How to find yours with no internet
- Ask long-time local gardeners or farmers.
- Check an old almanac or local extension office printouts.
- **Start a journal now:** write down the date of the last spring and first fall frost every year.
- Watch the plants: when lilacs leaf out and dandelions bloom, hardy crops can go in. Wait for soil temperatures and warm nights before tender crops.

## Hardiness zones are not frost dates
The USDA zone (1–13) is based on the **coldest winter night** and tells you which perennials survive winter. It does not tell you when to plant. Rough, **very approximate** frost dates by zone (hills, valleys, coasts, and lakes change these by weeks):

| Zone | Typical last spring frost | Typical first fall frost | Frost-free days |
|---|---|---|---|
| 3 | Late May – early June | Early – mid Sept | 90–110 |
| 4 | Mid – late May | Mid – late Sept | 110–130 |
| 5 | Late Apr – mid May | Early – mid Oct | 130–160 |
| 6 | Mid Apr – early May | Mid – late Oct | 160–190 |
| 7 | Late Mar – mid Apr | Late Oct – early Nov | 190–210 |
| 8 | Early Mar – early Apr | Mid Nov | 210–240 |
| 9 | Feb – early Mar | Late Nov – Dec | 250–300 |
| 10 | Rare; Jan – Feb | Dec – Jan | 300+ |

Use the **Planting Calendar** in the Tools tab: enter your two frost dates and it lists dates for each crop.

## Cool-season vs warm-season
- **Cool-season** (peas, spinach, lettuce, kale, cabbage family, carrots, beets, potatoes, onions): plant **before** the last frost. Many survive light frost.
- **Warm-season** (tomatoes, peppers, eggplant, beans, corn, squash, cucumbers, melons, sweet potatoes): plant **after** the last frost when soil and nights are warm. One frost kills them.

## Minimum soil temperatures to sprout
| Crop | Soil temperature |
|---|---|
| Peas, spinach, lettuce, radish | 40 °F (4 °C) |
| Carrots, beets, potatoes | 45 °F (7 °C) |
| Corn | 55–60 °F (13–16 °C) |
| Beans, squash, cucumbers | 60–65 °F (16–18 °C) |
| Peppers, melons, sweet potatoes | 65–70 °F (18–21 °C) |

## Timing by weeks (rules of thumb)
- Peas and spinach: 4–6 weeks before last frost
- Potatoes, onions, lettuce, kale: 2–4 weeks before
- Tomatoes: seed indoors 6–8 weeks before last frost; transplant 1–2 weeks after
- Beans, corn, squash, cucumbers: 1–2 weeks after
- **Fall crops:** count back from first frost. Add the days to maturity plus about 2 weeks, because growth slows in fall.
- **Garlic:** plant in fall, about 4–6 weeks before the ground freezes.

Full crop table: [[veg-quick-reference]]. Hardening off: [[seeds-starting]].
