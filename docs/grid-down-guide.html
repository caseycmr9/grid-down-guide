## Eggs
**Farm-fresh, unwashed eggs** have a natural coating (the bloom). They keep about 2–3 weeks on a cool counter and several months in a cool cellar or refrigerator.

> IMPORTANT: In the US, store-bought eggs are washed, which removes the bloom. They need refrigeration. Never wash eggs you plan to store; wipe off dirt only when you use them.

### Test eggs
Put an egg in a bowl of water. Fresh eggs lie on their side. Older eggs stand on end. Eggs that **float** are old; discard them. Crack eggs into a separate bowl before using, and discard any with an off smell or odd color.

### Oiling
Rub clean, dry eggs with food-grade mineral oil. Pack in cartons **pointed end down**. Keeps about 3 months or more cool.

### Water glassing
Mix **1 oz (about 2 Tbsp) of pickling lime** (calcium hydroxide) into 1 quart (1 L) of **boiled and cooled** water. Let it settle, then pour the clear liquid over **clean, unwashed, uncracked** fresh eggs in a clean crock or bucket, covering by 2 inches (5 cm). Keep cool (50–60 °F) and covered. Some people report 6–12 months, but this is not tested by food safety agencies. Use only the freshest eggs. Poke a pinhole in water-glassed eggs before boiling or they crack.

### Freezing
If you have a freezer: beat eggs lightly with a pinch of salt, freeze in small portions.

## Cheese
Hard cheeses (cheddar, Gouda, Parmesan) keep months to a year when **waxed** with cheese wax and stored cool (50–55 °F, 60–80% humidity). Surface mold on hard cheese can be cut off with a 1-inch margin ([[food-safety-basics]]). Soft cheeses spoil in days without cold. See [[dairy-basics]].

## Butter
Salted butter lasts longer. Wash out all buttermilk. Keep cool and covered, in a crock with a little water or a butter bell: weeks to a couple of months. For longer storage, make ghee ([[fats-pemmican]]).

> WARNING: Do not "can" butter or cheese at home. There is no tested safe method.

## Honey
Honey does not spoil: it is low in water and acidic. It may crystallize; warm it gently in a pan of warm water. Keep it sealed from moisture (honey with over 18% water can ferment). **Never give honey to children under 12 months** (infant botulism). See [[bees-honey]].

## Sugar, salt, flour, vinegar, oil
| Food | Storage life |
|---|---|
| White sugar, plain salt | Indefinite if dry (sugar may harden but is fine) |
| Vinegar | Years; slowly loses strength |
| Maple syrup, unopened | Indefinite; opened, refrigerate or keep cool |
| White flour | 1 year; up to 5 sealed with oxygen absorbers |
| Whole-grain flour | 6–12 months (oils go rancid) |
| Cooking oil | 1–2 years; keep cool and dark |
| Ghee, tallow | 6 months to a year or more |
| Powdered milk, opened | 3–6 months |

## Apples and potatoes
Both keep for months in a cool cellar if kept apart ([[root-cellar]]).

See [[bulk-dry-storage]] for grains and beans, and [[pantry-rotation]] to keep a stockpile fresh.

## Do this first
1. **Cook outdoors.** Use a camp stove, grill, or wood fire well away from the house.
2. Keep a bucket of water or sand and a fire extinguisher close.
3. Cook the most perishable food first ([[food-safety-basics]]).

> DANGER: Charcoal grills, gas grills, camp stoves, lanterns, and generators make **carbon monoxide (CO)**, which you cannot see or smell and which kills in minutes to hours. **Never use them inside a house, garage, tent, camper, or vehicle, even with windows or doors open.** Never use a gas oven or range to heat a room. See [[poisoning-overdose]].

## Your options
| Method | Fuel | Good for | Cautions |
|---|---|---|---|
| Canister camp stove | Butane or propane canisters | Boiling water fast | Canisters run out; weak in cold |
| Propane grill | Propane cylinder | Grilling, pots on side burner | Outdoors only, away from walls |
| Liquid-fuel stove | White gas, kerosene | Cold weather, long trips | Use only the correct fuel; flare-ups when priming |
| Charcoal grill | Charcoal | Grilling, Dutch oven | Outdoors only; ash can reignite |
| Wood fire or rocket stove | Sticks, scrap wood | Unlimited if wood is plentiful | Smoke; see [[rocket-stove-build]] |
| Dutch oven | Coals | Baking, stews | See [[dutch-oven-campfire]] |
| Solar oven | Sunlight | Free slow cooking | Needs strong sun; see [[solar-builds]] |
| Wood stove or fireplace | Wood | Heat and cooking together | Chimney must be sound; see [[heating-home]] |
| Canned gel fuel | Alcohol gel | Keeping food warm | Slow; ventilate; never refill while lit |

## Fuel planning
- A common planning figure is about **1 lb (0.45 kg) of propane per day** for a small family doing simple cooking. Track what you really use and stock more.
- One 20 lb propane cylinder contains about 4.7 gallons; it lasts roughly 40 hours on one burner at full flame, and much longer on low.
- Store fuel safely ([[fuel-storage]]). Keep cylinders upright, outdoors, shaded.
- Dry wood and charcoal are fuel too. See [[fire-management]].

## Save fuel
1. Put a **lid** on every pot.
2. Cut food small so it cooks faster.
3. Soak beans and grains first ([[cooking-staples]]).
4. Boil, then turn down to a gentle simmer.
5. Use a **windscreen** and a pot just big enough for the food.
6. Use **thermal cooking**: bring food to a boil, then finish it in an insulated box ([[cooking-staples]]).
7. Cook one big meal and eat it before it spoils.

## Safety checklist
- Set stoves on level, non-flammable ground, clear of tents, eaves, dry grass, and overhanging branches.
- Keep children and pets back. Wear closed shoes and long sleeves; use pot holders.
- **Propane leak check:** brush soapy water on fittings; bubbles mean a leak. Turn off and do not use.
- Never refill a hot stove or lantern.
- Put out coals completely: soak, stir, soak again. Store cooled ashes in a metal container, away from buildings.
- If a grease fire starts, smother with a lid. Never use water ([[fire-safety]]).

Cook to safe temperatures ([[safe-cooking-temps]]).

    body: `
## Cook over coals, not flames
Flames burn the outside and leave the inside raw. **Coals** give steady heat. Build a fire of hardwood, let it burn down to glowing coals (30–45 minutes), then rake some to the side or spread them to cook on. See [[fire-management]].

> WARNING: Only cook outdoors, in the open. Coal fires produce carbon monoxide. Keep water or sand nearby ([[cooking-without-power]]).

## Basic fire cooking
- **Grill or grate:** set a metal grate over coals. Adjust height or coal depth to control heat.
- **Pot or kettle:** hang from a tripod, or set on stones or a grate.
- **Skewers:** use dry hardwood sticks; peel the bark. Never use unknown woods, as some are poisonous.
- **Foil packets:** wrap food in 2–3 layers of heavy foil, folded tightly. Cook on coals 15–30 minutes, turning once. Open carefully; steam burns.
- **Skillet:** the easiest way to fry, bake flatbreads, and cook eggs.

## The Dutch oven
A heavy cast-iron pot with a rimmed lid that holds coals. It bakes, roasts, stews, and fries.

### The briquette rule (about 350 °F / 175 °C)
- Coals **on top**: oven diameter in inches **plus 3**.
- Coals **underneath**: oven diameter **minus 3**.
- Example: a 12-inch oven uses about **15 on top and 9 below**.

Add or remove about 2 coals for a 25 °F change. Use an oven thermometer inside to check. If using wood coals, replace them every 30–45 minutes.

| Cooking type | Coals |
|---|---|
| Baking (bread, cobbler) | Mostly top heat, bottom less |
| Roasting | Equal top and bottom |
| Stewing, simmering | Mostly bottom heat |
| Frying | All bottom, no lid |

### Tips
1. Set the oven on level, protected ground. Put coals on a metal or stone surface, not dry grass.
2. Use a **lid lifter** and heat-proof gloves. Never lift with bare hands.
3. Rotate the oven a quarter turn every 15 minutes in one direction and the lid a third of a turn the other way to avoid hot spots.
4. Dutch oven baking times are about the same as a home oven. Bread: see [[baking-bread]].
5. Lift the lid as little as possible.

## Foods that work well
Stews, beans, biscuits, cornbread, whole chickens, roasts, cobblers, no-knead bread. Cook meat to safe temperatures ([[safe-cooking-temps]]).

## Cast iron care
1. After cooking, scrape and rinse with hot water while still warm. Use a stiff brush or sand if needed. Mild soap is OK; avoid harsh lye soap.
2. **Dry completely** on the heat. Rust forms in minutes on a wet pan.
3. Rub a thin coat of cooking oil or fat over the inside and outside.
4. Store with the lid slightly ajar (or a paper towel inside) so moisture can escape.
5. If it rusts, scour with steel wool or sand, wash, dry, oil lightly, and bake or heat it for an hour until it smokes. Cool, repeat if needed.

## Clean up
Wash dishes with safe water ([[laundry-dishes]]). Keep food scraps and trash away from camp so animals do not come.
`

## Do this first
1. Use a **food thermometer** if you have one. Put the tip in the thickest part, away from bone and fat.
2. Cook to the temperatures below. **Color is not a reliable test.**
3. Wash hands, boards, and knives after touching raw meat.

## Minimum internal temperatures
| Food | Temperature |
|---|---|
| Poultry (chicken, turkey, duck, whole, parts, ground) | **165 °F (74 °C)** |
| Leftovers, casseroles, soups when reheated | **165 °F (74 °C)** |
| Ground beef, pork, lamb, veal, ground game | **160 °F (71 °C)** |
| Rabbit and other small game | **160 °F (71 °C)** (conservative) |
| Bear, wild pig, and other animals that may carry Trichinella | **160 °F (71 °C)**, thoroughly |
| Eggs and egg dishes | **160 °F (71 °C)**; yolks and whites firm |
| Whole beef, pork, lamb, veal, venison steaks and roasts | **145 °F (63 °C)**, then rest 3 minutes |
| Fish and shellfish | **145 °F (63 °C)**; opaque and flakes easily |

Wild game has extra risks: see [[game-meat-safety]].

## Check your thermometer
- Ice water (32 °F / 0 °C) and boiling water (212 °F / 100 °C at sea level) should read correctly. At altitude, water boils about 1 °F lower for every 500 ft.

## No thermometer?
These clues are less reliable. When unsure, cook it longer or cut food into small pieces.
- **Poultry:** cut the thickest part; no pink; juices run clear; leg moves freely.
- **Ground meat:** no pink inside and juices clear. (Browning can happen before it is safe.)
- **Pork and game:** firm, no pink or bloody juice.
- **Fish:** flakes with a fork, opaque all the way through.
- **Eggs:** firm whites and yolks.
- **Safest method:** stew, boil, or fry meat in small pieces until well done.

## Keep hot food hot, cold food cold
- Hold hot food at **140 °F (60 °C)** or above.
- Cool leftovers within **2 hours** (1 hour if above 90 °F) in shallow containers. Reheat to 165 °F.
- Without refrigeration, **cook only what will be eaten that day**. Cooked rice and pasta left out can grow bacteria that make toxins heat will not destroy.
- See [[food-safety-basics]].

## Foods that must be cooked right
> WARNING: **Red kidney beans** (and white kidney beans) contain a toxin that causes severe vomiting and diarrhea. Soak at least 5 hours, **pour off the water**, and boil hard for **at least 10 minutes**. Slow cooking at low heat does not destroy the toxin. Canned beans are already safe.

- **Other beans:** soak, discard the water, and boil until soft ([[cooking-staples]]).
- **Lima beans and bitter cassava:** can contain cyanide-forming compounds. Peel cassava; boil in plenty of water and discard it. Never eat raw.
- **Raw sprouts** can carry bacteria. Cook them for children, older adults, pregnant women, and sick people.
- **Raw milk and eggs:** can carry bacteria. Pasteurize milk ([[dairy-basics]]); cook eggs through.
- **Do not wash raw poultry.** It splashes bacteria; just cook it thoroughly.

## Cross-contamination
Keep raw meat, juices, and utensils away from foods that will not be cooked. Use separate boards, or wash well with hot soapy water and sanitize with 1 tablespoon of unscented bleach per gallon of water ([[laundry-dishes]]).

## Cooking for the sick
Cook everything fully. Wash hands before and after. See [[home-nursing]] and [[disease-prevention]].
`

## How many calories?
Calories are fuel. Too few and people grow weak, cold, slow, and sick. Plan for at least **2,000 calories per adult per day**. Hard physical work (chopping wood, hauling water, farming by hand) can need **3,000–4,000 or more**.

| Person | Calories per day (approx.) |
|---|---|
| Toddler (1–3 years) | 1,000–1,400 |
| Child (4–8) | 1,400–1,800 |
| Teen girl | 2,000–2,400 |
| Teen boy | 2,400–3,200 |
| Adult woman | 1,800–2,200 |
| Adult man | 2,200–2,800 |
| Heavy labor | 3,000–4,000+ |
| Pregnant (later months) | add about 340–450 |
| Breastfeeding | add about 330–500 |
| Cold weather | more, as the body burns fuel to stay warm |

About 1,200–1,500 calories is a short-term emergency minimum, not a plan. Children, pregnant women, and nursing mothers should not be cut back.

## Building blocks
- **Carbohydrates** (rice, grains, potatoes, beans): the main energy source, 4 calories per gram.
- **Fat** (oil, lard, nuts, butter): 9 calories per gram. Essential. See [[fats-pemmican]].
- **Protein** (beans, meat, eggs, dairy, fish): builds and repairs the body. Most adults need about 0.8 g per kg of body weight daily (roughly 50–60 g); more for heavy labor and healing. Beans plus grains over a day supply complete protein.
- **Water** matters most ([[water-needs]]). **Salt:** adults need about 1,500–2,300 mg of sodium daily; sweating heavily needs more ([[dehydration-ors]]).

## Deficiency diseases and fixes
A diet of only white rice, corn, or flour slowly causes deficiencies.

| Disease | Missing | Signs | Fix |
|---|---|---|---|
| **Scurvy** | Vitamin C | Tired, bleeding gums, bruising, slow-healing wounds, joint pain (after 1–3 months with almost none) | Sauerkraut, potatoes, cabbage, peppers, citrus, sprouts, rose hips ([[wild-berries-fruit]]), pine needle tea ([[trees-inner-bark]]) |
| **Beriberi** | Thiamine (B1) | Numb feet, weakness, swelling, heart trouble | Beans, whole grains, seeds, pork, not just polished rice |
| **Pellagra** | Niacin (B3) | Sun-sensitive rash, diarrhea, confusion | Treat corn with alkali ([[making-staples]]), eat meat, beans, whole grains |
| **Rickets, weak bones** | Vitamin D, calcium | Bone pain, bowed legs in children | Sunlight on skin, eggs, fatty fish, liver; dairy, greens, small bony fish |
| **Anemia** | Iron | Pale, weak, short of breath | Red meat, liver, beans, dark greens; cast-iron cooking; vitamin C with meals |
| **Goiter** | Iodine | Swelling at the front of the neck | Iodized salt, seafood, seaweed |
| **Night blindness** | Vitamin A | Poor vision in dim light | Liver, eggs, carrots, squash, sweet potato, dark greens |

> WARNING: Do not eat the liver of polar bears or seals (toxic vitamin A levels), and do not megadose vitamin A.

## Stock vitamins
A basic multivitamin for each person, extra vitamin C and D, and children's chewables are cheap insurance. Potency fades with time, but they remain useful. Pregnant women need prenatal vitamins ([[womens-health]]).

## Feeding children and babies
Children need regular meals with fat and protein. Infants need breastmilk or formula, **not** cow's milk or honey before 12 months ([[babies-kids]]).

## Keep variety and appetite
Monotonous food causes "appetite fatigue," and people eat too little. Stock **salt, pepper, spices, dried herbs, bouillon, vinegar, onions, garlic, hot sauce, and sugar**. Sprout seeds for fresh food ([[season-extension]]). Grow a garden ([[garden-planning]]).

## Signs of not eating enough
Weight loss, weakness, feeling cold, slow healing, irritability, hair loss, and in children, stopped growth. If people are very underfed, increase food gradually and seek medical care when possible.

See [[stretching-food]] for rationing and [[home-stockpile]] for quantities.

## Water and time (1 cup dry)
| Food | Water | Cook time | Makes |
|---|---|---|---|
| White rice | 2 cups | 15–18 min, covered, then rest 10 min | About 3 cups |
| Brown rice | 2¼–2½ cups | 40–45 min | About 3 cups |
| Dry beans (soaked) | 3 cups | 1–2 hours, longer if old | 2–2½ cups |
| Brown or green lentils | 2½ cups | 25–30 min | About 2¼ cups |
| Red lentils | 2 cups | 15–20 min | About 2 cups |
| Split peas | 3 cups | 45–60 min | About 2¼ cups |
| Rolled oats | 2 cups | 5 min | About 2 cups |
| Steel-cut oats | 3–4 cups | 20–30 min | About 2½ cups |
| Cornmeal (polenta, mush) | 4 cups | 30–40 min, stirring | About 4 cups |
| Wheat berries (soaked) | 3 cups | 50–60 min | 2½–3 cups |
| Pearl barley | 3 cups | 35–45 min | About 3½ cups |
| Pasta | Plenty of boiling water | 8–12 min | About double |

## Rice
Rinse, add to boiling water (or start in cold water), cover, and cook on low heat. **Do not lift the lid.** Rest off heat 10 minutes to finish steaming.

## Beans
1. **Sort** out stones and bad beans. Rinse.
2. **Soak** 8 hours (or overnight) in about 3 times as much water. Quick soak: boil 2 minutes, cover, stand 1 hour.
3. **Drain and use fresh water.**
4. Boil hard 10 minutes, then simmer until soft. Old beans can take 3 hours or more. A pinch of baking soda helps with hard water or old beans.
5. Add salt any time. Add acids (tomato, vinegar) near the end, as they slow softening.

> WARNING: Red and white kidney beans must be boiled hard for at least 10 minutes ([[safe-cooking-temps]]).

## Grains and porridge
- **Oats and cornmeal:** stir into boiling water to avoid lumps.
- **Wheat berries and barley:** soak overnight to save fuel.
- **Mix grains and beans** (rice and beans) for better nutrition ([[nutrition-basics]]).

## Save fuel: thermal (haybox) cooking
1. Bring food and water to a boil in a pot with a tight lid. Rice: 5 minutes; beans or grains: 10–15 minutes.
2. Put the hot pot straight into a **tightly packed insulated box** (wood or cardboard box lined and stuffed with blankets, hay, towels, or foam), with no gaps. Close it.
3. Leave 2–4 hours (rice, oats) or 4–8 hours (beans, whole grains).
4. Food must still be **hot (above 140 °F / 60 °C)**. If not, bring it back to a boil before eating ([[food-safety-basics]]).

## Pressure cooker
It cuts times to about a quarter and saves fuel. Soaked beans take about 8–12 minutes; unsoaked about 25–40. Fill **no more than half full** for beans and grains, which foam and can clog the vent. Follow the maker's manual. Let pressure drop naturally for beans.

## At altitude
Above about 3,000 ft (900 m), water boils at a lower temperature, so beans, rice, and grains take noticeably longer and need extra water. A pressure cooker or longer soaking solves this.

## Make staples taste good
Cook with onions and garlic, a bit of fat, salt, and herbs. Cook beans with a ham bone or scraps. Make big pots of soup and stew. See [[stretching-food]], [[baking-bread]], and [[bulk-dry-storage]].
`

## Sourdough starter (wild yeast)
A starter is flour and water that catches wild yeast from the air and flour. It replaces store-bought yeast and keeps going as long as you feed it.

1. **Day 1:** mix ½ cup (60 g) flour and ¼ cup (60 mL) chlorine-free water (boil and cool tap water) in a glass jar. Whole wheat or rye starts fastest. Cover loosely. Keep at 70–80 °F (21–27 °C).
2. **Day 2:** leave it, or stir.
3. **Days 3–7:** each day, throw out half and add ½ cup flour and ¼ cup water. Stir.
4. **Ready** when it bubbles, doubles within 4–8 hours of feeding, and smells pleasantly sour (usually 5–10 days).
5. **Keep it:** feed daily at room temperature, or feed weekly if kept cool (in a cellar or fridge). To save a backup, spread starter thin, dry it, and store the flakes in a jar.

> WARNING: Pink or orange streaks or fuzzy mold mean discard the starter and begin again. A dark liquid on top ("hooch") is harmless; stir it in or pour it off.

## Basic sourdough loaf
- 4 cups (500 g) flour, 1½ cups (350 mL) water, ½ cup (100 g) active starter, 2 tsp (10 g) salt.
1. Mix everything; rest 30 minutes.
2. Fold the dough over itself a few times, every 30 minutes, for 2 hours.
3. Let rise 4–8 hours (warm: shorter), until puffy and about doubled.
4. Shape, rest 1–2 hours.
5. Bake in a **covered pot** (Dutch oven, [[dutch-oven-campfire]]) at 450 °F (230 °C) for 30 minutes covered, 10–15 uncovered, until golden, the loaf sounds hollow, or it reaches about 205 °F (96 °C) inside.

## Baking powder and soda substitutes
- 1 tsp baking powder = **¼ tsp baking soda + ½ tsp cream of tartar**.
- Or ¼ tsp baking soda + ½ cup buttermilk or yogurt (replace ½ cup of the recipe's liquid).
- Or ¼ tsp baking soda + ½ tsp vinegar or lemon juice.
- Stock extra **instant yeast** in the freezer; it lasts years.

## Flatbreads (no oven needed)
**Chapati or roti:** 2 cups whole wheat flour, ½ tsp salt, about ¾ cup warm water, 1 Tbsp oil. Knead 5–8 minutes, rest 30 minutes, divide in 8, roll thin. Cook on a hot dry pan until bubbles form, flip; about 1 minute each side.

**Flour tortillas:** 2 cups flour, 1 tsp baking powder, ½ tsp salt, 3 Tbsp lard or oil, ¾ cup warm water. Knead, rest, roll thin, cook on a hot dry pan 30–60 seconds a side.

**Bannock:** 2 cups flour, 1 Tbsp baking powder, ½ tsp salt, 2 Tbsp fat, about ¾ cup water. Pat 1 inch (2.5 cm) thick and cook in a greased pan on low heat, 10 minutes each side, or wrap around a stick over coals.

**Johnnycake or hoe cake:** 1 cup cornmeal, ½ tsp salt, 1 Tbsp fat, about ¾ cup boiling water. Spoon into a greased pan; fry 3–4 minutes a side.

## Hardtack (long-lasting biscuit)
Mix 2 cups flour, about ¾ cup water, and 1 tsp salt into a stiff dough. Roll ½ inch (1.2 cm) thick, cut 3-inch (7.5 cm) squares, poke holes. Bake at 375 °F (190 °C) for 30 minutes per side, then dry in the cooling oven. Stored completely dry and airtight it keeps for months or years.

> WARNING: It is very hard. Soak it in soup, coffee, or water before eating to protect your teeth.

## Grinding grain
Whole grain flour goes rancid in months ([[bulk-dry-storage]]), so grind as needed. A hand mill, mortar and pestle, or two stones work but take effort. Sift to remove coarse bran for lighter bread. See [[growing-grains]].

## Ovens
Use a Dutch oven, a skillet with a lid, or a clay oven ([[earth-building]]). Cook with care and safe fuel ([[cooking-without-power]]). See also [[making-staples]].
`

## Rationing principles
1. **Count calories, not bulk.** Protect your supply of calorie-dense foods (rice, beans, oil, oats, flour).
2. **Eat perishables first** ([[power-outage-basics]]), then freezer, then pantry.
3. **Do not ration water.** Drink what you need ([[water-needs]]).
4. **Eat small meals regularly.** Two or three modest meals beat skipping a whole day.
5. **Priority for calories:** children, pregnant and nursing women, the sick and injured, and people doing hard physical work. Adults who must conserve food should cut first.
6. **Rest and stay warm.** Cold and effort burn calories.
7. Try not to drop below about 1,200 calories per adult for more than a few days.
8. Weigh people weekly if you can. Rapid weight loss means the ration is too small.

## Pantry meals that stretch
| Recipe (serves 4) | Dry ingredients | Calories per serving (approx.) |
|---|---|---|
| Rice and beans | 1½ cups rice, 1 cup dry beans, 3 Tbsp oil, onion, salt | 500 |
| Lentil soup | 1½ cups lentils, 2 Tbsp oil, onion, salt, 8 cups water | 300 |
| Oatmeal porridge (1 serving) | 1 cup rolled oats, 1 Tbsp sugar or honey, 1 tsp fat | 400 |
| Cornmeal mush (1 serving) | ½ cup cornmeal, 1 Tbsp fat, salt | 340 |
| Potato and bean stew | 2 lb potatoes, 1 cup dry beans, 2 Tbsp oil, salt | 400 |

See [[cooking-staples]] for how to cook them, and [[baking-bread]] for flatbreads.

## A bare-bones day (about 1,900 calories)
- ¾ cup dry rolled oats with 1 Tbsp honey or sugar
- 1 cup dry rice and ½ cup dry beans, cooked together
- ½ cup flour or cornmeal as bread or mush
- 3 Tbsp oil or fat across the meals
- Salt, any vegetables or greens, and a multivitamin ([[nutrition-basics]])

It is monotonous but works. Add onions, garlic, spices, and foraged or garden greens.

## Making more from less
- **Fat is calories.** One tablespoon of oil is about 120 calories. Save every drip ([[fats-pemmican]]).
- **Bone broth:** break bones, cover with water and a spoonful of vinegar, and simmer 4–8 hours (poultry) or 12–24 hours (beef). It adds flavor, gelatin, and some minerals, but few calories by itself.
- **Bulk with cheap foods:** potatoes, turnips, cabbage, squash, and wild greens ([[safe-wild-greens]]).
- Use a little meat to flavor a lot of beans or grain.
- **Cook once, eat well:** big pots waste less fuel.
- Grow food as soon as you can ([[garden-planning]]).

## Hunger
Hunger comes in waves and often eases after the first few days. It brings irritability, trouble thinking, and feeling cold. Sip warm water or broth, rest, stay occupied, and keep to a routine. Do not trade away your children's food.

## Famine foods
When supplies fail: acorns ([[wild-nuts-seeds]]), inner bark and needle tea ([[trees-inner-bark]]), small animals and insects ([[alternative-protein]]), and wild plants.

> WARNING: Famine foods can be poisonous or need special preparation. Follow [[foraging-safety-rules]]. A food you are not sure about is not worth the risk.
`

## Salt
You need salt to live and to preserve food. Plan to store at least **5–10 lb (2–4.5 kg) per person per year** for eating, plus far more for curing meat and fermenting ([[smoking-curing-salting]]).

### Salt from seawater
Seawater is about 3.5% salt: **1 gallon (3.8 L) makes about 4–5 oz (115–135 g)**.
1. Collect from **clean, open water** away from harbors, sewage, and river mouths. Do not drink it.
2. Strain through cloth. Let it settle overnight.
3. Boil in a stainless steel, enamel, or glass pot (not aluminum or iron). A white crust (calcium) forms first; skim it off.
4. As it thickens to a slurry, lower the heat and stir. Pour off the leftover bitter liquid.
5. Dry the crystals on a tray in a low oven or the sun.

Boiling takes lots of fuel; **solar evaporation** in shallow trays works in hot, dry weather. Inland, look for salt springs and licks. Sea salt has no added iodine ([[nutrition-basics]]).

## Sugar and syrup
- **Honey:** the best source ([[bees-honey]]).
- **Maple syrup:** sugar maple sap is about 2% sugar, so **about 40 gallons of sap make 1 gallon of syrup**. Sap runs in late winter when nights drop below freezing and days rise above. Drill a ⅜-inch (1 cm) hole 2 inches (5 cm) deep, slightly upward, and fit a spile (tube) and bucket. Keep sap cold and boil it within a few days, **outdoors** (it makes lots of steam). It is syrup at **7 °F (4 °C) above the boiling point of plain water** (219 °F at sea level; measure your water's boil first). Filter through cloth and store hot-sealed in jars.
- **Birch syrup:** needs about 100 gallons of sap per gallon of syrup, with a strong, distinct flavor.
- **Sorghum:** crush the cane, boil the juice to syrup.
- **Sugar beets:** slice, boil, press, and boil the juice down for a dark syrup.

## Hominy and masa (corn that gives you niacin)
Corn eaten as the main food without alkali treatment causes pellagra ([[nutrition-basics]]).
1. Use dried **field corn** (not sweet corn): about 2 lb (900 g).
2. Cover with water by 2 inches and stir in about **2 Tbsp pickling lime** (calcium hydroxide) in a stainless steel or enamel pot (never aluminum).
3. Simmer 30–60 minutes, then steep 8–12 hours.
4. Rub off skins and **rinse many times** until the water runs clear.
5. Boil as hominy, or grind wet into masa for tortillas.

> DANGER: Lime and lye burn skin and eyes. Wear gloves and eye protection. Rinse the corn thoroughly.

A traditional alternative uses lye water from **clean hardwood ash only** (never from treated wood or trash). Strength varies; the corn skins should slip off easily. See [[home-industries]].

## Potato starch (thickener)
Grate raw potatoes into cold water, squeeze through cloth, let the milky water settle 30 minutes, pour off the water, rinse the white starch with fresh water, settle again, then dry in the sun or a low oven. Use about 1 Tbsp per cup of liquid to thicken sauces.

## Other staples
- **Vinegar:** see [[fermenting-pickling]].
- **Yeast and baking substitutes:** sourdough and baking powder substitutes are in [[baking-bread]].
- **Butter:** shake or churn cream ([[dairy-basics]]).
- **Oil:** rendering animal fat ([[fats-pemmican]]) is the easiest. Pressing seed oil needs a press and gives small amounts. Nut oils can be skimmed from boiled crushed nuts ([[wild-nuts-seeds]]).
- **Coffee substitute:** scrub and dice chicory or dandelion root, roast at 350 °F (175 °C) until dark brown (30–60 minutes), grind, and use 1–2 Tbsp per cup. Roasted barley, rye, or leached acorns also work.
- **Tea substitutes:** mint, lemon balm, raspberry leaf, rose hips ([[herb-garden]], [[trees-inner-bark]]).
- **Cattail and other starches:** [[wild-roots-tubers]].
- **Soap and cleaning:** [[soap-candles]].
`

## Be realistic first
Hunting is unreliable and burns calories. A full day of walking may produce nothing. A squirrel or rabbit gives a few hundred calories. A deer gives weeks of meat, but only if you can butcher and preserve it before it spoils.

Treat hunting as a bonus alongside gardening, trapping ([[snares-traps]]), and fishing ([[fishing-basics]]). Do not plan to survive on it alone.

## Laws and safety
In normal times you need a license, must follow seasons and bag limits, and must use legal methods. Most states require a hunter-education course. Take one now. In a long crisis, laws may go unenforced, but you still share the woods with neighbors, livestock, and other hunters.

> DANGER: Never shoot at a sound, a color, or a movement. Positively identify the animal, and know what is beyond it. Most hunting shootings happen because someone was mistaken for game. See [[firearm-safety]].

> WARNING: Falls from tree stands are a leading cause of serious hunting injuries. Wear a full-body harness and stay clipped in from the ground to the stand and back.

- Tell someone where you are going and when you will be back.
- Wear blaze orange during hunting seasons, even if you hunt alone.
- Carry a knife, cord, game bags or clean cloth, water, light, first aid kit, and a tourniquet ([[severe-bleeding]]).

## Scouting: read the sign
Spend time looking before you spend time waiting. Look for:

- **Tracks** in mud, snow, and sand. Fresh tracks have sharp edges.
- **Droppings (scat).** Dark, moist, and soft means fresh.
- **Trails.** Narrow, worn paths between food, water, and bedding. Narrow spots ("funnels") are the best places to wait.
- **Feeding sign.** Chewed nut shells, stripped pine cones, torn bark, and browsed twigs. Deer have no upper front teeth, so they leave ragged tears. Rabbits cut twigs cleanly at a slant.
- **Bedding areas.** Flattened grass or leaves in sheltered spots.
- **Water.** Most animals drink at dawn and dusk.

## Wind, scent, and sound
Animals smell far better than you do. Keep the wind in your face or blowing across you. Test the wind with a pinch of dust, a bit of fluff, or a wet finger.

Move slowly. Take a few steps, then stop and look for a minute or two. Place your foot softly, outer edge first. Break up your outline against trees and sit with your back to a trunk.

## Best times
- Dawn and dusk are best for most animals.
- Midday, many animals bed down in cover.
- In hot weather, watch shade and water. In cold weather, watch sunny south-facing slopes.
- Game moves before a storm and just after one.

## Stand or stalk
**Waiting (stand hunting)** means sitting still downwind of a trail, feeding area, or water for hours. It is the easiest method for beginners and burns fewer calories.

**Stalking** means moving slowly through cover. It takes skill and rarely works for a beginner.

## The shot
Only take a shot that you are sure will kill cleanly. That means within the range you have practiced, with the animal still, broadside or slightly angled away.

1. Aim for the heart-lung area, just behind the front shoulder and about one-third of the way up from the belly.
2. Do not shoot at running animals, head-on animals, steep angles, or through brush.
3. For squirrels and rabbits, aim for the head or upper chest.
4. After the shot, stay quiet. Note where the animal stood and which way it ran.

## Tracking a wounded animal
1. Mark where the animal was standing and where you find the first blood.
2. Wait at least 30 minutes after a heart or lung hit. After a gut hit (stomach contents, greenish smell, dark thin blood), wait 4 to 6 hours.
3. Follow the blood trail with two people if you can. Mark each drop with a strip of cloth.
4. Bright red, frothy blood means a lung hit. Dark red means liver or muscle. Watery blood with stomach contents means a gut hit.
5. Approach the animal from behind. Touch its eye with a stick. If it blinks, wait and make a second clean shot.

## After the kill
Meat can spoil in a few hours in warm weather. Field dress right away ([[field-dressing-big-game]] or [[small-game-processing]]). Wear gloves, and read [[game-meat-safety]] before you eat what you take.
`

## Why trap
Traps work while you do other things. One person can run ten traps and take more animals than they could hunt in the same time. Traps are the best food-getting tool for most survival situations.

> NOTE: In normal times, trapping and snaring are tightly regulated, and snares are banned in many places. Use these methods in a true emergency or where the law allows. Learn your local rules now.

## Find the right place
Animals use the same paths every day. Look for:
- narrow trails through brush, grass, or snow
- tracks, droppings, and chewed plants along the trail
- gaps in fences, logs, and walls
- places where animals must pass: stream banks, log crossings, holes in thickets

Set traps on the trail, in a gap the animal will use. Do not set them where people, children, or pets walk.

## Snares
A snare is a loop of wire or strong cord that tightens when the animal pushes through it.

1. Use thin wire or strong cord that slides freely (brass or steel snare wire works best). A slide, or noose knot, must slide only one way.
2. For a rabbit, make the loop about 3 to 4 in (8 to 10 cm) wide. Hold the bottom edge about 3 to 4 in (8 to 10 cm) off the ground.
3. For a squirrel, set the loop on a leaning pole or log they climb.
4. Fix the snare end to a stake, root, or sapling, or use a drag (a heavy stick the animal pulls).
5. Hold the loop open with a twig or by pinching it into the brush so it sits in the animal's path.
6. Clear loose twigs inside the loop. Do not disturb the nearby vegetation more than you must.

A **locking** snare holds the animal in place after it tightens. A **non-locking** snare loosens if the animal stops pulling, which can release it. Match the snare to the animal and your goal.

## Deadfalls
A deadfall drops a heavy log or flat rock on an animal that disturbs a trigger. The classic trigger is the figure-4, three notched sticks that interlock under the weight. The notches must be cut precisely, so practice at home with a small weight before you depend on it.

> DANGER: A deadfall can crush your hand or arm while you set it. Set it from the side and keep your body out from under the weight. Do not leave one where people or pets might trigger it.

## Cage and box traps
Wire live-catch traps are safe to handle and let you release animals you do not want. Bait with apple, peanut butter, or greens. Place them in shade on trails or near burrows. Check them often.

## Fish traps
A funnel trap lets fish in but not out.
1. Cut a 2 L plastic bottle in half. Turn the top half upside down and slide it into the bottom half like a funnel.
2. Pin or tape the halves together. Poke small holes in the bottom for water to drain.
3. Put bait inside (bread, meat scraps, fish guts).
4. Place the trap in slow water or at the edge of current with the mouth facing upstream. Weigh it down with a rock.

Woven willow or wire-mesh funnel traps work the same way on a larger scale. See [[fishing-basics]].

## Running a trap line
1. Set 5 to 10 traps in a loop that you can walk in a short time.
2. Check traps at least once a day, morning is best. Leaving an animal to suffer is cruel and spoils the meat. Many laws require checks every 24 hours.
3. Dispatch trapped animals quickly. A sharp blow to the back of the skull kills small mammals fast.
4. Use gloves. A trapped animal can bite and carry disease ([[game-meat-safety]]).
5. Reset or move traps that catch nothing in a few days.

## Cautions
- Raccoons, foxes, and skunks can carry rabies. Do not handle a snared animal that is acting strangely. Treat bites at once ([[bites-stings]]).
- Do not set traps near water you drink from.

## Do this first
Cool the meat fast. Meat spoils quickly when the body is warm. Field dress the animal within an hour of death. Wear gloves. Work with sharp tools.

> DANGER: Do not cut toward your hands or body. Blood makes handles slippery. A bad cut with no help nearby can kill you. Keep your knife sharp ([[sharpening-tools]]).

## What you need
- Sharp knife with a 3 to 4 in (8 to 10 cm) blade
- Disposable gloves (and a pair of longer ones if you have them)
- Rope or cord
- Clean cloth or paper towels
- Game bags or cheesecloth
- Clean water, if you have it

## Check for disease first
Look at the animal. Do not eat it if it is very thin, has pus, lumps, cysts, or a strong foul smell. In areas with chronic wasting disease (CWD) in deer, elk, or moose, do not eat an animal that looked sick, and avoid cutting through the spine or brain. See [[game-meat-safety]].

## Field dressing a deer
1. Roll the deer on its back with the head uphill. Prop it with rocks or logs.
2. Cut around the anus and free the lower intestine so it can pull out with the guts. A bladder full of urine must not be cut. On a male, cut away the genitals without cutting the tube that carries urine.
3. Starting at the pelvis, pinch the belly skin and lift it away from the guts. Cut a shallow slit just through the skin and belly wall. Use two fingers inside the cut to keep the guts away from the blade, with the blade edge facing up and out.
4. Extend the cut from the pelvis to the bottom of the breastbone.
5. Reach in and cut the thin muscle (the diaphragm) that separates the belly from the chest along the ribs.
6. Reach high into the chest and cut the windpipe and food pipe as far up as you can.
7. Pull everything down and out, cutting any attachments. Roll the animal to one side to drain.
8. Save the heart and liver in a clean bag. The liver should be smooth, dark red-brown. If it has white or yellow spots, cysts, or abscesses, throw it away.
9. If guts leaked into the body cavity, wipe away the contamination right away with clean cloth. Rinse only if you can dry the cavity afterward.
10. Prop the chest open with a clean stick so the body cools.

## Cool the meat
- Meat must cool to **40 °F (4 °C) or below** as fast as possible.
- If it is above 40 °F outside, do not leave the carcass in the sun. Skin and quarter it right away, put the meat in clean bags, and cool it in a stream (inside waterproof bags) or in ice.
- In freezing weather, hang the carcass overnight. Do not let it freeze and thaw repeatedly.
- Keep flies off with cheesecloth bags.

## Skinning and quartering
1. Hang the deer by the back legs, with a stick through the tendons above the hocks.
2. Cut the skin around each leg at the knee, slit down the inside of the legs, and pull the hide down with your fist. Use the knife only to cut thin tissue so the hair stays off the meat.
3. Remove the front legs (they are not attached by bone) by cutting between the shoulder blade and the ribs.
4. Cut the hind legs off at the hip joint.
5. Remove the **backstraps** (the long muscles along the spine) and the **tenderloins** (inside the body cavity along the spine).
6. Cut the neck, rib, and trim meat off the bones.
7. Trim away the fat, tough silver membranes, bloody areas, and hair. Fat gives game its strong taste but is a calorie source ([[fats-pemmican]]).

A 150 lb (68 kg) deer yields roughly 50 lb (23 kg) of boneless meat.

## Aging
If you can keep the meat at 34 to 40 °F (1 to 4 °C), hanging for 3 to 7 days improves tenderness. If you cannot hold that temperature, do not age. Cut, cook, or preserve the meat right away ([[smoking-curing-salting]], [[drying-dehydrating]]).

## Moving a deer
Drag it head first (the hair lies smooth) with a rope around the neck or antlers, or use a sled or poles. Take breaks. Work as a team if you can.

## Clean up
- Bury or scatter the gut pile away from water and from your camp. Predators will come.
- Wash your hands, knife, and surfaces with soap and hot water. For tools, a sanitizing rinse of 1 tablespoon bleach per gallon of water works ([[laundry-dishes]]).

## Other large game
- **Elk and moose:** same steps, but they are far heavier. Quarter the animal in the field and carry the pieces out.
- **Bear and wild hog:** cook to at least 160 °F (71 °C). Both carry trichinella ([[game-meat-safety]]).
- **Feral hogs:** wear eye protection and gloves. They can carry brucellosis.

1. Cut off the feet at the first joint with strong shears or a knife.

9. Rinse the carcass in cool, clean water and chill it.

1. Cut across the back at the middle through the skin only.

    body: `
## Why fish
Fish are often easier to catch than game, and many lakes and streams hold enough to feed a family. Lean fish are protein-rich but low in calories. Choose oily fish when you can, and pair fish with starches and fats ([[nutrition-basics]]).

## Where fish are
- Near **structure**: logs, rocks, docks, weeds, undercut banks, drop-offs.
- At **current breaks**: behind rocks, at the edge where fast water meets slow water, and in eddies.
- Under **shade** in hot weather. In cold weather, they gather in deeper pools.
- At dawn, dusk, and after rain they feed more.

## Bait
Worms, grubs, grasshoppers, crickets, small minnows, fish guts, bread dough, corn, cheese, and meat scraps all work. Shiny or moving things also attract fish. Use what is local and fresh.

## Improvised hooks and line
- **Hooks:** safety pins, needles heated and bent (they may break), bent wire, thorns, fish bones, or a pop-tab with a sharpened end.
- **Gorge hook:** a short sliver of bone or wood sharpened at both ends and tied in the middle. Hide it in bait. When a fish swallows it, the sliver turns sideways and holds.
- **Line:** fishing line, thin cord, dental floss, unraveled strands from paracord, or fine thread.
- **Weights:** pebbles, small bolts, or a nut. A floating stick or cork works as a bobber.

## Rod-free methods
### Handline
Wind line on a stick or bottle. Hold the line with your finger and feel for bites. Pull hand over hand.

### Trotline
A long main line anchored at each end with many short lines, each with a baited hook, hanging from it. Check it often. It can be illegal in normal times.

### Jug or limb lines
A floating jug with a baited line and hook, or a baited line tied to an overhanging branch. Set at dusk and check at dawn.

### Spear
Sharpen a straight pole to a point or make a fork with two or three barbed tines. Wait still in shallow, clear water and stab at the fish from above. Water bends the image, so aim a little lower than where the fish appears.

### Nets
- A **gill net** snags fish by the gills as they swim through. Check every few hours.
- A **cast net** is thrown by hand and needs practice.
- A sheet, mosquito net, or wire screen can scoop minnows.
- A **funnel trap** works while you sleep ([[snares-traps]]).

> NOTE: Netting and some methods are illegal in normal times. Know your local laws.

## Ice fishing
Cut a hole through the ice with an auger or chisel and fish with a short line. A flag or "tip-up" shows a bite.

> DANGER: Never trust ice you have not tested. As a guide for **clear blue ice**: 4 in (10 cm) will hold one person on foot, 5 to 7 in (13 to 18 cm) holds a snowmobile or ATV, and 8 to 12 in (20 to 30 cm) holds a small car. White or slushy ice is about half as strong. Currents and springs make thin spots. Never go alone. Carry ice picks.

## Removing a hook
If a hook sticks in skin:
1. Push the hook through until the barb is out and cut it off with clippers, then back it out. Or:
2. If it is shallow, press down on the shank, loop a string around the bend, and pull sharply along the line of the shank.
3. Clean the wound and watch for infection ([[wound-care]]). If the hook is in the eye, go to a doctor.

## After you catch fish
Keep them alive on a stringer or in a bucket, or kill and cool them right away. See [[fish-cleaning-cooking]].
`

## Do this first
Fish spoil faster than meat. Gut them quickly. Keep them cool, and cook or preserve them the same day. Do not leave fish in the sun for more than 2 hours.

- **Scaling:** scrape from tail to head with the back of a knife. Do this before you gut or fillet.

Cook fish to an internal temperature of **145 °F (63 °C)**, or until the flesh is opaque and flakes easily with a fork.
- Grill whole fish on a stick or a green-wood grate.
- Wrap in foil or leaves and bake on coals.
- Boil in a soup. This is the best way to catch all the nutrition.
- Fry in a pan with fat.

## Preserve extra fish
- **Dry or smoke** thin strips or fillets over a low fire ([[smoking-curing-salting]], [[drying-dehydrating]]).
- **Salt** heavily for long storage.
- Keep fish cold and do not hold cooked fish more than 2 hours at room temperature ([[food-safety-basics]]).

## Parasites
Many wild freshwater fish carry parasites such as tapeworms and flukes. Cooking to 145 °F (63 °C) kills them. Do not eat raw wild fish. Freezing at -4 °F (-20 °C) for 7 days also kills parasites, but a home freezer rarely gets that cold.

## Toxic fish and shellfish
> DANGER: Some fish toxins are not destroyed by cooking, smoking, or freezing.

- **Ciguatera:** found in large tropical reef fish such as barracuda, grouper, snapper, and moray eel. Symptoms include vomiting, diarrhea, tingling, and a reversal of hot and cold sensations, starting 1 to 24 hours after eating. Do not eat large reef predators.
- **Scombroid (histamine) poisoning:** from tuna, mackerel, mahi-mahi, bluefish, sardines, and anchovies that were not kept cold. Symptoms: flushing, headache, rash, a peppery taste. An antihistamine helps. Get help if breathing is hard ([[allergic-reaction]]).
- **Pufferfish:** deadly poison. There is no antidote. Never eat them.
- **Shellfish (mussels, clams, oysters):** can concentrate red tide toxins that cooking does not destroy. Do not eat shellfish from water that is discolored, has dead fish or birds, or is under a local closure. The old "months with R" rule is not reliable. See [[coastal-desert-foods]].
- Cook shellfish until the shells open. Throw away any that do not open.

## Polluted waters
Do not eat fish from visibly polluted water. Large predatory fish (pike, large bass, walleye, big lake trout) can hold mercury. Pregnant people and children should eat them rarely.

## Fish liver and eggs
Avoid the liver, eggs, and guts of fish you do not know well. Some fish organs are toxic.

## Do this first
1. Only eat animals that looked healthy and acted normally.
2. Wear gloves when you skin and gut.
3. Cool the meat to 40 °F (4 °C) or below fast.
4. Cook thoroughly to the temperatures below.

## Cooking temperatures for game
Use a thermometer if you can. Color is not a reliable guide.

| Meat | Cook to |
|---|---|
| Ground game meat | 160 °F (71 °C) |
| Steaks and roasts from deer, elk, and moose | 145 °F (63 °C), then rest 3 minutes |
| Bear and wild hog (feral swine) | At least 160 °F (71 °C) |
| Rabbit, squirrel, and other small game | 165 °F (74 °C) |
| Game birds | 165 °F (74 °C) |
| Raccoon, opossum, and other omnivores | 165 °F (74 °C) |
| Fish | 145 °F (63 °C) |

When in doubt, cook it more. If you suspect the animal was sick, cook it to well done or do not eat it.

## Diseases to know
| Disease | Found in | How you get it | What to do |
|---|---|---|---|
| **Tularemia** | Rabbits, hares, rodents, ticks | Through cuts, eyes, mouth, or tick bites | Wear gloves. White spots on a rabbit's liver means do not eat. Cook to 165 °F. Fever, swollen glands, or a skin sore a few days later needs medical care. |
| **Brucellosis** | Feral hogs, elk, bison, sometimes deer | Through cuts, eyes, or raw meat | Wear gloves and eye protection. Cook to 160 °F. |
| **Trichinellosis** | Bear, wild hog, cougar, raccoon | Eating undercooked meat | Cook to 160 °F. Freezing, salting, drying, and smoking do **not** reliably kill it in bear meat. |
| **Chronic wasting disease (CWD)** | Deer, elk, moose | Prions in brain, spine, lymph nodes | Cooking does not destroy prions. |
| **Rabies** | Foxes, raccoons, skunks, bats | Bite or saliva in a wound | Do not handle or eat animals acting strangely. See [[bites-stings]]. |
| **Anthrax** | Hoofed animals in some regions | Handling a body that died suddenly | Do not butcher animals found dead. Do not open the carcass. |
| **Parasite cysts** | Livers and organs of many animals | Eating raw or undercooked organs | Throw away organs with gray, white, or yellow cysts or spots. Cook the meat well. |

## CWD precautions
- Do not eat an animal that looks very thin, drooling, stumbling, or has no fear of people.
- Do not eat the **brain, spinal cord, eyes, spleen, tonsils, or lymph nodes** of any deer, elk, or moose.
- Do not cut through the spine or brain with the same knife you use for meat. Bone out the meat.
- In areas with CWD, test the animal if you can.
- Do not feed brain or spine to pets.

## Do not eat
- An animal that was found dead
- An animal that was slow, dazed, or unafraid
- Meat that smells sour, slimy, or "off"
- Liver with spots or cysts
- The brain, spinal cord, or spleen of any game animal

## Lead fragments
Lead bullets break into tiny fragments in the meat. Cut away and throw out a generous amount of meat around the wound channel (several inches). Do not make ground meat from shot-damaged areas. Children and pregnant people are most at risk.

## Liver warning
Do not eat the liver of polar bears, bearded seals, walrus, or sled dogs. It has dangerous amounts of vitamin A.

## Rabbit starvation (protein poisoning)
Living on lean game alone, with little fat or carbohydrate, causes nausea, headache, low blood pressure, diarrhea, and constant hunger. It can be fatal over weeks.
- Keep protein under about 30 to 35% of your calories.
- Eat fat: fatty animals, fat from the carcass, rendered fat ([[fats-pemmican]]), and starches such as potatoes, grain, and beans.
- See [[nutrition-basics]].

## Clean handling
- Keep raw meat away from cooked food and fresh produce.
- Wash hands, knives, and boards with soap and hot water. Sanitize with 1 tablespoon bleach per gallon of water ([[laundry-dishes]]).
- Never leave meat in the danger zone between 40 and 140 °F (4 and 60 °C) for more than 2 hours ([[food-safety-basics]]).
- Bury or burn waste away from water.

## Why consider them
When game is scarce, insects and small water animals can fill the gap. They are protein-rich, plentiful, and need only simple tools. All must be cooked.

> WARNING: Many of these foods carry parasites that cooking destroys. Do not eat any of them raw. If you have a shellfish allergy, avoid insects, crayfish, and snails ([[allergic-reaction]]).

## Insects
**Safer choices:**
- Crickets and grasshoppers (remove wings and hind legs, which have barbs)
- Mealworms and beetle grubs
- Termites and ants (cook; avoid fire ants)
- Cicadas

**Preparation:**
1. Collect from clean, unsprayed areas.
2. Keep them in a container a day to let their guts empty, if you can.
3. Boil, roast, or fry until crisp and fully cooked.
4. Grind dried insects into flour to add to other foods.

**Avoid:**
- Brightly colored insects, hairy or spiny caterpillars, and strong-smelling ones
- Insects that bite or sting (bees, wasps) unless you know how to handle them
- Fireflies (toxic), blister beetles, and any insect that lives in dung, carcasses, or garbage
- Flies, mosquitoes, ticks, and cockroaches (disease carriers)
- Insects found dead or in treated areas

## Crayfish
1. Catch them by tying a piece of meat or fish guts to a string at the water's edge, or use a baited trap.
2. Keep them alive until cooking. Do not cook any that are dead.
3. Boil for at least 5 minutes. Eat the tail meat and the claws.

Eat them only from clean water. Raw freshwater crayfish and crabs can carry lung fluke.

## Mussels and clams
Freshwater mussels filter pollutants and may be protected species. Eat them only from clean water. Boil until the shells open, discard any that stay closed, and see [[fish-cleaning-cooking]] and [[coastal-desert-foods]] for the red tide warning.

## Snails and slugs
Some snails and slugs carry **rat lungworm**, a parasite that can cause meningitis. Never eat them raw. If you eat land snails, collect them from clean areas and boil for at least 5 minutes. Do not eat slugs.

## Frogs
- Eat only the **legs**. Skin them and cook thoroughly.
- Frogs have smooth, moist skin. **Toads** have dry, warty skin and swollen glands behind the eyes that carry toxins. Do not eat toads.
- Never eat brightly colored tropical frogs.

## Turtles
Freshwater turtles can be eaten but carry salmonella. Cook to 165 °F (74 °C). Large snapping turtles accumulate pollutants. Many species are protected. Never eat sea turtles.

## Eggs
Wild bird eggs are protected by law in normal times. If you take any in an emergency, cook them firm. Do not eat an egg that smells bad or has a developed embryo.

## Plant protein
Beans, nuts, seeds, and grains give protein too. See [[wild-nuts-seeds]] and [[growing-beans-corn-squash]].

> STOP: Never eat a wild plant unless you are 100% certain what it is. A few wild plants kill within hours, and there is no antidote you can make at home.

> WARNING: This app has no pictures. Words alone are not enough to identify an unfamiliar plant safely. **Buy a printed, illustrated field guide for your region now**, and learn at least five local plants in person from an experienced forager before you ever need them.

Wild food can supplement your diet, but it will not feed you. Greens are low in calories. Your real survival food is stored food, garden crops, and animals. Learn wild plants as a backup, not a plan.

## The rules
1. **Be 100% sure.** Identify a plant using several features: leaves (shape, edges, and how they attach to the stem), stem, flower, fruit, root, smell, and habitat. If one feature does not match your guide, do not eat it.
2. **Learn the deadly plants first.** Know what can kill you before you learn what can feed you. See [[deadly-plants]].

7. **Know which part is edible.** The berries may be safe and the leaves deadly, or the other way around. Many plants are safe only after cooking or leaching.
8. **Start small.** Eat one tablespoon of a new food and wait 24 hours. Even safe plants upset some stomachs, and some people are allergic.
9. **Eat variety.** Do not eat the same wild plant at every meal. Many contain oxalates or nitrates that build up.
10. **Keep a sample.** Save one piece of what you ate. If you get sick, it helps poison control.

## Read this first
> DANGER: This test is a last resort for when you are starving, have no other food, and know no safe plants. It is risky and it is **not** reliable. A single bite of some plants (water hemlock root, a chewed castor bean) can kill, and the test cannot protect you. Many poisons are delayed and show no sign for a day or more.

A healthy person can live for weeks without food. If you can find water, shelter, and rest, waiting is usually safer than eating an unknown plant.

## Never use this test on
- Mushrooms or fungi
- Plants in the carrot family (umbrella-shaped flower clusters, lacy leaves)
- Plants with milky or colored sap (except dandelions, which are safe)
- Plants with an almond or peach smell (cyanide)
- Plants with shiny leaves in sets of three
- Bulbs or roots with no onion or garlic smell
- White, yellow, or very bitter berries or fruits
- Beans and seeds in pods
- Plants with sharp, bitter, soapy, or burning taste

These are rules of thumb. Some safe plants break them, and some unsafe plants follow them. Treat them as a way to skip risky candidates, not as proof of safety.

## The test (about 24 hours)
Test **one plant and one part** at a time (leaves, stem, root, bud, flower, fruit each separately). Test every part you plan to eat in the way you plan to prepare it (raw or cooked).

1. Do not eat or drink anything except purified water for 8 hours before you start.
2. Smell the plant. If it smells strongly of almonds, peaches, or has a harsh, acrid odor, reject it.
3. **Skin test.** Crush a piece and rub it on the inside of your elbow or wrist. Leave it for 15 minutes. If you get itching, rash, burning, or swelling, reject the plant.
4. Prepare a small piece of the plant the way you plan to eat it.
5. **Lip test.** Touch the piece to the outside of your lip for 3 minutes. If it burns, itches, or tingles, reject it.
6. **Corner of mouth.** Hold it at the corner of your mouth for 15 minutes.
7. **Tongue.** Place it on your tongue and hold it for 15 minutes without chewing.
8. **Chew.** Chew a small piece for 15 minutes. Do not swallow. Spit it out if you taste burning, bitterness, or soapiness, or if your mouth tingles or goes numb.
9. **Swallow** a small amount. Wait 8 hours. Drink only purified water. If you feel sick at any time, stop.
10. If you feel fine after 8 hours, eat about 1/4 cup of the same prepared plant part. Wait another 8 hours.
11. If you still feel fine, the part you tested, prepared the way you tested it, is probably safe to eat in small amounts.

## If you get sick
Stop eating the plant. Sip clean water. Do not induce vomiting unless Poison Control advises it. Call 1-800-222-1222 (US) if you can. See [[poisoning-overdose]].

- It does not detect delayed or cumulative poisons.

## Do this first
> STOP: Do not eat any wild plant that you cannot identify with complete certainty. Several of the plants below can kill an adult from a single bite or a handful of berries. Many look like foods people eat.

Everything here is a description in words. A printed field guide with photos is essential. See [[foraging-safety-rules]].

## The worst offenders (carrot family)
These look like wild carrot, parsnip, parsley, or celery. They have umbrella-shaped clusters of small white flowers and lacy leaves.

- **Poison hemlock** (*Conium maculatum*). Grows 3 to 8 ft (1 to 2.5 m), in ditches, roadsides, and damp fields. The stem is smooth, hairless, hollow, and marked with **purple or red blotches**. Crushed leaves smell musty, like mouse urine. Eating even a little causes trembling, drooling, paralysis, and death from respiratory failure within hours. A white taproot looks like a parsnip.
- **Water hemlock** (*Cicuta*). The most violently toxic plant in North America. Grows in wet places: marshes, ditches, stream banks. Leaflets are narrow and sharply toothed, and the veins run to the **notches** between teeth, not the tips. The thick root is chambered when you cut it lengthwise and oozes yellow, oily sap. One bite of root can cause seizures within 15 to 60 minutes and death.
- **Never** eat any root from a wet-ground plant that looks like a parsnip or carrot.

## Quick lookalike table
| Deadly plant | Looks like | Key difference |
|---|---|---|
| Poison hemlock | Wild carrot (Queen Anne's lace), parsley, parsnip | Smooth hollow stem with purple blotches, mousy smell. Queen Anne's lace has a hairy stem. Do not rely on this: avoid all |
| Water hemlock | Wild parsnip, celery, wild carrot | Grows in wet ground. Chambered, oily root. Veins end at the notches |
| Death camas | Wild onion, wild garlic, edible camas | **No onion or garlic smell** when crushed. Grass-like leaves folded in a keel. Cream-white flowers |
| Lily of the valley | Ramps (wild leeks), wild garlic | No onion smell. Two broad leaves clasping the base. Small white bell flowers, red berries |
| Autumn crocus | Ramps, wild garlic | Spring leaves look like garlic but have no onion smell. Flowers appear in autumn. Contains colchicine |
| False hellebore (corn lily) | Ramps, skunk cabbage, wild leeks | Large pleated leaves spiral up a stout stem. No onion smell |
| Daffodil bulbs | Onions | No onion smell. Strap-like leaves |
| Foxglove (first-year leaves) | Comfrey, mullein, borage, dock | Soft, fuzzy, wrinkled, toothed leaves in a rosette. Spotted bell flowers on a spike in the second year |
| Monkshood | Wild horseradish roots, parsley | Hooded blue-purple flowers. Palm-shaped, deeply divided leaves. Touching can cause tingling |
| Moonseed | Wild grapes | Each berry has **one flat crescent-shaped seed**. No tendrils. Grapes have several small round seeds and forked tendrils |

| Water dropwort (Europe) | Celery, parsley | Grows in wet ground. Very toxic |

## Other deadly plants
- **Foxglove** (*Digitalis*). Tall spike of purple-pink, tube-shaped, spotted flowers in the second year. All parts affect the heart. Symptoms: nausea, slow or irregular pulse, yellow-green halos in vision.
- **Monkshood** (*Aconitum*). Hooded blue-purple flowers. All parts are deadly, and the sap can numb skin on contact. Wear gloves when touching.
- **Baneberry** (*Actaea*). White berries with a black dot ("doll's eyes") on thick red stalks, or red berries. A few berries can cause cardiac arrest.
- **Deadly nightshade (belladonna)**, **bittersweet nightshade**, and **black nightshade**. Shiny black or red berries, often with a green star-shaped cap. Belladonna berries can kill a child. Avoid all wild nightshade berries.

- **Rhododendron, azalea, mountain laurel.** Leathery evergreen leaves. Leaves, flowers, and honey made from them cause vomiting, slow pulse, and collapse. Do not use for skewers or tea.
- **White snakeroot.** Clusters of fluffy white flowers in the eastern US. It poisons cattle and anyone who drinks their milk ("milk sickness").
- **Rosary pea** (*Abrus*). Tropical vine with shiny red and black seeds. One chewed seed can kill.
- **Mistletoe**, **holly**, and **English ivy berries**. Toxic.

## High-risk groups to avoid
- The carrot family (umbrella flower clusters)
- Wild nightshades (except crops you know)
- Wild bulbs without an onion or garlic smell
- Plants with milky sap (except dandelion and lettuces)
- Mushrooms (see [[wild-mushrooms]])
- Wild "gourds" and cucumber-like fruits that taste very bitter. They can contain deadly cucurbitacins.

## Poisoning signs
Poisoning may begin in minutes or after a day. Look for: vomiting, drooling, sweating, tingling or numbness, trembling, seizures, confusion, slow or very fast pulse, and trouble breathing.

> CALL: Call Poison Control at 1-800-222-1222 (US) right away, or get to medical care. Bring a sample of the plant. Do not wait for symptoms to appear. See [[poisoning-overdose]].

Related: [[contact-poisons-plants]], [[wild-berries-fruit]], [[safe-wild-greens]].

## Do this first
> WARNING: Confirm every plant with a printed field guide for your region and ideally an experienced forager. Avoid plants from roadsides, sprayed lawns, and contaminated soil. Wash in treated water and cook when in doubt.

These plants are common, have distinctive features, and are rarely mixed up with deadly ones. Some lookalikes are listed so you know what to avoid. See [[foraging-safety-rules]].

## Dandelion (*Taraxacum officinale*)
- **Look for:** a rosette of toothed leaves hugging the ground. One hollow, leafless stem per yellow flower. Milky sap.
- **Lookalikes:** cat's ear, hawkweed, and wild lettuce, which have branched or leafy flower stems. Most are also edible.
- **Use:** young leaves raw or boiled in one or two changes of water to reduce bitterness. Flowers raw or cooked. Roots roasted as a coffee substitute. Rich in vitamins A, C, and K.

## Plantain (*Plantago*)
- **Look for:** a ground-hugging rosette of oval leaves with 3 to 5 strong **parallel veins** that pull out like strings when you tear a leaf. Spike of tiny flowers. (This is not the banana-like fruit.)
- **Lookalikes:** false hellebore (deadly) has large *pleated* leaves in a spiral up a stalk, not a rosette. Lily of the valley leaves come in pairs.
- **Use:** young leaves boiled or fried. Older leaves are tough: boil or chop finely. Seeds are edible. A crushed leaf rubbed on a bite or sting helps ([[herbal-remedies]]).

## Chickweed (*Stellaria media*)
- **Look for:** low, sprawling plant with small oval leaves in pairs and tiny white flowers whose five petals are so deeply split they look like ten. A single line of tiny hairs runs along the stem. The stem has a stretchy core when you pull it apart.
- **Lookalikes:** scarlet pimpernel (orange-red flowers, square stem, black dots under leaves) and spurges (milky sap). Chickweed has no milky sap.
- **Use:** raw in small amounts or lightly cooked. Eat in moderation.

## Clover (*Trifolium*)
- **Look for:** three oval leaflets, often with a pale V mark, and a round pink, white, or purple flower head.
- **Use:** flowers and young leaves raw or cooked. Eat in moderate amounts, as large amounts of raw clover cause bloating. Do not eat moldy sweet clover, which can thin your blood.

## Purslane (*Portulaca oleracea*)
- **Look for:** thick, fleshy, paddle-shaped leaves on smooth red stems that spread flat on the ground. Tiny yellow flowers. Clear sap.
- **Lookalike:** spotted spurge, which has thin, wiry stems, small leaves with a purple spot, and **milky white sap** when snapped. Do not eat spurge. If the sap is milky, it is not purslane.
- **Use:** raw or cooked. Slightly sour and juicy.

## Lamb's quarters (*Chenopodium album*)
- **Look for:** upright plant with diamond-shaped, toothed leaves covered with a **powdery white coating**, especially on young leaves. Water beads roll off.
- **Lookalikes:** black nightshade has smooth, uncoated leaves and berries. Check carefully.
- **Use:** young leaves cooked like spinach. Eat in moderation. Seeds are edible too ([[wild-nuts-seeds]]).

## Wood sorrel (*Oxalis*)
- **Look for:** three **heart-shaped** leaflets folded along the middle, lemony taste, small yellow flowers.
- **Lookalike:** clover has oval leaflets and is not sour.
- **Use:** raw in small amounts as a lemony nibble. Avoid large amounts (oxalic acid), especially if you have kidney stones or gout.

## Mallow (*Malva*)
- **Look for:** round, scalloped leaves on long stems, small pale pink or white flowers, and flat round "cheese wheel" fruits.
- **Use:** leaves, flowers, and green fruits raw or cooked. The slimy texture thickens soups.

## Stinging nettle (*Urtica dioica*)
- **Look for:** square stem, pointed toothed leaves in pairs, covered in stinging hairs.

    body: `
## Do this first
Nuts and acorns are the best wild source of calories in a temperate forest. They are rich in fat and protein and store well. Most need work to remove bitterness or hulls.

> WARNING: Do not eat nuts that are moldy, rancid, or have holes from insects. Do not confuse buckeye or horse chestnut with real chestnuts ([[deadly-plants]]).

## Acorns
All oaks make edible acorns, but they contain bitter **tannins** that upset the stomach and can harm kidneys in large amounts. They must be leached.

- White oaks (rounded leaf lobes) have the least tannin.
- Red and black oaks (pointed, bristle-tipped lobes) have more.

### Leaching
1. Gather acorns and discard any with holes or that float in water.
2. Shell and chop or grind them into coarse meal.
3. **Cold method (best flavor):** put the meal in a jar and cover with water. Pour off and replace the water once or twice a day until the meal tastes mild with no bitterness or dry, puckery feel. Takes 1 to several days for fine meal.
4. **Hot method (faster):** boil chopped acorns and pour off the brown water, replacing it with boiling water. Repeat until the water runs clear and the acorns taste mild.
5. Dry the meal. Grind into flour. Mix with wheat flour or cornmeal for bread, or cook as porridge ([[baking-bread]]).

About 3.5 oz (100 g) of dried acorn meal gives roughly 400 calories.

## Black walnuts, butternuts, and hickory
- **Black walnut:** the green husk stains skin and clothing. Wear gloves. Dry the husk for 2 to 3 weeks, then crack. Strong flavor.
- **Hickory (shagbark, pignut, pecan):** high-fat nutmeat. Bitternut is bitter but still edible. Boil crushed shells and skim the oil off the top.
- **Hazelnut:** a shrub with a leafy husk around the nut. Squirrels beat you to them. Pick in August to September.
- Nuts such as walnuts, hickory, and hazelnuts provide about 600 to 700 calories per 3.5 oz (100 g).

## Beechnuts and chestnuts
- **Beechnuts:** small triangular nuts in prickly husks. Eat in moderation, preferably roasted.
- **Chestnuts (American or Chinese):** nuts in a spiny burr, with pointed tips. Long narrow leaves with sharp teeth. Roast with a slit in the shell. **Do not confuse with buckeye or horse chestnut.**

## Pine nuts
Nearly all pine seeds are edible. Gather cones before they open, warm them to release the seeds, and shell. Large pinyon and stone pine seeds are best.

## Sunflower and other seeds
- **Wild sunflower:** dry the heads and rub out the seeds.
- **Grass seeds** (wild rice, foxtail, barnyard grass): shake ripe seed heads into a container or sheet. Thresh by rubbing, winnow in the wind, and parch before grinding.
- **Amaranth and lamb's quarters seeds:** rub dry heads over a bucket, winnow, rinse to remove bitterness, and boil as porridge or grind.

> DANGER: **Ergot** is a black, hard, curved fungus that replaces seeds in the heads of rye, wheat, and wild grasses. It causes convulsions and gangrene. Discard any grain head with black or purplish spurs.

## Storage
- Nuts last longest in the shell, kept cool, dry, and away from rodents.
- Shelled nuts and flour turn rancid in weeks to months. Keep cold or dry them well.
- Dry acorn meal thoroughly before storing.
- Freeze nuts for 3 days to kill insects ([[bulk-dry-storage]]).

See also [[stretching-food]] and [[fruit-nuts-perennials]].
`

## Do this first
> DANGER: Yew trees look like fir or hemlock but are deadly. Poison sumac looks like staghorn sumac but grows in swamps. Know your tree before you make tea or drink from it ([[deadly-plants]]).

## Maple and birch sap
Sap flows in late winter and early spring when nights are below freezing and days are above freezing.

1. Choose a tree at least 10 in (25 cm) across.
2. Drill a hole about 2 in (5 cm) deep on a sunny side, a few feet off the ground, and slope it slightly upward. Insert a tube or a hollow twig.
3. Hang a clean bucket. Cover it to keep out rain and bugs.
4. Collect daily. Raw sap is slightly sweet and drinkable. Keep it cold and use it within a few days.
5. Boil to make syrup. Maple sap is about 2% sugar and needs about **40 gallons to make 1 gallon** of syrup. Birch sap is less sweet and takes **about 100 to 1**. Syrup is done when it reaches 7 °F (4 °C) above the boiling point of water (about 219 °F / 104 °C at sea level).
6. Boil outdoors. The steam is large.

Take only one tap per large tree and plug the hole afterward. See [[making-staples]].

## Pine, spruce, and fir needle tea
Needles are a good source of vitamin C.

1. Identify the tree. **Pine** needles come in bundles of 2 to 5. **Spruce** needles are single and square (you can roll them between your fingers). **Fir** needles are flat and single.
2. Chop a handful of fresh needles and steep in hot water for 10 to 20 minutes. Do not boil hard.
3. Strain and drink.

> WARNING: Do not use yew (flat needles in two rows, red cups with seeds). Pregnant people should not drink pine needle tea. Ponderosa pine has been linked to miscarriage in cattle. If you cannot identify the tree, do not drink the tea.

Eastern hemlock (a tree) is not related to poison hemlock (a herb). It has short flat needles with two white lines below. If you are not certain, skip it.

## Spruce tips
Bright green new growth in spring is edible and rich in vitamin C. Eat raw, make tea, or add to food.

## Inner bark (cambium)
Inner bark is a famine food, low in calories. In spring it is moist and sweet.

1. Cut a small patch of outer bark off a pine, birch, or slippery elm.
2. Peel away the soft pale layer just beneath.
3. Eat raw, boil, or dry and grind it into flour.

Stripping bark all around a tree kills it. Take small patches from the side only, and only in an emergency.

- **Slippery elm** inner bark is slimy and soothes a sore throat when steeped in water.
- **Basswood (linden)** young leaves, flowers, and inner bark are edible.
- **Willow** inner bark contains a natural pain reliever ([[herbal-remedies]]).

## Staghorn sumac drink
- **Look for:** shrub or small tree with **fuzzy red-brown branches**, leaves with 11 to 31 pointed leaflets, and **upright cones of red, fuzzy berries**.
- **Make:** soak crushed berry clusters in cold water for 15 to 20 minutes. Strain well through cloth. Sweeten if you have honey.
- **Deadly lookalike:** poison sumac grows in wet swamps, has smooth stems, 7 to 13 smooth-edged leaflets, and **drooping clusters of white-gray berries**. Staghorn berries are red and stand up.
- People allergic to cashews or mango may react to sumac.

## Sassafras and spicebush
- **Sassafras** has three leaf shapes on the same tree (unlobed, mitten, three-lobed). Root bark tea contains safrole, a suspected carcinogen. Use dried leaves only occasionally as a thickener.
- **Spicebush** twigs and berries make a spicy tea.

## Other uses
- Bark and roots make cordage ([[cordage-rope]]).
- Wood makes fuel and tools ([[felling-splitting-firewood]]).

    body: `
## Do this first
> STOP: In a survival situation, do not eat wild mushrooms. Mushrooms have little food value (about 20 to 30 calories per 3.5 oz / 100 g), and the deadliest ones look like edible ones. Skip them.

If you or someone else may have eaten an unknown mushroom, see "If someone eats a wild mushroom" below right now.

## Why mushrooms are so dangerous
- A single deadly mushroom can kill an adult.
- Symptoms can be delayed **6 to 24 hours or more**. By then, the toxin is already damaging the liver or kidneys.
- Cooking, drying, or freezing does **not** destroy most mushroom poisons.
- No simple test works. See "Tests that do not work" below.
- Poisonous and edible species can grow side by side.

## The killers
- **Death cap** (*Amanita phalloides*) and **destroying angel** (*Amanita bisporigera, ocreata*). Responsible for most mushroom deaths. White gills, a ring (skirt) on the stalk, and a **cup or sac at the base**, which is often buried. Dig up the whole mushroom. The death cap cap is olive-green to yellow-brown. Destroying angels are pure white.
- **Galerina** (*Galerina marginata*). Small brown mushroom on rotting wood. Can be mistaken for edible honey mushrooms.
- **False morels** (*Gyromitra*). Brain-like, wrinkled cap that is not attached to the stem all the way. Toxin can be fatal even after cooking.
- **Little brown mushrooms.** Many are toxic, and some cause kidney failure days later.
- **Young Amanita "eggs."** They look like white puffballs.

> DANGER: Never eat any white-gilled mushroom with a ring on the stalk or a sac at the base.

## Tests that do not work
- A silver spoon turning black
- Whether insects, slugs, or squirrels eat it
- Peeling the cap
- Cooking, boiling, or soaking in vinegar or salt water
- Color, smell, or taste
- Whether it grows on wood or in a field

## If you must, learn from an expert in person
A few mushrooms are recognized by expert foragers as beginner-friendly, but you must learn them in person from an experienced local forager.
- **True morels.** Pitted, honeycomb cap that is attached to the stem. Cut one lengthwise: it is hollow in one continuous chamber from tip to base. False morels are cottony inside.
- **Giant puffballs.** Large, smooth, white, round. Cut every one from top to bottom. It must be pure white and uniform like a marshmallow inside. If you see any shape of a mushroom, gills, or any color but white, discard it.
- **Chicken of the woods.** Bright orange-yellow shelves on trees, with pores instead of gills. Some people get an upset stomach. Do not eat old specimens.

Always cook any wild mushroom. Eat only a small portion the first time. Keep a raw sample.

## Safer alternative
Grow oyster or shiitake mushrooms from spawn on logs or straw. The identity is known.

## If someone eats a wild mushroom
1. Do not wait for symptoms.
2. Call Poison Control: 1-800-222-1222 (US), or get medical care.
3. Save leftover raw mushrooms, a sample of the cooked meal, and any vomit. Take a photo if you can.
4. Do not induce vomiting unless a poison expert tells you to.
5. Stay hydrated with sips of water ([[dehydration-ors]]).
6. Know that deadly mushroom poisoning can have a "false recovery" after the first symptoms, followed by liver or kidney failure 2 to 4 days later. Get medical care even if the person feels better.

See [[poisoning-overdose]] and [[foraging-safety-rules]].
`
