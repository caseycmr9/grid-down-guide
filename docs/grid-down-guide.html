    body: `
## Potatoes
Potatoes give more calories per square foot than almost any other garden crop. They store for months.

### Planting
1. Use **seed potatoes** (certified disease-free if you can). Grocery potatoes are often treated to stop sprouting and may carry disease.
2. Cut large seed potatoes into pieces about the size of an egg, each with at least 2 "eyes". Let the cut pieces dry for 1–2 days.
3. Plant **2–4 weeks before the last frost**, when soil is at least 45 °F (7 °C). Place pieces 4 in (10 cm) deep, 12 in (30 cm) apart, in rows 30–36 in (75–90 cm) apart, eyes up.

### Growing
- When plants are 6–8 in (15–20 cm) tall, pile soil or straw around the stems to hill them. Repeat 2–3 times. Hilling keeps tubers covered and growing more.
- Water about 1–2 in (2.5–5 cm) a week, especially when plants flower and tubers are forming.
- Rotate beds; do not follow potatoes with tomatoes or peppers (same family; shared diseases like blight, see [[garden-pests]]).

### Harvest
- **New potatoes:** dig a few tender ones 2–3 weeks after flowering.
- **Storage potatoes:** wait until the vines die back, then leave them 2 more weeks so skins set. Dig on a dry day, gently, to avoid cuts.
- **Cure** 10–14 days in a dark, humid place at 50–60 °F (10–15 °C). Do not wash.
- **Store** dark at 38–40 °F (3–4 °C), in good conditions 4–8 months. Keep apart from apples. See [[root-cellar]].

> WARNING: Potato skin or flesh that turns **green**, and sprouts, contain solanine, which makes people sick. Cut away green parts and sprouts; throw away potatoes that are very green or bitter. Never eat potato leaves, stems, or the green "fruits".

## Sweet potatoes
Warm-season crop; need 100–120 frost-free days.
1. Grow **slips** (sprouts): half-bury a sweet potato in damp sand or suspend it in water in a warm place. Break off 6-in (15 cm) slips when they have a few leaves (4–6 weeks).
2. Plant slips about 2 weeks after the last frost, when soil is above 65 °F (18 °C), 12 in (30 cm) apart on ridges.
3. Harvest before frost, handling gently (they bruise). Vines blackened by frost: dig soon.
4. **Cure** 5–7 days at 80–85 °F (27–29 °C) and high humidity, then store at 55–60 °F (13–15 °C). Never refrigerate. Keeps 6–10 months.

    body: `
## Dry beans: your garden protein
Dry beans give protein and calories and store for years ([[bulk-dry-storage]]).
1. Sow **after the last frost** when soil is at least 60 °F (16 °C), 1–1.5 in (2.5–4 cm) deep, 2–4 in (5–10 cm) apart.
2. **Bush beans** need no support and mature all at once. **Pole beans** climb a trellis and give more over a longer time.
3. Do not water the leaves in the evening (disease).
4. Harvest when pods are dry, papery, and rattle (90–120 days). Pull whole plants if rain threatens and hang them to finish drying.
5. Shell, then dry seeds a few more days. Seeds should be hard.

> WARNING: Dry beans must be soaked and boiled hard before eating. Red kidney beans in particular must boil at least 10 minutes to destroy a toxin. See [[safe-cooking-temps]].

## Corn for storage
Sweet corn is for summer eating. For storage and flour, grow **flint, dent, or flour corn**.
- Plant after the last frost in **blocks of at least 4 rows**, not one long row, so wind carries pollen between plants.
- Sow 1–2 in (2.5–5 cm) deep, 8–12 in (20–30 cm) apart in rows 30 in (75 cm) apart.
- Corn is a heavy feeder: add compost or side-dress with manure.
- Harvest dry corn when husks are brown and kernels are too hard to dent with a thumbnail (90–120 days). Pull the husks back and hang or lay ears in a dry airy place until kernels are fully hard.
- Rub off kernels, store dry, grind for cornmeal.

> IMPORTANT: People who live mainly on corn can get **pellagra** (niacin deficiency). Treating corn with wood-ash lye or lime (nixtamalization) frees the niacin. See [[nutrition-basics]] and [[making-staples]].

## Winter squash and pumpkins
Winter squash (butternut, acorn, pumpkin) stores for months with very little work.
1. Plant after the last frost, 1 in (2.5 cm) deep, in hills 3–4 ft (1–1.2 m) apart, 3–4 seeds per hill. Thin to the best two.
2. Feed with compost; water deeply.
3. Harvest before frost when the rind is hard (a fingernail cannot dent it) and the stem is dry. Leave 2–3 in (5–7 cm) of stem on; never carry by the stem.
4. **Cure:** 10 days at 80–85 °F (27–29 °C), then store at 50–55 °F (10–13 °C) in a dry place. Butternut can last 3–6 months or more.
5. Dry squash seeds are edible and nutritious.

Pests: squash bugs and vine borers ([[garden-pests]]).

## The Three Sisters
A Native American planting that works well in a small space:
1. Make a mound about 1 ft (30 cm) high and 3 ft (1 m) wide.
2. Plant **corn** in the middle first, 4–5 seeds in a circle.
3. When corn is 4–6 in (10–15 cm) tall, plant **pole beans** around it (they fix nitrogen and climb the corn).
4. A week later plant **squash** around the edges. Its big leaves shade weeds and hold moisture.

Honest note: yields per area are similar to growing each crop separately, but the combination uses space and labor well. Choose short, vigorous squash and a not-too-aggressive pole bean.

    body: `
## Be realistic about grain
Grain is the staple of most diets, but home-scale grain is **land and labor hungry**. From 1,000 sq ft (93 m²) you may harvest about 30–60 lb (14–27 kg) of wheat: roughly 45,000–90,000 calories. The same space in potatoes can give about 250,000 calories. Learn grain growing, but put your first space into potatoes, beans, corn, and squash ([[garden-planning]]).

## Which grain?
- **Winter wheat/rye:** sown in fall (4–6 weeks before ground freezes), harvested the next summer. Rye is the hardiest and grows in poor soil.
- **Spring wheat, oats, barley:** sown as soon as soil can be worked in spring, harvested in summer.
- **Amaranth:** heat-loving, tiny nutritious seeds, edible leaves.
- **Sorghum:** heat- and drought-tolerant; grain and syrup.
- **Oats and barley** have hulls that cling to the seed; hull-less ("naked") varieties are easier.

## Planting
- Prepare a firm, weed-free bed. Broadcast seed at about 2–3 lb per 1,000 sq ft (1–1.5 kg per 90 m²), rake lightly to cover about 1 in (2.5 cm), and firm it down.
- Keep birds off with light netting or brush until sprouted.

## Harvest
1. Harvest when stalks are golden and dry and kernels are too hard to dent with a thumbnail.
2. Cut with a sickle or scythe close to the ground. Bundle and stand the bundles upright in small "shocks" to dry for about 1–2 weeks. Keep out of rain.

## Thresh and winnow
- **Threshing** frees the seeds from the heads. For small amounts: beat the heads inside a sack or on a tarp with a stick or flail, or rub by hand.
- **Winnowing** removes the chaff. On a breezy day, pour the grain slowly from one bucket to another so wind carries the light chaff away.
- Sort out stones and bits, and **dry the grain to 13% moisture or less** (kernels crack rather than squash when bitten) before storage.

## Storage and milling
- Store dry grain in rodent-proof, airtight containers in a cool place. See [[bulk-dry-storage]]. Whole grain keeps for years; flour spoils in months.
- Mill only what you need. Options: a hand-crank grain mill, a mortar and pestle, or two flat stones (quern). Sift out bran if you want finer flour.
- Cook as whole grains, cracked grain porridge, or bake ([[baking-bread]], [[cooking-staples]]).

## Mistakes to avoid
- Wet harvest or storage causes mold. Dry thoroughly.
- Grass and cereal seed heads can carry ergot, a purple-black fungus replacing some seeds. It is poisonous. Discard heads with ergot.
- Planting too little to matter. A grain plot under 1,000 sq ft is for learning and for seed.

    body: `
## How much water?
Most vegetables need about **1 inch (2.5 cm) of water a week** from rain plus watering, more in hot, windy weather and in sandy soil.

**Water budget:** 1 inch of water over 1 sq ft is about **0.62 gallons (2.4 L)**.
- A 100 sq ft bed needs about 62 gallons (235 L) per week if there is no rain, or about twelve 5-gallon buckets.
- A 1,000 sq ft garden needs about 620 gallons (2,350 L) a week.

Plan your water supply: see [[rain-catchment]] and [[wells-springs]]. Mulch cuts these numbers a lot.

## Water well, not often
- Water **deeply once or twice a week** rather than a sprinkle every day. Deep watering grows deep, drought-tough roots.
- Water at the base of plants, in the **morning**. Wet leaves overnight invite disease.
- Check by digging 2 in (5 cm) down. If it is dry there, water.
- **Seedlings and new transplants** need light, frequent watering until established.
- The most critical times: germination, transplanting, and when plants flower and set fruit.

## Mulch
A layer of organic mulch 3–4 in (7–10 cm) deep:
- holds moisture (a large part of watering saved)
- stops most weeds
- keeps soil cool and feeds soil life as it rots

Use straw, dry leaves, grass clippings (from lawns that were not sprayed), or wood chips on paths. Keep mulch a few inches away from plant stems. Hay can carry weed seed; straw carries less. Mulch beds after the soil warms in spring.

## Low-power watering
- **Watering can or buckets:** best for small gardens.
- **Gravity drip:** punch small holes in a bucket or use drip line from a raised barrel.
- **Olla:** bury an unglazed clay pot to its neck beside plants, fill with water, cap it. Water seeps out slowly where roots are. Bottles with holes also work.
- **Rain barrels:** fill from roofs (see [[rain-catchment]]).
- **Greywater** (mild-soap dishwater) may be used on soil around ornamental and fruit-tree roots, never on leaves or on root crops eaten raw.

## Gardening in drought
1. Choose drought-tough crops: sweet potatoes, okra, cowpeas, tepary beans, sorghum, amaranth, melons, squash, garlic.
2. Plant farther apart, and mulch heavily.
3. Use shade cloth (30–50%) in extreme heat.
4. Grow in trenches or sunken beds in dry climates so water pools at roots; in wet climates use raised beds.
5. Hoe weeds early: weeds steal water.
6. Build soil with compost; it acts like a sponge ([[soil-basics]]).

> WARNING: Overwatering rots roots and spreads disease. Yellow leaves with constantly wet soil usually mean too much water.
`

    body: `
## Prevention first
- Healthy soil and plants resist problems ([[soil-basics]], [[compost-fertilizer]]).
- **Rotate crops** every 3–4 years so pests and disease do not build up.
- Remove dead plants and fallen fruit at season's end.
- Check plants every day or two: catching problems early is most of the battle.

## Barriers and fences
- **Deer:** a fence 8 ft (2.4 m) tall, or two 4-ft fences about 3–4 ft apart. Single 4-ft fences are jumped.
- **Rabbits:** wire fence 2 ft (60 cm) high, with the bottom 6 in (15 cm) bent outward or buried.
- **Gophers and moles:** line beds with 1/2-in hardware cloth underneath.
- **Birds:** netting over berries and seedlings.
- **Row cover:** lightweight fabric over crops stops flying insects (cabbage moths, flea beetles, squash vine borers). Remove it when squash and cucumbers flower so bees can pollinate.

## Insects: hand control works
| Pest | What to do |
|---|---|
| Tomato hornworm | Handpick (large green caterpillars). Leave any with white cocoons on their backs. |
| Colorado potato beetle | Handpick adults and larvae; crush orange egg clusters under leaves. |
| Squash bugs | Handpick; trap under boards at night; crush bronze egg clusters. |
| Squash vine borer | Wrap stem base with foil; cut out borers; plant late. |
| Cabbage worms | Handpick; row cover; Bt (a bacterial spray safe for people) if you have it. |
| Aphids | Blast with a water spray; spray insecticidal soap. |
| Slugs and snails | Handpick at dusk; set boards to trap; shallow dish of beer; keep mulch thin. |

**Soap spray:** mix 1–2 teaspoons of plain liquid soap (no degreaser or bleach) in a quart (1 L) of water. Spray in the evening on aphids and mites, and rinse after a few hours. Test on one leaf first.

> TIP: Attract beneficial insects (ladybugs, lacewings, wasps) with dill, fennel, alyssum, yarrow, and other small flowers planted among crops.

## Diseases
- **Late blight** (potato and tomato): dark, greasy spots on leaves and stems, white fuzz underneath in damp weather. It spreads quickly. Remove infected plants, bag them (do not compost), and do not plant tomatoes or potatoes there for 3 years.
- **Early blight, leaf spots:** remove spotted lower leaves, mulch to stop soil splash, water at the base, give plants space.
- **Powdery mildew** (squash, cucumbers): white powder on leaves. Space plants, prune for airflow, and remove badly infected leaves.
- **Wilts and rots:** often come from wet soil. Improve drainage, rotate.

## Companion planting, honestly
Strong evidence: flowers that attract beneficial insects; mixing crops so pests cannot find one big patch; using trap crops. Many other folk pairings have little proof. Do not rely on them, but mixed plantings are harmless and often helpful.

## Other tools
- Diatomaceous earth dusted lightly on soil kills soft-bodied insects but also helpful ones; use sparingly and avoid breathing the dust.
- Chickens eat many pests but also scratch up crops ([[chickens]]).
- Remove or relocate what you cannot beat; no garden is perfect.

## Before the first frost
Tender crops (tomatoes, peppers, beans, squash, sweet potatoes, basil) die at 32 °F (0 °C). When a frost is forecast, either cover plants with sheets or row cover overnight, or harvest everything that is ready. Hardy crops (kale, carrots, cabbage, brussels sprouts, parsnips) improve in flavor after light frost.

## General rules
- Harvest in the cool of the morning, on a dry day.
- Handle gently; bruised food rots first.
- Do not wash crops you plan to store. Brush off soil.
- Use damaged produce first; store only the best.
- Check stored crops weekly and remove anything rotting.

| Winter squash | Hard rind, dry stem, before frost | 10 days at 80–85 °F | 50–55 °F, dry, 3–6 months |
| Carrots, beets | Roots full size | None | Damp sand, 32–40 °F; or in ground under mulch |
| Cabbage | Heads firm | None | 32–40 °F, humid; pull whole plant, roots on |
| Apples | Seeds brown, twist off easily | None | 30–35 °F, humid |

## Dry beans and corn
- **Beans:** pull plants when most pods are dry. Hang or lay on a tarp in a dry airy place. When pods crack, shell them. Beans should be so hard a hammer shatters them; if they dent, they need more drying.
- **Weevil prevention:** freeze dried beans in a sealed container for 3–4 days before long-term storage.
- **Dry corn:** leave on stalk until husks are brown. Pull back husks, hang ears or braid them, and dry until kernels are rock hard and rub off the cob easily. Dry grain below about 14% moisture for storage ([[bulk-dry-storage]]).

## Tomatoes, peppers and greens at frost
- Pick mature green tomatoes (full size, pale green or with a pink blush) before frost. Ripen them in a single layer in a paper bag or box at 55–70 °F (13–21 °C). Check often. Or pull whole plants and hang them upside-down in a cool shed.

## Where to store
- Cool, dark, humid: potatoes, roots, cabbage. Cool, dry: onions, garlic, squash. See [[root-cellar]] for how to build storage.

- Put wire mesh over crops to stop mice.

## Preserve the surplus
What cannot be stored fresh: [[canning-basics]], [[drying-dehydrating]], [[fermenting-pickling]].

## Why plant perennials
Perennial food keeps producing year after year with little work. But trees and shrubs take **years** to bear. If you have land, plant now. Plant and choose plants for your hardiness zone ([[frost-dates-calendar]]).

| Blueberries | 3–4 | Need acid soil (pH 4.5–5.5); plant two or more varieties |

| Walnut, pecan | 7–10+ | Large trees; slow |

- **Asparagus:** plant crowns in early spring in a trench; do not harvest for 2 years; then cut spears for 6 weeks each spring.
- **Rhubarb:** harvest stalks in spring; **never eat the leaves** (poisonous). Stalks are very sour; cook with sweetener.
- **Jerusalem artichoke (sunchoke):** tall sunflower relative with starchy tubers. Very productive and spreads aggressively. Can cause gas.
- **Horseradish, sorrel, chives, Egyptian walking onions:** tough and easy.

- Buy **bare-root** trees and berry plants in early spring or fall when dormant. They are cheaper.
- **Chill hours:** many fruit trees need a number of winter hours below 45 °F (7 °C). In warm climates choose low-chill varieties.
- **Pollination:** most apples, pears, and plums need a different, compatible variety nearby. Some peaches and sour cherries are self-fertile.

## Pruning basics
- Prune **fruit trees in late winter** while dormant. Remove dead, diseased, crossing, and inward-growing branches.

- Raspberries: cut canes that fruited down to the ground after harvest.
- Light pruning every year is better than hard pruning once in a while.

[[drying-dehydrating]], [[canning-basics]], and [[root-cellar]] store fruit. For wild fruit and nuts see [[wild-nuts-seeds]].

    body: `
## Why extend the season
Protection from cold and wind can stretch your growing season by weeks in spring and fall, and allow hardy greens through winter.

## Cold frame
A bottomless box with a clear lid, set on the ground facing south.
1. Make a box about 3 × 6 ft (1 × 2 m), 12 in (30 cm) high at the back and 8 in (20 cm) at the front, so the lid slopes to the sun.
2. Use an old window, clear polycarbonate, or heavy plastic for the lid.
3. Set it on well-drained soil and bank soil or straw around the outside for insulation.

> WARNING: A cold frame can overheat on a sunny day, even in cold weather. Prop the lid open when it is above about 70 °F (21 °C) inside, and close it in the afternoon.

Use it to harden off seedlings, start crops early, and keep spinach, lettuce, kale, and carrots going through winter.

## Row covers and low tunnels
- Lightweight fabric (floating row cover) laid over crops adds a few degrees of frost protection and keeps pests out.
- **Low tunnel:** bend hoops of wire, conduit, or flexible branches over a bed every 3 ft (1 m) and cover with 6-mil clear plastic or fabric. Weigh down the edges and open the ends on warm days.

## Hoop house or greenhouse
- A hoop house is a larger tunnel you can walk into, covered with 6-mil UV-resistant plastic. Anchor it well against wind.
- Water barrels painted black store heat in the day and release it at night.
- Always ventilate; hot, humid, still air breeds disease.

## Hotbed
Dig a pit about 2 ft (60 cm) deep, fill with fresh horse manure and straw mixed, top with 6 in (15 cm) of soil, and cover with a cold frame. The rotting manure heats the bed for several weeks.

## Winter crops
Plant by early fall so plants are nearly full size before light fades: kale, spinach, mache (corn salad), arugula, chard, scallions, carrots, leeks, and hardy lettuce. In mid-winter, with under 10 hours of daylight, plants hold rather than grow; harvest slowly from what you grew in fall.

## Sprouts: fast food on a windowsill
Sprouts take 3–5 days and give fresh vitamins (including vitamin C, see [[nutrition-basics]]).
1. Put 2–3 tablespoons of seeds (mung beans, lentils, radish, mustard, broccoli, or alfalfa) in a wide jar. Cover with water and soak 8–12 hours.
2. Drain through a cloth or mesh lid. Rinse and drain 2–3 times a day, keeping the jar tilted so water drains.
3. After 3–5 days, rinse well and eat or store in the fridge/cool place.

> WARNING: Warm, damp sprouts can grow bacteria (Salmonella, E. coli). Use seed meant for sprouting, wash hands, and cook sprouts for young children, pregnant women, the elderly, and anyone with a weak immune system. Never sprout or eat raw kidney beans, and never eat sprouts of potatoes or tomatoes.

## Microgreens
Sow dense seed (sunflower, pea, radish) on 1–2 in (2.5–5 cm) of soil in a tray in a very sunny window. Cut at 7–14 days. Good for fresh greens indoors in winter.

See [[garden-structures]] for building plans.

## Why grow herbs
Herbs make bland stored food taste good, and many have traditional uses for teas and simple home care. They are small, tough, and fit in pots beside the door.

## Hardy perennials (come back every year)
- **Thyme, sage, oregano:** sun, well-drained soil, little water. Cut back after flowering.
- **Rosemary:** needs a warm winter (zone 7 and up) or must come indoors.
- **Chives:** easy, onion flavor, divide clumps.
- **Mint:** grows everywhere. **Plant it in a pot or bottomless bucket** sunk in the ground or it will take over.
- **Lemon balm:** pleasant tea, spreads freely.
- **Yarrow, lavender, hyssop:** flowers for bees and tea; yarrow is not safe during pregnancy.

## Annuals (replant every year)
- **Basil:** needs warm weather; frost kills it. Pinch flowers to keep leaves coming.
- **Dill:** self-sows; seeds for pickling.
- **Cilantro (coriander):** bolts quickly in heat; sow new seed every 3 weeks. Seeds are coriander.
- **Parsley:** slow to sprout; lasts two seasons.
- **Calendula, chamomile:** flowers for tea and skin salves.

## Growing tips
- Most herbs prefer sun and well-drained soil; too much fertilizer and water weakens flavor.
- Harvest often, but take no more than about a third of the plant at once.
- Many herbs make seed easily; save it ([[seed-saving]]).

## Drying herbs
1. Cut stems in the morning after dew has dried.
2. Tie small bundles and hang upside down in a shaded, airy, dry place for 1–2 weeks until they crumble.
3. Strip the leaves, store whole in tightly sealed jars away from light. Good for about a year.
- Basil and cilantro keep better chopped and frozen in oil than dried.
- Oven drying: lowest setting, door ajar, until crisp.

## Teas and home uses (basic and gentle)
- **Mint:** tea for upset stomach.
- **Chamomile:** relaxing tea before bed.
- **Lemon balm:** mild calming tea.
- **Thyme:** tea or honey syrup for coughs and sore throat (traditional use).
- **Calendula:** infused in oil for dry skin and minor irritations (skin only).
- **Garlic and onion:** food that supports health; also used as simple home remedies.

> WARNING: Only use plants you have positively identified, in moderate amounts. Some herbs are unsafe in pregnancy, with certain medicines, or in large doses. Do not use comfrey internally. Herbs are not a replacement for treating serious illness. See [[herbal-remedies]] for what has evidence and what does not, and [[infection-antibiotics]] for the limits of home care.

## Why chickens
They are the easiest animal for beginners: eggs, meat, pest control, and excellent manure. A small flock of 6–12 hens can give a family fresh eggs most of the year.

## Housing
- **Space:** at least 3–4 sq ft (0.3–0.4 m²) inside the coop per bird, and 10 sq ft (1 m²) of outdoor run per bird.
- **Roosts:** flat-topped bars, 8–12 in (20–30 cm) per bird, set higher than nest boxes. Chickens sleep on roosts.
- **Nest boxes:** about 12 in (30 cm) cubes, 1 per 3–4 hens, low and dark, with straw.
- **Ventilation:** openings high above the roosts to let moisture out without drafting on the birds.
- **Predator-proof:** use **1/2-in hardware cloth**, not chicken wire (it keeps in chickens but not raccoons). Bury it 12 in (30 cm) or lay an 18-in apron outward. Raccoons open simple latches: use two-step latches. **Shut the birds in at dusk.**

## Feeding and water
- **Chicks:** starter feed (18–20% protein) for the first 8 weeks, then grower.
- **Hens:** a layer ration (about 16% protein) once they start laying, with **free-choice crushed oyster shell** for strong eggshells.
- **Grit** (small stones) is needed if they cannot scratch in soil.
- Table scraps, garden waste, weeds, grain, and insects stretch feed. A hen eats about 1/4 lb (115 g) a day.
- **Water:** clean and always available (about a pint a day; much more in heat). Break ice or use a heated dish in winter.

> WARNING: Never feed chickens raw or dried beans (toxic), avocado, chocolate, moldy food, or large amounts of onion, salty food, or green potato peelings.

## Eggs
- Hens start laying at 5–6 months. Good laying breeds make 250–300 eggs in their first year; heritage breeds 150–200. Production falls about 15–20% a year.
- Laying slows in winter (less light) and during a yearly molt. This is normal.
- Collect daily. Unwashed fresh eggs keep for weeks; see [[eggs-dairy-honey-storage]].
- Old hens make good stewing meat.

## Chicks and hatching
- A **broody hen** sits on eggs constantly and will not leave the nest. Give her 8–12 eggs; they hatch in **21 days**. Keep feed and water close to her.
- A rooster is only needed for fertile eggs: 1 rooster per 8–12 hens.
- **Brooder for chicks:** keep at 95 °F (35 °C) the first week, then lower by 5 °F (3 °C) each week until feathered (about 6 weeks). Chicks that huddle under the heat are cold; those far away are too hot. Heat lamps cause fires: secure them well or use a heating plate.

## Breeds
Dual-purpose breeds (Rhode Island Red, Plymouth Rock, Sussex, Orpington, Wyandotte) lay well and give decent meat. Fast-growing meat hybrids reach 5–6 lb in 6–8 weeks but do not breed true and are not self-sustaining.

## Health and predators
- **Mites and lice:** scratching, pale combs, a drop in laying. Give a dust-bathing area of dry soil mixed with wood ash.
- **Coccidiosis:** bloody droppings in chicks, damp litter. Keep litter dry.
- **Respiratory illness:** sneezing, bubbly eyes. Isolate the sick; sick birds are often culled.
- **Avian influenza** can kill whole flocks and can infect people. Keep wild birds away from feed and water, wash your hands, and cook eggs and meat thoroughly. Report sudden die-offs if you can.
- **Predators:** raccoon, fox, coyote, dog, hawk, owl, snake, rat. Strong coop, lock at night, cover the run top if hawks are a problem.

Processing: [[butchering-livestock]]. Feed and health in general: [[animal-health-feed]].

## Why rabbits
Rabbits are quiet, small, and breed fast. A doe can raise roughly 20–40 fryers a year (each about 2.5–3 lb / 1.1–1.4 kg dressed), on hay, greens, and a little feed. Their manure can go straight on the garden.

- **Pellets** (16–18% protein): about 4–6 oz (115–170 g) a day for a medium adult.
- **Hay** (grass hay or alfalfa) always available. It keeps the gut working.
- **Greens and garden surplus:** dandelion, clover, plantain, carrot tops, kale, grass. Introduce new greens slowly.
- Avoid: potato leaves and green potatoes, rhubarb leaves, avocado, raw beans, onions, wilted greens, or large amounts of cabbage (gas).

1. Does and bucks mature at 5–6 months (medium breeds). Wait a bit longer for first breeding.

5. Kits open their eyes at about 10 days, leave the nest at 3 weeks, and are weaned at **6–8 weeks**.
6. Rebreed the doe about 2–6 weeks after kindling; 3–4 litters a year is sustainable.

Fryers are ready at **8–12 weeks (4–5 lb / 1.8–2.3 kg live)**. See [[butchering-livestock]] for processing. Cook thoroughly ([[safe-cooking-temps]]). Check the liver at butchering: spots or discoloration mean disease; discard the animal ([[game-meat-safety]]).

Pelts can be tanned ([[leather-hides]]). Manure is excellent fertilizer and safe to use fresh; red worms thrive under hutches.

## Big picture
Goats, sheep, and cattle turn grass and brush into milk and meat. They also need land, strong fences, steady feed, and attention at birth. Learn from an experienced neighbor first. Never keep a single goat or sheep: they are herd animals and fret alone.

## Goats
- **Shelter:** 15–20 sq ft (1.5–2 m²) each in a dry, draft-free shed, plus 200 sq ft of yard. Provide high places to climb.
- **Fencing:** goats escape. Use 4-ft (1.2 m) woven wire with small openings, plus a hot wire if you can.
- **Feed:** goats prefer browse (brush, leaves, weeds) and hay. Dairy goats in milk need extra grain or alfalfa. Offer **loose minerals made for goats** (they need copper).
- **Water:** clean, 1–4 gallons (4–15 L) a day.
- **Milk:** a good dairy goat gives 1–2 gal (4–8 L) a day at peak, for about 10 months after kidding. Goat milk is easy to digest.
- **Breeding:** gestation about 150 days. Does usually kid easily, often twins or triplets. Dry off the doe about 2 months before kidding.

## Sheep
- 4–6 ewes per acre of good pasture. Hardy, quiet, and produce meat and wool. Hair sheep need no shearing.
- Shear yearly in spring. Wool takes work to clean but is useful for warm clothing.
- **Gestation about 147 days.** Lambing usually goes well; watch for a ewe pushing for over an hour with no progress.
- **Never give sheep goat minerals:** copper is toxic to sheep.
- Predators (dogs, coyotes) kill many sheep. A strong fence, night-time shelter, and a livestock guardian dog or donkey help.

## Cattle
- Need about 1–2 acres per animal on good pasture (many more in poor country), strong fences, and a handling pen.
- A small family dairy cow (Jersey, for example) gives 3–5 gal (11–19 L) of milk a day. Milk twice a day at the same times. Gestation about 283 days (9 months).
- A cow needs 20–30 lb (9–14 kg) of hay a day without pasture, and 10–25 gallons (40–95 L) of water.
- Beef steers take 18–24 months and give roughly 400–500 lb (180–225 kg) of meat. Slaughter and butchering of cattle need real training and equipment ([[butchering-livestock]]).

## Milking basics
1. Wash your hands. Wipe the udder and teats clean with warm water and a clean cloth.
2. Squeeze the first 2 squirts from each teat into a separate cup. Look for clots, strings, or blood (**mastitis**).
3. Close thumb and forefinger at the top of the teat, then squeeze with the other fingers in turn, pushing milk out. Do not pull.
4. Milk into a clean stainless or glass pail, strain it, and chill fast. See [[dairy-basics]].

## Care routine
- **Hooves:** trim every 6–8 weeks (goats, sheep). Overgrown hooves cause limping and foot rot.
- **Worms:** the "barber pole" worm drinks blood and causes anemia. Check the inside of the lower eyelid: pale pink or white means anemia and needs treatment. Rotate pastures and do not graze short grass.
- **Bloat:** a swollen left side after lush clover or alfalfa is an emergency: walk the animal and get help.
- Quarantine new animals for at least 2–4 weeks.
- See [[animal-health-feed]].

## Birthing: when to get help
Call an experienced person or vet if the mother strains hard more than 30–60 minutes without progress, if you see only one leg or a tail, or if the baby is stuck. Babies must nurse **colostrum** (first milk) within the first hours of life.

> NOTE: Raw milk can carry germs (Brucella, Listeria, Salmonella, E. coli). Pasteurize it at home before drinking; see [[dairy-basics]].

## Why bees
Bees make honey (a food that never spoils), beeswax (candles, salve), and pollinate your garden and fruit trees. Beekeeping is a craft best learned from a mentor. Join a local beekeeping group before you buy bees.

## Hive types
- **Langstroth:** stacked boxes with movable frames. The standard. Full boxes are heavy (about 60–80 lb / 27–36 kg).
- **Top-bar:** a horizontal hive with bars across the top. Easier on the back and cheap to build; lower honey yield.
- You can start with a **package** (about 3 lb / 1.4 kg of bees and a queen) or a **nucleus** (5 frames of bees) in spring, or catch a swarm.

## Siting
- Sunny with morning sun, sheltered from wind, level, and well drained.
- A water source (pond, trough with floating sticks) within a short distance.
- Entrance facing south or southeast. Keep a fence or hedge so bees fly up over people's heads.
- Away from where people walk or children and animals play.

## A colony
One **queen** lays up to 1,500 eggs a day; **workers** (female) number 20,000–60,000 in summer; **drones** (male) mate and are driven out in fall. A worker takes about 21 days from egg to adult.

## Handling
- Wear a veil and gloves; use a **smoker** (burn burlap or dry pine needles) to calm bees.
- Open hives on warm, calm, sunny days around midday, when foragers are away. Move slowly and smoothly.
- Inspect every 1–2 weeks in spring and summer. Look for eggs, larvae, honey, and disease.
- Give more space (another box) when frames are 7/10 full, to prevent swarming.

## Swarms
In spring a crowded colony splits: the old queen leaves with half the bees and clusters on a branch. Swarms are usually gentle. A swarm can be shaken into a box and hived.

## Honey harvest
- A good colony in a good year can give 30–60 lb (14–27 kg) of surplus honey. In the first year, expect little or none.
- Harvest only **capped honey** (wax-sealed cells); uncapped honey may be too wet and ferment.
- Brush bees off frames, uncap with a warm knife, and **spin** in an extractor, or **crush and strain**: cut comb into a bucket, mash it, and strain through a cloth or mesh. Crushing destroys the comb, so the bees must rebuild.
- **Leave winter stores:** about 60–90 lb (27–40 kg) in cold climates, 30–40 lb (14–18 kg) in mild ones. If you take too much, the colony starves.

## Pests and disease
- **Varroa mites** are the main killer of colonies. Check by sugar roll or alcohol wash and treat according to label and local rules.
- **American foulbrood** (sunken, greasy brood cappings, a ropy mess when probed with a stick) is serious and usually reportable. Hive and bees are often burned.
- Wax moths and small hive beetles attack weak colonies. Keep colonies strong.

## Stings
Scrape out the stinger with a fingernail or card right away (do not squeeze). Wash and apply ice. If someone has trouble breathing, swelling of the face, or hives, treat as an emergency: [[allergic-reaction]]. **Do not keep bees if anyone nearby has serious bee allergy.**

## Honey and wax
- **Honey** keeps indefinitely in a sealed jar. It may crystallize; warm gently in a water bath below 110 °F (43 °C).
- **Never give honey to babies under 12 months** (botulism risk).
- Honey can dress wounds ([[wound-care]]) and sweeten food ([[making-staples]]).
- **Beeswax:** melt in a double boiler (never directly over flame) and strain; use for candles and salve ([[soap-candles]]).
`

    body: `
## Before you start
- Learn this from someone experienced if you can. It is not pleasant, but it can be done calmly and humanely.
- **Plan:** sharp knives, clean work area, clean water, a way to chill the meat fast (cooler with ice or cold water), and a place to dispose of waste.
- **Withhold feed** (not water) for 8–12 hours before slaughter to empty the gut.
- Keep animals calm. Work quickly, cleanly, and with respect. **Never process a sick animal for food.** See [[game-meat-safety]].
- Wash hands and tools often. Gut and gall contamination spoils meat.

## Chickens (and other poultry)
### Killing
- **Killing cone:** place the bird head-down in a cone (traffic cone or sheet metal). With a very sharp knife, cut the large blood vessels on both sides of the neck just below the jaw. The bird bleeds out and loses consciousness quickly. Leave in the cone for about 2 minutes. Wing flapping afterward is a reflex.
- **Neck pull:** a quick, firm pull and stretch of the neck separating the skull from the spine is also used. Practice with someone experienced.

### Scalding and plucking
1. Dip the bird in water at **145–150 °F (63–66 °C)** for 30–60 seconds (up to 2 minutes for older birds). Too hot tears skin.
2. Wing and tail feathers should pull out easily. Pluck all feathers by hand; rub gently so the skin stays whole.
3. Singe any hairs over a flame.

### Eviscerating (cleaning)
1. Cut off the head (if not already) and feet at the joint.
2. Cut around the vent (the rear opening) without cutting the intestine.
3. Open the belly, reach in with your hand, and pull out all the organs together.
4. Keep the heart, liver (cut off the green **gall bladder** without breaking it; bile makes meat bitter), and gizzard (cut open and peel).
5. Remove the lungs and kidneys along the spine, and the windpipe and crop at the neck.
6. Rinse inside and out with cool, clean water.
7. **Chill** to 40 °F (4 °C) or below within 2 hours. Rest the meat in the cold 12–24 hours before cooking for tenderness.

## Rabbits
1. Dispatch quickly and humanely by cervical dislocation (a sharp stretch and twist of the neck) or a sharp blow to the back of the head.
2. Hang by a hind leg. Cut around the hind legs at the hock and slit down the inside of each leg to the crotch.
3. Pull the skin down over the body like peeling off a sock. Cut off the feet, tail, and head.
4. Open the belly from the crotch toward the breastbone, careful **not to cut the bladder or intestines**.
5. Remove the organs. Keep the heart, liver, and kidneys if healthy. **White spots on the liver mean disease: discard.**
6. Rinse, chill, and use within 2–3 days or freeze.

## Larger animals (goat, sheep, pig, calf)
This needs training, strong tools, and help. In outline:
1. A stunning method that makes the animal immediately unconscious (properly placed gunshot or captive bolt), then bleed by cutting the large neck vessels.
2. **Skin** (goat, sheep, calf) or **scald and scrape** (pig, about 140–145 °F / 60–63 °C).
3. Remove the **entrails** carefully without cutting the stomach, intestines, or bladder. Tie off the rectum first.
4. Split the carcass along the spine if needed.
5. **Chill** to 34–40 °F (1–4 °C) quickly. Meat hangs 2–7 days in cold weather (never above 40 °F / 4 °C) to age and tenderize.
6. Cut into joints and portions. Preserve or cook soon ([[smoking-curing-salting]], [[canning-basics]], [[drying-dehydrating]]).

## Food safety
- Cook to safe temperatures ([[safe-cooking-temps]]).
- Keep raw meat away from other foods. Wash cutting boards and knives with hot soapy water and sanitize.
- Wear gloves if you have cuts; wash well afterward. Animals can carry germs (Salmonella, Campylobacter, E. coli).
- If the meat smells bad, feels slimy, or the animal was sick, do not eat it.

## Waste
Bury offal and bones at least 3 ft (1 m) deep, far from wells and streams (100 ft / 30 m or more), or compost in a hot pile. Cover to keep out scavengers. Use blood, feathers, and guts in compost where possible ([[compost-fertilizer]]).

    body: `
## Milk hygiene
Clean milk makes safe, good-tasting dairy.
1. Wash your hands and clean the udder with warm water and a clean cloth.
2. Squirt the first 2 streams from each teat into a separate cup; look for clots or blood (**mastitis**). Do not use milk from a sick animal.
3. Milk into a clean, scalded stainless-steel or glass pail.
4. **Strain** through a clean cloth or fine filter into clean jars.
5. **Chill fast** to 40 °F (4 °C) or below within an hour: set jars in ice water, a cold stream, or a cold cellar.
6. Wash all equipment in hot, soapy water, rinse, and scald with boiling water.

## Raw milk and pasteurizing
Raw milk can carry dangerous germs (Listeria, Salmonella, E. coli, Campylobacter, Brucella, tuberculosis). **Children, pregnant women, the elderly, and anyone with a weak immune system should not drink it raw.** If you cannot be sure the animal is healthy, pasteurize.

**Home pasteurizing (use a thermometer):**
- **Low-temperature hold:** heat to **145 °F (63 °C)** and hold for **30 minutes**, stirring. Heat it in a pot set in a larger pot of water to avoid scorching.
- **High-temperature:** heat to **161 °F (72 °C)** for **15 seconds**.
- Then cool quickly in an ice-water bath.
- Without a thermometer: bring milk just to a simmer (steaming, small bubbles at the edge), then cool. Not exact, but better than nothing.

## Butter
1. Let milk sit in a cool place for 12–24 hours; the cream rises. Skim it off. (Or use whipping cream.)
2. Let the cream warm slightly to about 60 °F (15 °C).
3. Shake in a jar, churn, or whip until it separates into solid butter and liquid **buttermilk** (about 10–20 minutes).
4. Pour off the buttermilk (drink or cook with it). **Wash the butter** by kneading it in cold water until the water runs clear. Leftover buttermilk spoils butter.
5. Salt to taste (about 1 teaspoon per pound / 450 g) and press out water.

## Yogurt
1. Heat 1 quart (1 L) milk to 180 °F (82 °C), hold a few minutes (makes it thicker), then cool to **110–115 °F (43–46 °C)**.
2. Stir in 2 tablespoons of plain yogurt with live cultures (your starter).
3. Keep warm at about 110 °F for **6–12 hours**: in an insulated cooler with jars of warm water, or in a warm oven with only the pilot or light on.
4. Chill. Save a few spoonfuls to start the next batch.

## Simple fresh cheese (paneer / farmer cheese)
1. Heat 1 gallon (4 L) of milk to about 185–190 °F (85–88 °C), stirring.
2. Add 1/4–1/2 cup (60–120 mL) of vinegar or lemon juice slowly until the milk splits into curds and clear whey.
3. Pour through a cloth. Hang or press for 30 minutes to several hours. Salt.
4. Eat within about a week, kept cool. **Ricotta:** reheat the whey to near boiling and skim off the fine curds.

## Aged cheese (outline)
Aged (rennet) cheeses keep for months without refrigeration but need tested recipes and care: warm the milk to about 86–90 °F (30–32 °C), add starter culture and rennet, let it set until it breaks cleanly, cut the curd, heat gently, drain, salt, press for 12–24 hours, then age at 50–55 °F (10–13 °C) and high humidity for weeks to months. Follow a tested recipe for your cheese type. A coat of wax protects aged cheese ([[eggs-dairy-honey-storage]]).

## Storing without refrigeration
- **Ghee (clarified butter):** simmer butter gently until the milk solids settle and brown and the fat is clear and golden. Strain through cloth. Stays good for months at room temperature in a clean jar, kept dry.
- **Hard waxed cheese** keeps for months in a cool place.
- Butter keeps a few weeks when well washed, salted, and kept cool.
- **Whey** can feed pigs and chickens or go in bread.

See [[goats-sheep-cattle]] and [[food-safety-basics]].
`

## Water first
Animals die of thirst faster than hunger. Approximate daily water:

| Animal | Water per day |
|---|---|
| Chicken | About 1 pint (0.5 L), more in heat |
| Rabbit | 1 pint to 1 quart (0.5–1 L) |
| Goat or sheep | 1–3 gal (4–11 L); more in milk or heat |
| Pig | 2–5 gal (8–19 L) |
| Cow | 10–25 gal (38–95 L) |

In freezing weather, break ice twice daily or use a heated or insulated bucket. Never let animals run dry.

## Feeding without feed stores
- **Hay:** animals eat about 2–3% of body weight in dry matter daily. A 1,000 lb cow needs about 25 lb of hay; a 150 lb goat or sheep about 4–5 lb.
- **Winter feed math:** animals x daily hay x winter days (often 120–180) + 10–20% reserve.
- Store hay dry, off the ground, and covered. **Damp hay can heat up and burst into flame**. Never feed moldy hay.
- **Grain** (oats, barley, corn, wheat) stored in rodent-proof bins. Sunflower seeds and kitchen scraps help chickens.
- **Pasture:** rotate animals so grass can rest and regrow. Overgrazing kills pasture and spreads worms.
- **Salt and minerals:** keep loose salt or mineral available. Goats need copper; **sheep must never get goat minerals** (toxic).
- Garden surplus, weeds, acorns (for pigs), sprouted grain fodder, whey, and insects all stretch feed.

## Spotting illness
Signs: off feed, standing apart, dull eyes, hunched posture, diarrhea, cough, nasal or eye discharge, limping, bloated belly, or isolated behavior. Check animals twice a day.

**Normal temperatures** (rectal): cattle 100.4–102.5 °F; sheep and goats 101.5–103.5 °F; pigs 101–103 °F; rabbits 101–103.5 °F; chickens 105–107 °F.

## Common problems
- **Worms and parasites:** rotate pastures, keep animals off short grass, and check pale eyelids in goats and sheep.
- **Lice, mites:** dust baths for poultry; clean bedding.
- **Bloat:** swollen left side after lush clover or alfalfa; walk the animal and get help quickly.
- **Mastitis:** hot, hard, painful udder, clots in milk.
- **Foot rot, hoof overgrowth:** trim and keep pens dry.
- **Wounds:** wash with clean water, keep covered or fly-repellent in summer.

## Quarantine and biosecurity
Isolate new or sick animals for 2–4 weeks. Do not share tools between groups. Wash hands and boots. Many animal diseases (avian influenza, brucellosis, Q fever, leptospirosis, Salmonella) can infect people. See [[disease-prevention]].

## Birthing
- Provide a clean, dry, draft-free place and calm.
- Newborns **must** nurse **colostrum** (first milk) within the first few hours.
- If the mother strains for 30–60 minutes with no progress, or only a tail or one leg shows, get help ([[goats-sheep-cattle]]).

## Winter and heat
- **Cold:** windbreak, dry bedding, extra feed (animals burn feed to stay warm), unfrozen water.
- **Heat:** shade, ventilation, water, and wet-down for pigs, rabbits, and poultry ([[rabbits]]).

## Predators
Predators include dogs, coyotes, foxes, raccoons, hawks, owls, and snakes. Use secure night housing, strong fencing (electric wire helps), guardian animals (dogs, donkeys, llamas), and lights.

## Poisonous plants for animals
Rhododendron, azalea, oleander, yew, wilted wild cherry leaves, nightshades, bracken fern, and moldy feed can kill livestock. Avocado is toxic to birds and rabbits. Walk your pasture and pull what you cannot identify ([[deadly-plants]]).

## Carcass disposal
Bury at least 3 ft (1 m) deep and well away from wells and streams (100 ft / 30 m or more), or compost in a hot pile. Do not feed carcasses to other animals. Report suspected anthrax or avian influenza if there is anyone to report to.

More: [[livestock-overview]], [[butchering-livestock]].
`

## Do this first
1. Judge food by **temperature and time**, not by smell. Dangerous food often looks and smells normal.
2. Keep cold food at or below **40 °F (4 °C)** and hot food at or above **140 °F (60 °C)**.
3. Throw out perishable food (meat, poultry, fish, dairy, eggs, cooked leftovers, cut melon, cooked rice and pasta) that has sat between 40 and 140 °F for **more than 2 hours** — or **1 hour** if the air is above 90 °F (32 °C).
4. Never taste food to "test" it.
5. When in doubt, throw it out. Put it where children and animals cannot get it.

## The danger zone
Between 40 and 140 °F (4–60 °C) bacteria can double in as little as 20 minutes. Cooking to a safe temperature kills most of them, but some make toxins that cooking does not destroy. Hot food must stay hot (above 140 °F) or be cooled quickly.

| Situation | Rule |
|---|---|
| Refrigerator with no power | Food stays safe about 4 hours if the door stays shut |
| Full freezer with no power | About 48 hours (door shut) |
| Half-full freezer | About 24 hours |
| Food with ice crystals or still 40 °F or colder | May be refrozen or cooked |
| Perishable food above 40 °F for 2+ hours | Discard |
| Cooked leftovers, refrigerated | Use within 3–4 days |
| Cooked leftovers, no refrigeration | Eat the same day; do not save |
| Cooked rice or pasta left out over 2 hours | Discard; reheating does not remove the toxin |

See [[power-outage-basics]] and [[keeping-cold]] for what to eat first.

## Botulism: the silent killer
Botulism toxin is one of the most poisonous substances known. You cannot see, smell, or taste it.

> DANGER: Never taste-test home-canned or canned food you are unsure about. A tiny amount of botulism toxin can paralyze or kill.

Botulism bacteria thrive where there is **no oxygen, low acid, moisture, and room temperature**: sealed jars of vegetables, meat, or beans; garlic or herbs in oil; foil-wrapped baked potatoes left warm. Their spores survive boiling. Only a **pressure canner** (240 °F / 116 °C) kills them, which is why low-acid foods must never be water-bath canned (see [[canning-basics]], [[pressure-canning]]).

**Symptoms** appear 12–36 hours after eating (sometimes 6 hours to 10 days): double or blurred vision, drooping eyelids, slurred speech, trouble swallowing, dry mouth, then weakness that spreads down the body and trouble breathing.

> CALL: Suspected botulism is a life-threatening emergency. Get medical help immediately; antitoxin works best early. Keep the suspect food, sealed and untouched, for testing.

## Throw away if
- A can or jar is bulging, leaking, spurting liquid when opened, or has a lid that is unsealed or domes up.
- A can is deeply dented along a seam, or rusted through.
- The food smells off, looks foamy, cloudy, slimy, or has mold.
- It was canned at home without a tested recipe.

## Mold rules
- **Hard cheese, firm vegetables (cabbage, carrots, peppers):** cut at least 1 inch (2.5 cm) around and below the mold. Keep the knife out of the mold.
- **Discard completely:** soft cheese, yogurt, bread, cooked foods, jam, soft fruit and vegetables, nuts, peanut butter, grains and flour with mold.
- Do not sniff moldy food; spores irritate the lungs.

## After floods or fire
- Discard food that touched floodwater unless it is in an undamaged, **waterproof** can. Screw caps, snap lids, pull tops, crimped caps, cardboard, and **home-canned jars** cannot be made safe.
- Sound commercial cans can be saved: remove labels, wash, then soak 15 minutes in 1 tablespoon of unscented bleach per gallon of safe water (see [[flood]]). Re-label with marker.
- Food near fire may be contaminated by smoke, fumes, or heat: discard.

## Handling basics
Wash hands before cooking ([[handwashing-hygiene]]). Keep raw meat away from ready-to-eat food. Cook to safe temperatures ([[safe-cooking-temps]]). Cool leftovers in shallow containers. Write dates on everything.

## Two methods, one rule
- **Water-bath canning** (boiling water, 212 °F) is only for **high-acid foods**: fruit, jam, pickles, and tomatoes with added acid. See [[water-bath-canning]].
- **Pressure canning** (about 240 °F / 116 °C) is **required** for all low-acid foods: vegetables, meat, poultry, fish, beans, soups. See [[pressure-canning]].
- The dividing line is pH **4.6**. Foods above 4.6 (less acidic) can grow botulism if canned in a boiling-water bath.

> WARNING: Use only **tested recipes** from the National Center for Home Food Preservation (NCHFP), USDA, or the Ball Blue Book. Do not change ingredient amounts, thickeners, acid, or jar sizes. Never invent a canning recipe.

## Equipment
- **Jars** made for canning, with no chips or cracks. Pint and quart are standard.
- **New flat lids** every time. Rings can be reused if not bent or rusty.
- **Canner:** a deep pot with a rack for water-bath; a true **pressure canner** (not a small pressure cooker) for low-acid food.
- Jar lifter, funnel, non-metal spatula (to release bubbles), ladle, clean towels, a timer, and a thermometer.

## Steps for every jar
1. Wash jars, lids, and rings. Keep jars hot (in the canner or hot water) until filled.
2. Fill with **hot-pack** (food heated first) or **raw-pack** (uncooked food), as the recipe says.
3. Leave the correct **headspace** (space between food and rim): about ¼ inch (6 mm) for jam, ½ inch (12 mm) for fruit, tomatoes and pickles, about 1 inch (2.5 cm) for most pressure-canned foods. Follow the recipe.
4. Slide the spatula around the inside to release air bubbles; add liquid if needed.
5. **Wipe the rim** clean. Any grease or food prevents a seal.
6. Put on the lid and screw the ring on **fingertip-tight** (not forced).
7. Process for the full tested time, adjusted for altitude.
8. Move jars to a towel, out of drafts, and leave **undisturbed 12–24 hours**. Do not tighten rings or tilt jars.

## Check the seal
After cooling, press the center of each lid: it should not flex or pop. Remove the ring and lift the jar by the lid edge; it should hold. Jars that did not seal: refrigerate and eat within a few days, or reprocess within 24 hours with a new lid.

Wash jars, remove rings, label with contents and date, and store in a cool, dark, dry place. Best quality within about 1 year; safe as long as the seal is intact and the food looks and smells normal.

## Spoilage and disposal
Signs: bulging or loose lid, leaking, spurting liquid, mold, cloudy or foamy liquid, bad smell.

> DANGER: Do not taste. Seal the jar in a bag and put it in the trash out of reach of animals and children. Wipe spills with 1 part bleach to 5 parts water and wash your hands well.

As an extra safety step, boil home-canned low-acid foods (vegetables, meat) for at least 10 minutes before eating (add 1 minute for each 1,000 ft above 1,000 ft).

## Never do these
- Oven canning, microwave canning, open-kettle canning, or turning jars upside down to "seal".
- Water-bath canning of vegetables, meat, beans, or soups.
- Canning dairy, butter, or garlic or herbs in oil.
- Using a dial gauge you have not had tested.

## Grid-down reality
Canning needs lots of fuel, clean water, and **new lids**, which wear out and cannot be made at home. Stock extra lids (they last a few years in a cool, dry place), a spare canner gasket, and a weighted gauge if you can. Wood stoves are harder to keep at steady pressure than gas or electric; practice now. Drying ([[drying-dehydrating]]) and fermenting ([[fermenting-pickling]]) use less fuel.

## What can go in a water bath
Only **high-acid foods**: fruits and fruit juices, jams, jellies, applesauce, pickles and relishes (with the correct vinegar), tomatoes **with added acid**, and tested salsas and chutneys.

> WARNING: Plain vegetables, beans, corn, meat, soup, and mixed low-acid foods must **never** be water-bath canned. They need a pressure canner ([[pressure-canning]]). Read [[canning-basics]] first.

## Method
1. Fill the canner with water and heat. For hot-packed food start near 180 °F (82 °C); for raw-packed food start near 140 °F (60 °C).
2. Fill and seal jars as described in [[canning-basics]].
3. Lower the jars onto the rack. Water must cover jar tops by **1–2 inches (2.5–5 cm)**.
4. Cover and bring to a **full rolling boil**. **Start the timer only then.** Keep the boil steady; add boiling water if the level drops.
5. When time is up, turn off the heat, remove the lid, and wait **5 minutes**.
6. Lift jars straight up with a jar lifter; cool 12–24 hours undisturbed.

Modern tomatoes can be borderline acidic. Add to **every jar**:
- **Bottled** lemon juice: 2 Tbsp per quart, 1 Tbsp per pint, **or**

Use bottled juice, not fresh, because its acidity is consistent. Salt is optional. Use only ripe, unspoiled tomatoes.

| Tomato juice (with acid) | 35 min | 40 min |
| Whole tomatoes in water (with acid) | 40 min | 45 min |
| Fresh-pack dill pickles | 10 min | 15 min |

> IMPORTANT: Times depend on the exact recipe, pack style, and jar size. Treat this table as a guide and **confirm against current NCHFP tables** or your tested recipe.

- Use **vinegar of at least 5% acidity**. Never reduce the vinegar or dilute it beyond the recipe.

## When it goes wrong
If a jar fails to seal, refrigerate it. If a jar looks or smells wrong, follow the disposal steps in [[canning-basics]]. See [[food-safety-basics]].

## Why a pressure canner
Botulism spores survive boiling. Only the heat of a pressure canner (about **240 °F / 116 °C**) destroys them in jars. **Every low-acid food must be pressure canned**: vegetables (except tomatoes with acid), meat, poultry, fish, beans, soups, and stews. Read [[canning-basics]] and [[food-safety-basics]] first.

> DANGER: A pressure canner is a pressure vessel. Never leave it unattended while pressurized. Never force the lid open. Keep the vent pipe clear.

## Pressure by gauge type and altitude
| Altitude | Weighted gauge | Dial gauge |
|---|---|---|
| 0–1,000 ft (0–305 m) | 10 lb | 11 lb |
| 1,001–2,000 ft | 15 lb | 11 lb |
| 2,001–4,000 ft | 15 lb | 12 lb |
| 4,001–6,000 ft | 15 lb | 13 lb |
| 6,001–8,000 ft | 15 lb | 14 lb |

Dial gauges must be **tested for accuracy every year**. A weighted gauge needs no testing and is easier for grid-down use.

## Steps
1. Put the rack in the canner with 2–3 inches (5–8 cm) of hot water (or as your manual says).
2. Fill and seal jars (pints or quarts only; **never larger**). Use about 1 inch (2.5 cm) headspace.
3. Set jars on the rack. Lock the lid.
4. **Vent:** heat on high until steam flows steadily from the vent pipe, then keep it venting for **10 minutes**. This removes air.
5. Close the vent or place the weight. Bring to the target pressure. **Start timing only when the target pressure is reached.**
6. Keep pressure steady. If it falls below the target, bring it back and **restart the full time**.
7. When time is up, turn off the heat. **Let the canner cool and depressurize on its own.** Do not run it under water.
8. When the gauge reads zero, wait about 2 minutes, remove the weight, wait about 10 more minutes, then open the lid tilted away from you.
9. Let jars rest in the canner a few minutes, then cool 12–24 hours undisturbed.

| Beef, pork, venison (strips, cubes) | 75 min | 90 min |
| Chicken or rabbit, with bones | 65 min | 75 min |
| Chicken or rabbit, without bones | 75 min | 90 min |
| Dry beans or peas (rehydrated) | 75 min | 90 min |
| Vegetable or meat soup (no seafood) | 60 min | 75 min |

## Meat notes
Use fresh, well-chilled meat. Trim large fat. Pack hot (precooked) or raw with no added liquid; salt is optional. Wild game must be handled and cleaned well ([[game-meat-safety]]).

## Never can these
- Dairy, butter, ghee, or oil
- Flour, cornstarch, or other thickeners (add after opening)
- Pureed or mashed pumpkin, winter squash, or other dense purees (cubed is tested)
- Pasta, rice, or noodles in soups
- Eggs
- Any size jar bigger than a quart

## Spare parts
Keep an extra gasket, safety (overpressure) plug, and plenty of lids. Practice with water before you need it, ideally on the heat source you would use in an outage ([[cooking-without-power]]).

## Why dry food
Removing water stops bacteria and mold. Dried food is light, lasts for months or years, and needs no fuel to store. Drying needs **heat, low humidity, and air movement**.

## Methods
- **Sun drying:** fruit and herbs only. You need hot, dry, breezy weather: at least about 86 °F (30 °C), humidity below 60%, and 3–4 days in a row. Use screens (not metal like galvanized or aluminum that touches food), raise them off the ground, cover with cheesecloth against insects, and **bring trays indoors at night**. Vegetables and meat are not safe to sun-dry.
- **Oven:** set to the lowest setting (about 140 °F / 60 °C), prop the door open 2–6 inches (5–15 cm) for air flow, use a fan if you have power, and rotate trays.
- **Dehydrator:** fruit about 135 °F (57 °C), vegetables about 125 °F (52 °C), herbs 95–115 °F (35–46 °C).
- **Air drying:** herbs hung in bunches, peppers and beans on strings, in a warm, dry, shaded, airy room. See also the solar dehydrator in [[solar-builds]].

## Preparing food
- Slice thin and even: about ¼ inch (6 mm).
- **Vegetables:** blanch first (steam 2–5 minutes, then cool) to stop enzymes that spoil flavor. Onions, peppers, and herbs usually do not need it.
- **Fruit:** dip light-colored fruit (apples, pears, peaches) in lemon juice or an ascorbic acid solution for 5 minutes to prevent browning.

## When is it dry enough?
- **Fruit:** leathery and pliable, no moisture beads when torn.
- **Vegetables:** brittle or crisp.
- **Herbs:** crumble easily.

## Conditioning and pasteurizing
Pack dried fruit loosely, two-thirds full, in jars for 7–10 days and shake daily. If moisture beads form on the glass, dry it longer. To kill insect eggs, freeze sun-dried fruit 48 hours or heat it in a 175 °F (80 °C) oven 15 minutes.

## Storing
Use airtight jars or bags, in a cool, dark place. Fruit and vegetables keep about 6–12 months at room temperature (longer cool or with oxygen absorbers). Check often for moisture or mold; discard if found. To use, soak 1–2 hours or add straight to soups and stews.

## Jerky safely
> WARNING: Drying alone does not make raw meat safe. Heat the meat to **160 °F (71 °C)** for beef or game, or **165 °F (74 °C)** for poultry, before or after drying.

1. Use lean meat. Trim all fat (it turns rancid). Cut ¼ inch (6 mm) strips.
2. Marinate in a salty or acidic marinade, refrigerated or cold, 6–24 hours.
3. Heat strips in the marinade to a boil for about 5 minutes, **or** bake the finished jerky at 275 °F (135 °C) for 10 minutes.
4. Dry at **130–140 °F (54–60 °C)** until a strip cracks but does not snap when bent.
5. Store airtight. At room temperature it keeps about 1–2 months; refrigerate or freeze for longer.

Wild game also needs care ([[game-meat-safety]]). For long storage of dry goods see [[bulk-dry-storage]]. Wet or smoked meat: [[smoking-curing-salting]].
`

    summary: 'Using salt and smoke to preserve meat and fish, curing salt safety, hot vs cold smoking, and which woods to use.',

    body: `
## Salt is the preservative
Salt pulls water out of meat and bacteria. Smoke adds flavor and a thin surface protection, but **salt and drying do the real work**. Curing needs **cold weather or refrigeration** (36–40 °F / 2–4 °C) while the salt works.

> WARNING: Use only **tested recipes** for curing. Whole hams, dry-cured sausages, and salami without refrigeration can grow botulism if done wrong. Beginners should stick to brined, then cooked or hot-smoked, products.

## Dry cure vs brine
- **Dry cure:** rub meat on all sides with salt (plus curing salt and sugar if the recipe says), pack in a food-safe container, and keep it cold. Liquid draws out and pools; turn the meat daily. Time depends on thickness, so follow a tested recipe.
- **Brine:** dissolve salt in water and submerge the meat for days to weeks, kept cold and under the surface. Weigh your salt: 1 Tbsp of fine table salt is about 18 g. A basic brine is about 5–10% salt (50–100 g per liter of water).

## Curing salt (pink salt)
Curing salt contains sodium nitrite. It prevents botulism and keeps meat pink.
- **Cure #1** is 6.25% nitrite in salt. A typical tested amount is **1 level teaspoon per 5 lb (2.3 kg) of meat**, used for bacon, corned beef, and sausage that will be cooked.
- Measure with a scale or level spoon. **Too much is poisonous.**
- It is dyed pink and must be stored **labeled, away from kitchen salt**. Never use it as table salt.
- Salt-only curing (no nitrite) is the old way for salt pork and salted fish, which are always cooked well before eating.

## Salting fish and meat without nitrite
Gut and split the fish. Pack in layers with plenty of coarse salt (roughly one quarter of the weight of the fish), weight it down, and drain the brine. When firm, hang to dry in a cool, breezy, shady place. Soak in several changes of water before cooking. Salted fish keeps for months when dry.

## Hot smoking vs cold smoking
- **Hot smoking** cooks the meat at about 225–250 °F (107–121 °C) pit temperature. Cook to **165 °F (74 °C)** for poultry, **160 °F (71 °C)** for ground meat, **145 °F (63 °C)** for whole cuts and fish. See [[safe-cooking-temps]]. Keep and eat refrigerated, or dry thoroughly.
- **Cold smoking** (under 90 °F / 32 °C) does **not** cook and is risky. Use only on food already fully cured, with a tested recipe.

## Wood for smoke
- **Use hardwoods:** hickory, oak, apple, cherry, maple, alder, pecan.
- **Never use** pine, spruce, fir, cedar, or any softwood (resin makes bitter, sooty smoke), or treated, painted, or moldy wood.
- Smoke outdoors only: smoke contains **carbon monoxide** ([[poisoning-overdose]]). Watch for fire ([[fire-management]]).

## Storage
Cured and smoked meats keep best cold and wrapped in cloth or paper. Discard anything slimy, with foul odor, or with fuzzy mold on soft surfaces. For jerky see [[drying-dehydrating]]. For meat processing see [[butchering-livestock]] and [[field-dressing-big-game]].
`

## How it works
Fermenting uses salt to let friendly lactic-acid bacteria grow and make the food sour. The acid protects the food. It needs only salt, vegetables, a container, and time. Fermented foods also supply vitamin C in winter ([[nutrition-basics]]).

## Rules that make it safe
1. Use **non-iodized** salt (pickling, canning, or sea salt). Iodine and anti-caking additives can cloud brine.
2. Use chlorine-free water (boil and cool tap water, or let it stand).
3. Keep everything **under the brine**. Vegetables that touch air can mold. Weigh them down with a plate, a clean rock, or a water-filled bag.
4. Keep at about **65–75 °F (18–24 °C)**. Colder is slower; much hotter (above 80 °F) makes mushy, off-tasting food.
5. Use clean containers: glass, ceramic, or food-grade plastic. Not metal.

## Sauerkraut
1. Remove outer leaves. Shred 5 lb (2.3 kg) of cabbage.
2. Mix with **3 Tbsp pickling salt** (about 2–2.5% by weight). Massage until it gives off liquid.
3. Pack tightly into a crock or jar so liquid covers the cabbage by at least 1 inch (2.5 cm). Weigh it down.
4. Cover with a cloth. Ferment about **3–4 weeks at 70–75 °F**; 5–6 weeks at 60–65 °F. Skim any scum.
5. It is ready when bubbling stops and it tastes pleasantly sour. Keep it cold or cool.

## Fermented cucumbers and other vegetables
Use a **3.5% brine**: about 2 Tbsp of fine non-iodized salt per quart (1 L) of water. Add dill, garlic, and grape or oak leaves (they help keep crispness). Pack vegetables to the top, cover with brine, and weigh down. Taste after 3–4 days; most are good in 1–3 weeks.

## Kimchi basics
Cabbage is salted and drained, then mixed with garlic, ginger, chili, and scallions and packed tight. It ferments 1–5 days at room temperature, then is kept cold.

## Good or bad?
- **Normal:** bubbles, cloudy brine, sour smell, a thin white film on top (kahm yeast) that you skim off.
- **Throw out:** fuzzy, colored, or hairy mold; slimy texture; rotten or putrid smell (not sour); anything that smells like rotten eggs.

> WARNING: When in doubt, throw it out. See [[food-safety-basics]].

## Quick vinegar pickles
Pour hot brine of **vinegar (at least 5% acidity)** and water (typically half and half), plus salt and spices, over vegetables. They keep weeks in a cold place. They are **not shelf-stable** unless canned using a tested recipe ([[water-bath-canning]]). Never dilute the vinegar more than the recipe says.

## Making vinegar
Combine apple scraps or cores with sugar water (about ¼ cup sugar per quart of water). Cover with cloth. After 3–4 weeks it turns to hard cider; leave open to air another 4–8 weeks for vinegar, and a jelly-like "mother" forms.

> IMPORTANT: Homemade vinegar has unknown acidity. Use it for cooking and cleaning, **not for canning or shelf-stable pickles**.

## Storage
Keep finished ferments in a cool place, such as a root cellar ([[root-cellar]]), and keep the surface below brine. Properly made kraut keeps many months.

## What a root cellar does
It holds food **cold, humid, dark, and ventilated** without power. Many crops last months with no work beyond harvest and checking.

**Target for most crops:** 32–40 °F (0–4 °C) and 85–95% humidity. Squash and sweet potatoes need warmer, drier storage.

## Crop guide
| Crop | Temp | Humidity | Lasts |
|---|---|---|---|
| Potatoes (dark!) | 38–45 °F (3–7 °C), ideally about 40 | 90% | 4–8 months |
| Carrots, beets, parsnips, turnips, rutabagas | 32–40 °F | 90–95% | 3–6 months |
| Cabbage (late varieties) | 32–40 °F | 90–95% | 3–4 months |
| Onions, garlic | 32–40 °F | 60–70% (dry) | 3–8 months |
| Apples (late varieties) | 30–35 °F | 90% | 2–6 months |
| Winter squash, pumpkins | 50–55 °F | 50–70% (dry) | 2–6 months |
| Sweet potatoes | 55–60 °F | 80–85% | 4–6 months |
| Celery, leeks | 32 °F | 90–95% | 2–3 months |

Do not refrigerate sweet potatoes (they suffer chill damage below 50 °F). Cure potatoes, onions, garlic, squash, and sweet potatoes first ([[harvest-curing]]). Do not store ripe tomatoes or lettuce here.

## Tips
- Store **only sound, unbruised, unwashed** produce. One rotten apple or potato spreads rot.
- **Keep apples apart from vegetables.** Apples give off ethylene gas that makes potatoes sprout and carrots bitter; cabbage and onions pass smells.
- Pack roots in damp (not wet) sand, sawdust, or leaves in boxes or buckets. Trim tops to ½ inch (1 cm).
- Use a thermometer and a hygrometer if you can. Raise humidity with damp sand or pans of water; lower it with air flow.
- Check weekly and remove anything spoiled.

## Ways to build one
1. **Basement corner:** pick a north or northeast corner, away from the furnace. Wall it off, insulate the ceiling, and use a window vent with a screen. Shelves, not floor.
2. **Buried barrel or trash can:** bury a food-grade barrel or galvanized can up to the lid at a slight angle, fill with layers of produce and straw, cover the lid with straw and soil.
3. **Outdoor clamp or mound:** on well-drained ground, lay straw 6–8 inches (15–20 cm) thick, pile produce in a cone, cover with more straw, then 4–6 inches (10–15 cm) of soil. Leave a vent at the top. Dig a drainage ditch.
4. **Trench or pit:** dig below the frost line, line with straw and boards, and cover with a ventilated roof.

> WARNING: If you use an old refrigerator or freezer, remove or disable the latch to prevent child entrapment.

## Ventilation and pests
Use two vents: one low (cool air in) and one high (warm air out), both screened with ¼-inch (6 mm) hardware cloth against mice. Keep stored food in rodent-proof containers.

## Freezing risk
Below 32 °F produce freezes and rots. In deep winter, add bedding, close vents partly, or move crops to a warmer spot. See also [[keeping-cold]] and [[garden-structures]].

## First hours of an outage
1. **Keep fridge and freezer doors shut.** Fridge: about 4 hours. Full freezer: about 48 hours. Half-full: about 24 hours.
2. Put an appliance thermometer inside if you have one. Discard perishables that read above 40 °F (4 °C) for 2 hours or more ([[food-safety-basics]]).
3. **Eat in order:** refrigerator food first (milk, leftovers, meat, eggs), then freezer food as it thaws, then pantry and canned food.
4. Cook thawing meat and eat it the same day, or dry or can it ([[pressure-canning]], [[drying-dehydrating]]).

See [[power-outage-basics]].

## Make a freezer last
- **Keep it full.** Fill empty space with water jugs, which also become drinking water when they thaw. Pack food tightly.
- Cover with blankets (not blocking vents on a running unit).
- Add block ice or dry ice.

## Coolers and ice
- Block ice lasts much longer than cubes. Freeze water in milk jugs or plastic bottles ahead of time.
- Pre-chill the cooler, keep it in shade, keep it closed, and drain meltwater only if you must.
- Keep raw meat in a separate, lower container.

## Dry ice
Dry ice is about **-109 °F (-78 °C)**. About 50 lb (23 kg) holds a full 18-cubic-foot freezer for roughly 2 days.

> DANGER: Wear gloves or use tongs (bare skin gets frostbite). Use only in a **well-ventilated** area; the gas displaces air. Never seal it in an airtight container (it can burst), never store it in a closed vehicle, and never leave it where people sleep.

## Zeer pot (clay pot cooler)
Evaporation cools. It works best in hot, **dry** climates.
1. Take a large unglazed clay pot (porous) and a smaller pot that fits inside with a 1–2 inch (3–5 cm) gap.
2. Fill the gap with wet sand.
3. Put food in the inner pot and cover with a damp cloth.
4. Keep the sand and cloth wet; refill twice a day. Place in shade with a breeze.

It can drop temperature about 10–20 °F (5–11 °C) and keeps vegetables fresh days longer. It does **not** make a safe place for raw meat or milk.

## Natural cold
- **Springhouse:** build a small shed over a spring or stream with cold running water. Sealed jars or crocks sit in the flowing water. Keep it clean and guarded from floods and animals.
- **Well or cold stream:** hang sealed containers on a cord. Never lower open containers into a drinking well ([[water-safety]]).
- **Winter outdoors:** an unheated shed, porch, or snow bank can hold food at 33–40 °F. Use closed metal bins to keep out animals. Sunlight and warm spells can quickly spoil food; use a thermometer.
- **Ice houses:** insulated sheds packed with winter ice blocks and a foot or more of sawdust or straw can last into summer.

> WARNING: Cutting ice is dangerous. Walk only on clear, solid ice at least 4 inches (10 cm) thick, never alone, and carry a rope and ice picks.

## Longer term
If cold storage is not possible, preserve food in ways that do not need it: drying, salting, fermenting, canning, and root cellaring ([[root-cellar]], [[fermenting-pickling]], [[smoking-curing-salting]]).

    body: `
## The basics
Food lasts longest when it is **dry, cool, dark, and sealed from air and pests**. Heat is the main enemy: the warmer the storage, the shorter the life.

**Store what you will eat.** Buy foods your family knows how to cook, and rotate them ([[pantry-rotation]]). Quantities are in [[home-stockpile]].

## Realistic shelf lives (sealed, cool, dry)
| Food | Realistic shelf life |
|---|---|
| White rice | 25–30 years |
| Wheat berries, hard grains | 25–30 years |
| Dry beans | 20–30 years (older beans cook longer and harder) |
| Rolled oats | up to 25–30 years with oxygen absorbers |
| Pasta (no egg) | 20–30 years |
| Sugar, salt (plain) | indefinitely |
| Honey | indefinitely |
| Nonfat dry milk | 10–20 years |
| Freeze-dried foods | 20–25 years |
| White flour, cornmeal | 1–5 years |
| Brown rice | 6–12 months |
| Whole-grain flour | 6–12 months |
| Cooking oils | 1–2 years |
| Nuts, seeds | 6–12 months (longer frozen) |

Company claims are often higher than real life. Always smell and look before you eat.

## Containers
- **Food-grade 5-gallon buckets** (HDPE, marked #2 and with a food-safe symbol) with gasket or screw lids.
- **Mylar bags** (5–7 mil) lined inside buckets, with oxygen absorbers. These stop light, air, and moisture.
- **Glass jars** with tight lids for small amounts.
- **Metal or heavy plastic** garbage cans for rodent-proofing outer storage.

> IMPORTANT: Do not reuse buckets that held paint, chemicals, or non-food items.

## Oxygen absorbers
They remove oxygen to stop insects and slow rancidity.
- Rule of thumb: **300 cc per gallon** of food. A 5-gallon bag takes about 2,000 cc.
- Work fast: absorbers start working once exposed to air. Reseal unused ones immediately.
- **Only for dry foods** with about 10% moisture or less (grains, beans, flour, pasta, oats, powdered milk).
- **Do not use** with sugar, salt, brown sugar, honey, or moist or high-fat foods (dried fruit that is leathery, nuts, oils, jerky). Without oxygen these can allow dangerous bacteria growth.

## Steps for a mylar bag
1. Fill the bag inside the bucket. Shake to settle.
2. Drop in the oxygen absorbers.
3. Squeeze out air, then seal the top with a hot iron or hair straightener.
4. Seal the bucket. Label with contents and date.

## Pests
- Freeze flour and grains **3 days at 0 °F (-18 °C)** to kill insect eggs before storing, if you have a freezer.
- Never leave grain in open paper or thin plastic bags.
- Keep storage off concrete floors (use shelves or pallets) and away from walls where moisture collects.
- Check for webs, moths, holes, or sour smell.

## Best conditions
- Cool is best: under 70 °F (21 °C), steady temperature. Avoid attics, garages, and sheds that bake in summer.
- Dark and dry. Keep away from water heaters and exterior walls.
- Spread storage across more than one place.

## Cooking reality
Rice, beans, and grains need **water and fuel**. A plan to cook them is as important as storing them ([[cooking-staples]], [[cooking-without-power]]). Store salt, oil, spices, and vitamins as well ([[nutrition-basics]]).
`

    body: `
## Why fat matters
Fat has more than double the calories of protein or carbohydrate (about 9 vs 4 per gram). In a food crisis, fat is precious. It is also a cooking oil, lamp fuel, and skin and soap ingredient ([[soap-candles]]).

> WARNING: A diet of only very lean meat (rabbit, lean venison) can cause **protein poisoning ("rabbit starvation")**: nausea, headache, fatigue, diarrhea, and constant hunger. Keep protein to about a third of your calories and eat fat and carbohydrates with it.

## Rendering fat
Best fat: **beef suet** (around kidneys and loin) for tallow; **pork leaf fat** (around kidneys) or back fat for lard.
1. Chill the fat, trim any meat or blood, and chop it small (or grind).
2. Heat **gently** in a heavy pot, slow cooker, or low oven (about 250 °F / 120 °C). For "wet" rendering add a splash of water so the fat does not scorch.
3. Stir occasionally. The fat melts out and the bits (cracklings) turn golden and sink. It is done when bubbling stops, usually 1–3 hours.
4. Strain through a clean cloth or fine sieve into clean, dry jars. Strain twice for the cleanest fat.
5. Cool, then cover.

> DANGER: Hot fat burns badly and starts fires. Never add water to burning fat. Smother a grease fire with a lid or baking soda ([[fire-safety]]).

**Storage:** Water left in fat spoils it, so strain well and keep it dry. Tallow keeps a year or more in a cool, dark place; lard keeps about 6–12 months cool, longer in a cellar or freezer. Discard if it smells rancid or shows mold.

## Pemmican
A traditional high-energy, long-lasting food.
1. Slice **lean** meat (venison, beef) thin and **dry it completely** until it snaps. See [[drying-dehydrating]] for the safe heating step (160 °F / 71 °C).
2. **Grind** it to a coarse powder (blender, mortar, or hand mill).
3. Melt rendered tallow. Mix with the meat powder **about 1:1 by weight** (equal weights).
4. Optionally add dried berries (up to a quarter by weight).
5. Press into balls or bars, or pack in a lined pan. Cool until firm.

It supplies roughly 2,500–3,000 kcal per pound and keeps a year or more if made very dry and stored cool and dry. Check for rancid smell. Wild game needs safe handling ([[game-meat-safety]]).

## Confit (meat stored in fat)
Slow-cook duck, goose, pork, or rabbit at a low simmer (about 190–200 °F) in fat until tender, then pack in a crock and cover with 1–2 inches (2.5–5 cm) of fat.

> WARNING: Confit is **not shelf-stable**. It can grow botulism without cold storage. Keep it below 40 °F (4 °C) and heat to 165 °F (74 °C) before eating.

## Ghee (clarified butter)
Simmer butter slowly until it foams, then crackles, and the milk solids brown. Strain through cloth. Ghee keeps 3–6 months at room temperature, much longer cool. See [[dairy-basics]].

## Use of fat
Cook with it, spread it on bread, add it to beans, rice, and porridge to raise calories, and save every drop. See [[stretching-food]] and [[nutrition-basics]].
`
