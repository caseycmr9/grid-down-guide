    body: `
## The basics
The sun rises roughly in the east and sets roughly in the west. It rises exactly east and sets exactly west only twice a year (around March 20 and September 22). In the northern hemisphere, the sun is due **south** at local solar noon (the middle of the day, not necessarily 12:00 on your clock). In the southern hemisphere it is due **north** at that moment.

- Northern hemisphere, summer: sunrise is northeast, sunset is northwest.
- Northern hemisphere, winter: sunrise is southeast, sunset is southwest.

Use two or more methods and compare. Every method here is approximate.

## Shadow-stick method (works anywhere with sun)
1. Push a straight stick about 3 ft (1 m) long upright into flat, open ground.
2. Mark the tip of its shadow with a pebble.
3. Wait at least 15 minutes. The shadow tip moves.
4. Mark the new tip with a second pebble.
5. Draw a line through both pebbles. The first pebble is **west**, the second is **east** (roughly). A line crossing it at a right angle points north and south.

For a better result, mark the tip every 15 minutes through the day. The shortest shadow happens at local solar noon, and in the northern hemisphere (mid-latitudes) it points north.

## Analog watch method
You need an old-style watch with hands, set to local standard time. If daylight saving time is in effect, use the point halfway between the hour hand and 1 o'clock instead of 12.

- **Northern hemisphere:** Hold the watch flat. Point the hour hand at the sun. Halfway between the hour hand and 12 is **south**.
- **Southern hemisphere:** Point 12 at the sun. Halfway between 12 and the hour hand is **north**.

This is less reliable close to the equator. With no analog watch, draw a clock face on paper or in the dirt.

## The North Star (northern hemisphere only)
Polaris stays almost exactly over true north, within about 1 degree.
1. Find the Big Dipper (seven stars shaped like a ladle).
2. Locate the two stars at the outer edge of the bowl (Dubhe and Merak), the ones farthest from the handle.
3. Draw a line through them and extend it about five times the distance between them. You will reach a moderately bright, lonely star. That is Polaris.
4. Look straight down to the ground below it. That is north.

Cassiopeia (a W or M shape) sits on the other side of Polaris from the Big Dipper. Use it when the Dipper is low or hidden. The height of Polaris above the horizon equals your latitude.

## Southern Cross (southern hemisphere)
Find the Southern Cross, a small kite shape of four bright stars. Extend its long axis about 4.5 times its length. Drop straight down from that point to the horizon. That is roughly **south**.

## Orion and the moon
- **Orion** rises close to due east and sets close to due west for most of the world. Its three-star belt is a handy pointer.
- **Crescent moon:** draw a line connecting the two tips of the crescent and continue it down to the horizon. In the northern hemisphere it points roughly south; in the southern, roughly north. This is a rough guide only.

## Nature signs: mostly unreliable
Moss does not reliably grow on the north side of trees. Tree rings, ant hills, and bird flight are not dependable. Some weak clues exist (in the northern hemisphere, snow melts first on south-facing slopes, and satellite dishes in North America point southeast to south), but never use them alone.

> TIP: Make a "known direction" mark each time you set up camp: pile rocks pointing north, so you do not need to work it out again.

See also: [[map-compass]], [[lost-procedure]], and the Compass in the Tools tab (phone sensors can be wrong near metal and electronics).
`

    body: `
## Why paper maps matter
Phones die, GPS can fail, and cell maps need signal. A paper map and a compass need no battery. Collect topographic maps and a road atlas of your region now, and keep them dry.

## Reading a map
**Scale** tells you how map distance relates to real distance.
- 1:24,000: 1 inch on the map = 2,000 ft (about 0.4 mile). Common in the US.
- 1:50,000: 1 cm = 500 m.
- 1:100,000: 1 cm = 1 km.

**Contour lines** join points of equal elevation.
- Lines close together = steep slope. Lines far apart = gentle slope.
- Closed rings = hilltop (or a pit, if marked).
- Contour V-shapes point **uphill** in stream valleys and **downhill** along ridges.

**Colors** (typical): blue = water, green = woods, brown = contours, black = buildings and trails, red = major roads, white = open ground.

## Parts of a compass
Baseplate with a ruler edge, a rotating dial (bezel) marked 0-360 degrees, a direction-of-travel arrow on the baseplate, an orienting arrow and lines inside the dial, and a needle. The red end of the needle points to **magnetic north**.

> WARNING: Keep your compass away from metal, vehicles, phones, radios, belt buckles, and power lines. They bend the needle and send you off course.

## Take a bearing to something you can see
1. Hold the compass level in front of you, direction-of-travel arrow pointing at the target.
2. Turn the dial until the orienting arrow lies under the red end of the needle (red in the shed).
3. Read the number at the index line. That is your bearing.

## Follow a bearing
1. Set the bearing on the dial.
2. Hold the compass level and turn your whole body until the red needle sits in the orienting arrow.
3. Look along the direction-of-travel arrow. Pick a landmark on that line and walk to it. Repeat.

## Transfer a bearing from the map
1. Lay the compass edge along the line from where you are (A) to where you are going (B), travel arrow pointing toward B.
2. Turn the dial until the orienting lines run parallel to the map's north-south grid lines, orienting arrow pointing to the top of the map.
3. Correct for declination (below), then follow the bearing as above.

## Declination
Map north (true north) and compass north (magnetic) differ. This difference is **declination**. It is printed in the map margin and changes by place and over time. In the continental US it runs from roughly 15 degrees east in the Pacific Northwest to roughly 15 degrees west in Maine.

When converting a **map bearing to a compass bearing**: "east is least" (subtract east declination), "west is best" (add west declination). Many compasses let you set declination once with a small screw. Use the number on your newest map.

## Find your position (resection)
1. Pick two or three landmarks you can find on the map.
2. Take a bearing to each.
3. Convert each to a map bearing (reverse the declination correction).
4. Add or subtract 180 degrees to get the **back bearing**, from the landmark to you.
5. Draw each back bearing line on the map from its landmark. Where the lines cross is you.

## Keep from getting lost
- **Handrails:** follow rivers, ridges, roads, and power lines.
- **Catching features:** pick something big and unmistakable beyond your goal (a road, a river) so you know when you have gone too far.
- **Aiming off:** aim deliberately to one side of a target on a line, so you know which way to turn when you hit the line.
- **Pace count:** see [[estimation-tricks]].

See also: [[lost-procedure]], [[direction-sun-stars]], [[traveling-on-foot]].
`

    body: `
## Do this first
1. **Stay visible.** Move to an open area if it is safe.
2. **Remember three.** Three whistle blasts, three fires, three flashes, three shots: spaced evenly, pause, repeat. Three of anything is the international distress signal.
3. **Make it big and contrasting.** Bright against its background. Moving, shining, or smoking.
4. **Signal when someone can notice.** When you hear an aircraft, vehicle, or voices. Rest between.

## Sound
- **Whistle:** carries much farther than a voice and costs no energy. Three blasts, pause, repeat.
- Shouting wears you out and ruins your voice. Use sound only when you hear or see someone.

## Mirror (the best daytime tool)
Use a signal mirror or anything shiny: CD, phone screen, foil, a can lid, a watch glass.
1. Hold your free hand out at arm's length with two fingers in a V around the target (aircraft or person).
2. Aim the reflected light onto your fingers, then slide it onto the target.
3. Flash in short bursts. Sweep the horizon slowly even when you see no one. The flash can be seen for many miles.

## Fire and smoke
- **Night:** a bright fire, ideally three in a triangle about 100 ft (30 m) apart. Keep fuel stacked and ready.
- **Day:** smoke. Add green leaves, moss, or wet material to make thick **white** smoke (shows best against dark trees). Dark smoke from oil-soaked rags or rubber shows best against snow or pale ground but is toxic and hard to control.
- Prepare a pile with dry tinder under green boughs. Light it only when you hear or see a possible rescuer.

> DANGER: Never leave a signal fire unattended or build it near dry brush or under trees. A signal fire that starts a wildfire can kill you and others.

## Ground-to-air signals
Make symbols **at least 10 ft (3 m) long**, with high contrast: stamp them in snow, line them with rocks, branches, or dark clothing on pale ground.

| Symbol | Meaning |
|---|---|
| V | Need assistance |
| X | Need medical help / cannot proceed |
| Arrow | We are going this way |
| Y | Yes |
| N | No |
| SOS | Distress |

## Body signals to an aircraft
- **Both arms straight up in a V (like a Y):** I need help.
- **One arm up, one down:** I do not need help.
Wave bright clothing overhead.

## Light at night
Flash a flashlight, headlamp, or phone light in the SOS pattern: three short, three long, three short. The Flashlight / SOS / Morse tool in the Tools tab does this for you. A vehicle's headlights and horn can be signaled the same way.

## Electronics
- **Personal locator beacon (PLB):** works without cell signal. Press and it sends your location by satellite to rescue services. Register it. Keep the antenna clear and in the open.
- **Satellite messenger or phone satellite SOS:** use if you have one.
- **Phone:** a text message needs far less signal than a voice call. In the US, 911 calls can connect through any available carrier. Turn on airplane mode to save battery, and check for signal at high points.

## Make it easy to find you later
- If you leave a location, leave a note, an arrow, and a sign at the site.
- Spread bright items (orange, red, yellow) in the open. Avoid green, brown, and gray.
- Stay with your shelter or vehicle. A car is much easier to spot than a person.

See also: [[lost-procedure]], [[emergency-frequencies]], [[radio-basics]].
`

    summary: 'Clouds, pressure, wind, halos, lightning distance, and flash-flood signs for forecasting without internet.',

    body: `
## Why it matters
With no internet or TV, you can still see most storms coming by watching the sky, the wind, and the air pressure. Check the sky every few hours, and especially before travel, building, or planting.

## Clouds
| Cloud | What it looks like | What it means |
|---|---|---|
| Cirrus | Thin, wispy, high | Fair now. If thickening and lowering, a front arrives in 24-48 hours |
| Cirrostratus | Thin milky veil, halo around sun or moon | Rain or snow likely within about a day |
| Altostratus | Gray sheet; sun looks like it is behind frosted glass | Steady rain or snow is coming |
| Cumulus (small) | Puffy, flat bottoms | Fair weather |
| Towering cumulus | Puffs growing tall quickly | Showers or thunderstorms within hours |
| Cumulonimbus | Giant tower, flat anvil top, dark base | Thunderstorm: lightning, hail, wind, sometimes tornado |
| Nimbostratus | Low, thick, dark gray | Steady rain or snow |

## Air pressure
A barometer (many phones have one) shows the trend.
- **Falling fast:** a storm is near. Prepare.
- **Rising:** clearing, drier weather.
- **Steady and high:** fair.
The trend matters more than the number. Write the reading down every few hours.

## Wind and temperature
- A sudden wind shift with a temperature drop and clearing sky usually means a **cold front** has passed.
- Gusts increasing, then a wind shift: a front or thunderstorm is arriving.
- Smoke rising straight up means stable, high pressure (fair). Smoke that flattens or drifts down means low pressure and possibly worse weather.

## Folklore that often works (and some that doesn't)
- **Halo around the moon or sun:** ice crystals in high cloud, often ahead of precipitation within a day. Fairly reliable.
- **Red sky at night, red sky in morning:** works in mid-latitudes where weather moves west to east. Check the western sky.
- Animal behavior and "bad knees" are not dependable.

## Lightning
- Count the seconds between flash and thunder. Divide by 5 for miles (divide by 3 for kilometers).
- **If thunder follows within 30 seconds (about 6 miles), go indoors or into a hard-topped vehicle.** Wait 30 minutes after the last thunder before going out.
- Safe: a building with wiring and plumbing, or a metal-roofed vehicle with windows up.
- Avoid: open fields, hilltops, isolated trees, water, metal fences, tents, and open shelters.
- Details and first aid: [[severe-storms-tornado]], [[drowning-electric]].

## Flash floods
Signs: heavy rain upstream (even if it is dry where you are), a sudden rise in water, muddy and fast water, a roaring sound, floating debris. **Move to high ground at once.** Never camp in a dry wash or canyon bottom. See [[flood]].

## Tornado signs
A dark greenish sky, large hail, a rotating wall cloud, a loud continuous roar like a freight train, and a sudden calm. Go to the lowest interior room or a ditch. See [[severe-storms-tornado]].

## Temperature danger
- **Wind chill:** wind makes cold feel colder and speeds frostbite. See [[hypothermia-frostbite]].
- **Heat index:** humid heat is dangerous. At a heat index of 103 F (39 C) and above, heat exhaustion and heat stroke become likely with long exposure. See [[heat-illness]].

## Keep a weather log
Record the date, time, temperature, pressure, wind direction, clouds, and rain three times a day. After a few weeks, you will know your local patterns better than any forecast.

For official alerts, keep a NOAA Weather Radio or hand-crank radio. See [[getting-information]] and [[emergency-frequencies]].
`

    body: `
## Do this first
1. **Water.** Plan where you will find it and how you will treat it. See [[water-safety]].
2. **Feet.** Shoes that fit, clean socks, treat hot spots right away. See [[foot-care]].
3. **Plan.** Know the route, the next water, and where you will stop for the night.
4. **Tell someone** where you are going, if anyone can be told. Leave a note at home.

## How far and how fast
- A fit adult with a light load walks about 2.5-3 mph (4-5 km/h) on flat ground.
- With a pack, hills, weather, or fatigue, plan on 1.5-2 mph.
- **Naismith's rule:** allow 1 hour for every 3 miles (5 km), plus 1 hour for every 2,000 ft (600 m) of climb.
- Realistic daily distance: 10-15 miles (16-24 km) for a fit adult with a pack. Less for children, the elderly, or the injured.
- A group moves at the speed of its slowest member. Put the slowest in front.

## Load
- Carry no more than **20-25% of your body weight**. Heavy loads cause injuries and slow you down.
- Water weighs 8.3 lb per gallon (1 L = 2.2 lb). Carry a way to treat water instead of hauling all of it. See [[boiling-water]] and [[chemical-disinfection]].
- Pack what you will need most (water, snacks, rain gear) where you can reach it without stopping.
- Children: keep their packs to 10-15% of their weight.

## Rest, food, and water
- Rest 5-10 minutes each hour. Stop early in the day to adjust gear.
- Eat and drink small amounts often. Do not wait to be thirsty or hungry.
- Heavy walking burns 2,500-4,000 calories a day. Eat accordingly.

## Choosing a route
- Prefer secondary roads and trails to major highways. Crowds, accidents, and desperate people gather on main routes.
- Avoid choke points where you cannot go around: bridges, tunnels, narrow passes.
- Stay out of flood zones and low spots after heavy rain.
- Watch for downed power lines. Stay 35 ft (10 m) away. See [[drowning-electric]].
- Stop an hour or two before dark to find water and build shelter. See [[emergency-shelters]].

## Night travel
Avoid it. Falls, lost trails, and exhaustion are much more likely. Travel at night only if heat, danger, or distance demands it, with a red or dim light and a moon to help.

## Crossing rivers
> DANGER: Moving water 6 in (15 cm) deep can knock an adult down. Do not cross flood-stage, muddy, or fast water. Find a bridge, wait for the water to drop, or go around.

If you must cross a safe-looking stream:
1. Look for a wide, shallow, slow section. Wide is usually shallower.
2. Keep your shoes on. Unbuckle your pack's hip belt and chest strap so you can drop it if you fall.
3. Face upstream, lean into the current, and use a stout pole as a third point of contact.
4. Move one foot at a time, sliding rather than lifting. Cross at a slight downstream angle.
5. In a group, cross in a line, side by side holding each other's packs.
6. Never tie yourself to a rope in the water.

## Ice
Walk on lake ice only if it is at least **4 inches (10 cm) of clear, solid ice**. White or snowy ice is weaker. Avoid ice over moving water, near inlets, and around springs. If you fall in: do not climb straight up; kick, spread your arms on the ice, pull out flat, and roll away from the hole. Then get warm immediately. See [[hypothermia-frostbite]].

## Weather and heat
Rest in the hottest part of the day. Wear loose, light clothing and a hat. In cold, avoid sweating through your layers. See [[clothing-layers]].

## If you get turned around
Stop and use [[lost-procedure]]. For navigation, see [[map-compass]] and [[direction-sun-stars]]. For the pack, see [[bug-out-bag]].

    title: 'Estimating Time, Distance, Height & Daylight',
    summary: 'Hand-width daylight, pace counting, parallax distance, shadow height, and body measurements.',
    tags: ['estimate', 'daylight', 'pace count', 'distance', 'height', 'tree', 'river width', 'time', 'measure', 'hand', 'fingers', 'ranger beads'],
    body: `
## Daylight left
Hold your hand at arm's length with fingers together and horizontal, the bottom edge on the horizon and the top toward the sun. Count how many finger widths fit between the horizon and the sun. **Each finger is about 15 minutes**, so four fingers is about an hour. A full hand is about an hour. It is rough, but good enough to decide when to stop and build shelter.

## Pace count (how far you have walked)
1. Walk a measured 100 m (330 ft) on level ground at your normal pace.
2. Count every time your right foot hits the ground. Most adults take about 60-70 of these "double paces" per 100 m. That number is yours.
3. Out in the field, count paces, or move a pebble from one pocket to the other every 100 m. Ten pebbles is 1 km.
4. Add 10-20% for uphill, mud, or a heavy pack. Subtract a little for downhill.

## Distance with parallax
1. Hold your thumb out at arm's length. Close your left eye and line it up with a distant object.
2. Switch eyes. The thumb seems to jump sideways.
3. Estimate how far the object appears to jump in real distance (for example, a house is 10 ft wide, and the jump was about one house width).
4. Multiply that distance by 10. That is roughly how far away the object is.

## Distance by sound
Sound travels about 1,100 ft per second (340 m/s). Count seconds between a flash and its bang: 5 seconds is about 1 mile, 3 seconds is about 1 km.

## Height of a tree or building (shadow method)
1. Measure your own height and the length of your shadow.
2. Measure the length of the tree's shadow.
3. Tree height = tree shadow x (your height / your shadow).

## Width of a river (hat-brim method)
1. Stand at the edge. Pull your hat or hold your hand flat at your brow so your line of sight just touches the far bank at water level.
2. Without changing your head angle, turn and note the spot on your side where that line meets the ground.
3. Pace off the distance to that spot. It is about the width of the river.

## Know your body
Measure these once and write them down. They are rulers you always carry.

| Measure | Typical adult |
|---|---|
| Pace (one step) | 2.5 ft (0.75 m) |
| Hand span (thumb to little finger) | 7-9 in (18-23 cm) |
| Forearm (elbow to fingertip) | 16-19 in (40-48 cm) |
| Arm span (fingertip to fingertip) | about your height |
| Thumb width | about 1 in (2.5 cm) |
| Fist width | about 4 in (10 cm) |

## Time from the sun
The sun moves about 15 degrees per hour, so one hour is roughly one fist width across the sky at arm's length. Noon is when the sun is highest. Near the equinoxes, sunrise is about 6 a.m. and sunset about 6 p.m., local solar time.

## Using these together
Mix methods and treat each answer as a range. For navigation see [[map-compass]], [[direction-sun-stars]], and [[traveling-on-foot]]. For measuring while building, see [[measuring-squaring]]. The Unit Converter in the Tools tab helps with conversions.

## Why radios
When phones and internet fail, radios still work. They need only power and someone listening. Learn them before you need them.

## Types at a glance
| Radio | License (US) | Power | Realistic range | Notes |
|---|---|---|---|---|
| CB (Citizens Band) | None | 4 W | 1-5 miles (more with a good antenna) | 40 channels near 27 MHz. Common in trucks. |
| FRS | None | up to 2 W | 0.5-2 miles | Cheap walkie-talkies. Range claims are exaggerated. |
| GMRS | FCC license (covers a family) | up to 50 W | 1-5+ miles, more with repeaters | Same band as FRS, more power. |
| MURS | None | 2 W | 1-3 miles | Five VHF channels. |
| Amateur (ham) | Exam-based license | 5-100+ W | Local to worldwide | The most capable. HF can span continents. |
| Marine VHF | License rules vary | 1-25 W | 5-25 miles | Boats and coastal areas. |
| Receive only | None | - | - | NOAA Weather Radio, scanners, shortwave, AM/FM. |

## Reality check
- VHF and UHF (FRS, GMRS, MURS, handheld ham) travel in a straight line. Hills, buildings, and trees block them. A realistic handheld range is 1-5 miles; high ground and a better antenna help.
- Repeaters extend range but need power and may fail in a long outage. **Simplex** (radio to radio, direct) always works.
- HF (shortwave, ham HF) bounces off the upper atmosphere and can reach very far with no infrastructure, but it takes training and a General-class or higher ham license for the best bands.

## What to get first
1. **A hand-crank/solar AM/FM/NOAA receiver** for news and alerts. See [[getting-information]].
2. **A pair of FRS/GMRS handheld radios** so your family can talk at short range.
3. **A ham license (Technician) and a handheld ham radio.** The test is multiple choice, and clubs teach it. Handheld hams work on repeaters and simplex, and let you listen to emergency nets.
4. **A CB** if you travel by road. Truckers often know road conditions.

## Power and storage
- Keep batteries charged and spares on hand. A handheld on one charge lasts a day or two with careful use. A small solar panel and a battery pack help. See [[batteries-charging]].
- Keep a spare radio and antenna in a closed metal box, unplugged from any antenna or power line, to protect it from lightning surges. (Claims that this protects against EMP are unproven.)

## Antennas
Higher is better. A taller or external antenna improves range more than extra power does. **Keep antennas well away from power lines**, and never put one up in a storm.

## Using a radio well
- **Listen first.** Is someone already talking?
- Keep it short and clear. Say who you are calling and who you are.
- Do not use codes. Plain language works.
- Use the phonetic alphabet to spell words. See [[phonetic-morse]].
- Save batteries: use low power when the other party is close.

## Make a plan now
- Pick a channel and a check-in schedule with family and neighbors (for example, listen for 10 minutes at the top of every hour and at 7 a.m. and 7 p.m.).
- Practice monthly. See [[family-plan]] and [[community-security]].
- Find your local amateur radio club. Many run emergency nets.

For frequencies and distress procedure, see [[emergency-frequencies]].

## Make a distress call
1. Make sure you have a real emergency. False distress calls are illegal and put rescuers at risk.
2. Switch to an emergency channel (below).
3. Press and hold to talk. Speak slowly and clearly.
4. Say:
   - "MAYDAY, MAYDAY, MAYDAY."
   - "This is (your name, vehicle, or call sign), three times."
   - "MAYDAY (your name)."
   - Your location: road and mile marker, landmarks, coordinates if you have them.
   - What is wrong, the number of people, and any injuries.
   - What help you need.
   - "Over."
5. Release the button and **listen** for 1-2 minutes. If no reply, repeat. Try another channel or location.
6. Spell names and numbers with the phonetic alphabet. See [[phonetic-morse]].

## Well-known channels and frequencies
| Service | Channel / Frequency | Use |
|---|---|---|
| CB radio | Channel 9, 27.065 MHz | Emergency and motorist assistance |
| CB radio | Channel 19, 27.185 MHz | Highway traffic, truckers, road conditions |
| Amateur radio, 2 meter | 146.520 MHz | National simplex calling frequency |
| Amateur radio, 70 cm | 446.000 MHz | National simplex calling frequency |
| Marine VHF | Channel 16, 156.800 MHz | Distress, safety, and calling |
| Aviation | 121.500 MHz | International civil aircraft emergency frequency |
| NOAA Weather Radio | 162.400, 162.425, 162.450, 162.475, 162.500, 162.525, 162.550 MHz | Weather and hazard alerts (listen only) |
| Satellite beacons | 406 MHz | Personal locator beacons and EPIRBs |

> NOTE: FRS and GMRS radios have no official national emergency channel. Agree on a channel with your family and neighbors in advance, and monitor it at set times.

Local ham clubs often run emergency nets on local repeaters. Tune a scanner or handheld to learn your area's activity before a crisis.

## Procedure words
| Word | Meaning |
|---|---|
| MAYDAY (said three times) | Life or vessel in immediate danger |
| PAN-PAN (three times) | Urgent, but not immediately life-threatening |
| SECURITE (three times) | A safety message, such as a navigation or weather warning |
| Over | I have finished speaking; your turn |
| Out | The conversation is finished (never say "over and out") |
| Roger | I received your last message |
| Say again | Please repeat |
| Stand by | Wait; I will get back to you |
| Break | Separates parts of a message, or interrupts for an emergency |

## Calling a phone for help
- In the US, 911 calls can connect through any carrier's tower in range even if your own network is down.
- A text message can go through when a voice call will not, and text-to-911 works in some areas.
- If nothing connects, try again from higher ground and conserve battery.

## Keep it working
- Listen before you speak, so you do not talk over a call.
- Change to a clear channel only if the dispatcher or the other party tells you to.
- Conserve batteries: transmit briefly, listen often.
- If you hear a distress call and the person is not answered, write down the time, place, and details, and try to relay it to others on the same channel.

> TIP: Write the table above on an index card and keep it with your radio. In an emergency you will not remember it.

See also: [[radio-basics]], [[signaling-rescue]], [[getting-information]].
`

    summary: 'AM and weather radio, shortwave, ham nets, community boards, and how to check rumors when TV and internet are down.',

    body: `
## Do this first
1. Turn on a battery or hand-crank radio and tune to **AM**, then **FM** for local news.
2. Tune a **NOAA Weather Radio** channel (162.400-162.550 MHz) if your radio has one.
3. Listen at **set times** (for example, morning, noon, evening) and turn it off between them to save batteries.
4. Write down what you hear with the date and time.

## Local stations
- **AM radio** carries much farther than FM, especially at night. Some AM stations are part of the national Emergency Alert System (EAS) and have backup power and special equipment.
- Local stations often keep broadcasting during outages and will give shelter locations, curfews, water notices, and road closures.
- A small portable or hand-crank radio is the single best information tool in an outage.

## Choosing a radio
Look for AM/FM and NOAA weather bands, multiple power sources (batteries, hand crank, solar), a headphone jack, and a flashlight. A radio that can also charge a phone does so slowly; use that only as a backup. See [[batteries-charging]].

## Shortwave
Shortwave radio can bring in international broadcasts from other continents, which may report on events your local stations cannot. Schedules and stations change, so scan the bands from about 5 to 22 MHz and note what you find.
- **Time signals:** the US station WWV broadcasts on 2.5, 5, 10, 15, and 20 MHz. If you hear it, your radio and antenna are working.

## Amateur (ham) radio
You do not need a license to listen. Local ham clubs often run emergency nets on repeaters and simplex channels during disasters, relaying messages and conditions. See [[radio-basics]] and [[emergency-frequencies]].

## Phones
- Text messages use far less signal than calls. They may go through when voice calls fail.
- Keep the phone in airplane mode and check it once or twice a day for a signal. Move to high ground if needed.
- Keep a printed list of key phone numbers, because the phone's contacts may be unavailable if it dies.

## Local information networks
- Set up a **message board** in a central place (a mailbox cluster, church, store window, or fence): notices with date and time.
- Agree on a time each day when neighbors meet or check in.
- Use **runners** (people on bikes or on foot) to carry messages when radios and phones fail.
- Hold short neighborhood meetings to share news, needs, and offers.

## Check the information
Rumors spread fast and can be dangerous. When you hear something important:
1. Ask where it came from. Direct witness, official source, or "somebody said"?
2. Look for **two independent sources** before acting.
3. Note the time. Information goes stale quickly.
4. Do not repeat unverified reports, especially about violence, disease, or relief supplies.
5. Be wary of anything that tells you to hurry or panic.

## Keep a log
Keep a notebook with the time, source, and what you learned. In a long outage it helps you see patterns in what is coming back, what is getting worse, and what is just rumor.

See also: [[infrastructure-failure]], [[community-security]], [[weather-forecasting]].
`

## The idea: layers
Security is **deter, detect, delay, respond**. No single lock stops a determined intruder. Layers make your home a harder, slower, noisier target than the next one. Most burglars enter through **doors and first-floor windows**, and many walk in through unlocked ones.

## Do this now
1. **Lock doors and windows**, every time, including when you are home and in the garage.
2. Replace the short screws in each door's **strike plate** and **hinges** with **3-inch (75 mm)** screws that reach the wall stud.
3. Add a **solid-core or metal exterior door** if yours is hollow.
4. Put a bar or dowel in the track of sliding doors.
5. Light the outside of the house with motion-sensing lights (solar models work with no power).
6. Meet your neighbors and agree to watch each other's homes ([[community-security]]).

## Doors
- A **deadbolt with a 1-inch throw** is much stronger than a spring latch.
- Reinforce the **door frame** with a metal plate. Kicked-in doors usually fail at the frame, not the lock.
- Exterior door hinges should be on the inside, or have security studs.
- Keep a **peephole** or small window. Do not open the door for strangers. Talk through the door.
- **Garage:** Lock the door between the garage and house. The release cord on an automatic opener can be fished open from outside; secure it with a zip tie when away.

## Windows
- Keep latches working. Add pin locks or a wooden dowel in the track.
- Security film makes glass slower to break.
- Thorny shrubs under ground-floor windows slow people down.
- At night, close curtains so people cannot see inside.

## Outside
- Trim shrubs below about 3 feet (1 m) and tree limbs above 7 feet (2 m) so there are no hiding places.
- Gravel paths make noise when walked on.
- Lock sheds and keep ladders and tools inside, where they cannot be used to break in.
- A **dog** is one of the best low-tech alarms.

## Alarms without power
Battery door and window alarms, bells hung on doors, a stack of tin cans, or a whistle by the bed. A loud noise makes most intruders leave.

## Safe room
Pick an interior room with a solid door, a good lock, a flashlight, a phone or radio, water, and first aid supplies. It is a place to wait for help while you call, not a place to hide from a fire.

## Fire safety first
> WARNING: Never lock yourself in. **Do not use keyed double-cylinder deadbolts**, bars, or bolts that need a key from inside. In a fire, every person must be able to open exits quickly without a key or tool. Test your escape routes ([[fire-safety]]).

## Use light and noise discipline in an outage
During a long blackout, lit windows signal that you have supplies. Use curtains and low light. See [[opsec-low-profile]].

    body: `
## Why it matters
In a long crisis, people who know you have food, water, fuel, or medicine may ask for it, pressure you, or take it. This is not about being selfish. It is about keeping control of **your** decisions about whom you help, and how, so that you can keep your family safe.

## Do this now
1. **Do not brag.** Skip stories about your stockpile at work, school, or parties.
2. **Do not post** photos of your supplies, house layout, or location on social media. Turn off location tagging.
3. Decide who really needs to know. Household members and a small circle you trust, no more.
4. Teach children to keep quiet about it. Frame it as "family business."
5. Store supplies out of sight: closets, under beds, basement shelves, plain boxes. No labels such as "EMERGENCY FOOD."

## Shopping and storage
- Buy gradually, mixed in with normal shopping. Large, obvious purchases get noticed.
- Keep bulk items in plain containers.
- Do not leave empty boxes or cans out for the trash. Pack them out of sight, crush, and dispose discreetly.

## In a long outage
What attracts attention during a grid-down event:
- **Lights at night:** Use curtains and keep light dim.
- **Noise:** Generators are loud and tell everyone you have fuel. Run them only when needed, with sound barriers, and at times when you have the most privacy ([[generator-safety]]).
- **Smoke and cooking smells:** Cook at varied times. A cooking fire or grill attracts hungry people. Use fuel that burns cleanly and does not produce heavy smoke ([[cooking-without-power]]).
- **Foot traffic:** Don't carry water, food, or gear in obvious ways. Use ordinary bags and carts.
- **Wealth:** Do not wear expensive items. Keep your car ordinary.

## "Gray man" in public
Blend in. Dress neutrally. Avoid tactical or military-style clothing and slogans. Behave normally. Be observant. Pay attention to who is paying attention to you. Vary routines. Do not discuss plans or supplies in public.

## Online privacy
- Restrict who sees your posts. Limit personal details.
- Avoid announcing vacations or absences.
- Keep paper copies of important information ([[documents-money]]).

## Honesty and generosity
You do not need to lie. If someone asks, a simple, truthful answer works: "We have a little extra, but not much to spare." Decide **in advance** how you will help: limited, planned, and safe (for example, giving water or a meal, not inviting people into your home). Compassion is important. Staying safe lets you help for longer.

## Do not be isolated
Total secrecy cuts you off from help and information. A trusted neighborhood group is stronger than a lone household ([[community-security]]). Be careful about sharing details with new acquaintances. Build trust slowly.

## Also see
[[home-security]], [[conflict-avoidance]], [[barter-trade]].

## Why a group
One household cannot do everything: stay awake, cook, tend sick people, guard, repair, and gather water. A group of 10 to 50 households shares skills, workload, and protection. Isolated families are more vulnerable. **Build it now**, while things are calm.

## Do this now
1. Introduce yourself to neighbors. Learn names and who lives alone.
2. Exchange phone numbers and, if possible, radio channels ([[radio-basics]]).
3. Make a list of skills and resources (see below).
4. Agree on a meeting place and a simple signal for "OK" and "Need help" (for example, a green or red card in the window).
5. Take a free **CERT** (Community Emergency Response Team) course if your area offers it. It teaches first aid, search, and fire safety.

## Skills inventory
Ask each household what they can offer:
- Medical (nurse, EMT, vet, first aid), mental health
- Mechanical and building, electrical, plumbing, welding
- Gardening and farming, hunting, food preservation, cooking for groups
- Radio and communications ([[radio-basics]])
- Childcare and education
- Equipment: generators, chainsaws, well, solar, tools, vehicles, water storage

## Roles
Assign simple, clear roles: coordinator, medical, water and food, communications, sanitation, safety and watch, childcare, and a note-taker. Rotate roles to prevent burnout.

## Watch shifts
- Use **pairs**, not individuals.
- Keep shifts short (about 2 to 4 hours) so people stay alert.
- Watchers **observe and report**. They do not confront, chase, or detain.
- Use whistles, radios, or a bell to alert the group. Agree on codes: "all clear," "unknown person approaching," "emergency."
- Keep a log of events.

## Dealing with strangers
- Greet from a distance. Be polite and firm. Ask what they need.
- Offer limited help at the edge of your area, without inviting strangers inside.
- Do not set up roadblocks or detain people. This can be illegal and can lead to violence. Call authorities when possible ([[conflict-avoidance]]).

## Shared resources
A shared well, garden, workshop, medical supplies, and storage can serve many. Agree on **fair rules** ahead of time. Keep records. People who contribute should benefit. The vulnerable (the elderly, disabled, sick, young) should be protected, not left behind ([[elderly-disabled]]).

## Making decisions
- Meet regularly. Decide by consensus or a clear majority.
- Write simple rules, such as when and where to draw water, quiet hours, sanitation rules ([[human-waste]]), and conflict handling.
- For disputes, use a small panel of respected neighbors. Keep it respectful and private.

## Avoid vigilantism
Do not take law into your own hands. Punishing people yourself invites revenge and legal trouble. Protect, document, and report.

## Checklist for your group
- [ ] Contact list with phone numbers and addresses
- [ ] Skills and resources list
- [ ] List of vulnerable neighbors and their needs
- [ ] Meeting place and signals
- [ ] Radio channel and check-in schedule
- [ ] Roles assigned

    summary: 'The four core safety rules, how to store firearms and ammunition safely, basic maintenance, training, and legal basics.',
    tags: ['gun', 'firearm', 'rifle', 'pistol', 'shotgun', 'ammunition', 'storage', 'safe', 'safety rules', 'cleaning', 'children'],
    body: `
## The four rules
Every firearm accident breaks at least one of these. Follow **all four, every time**.
1. **Treat every firearm as if it is loaded.** Always check it yourself, even when you have just seen it unloaded.
2. **Never point the muzzle at anything you are not willing to destroy.** Keep it pointed in a safe direction, usually up or down range.
3. **Keep your finger off the trigger** and outside the trigger guard until your sights are on the target and you have decided to shoot.
4. **Be sure of your target, and what is beyond it.** Bullets travel far and go through walls. Know what is in front of and behind your target.

## Other habits
- Know how your firearm works. Read the manual.
- Wear eye and ear protection.
- Never mix firearms with alcohol, drugs, or sedating medication.
- Do not rely on a mechanical safety. It can fail.
- Hand a firearm to someone only with the action **open and unloaded** so they can see that it is empty.
- Unload when you are finished. Store ammunition separately from the firearm unless it is in a secure, quick-access device.

## In a grid-down world
There is no emergency room. An accidental shooting is far more deadly. Safe handling matters even more, not less.

## Storage and children
- Store firearms **unloaded and locked**: gun safe, lockbox, or cable or trigger lock.
- If you keep one ready for home defense, use a **quick-access lockbox** (keypad or biometric) that children cannot open.
- Store ammunition locked, separate from the firearm.
- Talk with children early. Teach them: **Stop. Don't touch. Run away. Tell a grown-up.** Never assume a child has not found the key.
- If anyone in your household is in crisis, depressed, or at risk of self-harm, **lock up or temporarily remove** firearms. See [[mental-health]]. In the US, 988 is the Suicide & Crisis Lifeline.

## Ammunition storage
Keep ammunition in a cool, dry place in a sealed container (a metal ammo can with a rubber gasket works well). Moisture and heat are the enemies. Stored well, modern ammunition lasts decades. Do not store it near solvents or in a hot car or attic.

## Basic cleaning and maintenance
1. Make sure the firearm is **unloaded**. Check the chamber and magazine, and keep ammunition in another room.
2. Clean in a ventilated area. Solvents have fumes. Use eye protection.
3. Disassemble as described in the manual. Clean the bore, wipe off residue, and apply light lubricant.
4. Reassemble and do a **function check**.
5. Wash your hands afterward. Lead residue is toxic, especially to children and pregnant people.

## Training and law
- Take a certified safety course (state hunter education, range safety, or a recognized firearms instructor).
- Practice regularly at a range.
- **Laws vary widely** by state and country: purchase, storage, carry, transport, and use of force. Learn yours. Never lend a firearm to someone you do not know well.
- Record serial numbers and report theft.

## Transport
Unloaded, in a locked case, with ammunition stored separately, and follow the laws of every jurisdiction you pass through. Do not leave a firearm in an unattended vehicle.

## Also see
[[hunting-weapons]], [[conflict-avoidance]], [[home-security]].

    summary: 'Awareness, avoidance, verbal de-escalation, and the legal and practical basics of defending yourself as a last resort.',

    body: `
## The order: avoid, escape, de-escalate, defend
Most safety comes from the first three. Defense is the last resort.
1. **Avoid** trouble. Stay away from places and people who may be dangerous.
2. **Escape.** Leave early and calmly.
3. **De-escalate.** Calm a tense encounter with words and posture.
4. **Defend** only when you cannot leave and are in immediate danger.

## Situational awareness
Use simple color codes:
- **White:** Unaware. Distracted, lost in a phone.
- **Yellow:** Relaxed but aware. Notice exits, people, and changes. This is your normal setting.
- **Orange:** Something is wrong. Focus on it. Plan your exit.
- **Red:** Action: leave, call for help, or defend.

Habits:
- Look up. Keep your phone away in public.
- Know the exits wherever you go.
- Trust your instincts. If something feels wrong, leave.
- Avoid isolated places and traveling alone after dark.
- Park near light and lock the doors. At a stop, leave enough room to steer around the car in front.

## De-escalation
When someone is angry or threatening:
1. Stay calm. Breathe slowly. Keep your voice low and steady.
2. Keep your distance, ideally two arm lengths. Stand slightly angled, not square-on, with open hands visible.
3. Do not match their anger. Do not argue, threaten, insult, or touch them.
4. **Listen.** Let them speak. Say, "I hear that you're upset."
5. Use short, simple sentences. Offer choices. "I don't want any trouble. I'll leave now."
6. Give them a way out that saves face.
7. Do not corner them. Keep an exit behind you.

## If you are robbed
**Give them what they ask for.** Possessions can be replaced. Do not chase. Move away, and report it later.

## Using force: general principles
> NOTE: Laws vary by state and country. Learn your local law. This is not legal advice.

- In general, you may use only **reasonable, proportionate force** to stop an **immediate, unlawful threat** of harm. Once the threat ends, you must stop.
- Some places require you to **retreat** if you safely can. Others (stand-your-ground) do not. "Castle" laws give more latitude at home.
- Law still applies in a disaster, even if police are slow to arrive. You will have to account for what you did.

## Non-lethal tools
- A bright **flashlight** can blind and disorient.
- **Pepper spray:** check local law. Practice with a test can so you know how it works. It works within about 10 feet and can blow back in wind. Effects last about 30 to 45 minutes. Rinse skin and eyes with water ([[first-aid-basics]]).
- A **whistle** or personal alarm draws attention.

## Physical self-defense
Aim to **create an opening and escape**, not to win a fight. Hit hard at vulnerable spots (palm strike to the nose or chin, knee to the groin), yell loudly, and run to a safe place. A short class in self-defense gives practice that no article can.

## After an incident
- Get to safety. Call for help if you can.
- Treat injuries ([[severe-bleeding]], [[first-aid-basics]]).
- Write down what happened while it is fresh. Report it.
- Expect shaking, fear, and sleeplessness. These are normal. Talk to someone ([[mental-health]]).

## During unrest
Avoid crowds, looting, and confrontations. See [[civil-unrest]] and [[community-security]].

    body: `
## If there is a fire: GET OUT
1. **Get out. Stay out.** Do not stop for belongings.
2. Crawl low under smoke. Smoke and heat rise.
3. Before you open a door, feel it with the **back of your hand**. If it is hot, use another way out.
4. **Close doors** behind you to slow the fire.
5. Call 911 **from outside**.
6. Go to your family meeting place. Count heads.
7. If your clothes catch fire: **stop, drop, and roll.** Then cool the burn ([[burns]]).

If you are trapped: close the door, put wet towels in the gap, go to a window, and signal for help.

## Alarms
- **Smoke alarms** on every level, inside each bedroom, and outside sleeping areas. Test monthly. Replace batteries yearly (unless sealed 10-year units). Replace alarms every 10 years.
- **Carbon monoxide (CO) alarms** on every level and near bedrooms ([[poisoning-overdose]]). Use battery-powered models in outages.

## Escape plan
- Plan **two ways out** of every room.
- Pick a meeting place outside.
- Practice twice a year, including in the dark and with children.
- Keep exits clear. Windows must open.

## Fire extinguishers
Keep one in the kitchen, garage, and near exits. The multipurpose **ABC** dry chemical type (about 5 lb) is a good choice.

| Class | Fires |
|---|---|
| A | Wood, paper, cloth |
| B | Flammable liquids, grease |
| C | Electrical |
| K | Kitchen oils (commercial kitchens) |

Use **PASS**:
1. **Pull** the pin.
2. **Aim** low at the base of the fire.
3. **Squeeze** the handle.
4. **Sweep** side to side.

Stand 6 to 8 feet (2 m) away. Fight only a **small** fire that is not spreading, with everyone else out and an exit behind you. If in doubt, **leave**. Check the gauge monthly.

## Special fires
> DANGER: **Never use water on a grease or electrical fire.**

- **Grease fire:** Turn off heat. Slide a lid over the pan. Leave it covered until cool. Do not carry the pan.
- **Oven or microwave fire:** Keep the door closed. Turn off or unplug.
- **Electrical fire:** Unplug or shut off power if safe. Use a Class C or ABC extinguisher.
- **Chimney fire:** A roar, shaking, or dense smoke. Get everyone out and call 911.

## Fire safety in an outage
Outages bring many house fires from improvised light, heat, and cooking.
- Use **flashlights** and battery lanterns instead of candles ([[lighting]]).
- If you use candles, use a stable holder, keep them away from anything that burns, and never leave them unattended. Put them out when leaving the room or going to sleep.
- Keep anything that burns **3 feet (1 m)** from heaters, stoves, and fireplaces.
- Use only heaters rated for indoor use, with ventilation and a working CO alarm ([[heating-home]]).
- Never use a charcoal grill or gas oven for heat, and never refuel a hot heater or stove.
- Wood stoves and fireplaces: use a screen. Clean chimneys yearly. Put ashes in a metal container with a lid, outdoors and away from buildings.
- Generators: outdoors only ([[generator-safety]]).
- Do not leave cooking unattended.

## Also see
[[fire-management]] for outdoor fires, [[home-security]] for balancing locks and escape, and [[wildfire]] for fires outdoors.

The **Light, SOS & Morse** tool in the Tools tab can flash any message. Use this chart to read or send it by hand.

## Phonetic alphabet (NATO)
Spell words over a poor radio or phone line.

| Letter | Say | Letter | Say | Letter | Say |
|---|---|---|---|---|---|
| A | Alfa | J | Juliett | S | Sierra |
| B | Bravo | K | Kilo | T | Tango |

| I | India | R | Romeo | | |

**Numbers:** 0 zero, 1 wun, 2 too, 3 tree, 4 fower, 5 fife, 6 six, 7 seven, 8 ait, 9 niner.

## Morse code
A **dot** is a short signal. A **dash** is three times as long.

| Letter | Code | Letter | Code | Letter | Code |
|---|---|---|---|---|---|
| A | .- | J | .--- | S | ... |
| B | -... | K | -.- | T | - |
| C | -.-. | L | .-.. | U | ..- |
| D | -.. | M | -- | V | ...- |
| E | . | N | -. | W | .-- |
| F | ..-. | O | --- | X | -..- |
| G | --. | P | .--. | Y | -.-- |
| H | .... | Q | --.- | Z | --.. |
| I | .. | R | .-. | | |

| Number | Code | Number | Code |
|---|---|---|---|
| 1 | .---- | 6 | -.... |
| 2 | ..--- | 7 | --... |
| 3 | ...-- | 8 | ---.. |
| 4 | ....- | 9 | ----. |
| 5 | ..... | 0 | ----- |

### Timing
- Dot = 1 unit. Dash = 3 units.
- Gap between signals in a letter = 1 unit.
- Gap between letters = 3 units.
- Gap between words = 7 units.

### SOS
**· · ·  − − −  · · ·** (three short, three long, three short). It is a signal, not letters. Send it with a light, a whistle, taps on a pipe, or flashes of a mirror. Repeat with a pause between.

| Word | Meaning |
|---|---|
| MAYDAY (×3) | Life-threatening emergency |
| PAN-PAN (×3) | Urgent, but no immediate danger to life |
| SÉCURITÉ (×3) | Safety message (for example a hazard to navigation) |
| Over | I am finished talking; your turn |
| Out | I am finished; no reply needed |
| Roger | I received your message |
| Say again | Repeat your last message |
| Stand by | Wait; I will get back to you |
| Break | Pause or separate parts of a message |

How to make a distress call: [[emergency-frequencies]].

Make large symbols at least 10 ft (3 m) tall with high contrast against the ground: stones, logs, clothing, or trampled snow.

| Symbol | Meaning |
|---|---|
| V | Need assistance |
| X | Need medical help |
| N | No |
| Y | Yes |
| Arrow | We went this way |
| SOS | Universal distress |

      var html = '<h2 class="sec">Water</h2><div class="tbl-wrap"><table class="res-table"><tbody>' +
        row('Total water', r1(gal) + ' gal (' + r1(gal * 3.785) + ' L)') + row('5-gallon jugs', Math.ceil(gal / 5)) + row('55-gallon drums', r1(gal / 55)) + '</tbody></table></div>' +

  /* ================= PLANTING CALENDAR ================= */

    }

  }

<script>
/* Grid Down Guide — app logic. Hash-routed single page app, no dependencies, fully offline. */
(function () {
  'use strict';

  var MD = window.MD;
  var e = MD.esc;
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };

  var CATS = window.CATEGORIES || [];
  var ARTS = window.ARTICLES || [];
  var byId = {}, byCat = {}, catById = {};
  CATS.forEach(function (c) { catById[c.id] = c; byCat[c.id] = []; });
  ARTS.forEach(function (a) { byId[a.id] = a; (byCat[a.cat] = byCat[a.cat] || []).push(a); });

  /* ---------------- state ---------------- */
  var KEY = 'gdg.v1';
  function loadState() { try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {}; } catch (err) { return {}; } }
  var S = Object.assign({ size: 100, theme: 'auto', saved: [], recent: [], checks: {}, timers: [], frost: {}, intro: false, keepAwake: false }, loadState());
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (err) { /* storage unavailable: app still works */ } }

  function applyPrefs() {
    document.documentElement.style.fontSize = S.size + '%';
    if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', S.theme);
    var meta = document.querySelector('meta[name="theme-color"]');

  }

  /* ---------------- toast, wake lock ---------------- */
  var toastTimer = null;
  function toast(msg, ms, actionLabel, action) {
    var t = $('#toast');
    t.innerHTML = e(msg) + (actionLabel ? '<button type="button" id="toast-act">' + e(actionLabel) + '</button>' : '');
    t.hidden = false;
    if (actionLabel) $('#toast-act').onclick = function () { t.hidden = true; if (action) action(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, ms || 3000);
  }

  var wakeSentinel = null, wakeWanted = false;
  function wake(on) {

    if (!wakeWanted) { if (wakeSentinel) { try { wakeSentinel.release(); } catch (err) {} wakeSentinel = null; } return; }
    if (!('wakeLock' in navigator) || wakeSentinel) return;

  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && wakeWanted) wake(true); });

  /* ---------------- search ---------------- */
  var INDEX = ARTS.map(function (a) {
    var raw = MD.plain(a.body || '');
    return { a: a, title: a.title.toLowerCase(), sum: (a.summary || '').toLowerCase(), tags: (a.tags || []).join(' ').toLowerCase(), body: raw.toLowerCase(), raw: raw };
  });
  function count(hay, needle, cap) { var n = 0, i = -1; while ((i = hay.indexOf(needle, i + 1)) > -1) { if (++n >= cap) break; } return n; }
  function variants(t) {
    var v = [t];
    if (t.length > 3) {
      if (/ies$/.test(t)) v.push(t.slice(0, -3) + 'y');
      else if (/es$/.test(t)) v.push(t.slice(0, -2));
      if (/s$/.test(t)) v.push(t.slice(0, -1));
      if (/ing$/.test(t) && t.length > 5) v.push(t.slice(0, -3));
    }
    return v;
  }
  function search(q) {
    var toks = q.toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 6);
    if (!toks.length) return { toks: toks, hits: [] };
    var out = [];
    INDEX.forEach(function (ix) {
      var score = 0;
      for (var i = 0; i < toks.length; i++) {
        var vs = variants(toks[i]), s = 0;
        for (var j = 0; j < vs.length; j++) {
          var v = vs[j];
          if (ix.title.indexOf(v) > -1) s = Math.max(s, 12);
          else if (ix.tags.indexOf(v) > -1) s = Math.max(s, 8);
          else if (ix.sum.indexOf(v) > -1) s = Math.max(s, 5);
          else { var c = count(ix.body, v, 4); if (c) s = Math.max(s, c); }
        }
        if (!s) return;
        score += s;
      }
      if (ix.a.priority) score += 1;
      out.push({ ix: ix, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return { toks: toks, hits: out.slice(0, 60) };
  }
  function snippet(ix, toks) {
    var low = ix.body, pos = -1;
    for (var i = 0; i < toks.length && pos < 0; i++) {
      var vs = variants(toks[i]);
      for (var j = 0; j < vs.length; j++) { var p = low.indexOf(vs[j]); if (p > -1 && (pos < 0 || p < pos)) pos = p; }
    }

    var from = Math.max(0, pos - 50), to = Math.min(ix.raw.length, pos + 110);

    var re = new RegExp('(' + toks.map(function (t) { return variants(t).join('|'); }).join('|').replace(/[.*+?^${}()[\]\\]/g, '\\$&') + ')', 'gi');
    return e(s).replace(re, '<mark>$1</mark>');
  }

  /* ---------------- views ---------------- */

    ]],

      ['🌪️', 'Tornado or severe storm', 'severe-storms-tornado'], ['🌊', 'Flood', 'flood'], ['🏚️', 'Earthquake', 'earthquake'],

  function viewHome() {

      [['cpr', '❤️', 'CPR Metronome'], ['timers', '⏱️', 'Timers & Tourniquet Clock'], ['water', '💧', 'Water Treatment'], ['supplies', '📦', 'Supplies Calculator']].map(function (t) {

    document.body.appendChild(d);
  }

  /* ---------------- shared API for tools ---------------- */
  window.App = { S: S, save: save, toast: toast, wake: wake, esc: e, byId: byId };

  /* ---------------- start ---------------- */
  applyPrefs();
  if (window.GDG_TOOLS && window.GDG_TOOLS.boot) window.GDG_TOOLS.boot(window.App);
  route();
  intro();
})();

</script>
