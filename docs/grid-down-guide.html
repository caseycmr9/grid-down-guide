    body: `
## Anaphylaxis: use epinephrine now
Anaphylaxis is a severe, rapid allergic reaction. **Epinephrine is the only first-line treatment. Antihistamines are not enough.** Give it at the first signs; do not wait to see if it gets worse.

### Signs (any of these after exposure to a likely trigger, usually within minutes)
- Trouble breathing, wheezing, a tight throat, hoarse voice, repeated coughing
- Swelling of the tongue, lips, or face
- Widespread hives, itching, flushing
- Dizziness, fainting, a weak fast pulse, pale or blue skin
- Vomiting, severe belly cramps, diarrhea
- A feeling that something terrible is about to happen

Common triggers: peanuts, tree nuts, shellfish, fish, milk, eggs, insect stings, medicines (penicillin and others), latex.

### Do this
1. **Inject epinephrine into the outer middle thigh.** It works through clothing.
   - **0.3 mg auto-injector for a person 66 lb (30 kg) or more**
   - **0.15 mg auto-injector for 33 to 66 lb (15 to 30 kg)**
   - Remove the safety cap, press the tip firmly against the thigh until it clicks, and hold it in place for the time printed on your device (some 3 seconds, some up to 10).
2. **Call 911** if you can. Everyone who gets epinephrine needs medical observation.
3. **Lay the person flat with legs raised.** If they have trouble breathing, let them sit up. If they are pregnant, lay them on their left side. If they are vomiting, turn them onto their side. **Do not let them stand or walk;** suddenly standing can cause collapse and death.
4. **If there is no improvement after 5 to 15 minutes, or symptoms return, give a second dose** with a second auto-injector.
5. If they stop breathing, start [[cpr]].
6. **Antihistamines** (diphenhydramine or a non-drowsy antihistamine) and a rescue inhaler for wheezing are add-ons only. They do not replace epinephrine.
7. **Watch for at least 4 to 6 hours.** A second wave of symptoms can occur hours later (up to 72 hours in rare cases). Get medical care if you can.

## Mild reactions
Itchy rash, hives, sneezing, runny nose, or mild lip swelling **without** breathing trouble, dizziness, or vomiting: move away from the trigger, take an antihistamine (diphenhydramine 25 to 50 mg for an adult, or a non-drowsy one such as cetirizine 10 mg; see [[meds-stockpile]] for children), apply hydrocortisone cream or cool compresses, and **watch closely for an hour or two.** Any sign of breathing trouble or faintness means epinephrine.

## For people with known severe allergies
- **Carry two auto-injectors at all times.** Teach family and friends to use them.
- **Stock extras** for a long outage. Auto-injectors cost a lot; ask your doctor about a larger supply.
- Store at room temperature (59 to 86 °F / 15 to 30 °C), out of heat and cold. Do not leave in a car. Do not refrigerate. Check the liquid; if it is discolored or cloudy, replace it.
- Expired epinephrine loses strength gradually. If it is the only one you have in an emergency, use it.
- Wear a medical ID.
- Read every label; in an emergency pantry, "safe" foods may have changed brands.

## Asthma and allergies
Wheezing after an allergen exposure should be treated as anaphylaxis if other signs are present. Give epinephrine first, then the rescue inhaler.

See also [[bites-stings]], [[heart-stroke]].

    body: `
## Do this first
1. **Make sure the scene is safe.** Fumes or gas? Move to fresh air before helping.
2. **If the person is unresponsive and not breathing,** start [[cpr]]. If seizing, protect their head and lay them on their side.
3. **Call Poison Control: 1-800-222-1222** (US, free, 24 hours, any phone). Have ready: the person's age and weight, what they took, how much, when, and symptoms. If you cannot call, read the container label for first aid instructions.
4. **Do not make the person vomit.** Do not give salt water, milk, or home remedies unless Poison Control says so. Do not give activated charcoal unless told to.
5. **Keep the container, pills, or plant sample** to show to responders.
6. **If they are drowsy,** keep the airway open, lay them on their side (recovery position, see [[first-aid-basics]]), and monitor breathing.

## Skin, eyes, and inhaled poisons
- **Skin:** remove contaminated clothing, then rinse with running water for 15 to 20 minutes.
- **Eyes:** flush with clean water for 15 to 20 minutes ([[chest-abdomen-eye]]).
- **Inhaled:** move to fresh air.
- **Swallowed corrosives** (drain cleaner, strong bleach): wipe the mouth, rinse mouth with water, do not induce vomiting. Get care.

## Carbon monoxide (CO): the silent killer
CO is a colorless, odorless gas from burning fuel. It kills thousands of people in power outages from generators, charcoal grills, camp stoves, gas ranges and ovens, kerosene heaters, and running cars in garages.

**Signs:** headache, dizziness, nausea, weakness, confusion, sleepiness, chest pain. Several people in the same place falling ill together is a classic clue.

**Do this:**
1. **Get everyone into fresh air immediately.** Open doors and windows if you cannot leave.
2. Shut off the source if you can do so safely.
3. Call 911 if you can. Anyone who passed out, is confused, or has chest pain needs care, and pregnant women and children are especially vulnerable.
4. Do not go back inside until it has been ventilated and the source fixed.

> DANGER: Never run a generator, grill, camp stove, or propane or kerosene heater (unless rated for indoor use) inside a home, garage, or tent. Install battery-powered CO alarms. See [[generator-safety]] and [[heating-home]].

## Opioid overdose
**Signs:** unresponsive, slow or no breathing, blue or gray lips, tiny pupils, gurgling sounds.
1. Call for help if you can. Give **naloxone** (nasal spray 4 mg, one spray in one nostril). If there is no response in 2 to 3 minutes, give another dose in the other nostril.
2. **Give rescue breaths or CPR** until they breathe. Naloxone does not replace airway support.
3. Roll them onto their side once breathing. Stay with them; naloxone can wear off in 30 to 90 minutes and the overdose may return.

Naloxone is sold without a prescription in many places. It is worth adding to your kit ([[first-aid-kit]]).

## Alcohol poisoning
Vomiting, confusion, passing out, slow or irregular breathing (fewer than 8 breaths per minute), cold clammy skin, or blue lips. Lay them on their side, keep them warm, and **never leave them alone.** Do not give coffee or a cold shower. It is an emergency.

## Medicines
- **Acetaminophen (paracetamol) overdose** causes no symptoms at first, then liver failure days later. Treat any large dose as an emergency even if the person feels fine. See [[meds-stockpile]] for safe maximum doses.
- **Iron pills** are very dangerous to children.
- Keep medicines in original containers and out of reach.

## Button batteries and magnets
A swallowed button battery can burn through the throat in 2 hours. If a child (over 12 months) swallowed one and care is far away, give 2 teaspoons of honey every 10 minutes (up to 6 doses) while heading to care. Swallowed magnets (two or more) can cut through the intestines. Both are emergencies.

## Plants, mushrooms, and food
Call Poison Control and keep a sample. See [[deadly-plants]] and [[wild-mushrooms]]. For food poisoning, see [[food-safety-basics]] and [[dehydration-ors]].

## Chemicals
Never mix bleach with ammonia or vinegar; the gas can be deadly. See [[chemical-hazmat]].
`

    body: `
## Heart attack
### Signs
- Pressure, squeezing, fullness, or pain in the center of the chest lasting more than a few minutes, or that goes away and returns
- Pain or discomfort spreading to one or both arms, the back, neck, jaw, or stomach
- Shortness of breath, cold sweat, nausea or vomiting, lightheadedness
- **Women, older adults, and people with diabetes** may have little or no chest pain: unusual fatigue, indigestion-like discomfort, back or jaw pain, breathlessness

### Do this
1. **Call 911 / get help now.** Stop all activity. Help them sit down, ideally half-sitting with knees bent.
2. **Chew and swallow 325 mg of regular aspirin** (or four 81 mg low-dose tablets), unless they are allergic, a doctor has told them never to take it, they have a bleeding problem, or you suspect a stroke instead. Chewing works faster.
3. **Nitroglycerin** only if it is prescribed to that person: 1 tablet under the tongue, repeat every 5 minutes up to 3 doses. Do not give it if they have taken Viagra-type drugs in the last 24 to 48 hours or feel very faint.
4. **Loosen tight clothing,** keep them calm and warm, and do not let them walk around or drive.
5. **If they collapse and are not breathing,** start [[cpr]] and use an AED if available.

### Angina vs heart attack
Known angina brings chest pressure on exertion that eases within about 5 minutes of rest or nitroglycerin. If pain lasts more than 5 minutes after rest, or is worse than usual, **treat it as a heart attack.**

## Stroke
A stroke is a blockage or bleed in the brain. Treatment is time-critical: clot-dissolving drugs and clot removal work best within hours.

### BE-FAST signs
- **B**alance: sudden loss of balance or dizziness
- **E**yes: sudden vision loss or double vision
- **F**ace: one side of the face droops when they smile
- **A**rm: one arm drifts down when both are raised
- **S**peech: slurred, strange, or unable to speak or understand
- **T**ime: note when symptoms started (or when they were last seen normal) and call immediately

Other signs: sudden numbness on one side, confusion, sudden severe headache, trouble walking. **Symptoms that go away within minutes** (a "mini-stroke" or TIA) are still an emergency; a major stroke often follows.

### Do this
1. **Note the time they were last normal.** Tell responders.
2. **Call 911** or get to a hospital by the fastest means.
3. **Do not give aspirin** for a suspected stroke (a bleed would be made worse).
4. **Give nothing by mouth;** swallowing can be impaired and they may choke.
5. Keep them lying with the head slightly raised, or on their side if drowsy or vomiting. Keep them warm and calm.
6. **Check blood sugar if you can** (diabetics); low blood sugar can mimic a stroke. If they are awake and low, give sugar ([[chronic-conditions]]).
7. If they stop breathing, start [[cpr]].

## When no hospital is reachable
Rest, aspirin for a suspected heart attack (not for stroke), keep warm, monitor breathing and pulse, and avoid any exertion. Keep trying to reach help. Prevention matters: blood pressure control, no smoking, aspirin only if a doctor advises, and stocking essential heart medicines ([[meds-stockpile]]).
`

    body: `
## Chest wounds
### Sucking chest wound (open pneumothorax)
A hole in the chest that makes a sucking or bubbling sound when the person breathes.
1. **Cover the hole immediately** with a gloved hand while they breathe out, then seal it with a **chest seal**, plastic wrap, foil, or a plastic bag cut to fit, with several inches (about 10 cm) of overlap.
2. **Tape the seal on three sides** to let air escape (it acts as a one-way valve), or on all four sides if you are ready to lift one edge if breathing gets worse. A vented chest seal is best.
3. **Let the person sit up** or lie on the injured side, whichever helps them breathe.
4. **Watch for worsening:** more and more difficulty breathing, blue lips, a shifting windpipe, swollen neck veins. This is a **tension pneumothorax.** Briefly lift an edge of the seal to let trapped air hiss out ("burp" it), then reseal. Only a trained person can decompress the chest with a needle.
5. Treat for [[shock]] and get to care.

### Rib fractures
Pain with every breath and tenderness over the ribs. Do not wrap the chest tightly. Let the person hug a pillow when coughing. Have them take deep breaths and cough every hour while awake to avoid pneumonia. Danger signs: shortness of breath, blue lips, coughing blood, a section of chest that moves opposite to the rest when they breathe (flail chest; stabilize with a bulky pad), severe pain.

## Abdominal injuries
- **Closed injury (blunt blow):** bruising, tenderness, a rigid belly, vomiting, or signs of shock suggest internal bleeding. Lay the person flat, knees raised, keep them warm, give nothing by mouth, and get urgent care. See [[severe-bleeding]].
- **Open wound with organs outside (evisceration):**
  1. **Do not push the organs back in** and do not touch or press on them.
  2. Cover with a clean cloth soaked in clean water (or saline), then cover that with plastic wrap or foil to hold in moisture and warmth. Do not use fluffy cotton.
  3. Raise the knees on a pillow to reduce tension, and keep them warm.
  4. Give nothing to eat or drink. Treat for [[shock]].

## Embedded or impaled objects
**Do not pull the object out.** It may be plugging a bleeding vessel.
1. Pack bulky dressings around the object to hold it still.
2. Press on the edges of the wound, not on the object, to control bleeding.
3. Tape or tie the dressings in place. Shorten the object only if you must to move the person, and hold it steady while you do.
4. **Exception:** if an object in the cheek blocks the airway, or you must do CPR, remove it.

## Eye injuries
### Chemical in the eye (an emergency)
1. **Flush right away** with large amounts of clean, lukewarm water for **15 to 20 minutes.** Hold the eyelids open. Tilt the head so water runs from the nose side outward and away from the other eye. A faucet, bottle, or shower works.
2. Remove contact lenses if they come out easily.
3. Keep flushing even if it feels better. Alkalis (bleach, drain cleaner, lime, cement) cause the worst damage. Then get care.

### Foreign object
Do not rub. Blink repeatedly, or flush with clean water. Lift the upper lid over the lower lid to dislodge a speck. If the object is embedded or you cannot remove it, **do not try to dig it out.**

### Cuts, punctures, or a blow to the eye
- **Do not press on the eye or wash it.** Do not apply ointment.
- Cover with a **rigid shield** (a paper cup or the bottom of a cup taped around the eye, no pressure on the eyeball). Covering the other eye reduces movement and may help if the person can stay calm.
- A cold pack placed on the bone around the eye (not on the eye) helps with a blow.
- Get care for vision loss, double vision, blood in the colored part of the eye, severe pain, or an eye that looks misshapen.

### Snow blindness (sunburn of the eye)
Painful, gritty eyes hours after sun and snow exposure. Rest in darkness, cool compresses; it usually heals in 24 to 48 hours. Prevent it with sunglasses, or make slit goggles from cardboard or tape.

## Mouth and teeth
For knocked-out and broken teeth, see [[dental]].
`

    body: `
## Drowning
### Rescue without becoming a victim
Drowning people panic and can pull rescuers under. **Reach, throw, do not go.**
1. **Reach** with a pole, branch, paddle, or towel from solid ground.
2. **Throw** a rope, life jacket, cooler, empty jug, or anything that floats.
3. Only **swim out** if you are trained and have a flotation device. Never jump in after someone in cold or fast water.
4. **Ice:** do not walk out. Lie flat to spread your weight, push a ladder or branch ahead, and throw a rope.

### Treat
1. Get them to dry ground and lay them on their back. Suspect a spine injury only if there was a dive, a fall, or a high-speed accident ([[head-spine-injury]]).
2. **Check for breathing.** If they are not breathing, **give 5 rescue breaths first** (about 1 second each), then start CPR with **30 compressions and 2 breaths** ([[cpr]]). In drowning, the problem is lack of oxygen, so breaths matter more than in other cardiac arrests.
3. **Do not try to drain water from the lungs.** No abdominal thrusts. Vomiting is common; roll them to the side and clear the mouth, then continue.
4. Once breathing, place in the recovery position ([[first-aid-basics]]), remove wet clothing, and warm them ([[hypothermia-frostbite]]).
5. **Anyone who needed rescue breaths, coughed, or had trouble breathing should be watched for at least 4 to 8 hours** and seen by a clinician if possible; breathing problems can develop later.

## Electric shock
### Do this
1. **Do not touch the person while they are in contact with the source.** The current can pass to you.
2. **Turn off the power** at the breaker, switch, or unplug it. If you cannot, push the person or wire away with a **dry** non-conductor (dry wood, a plastic or rubber object, a dry rope) while standing on something dry.
3. Check breathing and pulse. Start [[cpr]] and use an AED if needed; electric shock can stop the heart.
4. Treat burns ([[burns]]). There may be an entry and an exit wound.
5. Anyone who was knocked unconscious, had a high-voltage shock, a heart rhythm problem, burns, or was in water needs medical evaluation.

### Downed power lines
> DANGER: Stay at least **35 feet (10 meters)** away from a downed line and anything touching it (fence, car, water). The ground around it can be live. If you feel tingling, shuffle away with feet together, taking tiny steps. Call the utility.

If a wire falls on your car: **stay in the car** and wait for the utility. Only if there is fire, jump clear with both feet together, without touching the car and the ground at the same time, and shuffle away.

### Water and electricity
Do not enter a flooded room or basement until the power is off at the main breaker. See [[flood]].

## Lightning strike
- **A lightning victim does not carry an electrical charge.** It is safe to touch them.
- Call for help. Check breathing and pulse. **Start CPR** if needed; most lightning deaths are from cardiac arrest, and prompt CPR works.
- **If there are several victims, treat first the ones who are not breathing or have no pulse** (the opposite of the usual order). People who are awake and moaning will probably live.
- Expect burns (including a feathery pattern), broken bones from muscle contraction, hearing loss, eardrum rupture, and confusion.
- Move to safe shelter. Lightning can strike the same area again. If thunder is still audible, you are still at risk. See [[severe-storms-tornado]].

## Prevention
Learn to swim. Wear a life jacket on boats. Cover or fence water sources. Never use electrical appliances near water. Stay indoors in a storm and stay away from windows and plumbing.
`

    summary: "When to move someone, simple carries and drags, and how to build and use an improvised stretcher.",

    body: `
## Should you move them?
**Leave them where they are** unless:
- There is danger: fire, rising water, traffic, gas, an unstable building, or falling rock.
- You need to move them to a hard, flat surface for [[cpr]].
- You must reach shelter, warmth, or care and no help is coming.

Do not move someone with a suspected spine injury unless forced to ([[head-spine-injury]]). Move the minimum distance necessary, stabilize bleeding and broken bones first, and treat for [[shock]].

## Protect your own back
Bend your knees and lift with your legs, keep the person close to your body, do not twist, and lift together on a count of three. Rest often. Two or more rescuers are far safer than one.

## One-rescuer emergency moves
- **Clothes drag:** grab the collar behind the head, cradle the head with your forearms, and pull the person along the ground, head first.
- **Blanket drag:** roll the person onto a blanket or tarp, then pull from the head end. Good for heavy people.
- **Armpit (shoulder) drag:** reach under the armpits from behind, grasp one forearm with both hands, and drag backward with your knees bent.
- **Pack-strap carry:** for a conscious person who can stand. Back up to them, have them hang their arms over your shoulders, grasp their wrists, and lean forward to lift them onto your back. Good for short distances.
- **Fireman's carry:** for a light to moderate-weight person who can be lifted. Do not use with chest, belly, or spine injuries.
- **Child:** carry in the arms or on the back.

## Two-rescuer carries
- **Two-hand seat:** each rescuer grasps one of their own wrists and the other rescuer's wrist to form a seat; the person sits and puts arms around both shoulders.
- **Four-hand seat:** each rescuer grasps their own wrist with one hand and the other's wrist with the other hand, forming a square seat. Easier for long distances.
- **Chair carry:** seat the person in a sturdy chair. One rescuer holds the back legs, the other holds the front legs, and tilt the chair to carry.
- **Human crutch:** stand on the injured side, put their arm over your shoulder, and support their waist.

## Improvised stretchers
Use at least **4 people** for a stretcher over rough ground, and 6 to 8 for a long trip, rotating the carriers.
- **Blanket and poles:** use two strong poles about 7 to 8 feet (2 to 2.5 m) long. Lay a blanket flat. Place the first pole one-third of the way across, fold the blanket over it, place the second pole two-thirds across, and fold the rest over. The person's weight holds it.
- **Jacket stretcher:** pass two poles through the sleeves of two or three coats buttoned up with the sleeves turned inside out.
- **Sack stretcher:** poles through holes in the bottom corners of two or three sacks.
- **Rigid board, door, or ladder:** best for spine injuries or broken legs. Pad it, and strap the person across the chest, hips, thighs, and ankles.
- **Tarp or hammock carry:** carriers hold the edges; padding on a rope-edge tarp helps.

## Log roll (for placing someone on a board)
With 3 to 4 people, one at the head directs. Keep the head, neck, and trunk in a straight line. On the command, roll the person toward you as one unit, slide the board under, and roll back.

## Long-distance evacuation tips
- Carry **feet first** on level ground, and keep the **head uphill** on slopes.
- Keep the person warm, shaded, padded, and hydrated if awake.
- Recheck breathing, bleeding, splints, and circulation every 10 to 15 minutes ([[fractures-sprains]]).
- Change carriers often. Move smoothly; avoid jolts.
- Send ahead scouts to clear the route.
- Leave a note at the scene about where you went.

See also [[improvised-first-aid]] and [[triage-no-help]].
`

## Dressings and bandages
- **Clean cloth:** cut or tear a clean cotton T-shirt or sheet into squares. For the best result, **boil it for 10 minutes** (or iron it hot) and let it dry in a clean place. Store in a clean plastic bag.
- **Absorbent pads:** sanitary pads and unused diapers make good trauma pads (use the absorbent side against the wound; they are often individually wrapped).
- **Non-stick layer:** a layer of plastic wrap or a clean plastic bag next to a burn.
- **Tape alternatives:** strips of cloth tied around a limb, a belt, or duct tape on the outside (not directly on the wound).
- **Elastic wraps:** nylon stockings or tights, cut strips from a stretchy T-shirt.

## Triangular bandage (sling, swathe, tourniquet)
Cut or fold a cotton square about 36 to 40 inches (90 to 100 cm) across diagonally to make two triangles.
- **Sling:** place the triangle under the arm with the point at the elbow, tie the ends behind the neck, and pin the point at the elbow.
- **Cravat (strip):** fold the point to the base and then in half again twice, giving a band 2 to 3 inches wide. Use it to hold splints, tie legs together, or as a bandage.
- **No bandage?** Pin the shirt sleeve to the chest, put the hand inside a buttoned shirt, or use a belt or scarf.

## Splints
- **Rolled newspaper or magazines** held with tape or string
- **Sticks, boards, or cardboard** folded into a U
- **A pillow or folded blanket** wrapped around an ankle or forearm
- **Rolled sleeping pad** or foam
- **Buddy splint:** tape a finger to the next finger, or a leg to the other leg
- Pad every splint with cloth. Immobilize the joints above and below. See [[fractures-sprains]].

## Tourniquet
Use a wide strap (belt, folded triangular bandage) and a stick or rod; never a thin cord. Full steps are in [[severe-bleeding]].

## Pressure dressing
Place a thick pad directly on the wound, wrap tightly with an elastic strip, then tie a knot or place a small hard object over the wound under the wrap. Check the fingers or toes for warmth and color.

## Wound irrigation
- A **plastic bag with a pinhole**, a squeeze bottle with a pinhole in the cap, a **turkey baster**, or a large syringe
- A drinking-quality or boiled-and-cooled water source
- Weak salt water is fine: about 1 level teaspoon of salt per pint (500 mL) of clean water. Plain water works almost as well.

See [[wound-care]].

## Sterilizing tools
Boil metal instruments for 20 minutes, or hold in a flame until red and let cool without touching (wipe off soot with a clean cloth), or soak in 70 percent isopropyl alcohol for at least 10 minutes. Handle only the handles afterward.

## Barriers and protection
- **Gloves:** plastic bags, sandwich bags, or plastic wrap
- **Face shield for rescue breaths:** a clean cloth or plastic with a hole is better than nothing. The risk of catching an infection from rescue breaths is very low.

## Cold and heat
- **Cold pack:** a bag of ice or snow wrapped in cloth, frozen vegetables, or a cloth soaked in cold water
- **Heat pack:** a water bottle filled with warm (not boiling) water wrapped in cloth. Never apply a hot object directly to skin.

## Eye protection and shields
A paper cup taped around the eye, or a folded piece of cardboard with a hole.

## Honey dressings
A thin layer of honey on a clean dressing helps with burns and slow-healing wounds. Do not use honey in infants' mouths (botulism risk under 1 year).

## Improvised stretcher and carry
See [[moving-patients]].

## Other ideas
- **Neck support:** a rolled towel or blanket on both sides of the head works better than a homemade collar. See [[head-spine-injury]].
- **Pulse and breathing rate:** count for 15 seconds with a watch and multiply by 4.
- **Fever check without a thermometer:** feel the forehead and trunk with the back of the hand; you cannot estimate the temperature accurately, so look for other signs.
- **Hot water bottle:** a sealed metal canteen filled with hot water, wrapped in a sock.

Improvised supplies work best when you have practiced with them. Try making a splint and a sling before you need one.

    body: `
## When to use triage
Triage means sorting injured people so that limited helpers and supplies save the most lives. Use it when there are **more injured people than you can treat at once.**

## Before you sort
1. **Make the scene safe.**
2. **Ask everyone who can walk to move to one spot.** They are the "minor" group. Ask one of them to help.
3. **Choose one person to lead** and one to keep records.
4. Plan on about **30 seconds per person.** Only fix life threats as you go: stop heavy bleeding, open the airway, and reposition.

## START triage (adults)
Check each person in this order.
1. **Can they walk?** Yes: **Minor (green).**
2. **Breathing?** If not breathing, open the airway once. Still not breathing: **Expectant/deceased (black).** If they start breathing: **Immediate (red).**
3. **Breathing rate:** more than 30 per minute: **Immediate (red).**
4. **Circulation:** no pulse at the wrist, or when you press a fingernail the color takes more than 2 seconds to return, or heavy bleeding: **Immediate (red).** Stop the bleeding.
5. **Mental status:** cannot follow a simple command ("squeeze my hand"): **Immediate (red).** Can follow: **Delayed (yellow).**

| Group | Meaning | Examples |
|---|---|---|
| **Immediate (red)** | Life-threatening, but can be saved with quick help | Severe bleeding, airway problems, shock |
| **Delayed (yellow)** | Serious, but can wait a few hours | Fractures, large burns, stable wounds |
| **Minor (green)** | Walking wounded | Cuts, sprains, minor burns |
| **Expectant (black)** | Not breathing, or injuries too severe to survive given the resources | Receive comfort care |

**For children,** use a similar approach, but if a child is not breathing give 5 rescue breaths before deciding; children whose breathing rate is outside 15 to 45 per minute are red.

Mark each person with a colored cloth or write the group on the forehead or arm with a marker, along with the time. **Reassess every 15 to 30 minutes.** People change groups.

## When no hospital is coming
In ordinary disasters, ambulances come within an hour. In a long grid-down emergency they may not. Then:
- **Treat the people you can save with what you have.** Severe injuries that need an operating room may be fatal; the "expectant" group grows. This is hard, and it is not a failure on your part.
- **Comfort care for the dying:** a warm, quiet place, pain relief if you have it, water on the lips, a human presence, and honesty with family. Never abandon someone who is still alive.
- **Do not decide alone** if others are available. Talk it through, and agree on principles ahead of time.

## Special rules
- **Lightning:** treat the people who look dead first ([[drowning-electric]]).
- **Hypothermia:** a person who looks dead may be saved after rewarming ([[hypothermia-frostbite]]).
- **Children and pregnant women:** do not treat them as lower priority.
- **Treat life threats at any point:** a bleeding person gets a tourniquet even if you are in the middle of sorting ([[severe-bleeding]]).

## Keep records
Write down each person's name, age, injuries, findings, what you did, medicines given (name, dose, time), and tourniquet times. A pencil and paper beat memory.

## Set up simple zones
- A **treatment area** with red, yellow, and green sections
- A **quiet area** for the dying and for the dead
- A **supply station**
- A **clear route** out

## Longer-term care
After the first hours, switch to ongoing care: wound checks, hydration, nutrition, pain control, turning bedbound patients, and watching for infection. See [[home-nursing]], [[infection-antibiotics]], [[disease-prevention]].

## Look after the helpers
Drink, eat, and rest, even for a few minutes. Rotate roles. Talk afterward about what you saw. See [[mental-health]].
`

## Do this first
1. Count everyone you must supply, including children, nursing mothers and pets.
2. Set aside at least **1 gallon (4 L) per person per day**. Roughly half is for drinking and cooking, half for minimal washing and hygiene.
3. Drink when you are thirsty. **Do not ration water; ration effort.** Rest in the heat and do hard work in the cool of morning or evening.

> IMPORTANT: Without water most people last about 3 days, less in heat or when working hard. Water comes before food.

## How much is enough
| Person or situation | Drinking water per day |
|---|---|
| Adult, resting, cool weather | about 2-3 quarts (2-3 L) |
| Adult, warm weather or active | 4-6 quarts (4-6 L) |
| Heavy labor in heat | 1.5 gallons (6 L) or more |
| Child | at least 1/2 gallon (2 L); they dehydrate faster than adults |
| Pregnant or nursing | add about 1 quart (1 L) to the adult figure |
| Fever, vomiting, diarrhea | much more; see [[dehydration-ors]] |
| Dog or cat | about 1 ounce per pound of body weight (a 50 lb dog needs about 1.5 quarts) |

The body can absorb roughly 1 quart (1 L) per hour at most. Sip steadily rather than gulping.

## Plan the storage
- **3 days**: 3 gallons (12 L) per person. This is the bare minimum kit.
- **2 weeks**: 14 gallons (56 L) per person. A sensible home goal.
- Add extra for pets, for cooking dry food (rice, beans, pasta soak up a lot), and for washing.
- Use the Supplies Calculator in the Tools tab to total it for your household.
- See [[water-storage]] for containers and hidden sources in your home.

## Signs you are not drinking enough
- Thirst, dry mouth, dark yellow urine, headache, tiredness, dizziness when you stand.
- **Urine color is your gauge**: pale straw is good; dark amber means drink more.
- Serious: confusion, very little or no urine for 8 hours, sunken eyes, fast heartbeat, fainting. Treat right away with [[dehydration-ors]].

## Make water last
- Stay in shade and move slowly in the heat. Sweat is where most water is lost.
- Wear loose, light clothing and a hat. Wet a cloth for your neck.
- Eat little when water is very short; digesting food, especially salty or dry food, uses water.
- Avoid alcohol and caffeine; they increase fluid loss.
- Use less-clean water for washing and flushing, and the cleanest for drinking.
- Reuse: rinse water for dishes can flush a toilet.

> WARNING: Never drink seawater, urine, antifreeze or floodwater to ease thirst. Salt water makes dehydration worse. See [[distillation]].

## Where to get more
See [[finding-water]], [[water-safety]] for judging sources, and [[boiling-water]] or [[chemical-disinfection]] to make it safe.

    body: `
## Do this first
1. **Use what is already at home**: water heater, toilet tank, pipes, ice, canned liquids (see below).
2. Look for the best natural source: **rain, then springs, then clear flowing streams**, then ponds and lakes. Avoid stagnant, scummy or dead-animal water.
3. **Treat everything you collect** before drinking: [[boiling-water]], [[chemical-disinfection]] or [[water-filters]].

## Hidden water in your home
- **Water heater tank** (30-80 gallons): turn off the power or gas first, let it cool, then drain from the bottom valve into clean containers. Details in [[water-storage]].
- **Toilet tank** (not the bowl): clean water if you have not used tank cleaning tablets.
- **Plumbing**: shut the main valve, open the highest faucet to let air in, then collect from the lowest faucet.
- **Ice** in the freezer and ice-maker bin.
- **Liquid from canned vegetables and fruit.**
- **Swimming pool or hot tub**: only for flushing and washing unless properly treated and filtered; pool chemicals make it a poor drinking choice.

## Outdoor sources
### Rain
The cleanest natural water. Catch it in clean pots, buckets, or on a tarp. See [[rain-catchment]].

### Snow and ice
**Melt it before drinking.** Eating snow chills your body and wastes energy. Put a little water in the pot first so snow does not scorch. Ice gives more water per volume than snow.

### Dew
At dawn, wipe grass and leaves with a clean cloth, then wring it into a container. A slow but real source.

### Streams and springs
- Moving water is generally better than standing water.
- Collect **upstream** of campsites, animals, roads, farms and towns.
- A spring where water comes out of the ground is usually cleaner than a stream, but still treat it.

### Ponds and lakes
Collect away from the shore. **Avoid water with green, blue-green or paint-like scum**: algae toxins are not removed by boiling.

### Digging for water
In a dry streambed, dig on the **outside bend** of a curve at the lowest point. Wait for it to seep in. It will be muddy; let it settle, strain it, then treat it.

## Clues that water is near
- Green plants in dry country, willows, cottonwoods, cattails.
- Animal trails converging, especially downhill, and birds flying low at dawn and dusk.
- Water flows downhill. Follow valleys and drainage downward.

## Transpiration bag
Tie a clear plastic bag tightly around a leafy branch in sunlight. Water drips into the bag over hours. You get only a few ounces a day, and **never use poison ivy, oak, sumac or any plant you cannot identify.**

## Myths that waste effort or harm you
- **Cactus water**: most cactus fluid is bitter or toxic and causes diarrhea, which dehydrates you further.
- **Vines**: do not drink from vines with milky, colored or smelly sap.
- **Drinking urine, seawater or alcohol**: makes dehydration worse.

> WARNING: Water that looks clear can still carry germs. Read [[water-safety]] before you decide what is drinkable.

    body: `
## The short version
Any water that has not come from a treated tap supply may carry germs. **Clear water is not necessarily safe.** The reliable routine is: pick the best source, strain it if cloudy, then disinfect it, preferably by boiling.

## What can make you sick
| Danger | Examples | Boiling | Filter (0.1-0.2 micron) | Bleach at normal dose |
|---|---|---|---|---|
| Bacteria | cholera, E. coli, typhoid, Salmonella | kills | removes | kills |
| Viruses | hepatitis A, norovirus, rotavirus | kills | usually does not remove | kills |
| Protozoa | Giardia, Cryptosporidium | kills | removes | kills Giardia; Cryptosporidium is resistant |
| Chemicals | fuel, pesticides, heavy metals, nitrates | does NOT remove | carbon helps with some | does NOT remove |

For the widest protection use **boiling**, or **a filter plus chemical treatment**.

## Chemicals and toxins
Boiling does not remove poisons; it can even concentrate them as water boils off. Avoid water near:
- Farms with spraying or heavy manure, factories, mines, gas stations, junkyards, dumps.
- Anything with an oily sheen, strong chemical smell, foam, or dead fish or animals.
- Green or blue-green scum (blue-green algae toxins).

If you suspect chemical contamination, find another source.

## Rank your sources
1. Stored treated tap or bottled water
2. Rain caught in clean containers
3. Springs and protected wells
4. Clear, fast-moving streams, collected upstream
5. Lakes and ponds
6. Slow, muddy, stagnant water
7. Floodwater, water downstream of towns or farms, anything near sewage (**last resort; filter then boil**)

## Floodwater and sewage
Floodwater carries sewage, fuel and chemicals. Do not drink it unless there is no alternative, and then only after cloth-straining, filtering and boiling. A flooded well must be disinfected and tested before use: see [[wells-springs]].

## Make cloudy water easier to treat
1. Let it sit so sand and silt settle, then pour off the top.
2. Pour it through a clean cloth or coffee filter.
3. Then disinfect. Cloudy water reduces how well chemicals work, so double the dose if you must use it cloudy. See [[chemical-disinfection]].

## Seawater and urine
Never drink either. See [[distillation]].

## If you truly cannot treat water
If you are becoming seriously dehydrated and have **no** way to boil or treat, choose the clearest, fastest-moving source you can reach and drink. Dehydration can kill in days; waterborne illness is usually slower and treatable. Expect possible stomach illness and treat it with [[dehydration-ors]].

> TIP: Stay as safe as you can by carrying a way to make fire or a small filter at all times. A metal cup or pot lets you boil water anywhere.
`

    body: `
## Do this first
1. If the water is cloudy, strain it through a clean cloth or coffee filter.
2. Heat it until large bubbles are continuously breaking the surface: a **rolling boil**.
3. Keep boiling for **1 minute**. Above **6,500 feet (2,000 m)** boil for **3 minutes**.
4. Let it cool with the lid on. Store it in a clean, covered container.

Boiling kills bacteria, viruses and protozoa, including Cryptosporidium. Disease germs die at lower temperatures than boiling, so the minute is a safety margin.

> WARNING: Boiling does **not** remove chemicals, fuel, pesticides, heavy metals or salt. If water smells of fuel or chemicals or comes from near industrial sites, do not drink it.

## Saving fuel
- Use a pot with a **lid**. A lid can cut fuel use by roughly a third.
- Shield the flame from wind with a windbreak.
- Use a wide, flat-bottomed pot; a rocket stove ([[rocket-stove-build]]) uses far less wood than an open fire.
- Boil only what you need to drink and cook; use disinfected water for dishes only if necessary.
- Warm water in the sun first: a dark container in direct sun heats water before it goes on the stove.
- After the boil, keep the pot in a well-insulated box (a hay box) to stay hot without more fuel.

## Making boiled water taste better
Boiled water tastes flat because the air is gone. Pour it back and forth between two clean containers, or let it stand a few hours. A tiny pinch of salt per quart also helps.

## Keep it clean afterward
Pour it into a clean container with a lid. Do not dip dirty cups into it; pour or ladle with a clean tool.

## Solar disinfection (SODIS)
Use this when you cannot boil, as a backup method.
1. Use **clear PET plastic bottles** (soda or water bottles), no larger than 2 L. Not colored, not scratched, not glass, not PVC. Remove labels.
2. The water must be clear. If you can read large print through the filled bottle, it is clear enough. If not, strain or filter first.
3. Fill the bottle about three quarters, cap it, shake for 20 seconds, then fill it completely and recap.
4. Lay bottles **on their side** on a reflective surface such as a metal roof or foil, in full sun.
5. Leave them for **at least 6 hours in bright sun**, or **2 full days if mostly cloudy**. Do not rely on it in rain or heavy cloud.
6. Drink straight from the bottle or pour into a clean cup.

### Limits of SODIS
- It does not remove chemicals.
- It does not work on cloudy water.
- Only small quantities per bottle; you need many bottles.
- It may be less reliable against Cryptosporidium. Boil whenever you can.

## Other uses of heat
Hot tap or stove water at a full boil for a minute is also the right way to prepare formula or sterilize bottles and instruments. See [[babies-kids]] for infant water safety.

## Do this first: bleach
1. Use **plain, unscented household bleach** whose label lists sodium hypochlorite (5-6% or 8.25%) as the only active ingredient. No scents, dyes, thickeners, cleaners or "color-safe" types.
2. If the water is cloudy, strain it through a cloth first. If it is still cloudy, **double the dose**.
3. Add the drops below to clear water, then stir or shake.
4. **Wait 30 minutes.** In very cold water wait up to an hour.
5. The water should smell slightly of chlorine. If it does not, repeat the dose and wait another 15 minutes.

| Water | 5-6% bleach | 8.25% bleach |
|---|---|---|
| 1 quart or 1 liter | 2 drops | 2 drops (rounded up) |
| 1 gallon (4 L) | **8 drops** | **6 drops** |
| 5 gallons (20 L) | 40 drops (about 1/2 teaspoon) | 30 drops (about 1/3 teaspoon) |

The Water Treatment Calculator in the Tools tab works out doses for any volume.

### Bleach tips
- Use a clean dropper or spoon, not a dirty one.
- Bleach weakens with age and heat. If it is more than a year old or was stored hot, add a few extra drops and rely on the **chlorine smell test**.
- If the chlorine taste is strong, let the water stand uncovered for a few hours or pour it between containers.
- Never mix bleach with ammonia, vinegar or other cleaners. It makes toxic gas.

> WARNING: Do not use bleach on water you suspect is chemically contaminated. It only treats germs.

## Pool shock (calcium hypochlorite)
Granular pool "shock" lasts for years when stored dry, so it is a good long-term water disinfectant, but the product must be right.

> DANGER: Use only granular calcium hypochlorite labeled **65-78%** with **no additives**: no algaecide, clarifier, stabilizer or "trichlor/dichlor" (cyanuric acid). Wear gloves and goggles. Keep it dry and away from fuels, oils and other chemicals; it can start fires or give off toxic gas if mixed.

Method from the CDC:
1. Make a stock solution: **1 heaping teaspoon (about 1/4 oz, 7 g)** of powder per **2 gallons (7.5 L)** of water. Stir until dissolved.
2. To treat water, add **1 part stock solution to 100 parts water**. That is roughly **1 pint per 12.5 gallons**, or about 2 1/2 tablespoons per gallon.
3. Wait 30 minutes and check for a faint chlorine smell.

Make a fresh stock solution regularly and keep it in a dark, closed container, out of reach of children.

## Iodine tablets
- Follow the label, usually one tablet per quart or liter with a 30 minute wait (longer if the water is cold).
- Kills bacteria and viruses and Giardia, but **is unreliable against Cryptosporidium**.
- **Avoid** in pregnancy, thyroid disease, iodine allergy, and for more than a few weeks of continuous use.

## Chlorine dioxide tablets
- Follow the label. Typical waits are about 30 minutes for bacteria and viruses and **4 hours for Cryptosporidium**.

| Method | Bacteria | Viruses | Giardia | Cryptosporidium |
|---|---|---|---|---|
| Boiling | yes | yes | yes | yes |
| Bleach | yes | yes | yes | poor |
| Iodine | yes | yes | yes | poor |
| Chlorine dioxide | yes | yes | yes | yes, after 4 hours |
| Filter 0.1-0.2 micron | yes | no | yes | yes |

For the best result combine a filter with chemical treatment, or just boil. See [[water-filters]] and [[boiling-water]].

    body: `
## What a filter does
A filter is a strainer with tiny holes. It stops anything bigger than its pores. The pore size decides what it protects you from.

| Filter type | Removes | Does not remove |
|---|---|---|
| Folded cloth, coffee filter | sand, silt, debris, large organisms | germs, chemicals |
| Ceramic (about 0.2-0.5 micron) | bacteria, protozoa | viruses, most chemicals |
| Hollow-fiber (0.1-0.2 micron) | bacteria, protozoa (Giardia, Cryptosporidium) | viruses, chemicals |
| Ultrafilter / "purifier" (about 0.02 micron or filter plus chemical stage) | bacteria, protozoa, and viruses | most chemicals |
| Activated carbon | chlorine taste, odors, some chemicals | germs |

**A filter alone is not enough** if viruses are possible, such as downstream of towns, after floods, or anywhere sewage could be involved. Add chlorine or boil after filtering.

## Using a filter well
1. Pre-strain cloudy water through cloth so the filter does not clog.
2. Follow the maker's flow direction and instructions.
3. Clean it. Hollow-fiber filters are backflushed; ceramic filters are scrubbed with a scouring pad. Replace cartridges at the stated life.
4. Store it clean and dry.
5. Keep spare cartridges.

> WARNING: **Never let a hollow-fiber filter freeze.** Ice can crack the fibers invisibly and the filter will no longer work. In cold weather keep it inside your jacket or sleeping bag. If it may have frozen, replace it.

## Gravity filters
Countertop gravity filters with ceramic or carbon elements work with no power, and can clean large quantities. Treat them as bacteria and protozoa filters unless the maker states virus removal. In an emergency add a few drops of bleach after filtering.

## Do-it-yourself filters
A sand-and-charcoal filter made from a bucket or bottle **only improves clarity and taste**. It is a **pre-filter**, not a purifier.
1. Poke small holes in the bottom of a bucket or cut the bottom off a bottle and turn it upside down.
2. From the bottom up, add: a piece of cloth over the outlet, small gravel, crushed hardwood charcoal that has been rinsed, fine sand, and coarse sand.
3. Pour water slowly through the top and discard the first few batches.
4. **Boil or disinfect the result.**

Folding clean cloth into several layers and pouring water through it is a worthwhile pre-filter when nothing else is available, because it catches larger particles and organisms that carry germs.

### Biosand filters
A slow sand filter builds a living layer on the top of the sand that removes many germs, but it needs weeks to start working and must be kept wet. Even then, disinfect the output.

## Best practice
**Filter, then disinfect or boil.** Think of the filter as taking out the junk, and the disinfectant as killing what remains. See [[chemical-disinfection]] and [[boiling-water]], and [[water-safety]] for choosing a source.
`

    body: `
## Do this first
1. Fill clean containers with tap water **before** a storm or outage, when pressure can fail.
2. If power or water pressure is already failing, fill bathtubs, pots, bottles and the washing machine tub for washing and flushing.
3. Store at least **1 gallon (4 L) per person per day**: 14 gallons per person for 2 weeks. See [[water-needs]].

## Choosing containers
Good:
- Food-grade plastic (HDPE #2 or PET #1), such as soda and water bottles, 5-7 gallon jugs, and **55-gallon food-grade drums**.
- Stainless steel or glass, if you can keep them from breaking.

Avoid:
- **Milk jugs**: they cannot be cleaned fully and break down over time.
- Anything that held chemicals, fuel, or pesticides.

## Sanitizing a container
1. Wash with soap and rinse well.
2. Mix **1 teaspoon of plain unscented bleach per quart (1 L) of water** and swish it around so it touches every surface.
3. Wait about 30 seconds, pour it out, and let the container air dry or rinse with clean water.

## Filling and treating
- **City tap water** that is already chlorinated can be stored as is.
- **Well water or untreated water**: treat it before storing using [[chemical-disinfection]] (8 drops per gallon of 5-6% bleach, wait 30 minutes).
- Leave about an inch (2.5 cm) of space at the top if the container might freeze.
- Label with the date. **Replace stored tap water about every 6 months.** Commercial bottled water: use by the date on the label.
- Keep it in a cool, dark place, away from fuel, chemicals and strong smells; plastic is slightly permeable to vapors.

## Large storage
- A 55-gallon drum weighs about 460 lb (210 kg) when full; set it on a stable base where you want it and use a siphon or pump with a clean hose.
- Bladders that fit in a bathtub store about 100 gallons and can be set up when a storm is announced.

## Hidden water inside your home
### Water heater
Holds 30-80 gallons of drinkable water.
1. Turn off the **electric breaker or gas** to the heater and **let it cool**.
2. Turn off the incoming cold water valve on top.
3. Open a hot water tap somewhere in the house to let air in.
4. Attach a hose to the drain valve at the bottom and drain into clean containers.
5. The first bit may contain sediment. Let it settle, then treat as needed.

### Toilet tank (not the bowl)
Clean water if you do not use tablets or cleaners in the tank. Treat before drinking.

### Plumbing
Shut the main valve first (this keeps contaminated water from flowing back in). Open the highest faucet, then collect what drains from the lowest faucet.

### Other
- Ice in the freezer and ice-maker bin.
- Water in the washing machine drum is not drinkable but is fine for flushing.
- **Swimming pools and hot tubs** are for flushing and washing, not drinking, unless filtered and treated.
- Liquid in canned vegetables and fruit.

> TIP: Fill empty freezer space with containers of water (leave room to expand). It keeps the freezer cold longer during an outage and gives you clean water when it thaws.

## Keep stored water usable
Treat any stored water that has been opened, smells bad, or looks cloudy before drinking. See [[water-safety]] and [[boiling-water]]. When in doubt, boil.
`

## How much can you collect?
Every **1 inch (25 mm) of rain on 1,000 square feet (93 m2) of roof gives about 623 gallons**. Use about 75-80% of that figure to allow for splash, evaporation and overflow.

Example: a 1,500 sq ft roof in a place with 30 inches of rain a year: 1,500 x 30 x 0.623 = about 28,000 gallons, or roughly 22,000 gallons after losses.

Even one small shower can fill a barrel.

## Parts of a system
1. **Catchment**: the roof. Metal and clay tile are best. Asphalt shingles are fine for non-drinking use. Avoid wood shakes treated with chemicals, roofs with lead flashing or paint, and any roof with asbestos.
2. **Gutters** with leaf screens, sloped toward the downspout.
3. **First-flush diverter**: discards the dirtiest first part of each rain (about 10 gallons per 1,000 sq ft of roof).
4. **Storage**: opaque food-grade barrel or tank with a tight lid, an overflow pipe, and a tap about 4-6 inches above the bottom.
5. **Screens** over every opening, fine enough to stop mosquitoes.

## Emergency collection
- Spread a clean tarp or plastic sheet and slope it into a bucket.
- Catch rain straight from the sky in clean pots, bowls and bottles.
- Let the first 10 minutes of rain rinse the surface before collecting.

## Treating rainwater
Roof water collects bird droppings, dust and chemicals.
- **For drinking and cooking**: filter and then boil or disinfect. See [[water-filters]], [[boiling-water]], [[chemical-disinfection]].
- **For washing, flushing and the garden**: untreated is fine.

> WARNING: Do not drink water that has run off roofs with lead or copper flashing, tar, or newly treated wood without testing or another source.

## Keeping it clean
- Clean gutters and screens often.
- Keep the container dark and tightly closed so algae and mosquitoes cannot grow. A small mosquito-control product (Bti "dunks") can be added to open water.
- Scrub the tank once a year.
- Make sure the overflow runs away from your foundation.

## Winter and legal notes
- In freezing weather drain exposed pipes and keep a few inches of space in barrels so ice does not crack them.
- Some places limit or regulate rainwater collection. Check local rules in normal times.

## Related
[[water-storage]] for containers, [[water-safety]] for judging sources, and [[garden-structures]] for building a rain barrel stand.

    body: `
## Wells without power
Most home wells use an electric pump. If the power fails, you can still reach the water.
- **Bucket and rope**: lower a clean, dedicated bucket on a clean rope. Never use a bucket that has touched the ground or been used for anything else.
- **Bailer**: a length of pipe with a check valve at the bottom that you drop and lift.
- **Hand pump**: shallow-well suction pumps work only to a depth of about 25 feet (8 m). For deeper wells you need a **deep-well hand pump** that has a piston down in the well. Some models can be installed beside an existing electric pump in drilled wells, so you can fit one **before** you need it.

> DANGER: Never climb down into a well or an old pit. Low oxygen and poisonous gas can kill in seconds, even without a smell.

## Protecting a well or spring from contamination
- Keep wells **at least 100 feet (30 m)** from septic tanks, latrines, animal pens and manure piles, and place them uphill when you can. More distance is better.
- Cap the well so nothing can fall in; raise the top of the casing 1-2 feet above ground and slope the ground away from it.
- **A spring box** is a box of stone, concrete or pipe built around the spring's eye. Add a screened outlet pipe, a cover, and a ditch uphill to divert surface runoff. Fence out animals.
- Keep latrines, livestock and compost downhill from wells and springs.

## Hand-dug wells
These are risky and slow, but they have been used for thousands of years.
- Dig where the water table is shallow (green vegetation, springs nearby), ideally in the dry season so you reach the lowest water level.
- **Collapse is the main killer.** Do not work in a hole deeper than about 4 feet (1.2 m) without shoring or lining. Always have a person at the surface and a rope.
- Line the shaft with stone, brick or concrete rings, add a lid, and raise the rim 1-2 feet. Seal the upper 10 feet (3 m) against surface water if you can.
- Treat the water: seep water is usually muddy and may be unsafe. See [[water-safety]].

## Disinfecting a well
After flooding, or if the water changes taste, smell or color, treat the well as contaminated.
1. Use another source for drinking in the meantime, and boil or disinfect water from the well. See [[boiling-water]].
2. **Shock chlorination**: add chlorine bleach to the well so the whole casing and water is disinfected, wait 12-24 hours, then pump the water out until the chlorine smell is gone. The right amount depends on the diameter and depth of the well, so **follow your state or county health department or Extension service instructions**.
3. Pump the chlorinated water away from septic systems, streams and plants.
4. After treatment, have the water tested when it is possible.

## Cisterns
Underground or tank cisterns store rain or hauled water. Keep them covered, screened and clean, and treat water before drinking. See [[rain-catchment]].

## Related
[[finding-water]], [[water-storage]], [[human-waste]] for safe latrine placement.

    summary: 'Why you must not drink seawater or urine, how to distill water on a stove, and how solar stills really perform.',

    body: `
## Never drink these
> DANGER: **Seawater, urine, blood, alcohol and antifreeze make dehydration worse and can kill.** Seawater is about 3.5% salt. Your kidneys cannot remove that much salt, so each sip pulls water out of your body.

Brackish (slightly salty) water has the same problem, just weaker. If it tastes salty, do not drink it. Distill it, or find another source.

## What distillation does
Distilling boils water and catches the steam, which turns back into water and leaves salt, metals and most dissolved minerals behind. It also kills germs.

**It does not reliably remove chemicals that boil off easily, like fuel or solvents.** Do not rely on it for water that smells of gasoline or chemicals.

## Distilling on a stove or fire
1. Fill a large pot about halfway with salty or dirty water.
2. Place a **clean cup or small bowl** in the middle, so it is not touching the sides and sits above the water level (prop it on a clean rock or ring).
3. Turn the pot's **lid upside down** so its handle points down toward the cup.
4. Put the lid on, and fill it with ice or cold water. Replace the cold water as it warms.
5. Heat the pot to a gentle boil. Steam rises, condenses on the cool lid, and drips off the handle into the cup.
6. **Never let the pot boil dry.** Steam burns badly, so use gloves or a cloth.

It is slow and uses fuel, so distill only when you have to. Distilled water tastes flat; add a pinch of salt or pour it between containers.

## Solar stills
A solar still uses the sun to evaporate water and collect the droplets on a plastic cover.

### Honest assessment
- A hole-in-the-ground still dug in desert often yields **less than a pint (0.5 L) per day**. Digging can make you sweat out more water than you gain.
- A **pan-type still** (a shallow dark tray of salty or dirty water under a sloped clear sheet of glass or plastic that drains to a gutter) may give roughly 1-2 quarts (1-2 L) per square meter on a sunny day.
- Stills are more useful for a camp or a home than in an emergency on the move.

### A basic pan-type still
1. Use a shallow dark container for the water, so it absorbs heat.
2. Place a clear sloped cover over it, sealed at the edges, with the low side feeding a collecting gutter.
3. Keep the cover clean and angled about 20-30 degrees so water runs to the low edge instead of dripping back.
4. Set it in full sun and collect the water regularly.

## Other options at sea or on the coast
- Rain and dew caught on clothing, sails, or tarps.
- **Old sea ice** (smooth, rounded and bluish) has lost most of its salt. New ice is salty.
- Treat any collected water before drinking.

[[finding-water]], [[boiling-water]], [[water-safety]], [[water-needs]].

    body: `
## Why shelter comes first
In cold, wet or windy weather, exposure can kill in **about 3 hours**, long before thirst or hunger. Shelter and warmth come before water and food.

## Do this first
1. **Get out of the wind, rain, snow or sun.** Any barrier helps: a wall, a tree trunk, a car, a rock overhang.
2. **Get off the ground.** The ground pulls heat out of your body faster than the air does. Put insulation under you: branches, leaves, packs, cardboard, clothing.
3. **Stay dry.** Wet clothing loses most of its warmth. Change out of wet clothes as soon as you can.
4. **Keep it small.** Your body heat warms the space. A shelter just big enough to lie in is warmer than a large one.

## How the body loses heat
| Way | What happens | What stops it |
|---|---|---|
| Conduction | Heat flows into cold ground or objects you touch | Insulate beneath you |
| Convection | Wind or moving air carries heat away | Windbreak, closed walls |
| Radiation | Heat radiates off your body, especially the head | Hat, covered shelter, fire with a reflector |
| Evaporation | Sweat, wet clothes and breathing remove heat | Stay dry, vent sweat before it soaks you |

## Choosing a site
- **Look up.** Avoid dead branches and loose rocks overhead.
- **Look down.** Avoid dry streambeds, gullies and low spots that can flood, and the bottoms of cliffs.
- **Avoid the coldest and windiest places**: valley floors where cold air settles at night and bare ridgetops. A spot partway up a slope is often best.
- **Be near resources** such as water and firewood, but not at the water's edge, where it is damp, buggy and cold.
- Avoid animal trails, ant nests and wasp or bee activity.
- Pick a spot that drains water away and where people can see you from the air or a trail.
- In desert heat, shade is the priority. See [[staying-cool]].

## Build in the right order
1. Choose the site and gather materials before you get tired.
2. Build the **floor insulation first**, then the roof and walls.
3. Make the entrance face away from the wind.
4. Make it just big enough. See [[emergency-shelters]] for step-by-step builds.

## Use what is already there
- **Buildings**: pick a small interior room, hang blankets over doors and windows, and check that the building is sound and free of gas leaks. Do not enter flooded or damaged structures.
- **Vehicles in cold**: stay with the vehicle; it blocks wind and is easier for rescuers to find. To run the engine for heat, do it about **10 minutes each hour**, **clear snow from the tailpipe**, and crack a window.

> DANGER: A blocked tailpipe fills a car with carbon monoxide. Check it every time you run the engine.

- **Vehicles in heat**: do not sit in a closed parked car in the sun. Use shade next to or under it.

## Next steps
[[fire-starting]] for warmth, [[clothing-layers]] to keep heat in, [[heating-home]] if you are indoors, [[snow-shelters]] in deep snow, and [[hypothermia-frostbite]] if someone is already cold and shivering.

## Before you build
- Have light and a half hour before dark if you can. Build **floor insulation first**.
- You need cordage ([[cordage-rope]]), a few knots ([[knots]]), and a sharp tool if you have one.
- Keep it small: just room for your body.

## Tarp A-frame (fastest, if you have a tarp)
1. Tie a **ridgeline** of strong cord between two trees at about chest height, pulled tight (a taut-line hitch lets you adjust it).
2. Drape the tarp over the line so both sides slope toward the ground at about 45 degrees.
3. Stake or weigh down the edges with rocks or logs. Close the windward end.
4. Lay a thick floor of leaves, branches or clothing under you.
5. Leave a small gap at the top of the open end for ventilation.

Pitch the narrow end into the wind. In heavy rain, use a steeper slope.

## Lean-to
1. Find a horizontal support: a low branch, a log between two trees, or two forked poles with a crossbar, about 3-4 feet (1 m) high.
2. Lean poles along the crossbar so they slope to the ground at about 45 degrees on the windward side.
3. Cover them with branches, bark, big leaves or a tarp. **Start at the bottom and overlap upward like shingles**, so rain runs off.
4. Add a foot of debris on the roof for insulation.
5. Build a fire in front with a **reflector wall** of logs or rocks behind it to bounce heat into the shelter. Keep the fire at least 4-6 feet from the shelter and watch for sparks, which melt synthetic tarps.

## Debris hut (best warmth with no equipment)
1. Find a straight **ridgepole** about 1 foot (30 cm) longer than your body. Prop one end 2-3 feet high on a stump or in the fork of a tree. Rest the other end on the ground.
2. Lean many branches against both sides of the ridgepole as ribs, close together, to make a tent shape just wide enough to lie down in.
3. Cover the ribs with a lattice of small twigs.
4. Pile on **2-3 feet (60-90 cm) of dry leaves, grass or pine needles**. This is your insulation. Pile more on the windward side.
5. Stuff the floor with at least a foot of dry leaves or boughs.
6. Block the door with a stuffed pack, a bundle of leaves, or a small log.
7. Test it by sitting inside. If daylight shows through, add more debris.

The inside should be so small that you must wiggle in feet first. A small space warms quickly from body heat.

> WARNING: Check debris for poison ivy, ant nests, hornets and rodent droppings before using it. Wear gloves if you can.

## Poncho or sheet shelter
Tie one corner high on a tree, stake the opposite corner low, and pull the other corners out to the sides to make a slanted roof. Add insulation to the floor.

## Desert and hot-weather shelters
- The aim is **shade**, not warmth. Build or stretch cloth at least 12 inches (30 cm) above a second layer so a gap of air cools the space.
- The ground is much hotter than the air. Sit or lie on a raised bed of brush or gear.
- Rest in the shade through midday and travel in cooler hours.
- Nights can be cold; keep your clothes.

## Safe habits in any shelter
- **Never burn a stove, charcoal or open fire inside a closed shelter.** It uses up the oxygen and makes carbon monoxide.
- Keep gear and boots off the ground and inside the shelter.
- Mark or flag your shelter so searchers can see it ([[signaling-rescue]]).

    body: `
## Why a snow shelter works
Snow is a good insulator. Inside a snow shelter the temperature often sits near freezing (32 °F / 0 °C) even when the air outside is far colder, and it blocks wind completely. It takes effort and can be dangerous if built badly, so use it when other shelter is not available.

## Safety rules first
> DANGER: **Ventilation saves lives.** Poke a hole at least the width of a fist through the roof, and keep the entrance partly open. Check the vent every hour; fresh snow and your breath can block it. Do not cook or burn charcoal inside.

- **Avoid avalanche terrain**: slopes steeper than about 25 degrees, and below steep slopes or cornices. Build on a flat or gentle area.
- **Stay dry while digging.** Remove layers before you start so you do not sweat, and put them back on when you stop.
- **Keep a digging tool inside** so you can dig out if the entrance fills with snow.
- **Mark the outside** with a pole, skis or a bright cloth so rescuers or others can find it and avoid walking on it.
- **Avoid tree wells.** The soft snow around the base of an evergreen can be deep enough to trap and suffocate someone who falls in. Stay away from the trunk.

## Snow cave
Needs a firm drift at least about 5-6 feet (1.5-2 m) deep.
1. Dig a small entrance at the base of the drift and tunnel inward.
2. At the end, dig **upward** and make a sleeping platform **higher than the entrance**. Cold air sinks and stays low; warm air rises to where you lie.
3. Dig the roof as a **smooth dome** so drips run down the sides instead of onto you.
4. Keep walls and roof about 1 foot (30 cm) thick, and not thinner. Light should look dim, not bright, from inside.
5. Poke the vent hole through the roof.
6. Insulate the sleeping platform with branches, pack, ropes or clothing.
7. Partly block the door with a pack or snow block, not completely.

## Quinzee (when snow is not deep enough to tunnel)
1. Pile snow into a mound about 6 feet (2 m) high and 8-10 feet wide. Pile loose snow on top of a tarp or sheet if you have one, so you can see what you have.
2. Let it **settle for 1.5-2 hours** so it hardens.
3. Push 12-inch (30 cm) sticks into the pile from the outside in every direction as wall-thickness guides.
4. Dig in from the side and hollow it out until you see the ends of the sticks. Walls should end up about 1 foot thick.
5. Make a sleeping platform higher than the door, and add a vent hole.

## Trench shelter
1. Dig a trench in deep snow about 3-4 feet (1 m) wide and long enough to lie in.
2. Cover it with skis, poles, branches or a tarp, and pile snow blocks or loose snow on top.
3. Leave a gap for ventilation and an entrance at one end.

## Staying warm inside
- Sleep on insulation, not directly on snow.
- Keep a candle or small flashlight for light. A single candle adds a little heat and light, but only with fresh air coming in.
- Melt snow for drinking outside the sleeping area. Never eat snow to hydrate; it chills you ([[finding-water]]).
- Watch each other for cold and drowsiness ([[hypothermia-frostbite]]).

[[shelter-priorities]], [[clothing-layers]], [[winter-storm]].

## Do this first
1. Pick a safe spot (below).
2. **Gather all your materials before you light anything**: tinder, kindling and fuel, plus more than you think you need.
3. Build the fire, then light the **tinder**, then slowly add larger pieces.

> WARNING: **Never light a fire inside a tent, vehicle or closed shelter.** Fire uses up the oxygen and makes deadly carbon monoxide. Never use gasoline or other fuel to start a fire; it can explode. Never leave a fire unattended.

## Choose a safe spot
- Clear a **10-foot (3 m) circle** to bare dirt, away from overhanging branches, dry grass and your shelter.
- On wet or snowy ground, build a platform of green logs or flat stones.
- Shield the spot from wind, but leave room for air.
- Keep water or dirt close. Check for fire bans in normal times.

## The three sizes of fuel
- **Tinder**: catches a spark or small flame. A double handful of dry grass, shredded birch or cedar bark, dry pine needles, cattail fluff, fatwood shavings, dryer lint, or cotton balls rubbed with petroleum jelly.
- **Kindling**: dry twigs from pencil-lead thickness up to thumb thickness. Gather two armfuls.
- **Fuel**: wrist- to arm-thick dead wood. Gather a big pile.

Good dry wood **snaps** when you bend it. Damp wood bends.

## Lighting a fire (any flame)
1. Make a loose nest of tinder.
2. Lean thin kindling over it like a teepee, leaving a gap on the windward side.
3. Light the tinder at the windward gap.
4. As flames rise, add small kindling, then bigger, always **leaving air space** so it can breathe. Do not smother it.
5. Add fuel only when the kindling is burning well.

## Methods
### Lighter or matches
Keep several, in a waterproof container. Matches work best when the box lid is a striking surface; split each stick for more flame.

### Ferro rod and striker
1. Hold the tinder bundle with the rod's tip against the base.
2. Put the striker on the rod at a 45 degree angle and **pull the rod back**, rather than push the striker forward, so the tinder does not move.
3. Scrape hard and fast. A shower of hot sparks lights good tinder.

### Flint and steel
Strike a sharp edge of flint (or chert or quartz) against high-carbon steel in a glancing downward blow so sparks fall on **char cloth** or very dry tinder. Blow gently when a spark glows.

### Magnifying lens or eyeglasses
On a sunny day, focus the sun to the smallest, brightest dot on dark, dry tinder. Hold steady until smoke and an ember appear, then blow softly.

### Battery and steel wool
Pull fine steel wool (grade 0000) into a loose wisp and touch it to both terminals of a 9-volt battery, or both ends of a stack of AA cells. It glows and burns. Drop it into tinder. **Do not use phone or other lithium batteries**, which can burst into flame.

### Bow drill (friction fire)
Needs patience and practice. Practice **before** an emergency.
1. **Parts**: a flat fireboard of soft, dry, non-resinous wood (cedar, willow, cottonwood, aspen, basswood); a straight spindle of the same wood, about thumb-thick and as long as your forearm; a bow with a cord; a hard socket (stone, hardwood or bone) to press on top.
2. Cut a shallow dimple near the edge of the fireboard, then cut a **V-notch** from the edge to the dimple's center. Put a piece of bark under the notch to catch the dust.
3. Loop the bow cord once around the spindle. Put the spindle point in the dimple and press down with the socket, with your foot on the fireboard.
4. Saw the bow back and forth with long, smooth strokes. First smoke, then black dust, will collect in the notch.
5. When dust smokes by itself, stop. Carefully tip the **ember** into a tinder nest, and blow gently until it flames.

A hand drill works the same way but you spin a long straight spindle between your palms. It is harder.

## Wet-weather tricks
- Look for **standing dead wood**, dead twigs on the underside of conifers, and the dry inside of split logs.
- Birch bark and pine pitch (fatwood) burn even when damp.
- Shave **feather sticks**: thin curls left attached to the stick, which catch easily.
- Build the fire on a platform and keep the wood under cover.
- Carry a firestarter: wax-soaked cotton, petroleum jelly cotton balls or a candle stub.

## Make char cloth
Put 100% cotton cloth squares in a closed metal tin with a nail-sized hole in the lid. Heat it in a fire until smoke from the hole stops. Let it cool before opening. It lights from the smallest spark.

## Once it is lit
See [[fire-management]] for fire layouts, fuel, keeping embers and putting a fire out. If you are cold or wet, also read [[hypothermia-frostbite]]. For signaling, see [[signaling-rescue]].
`

| Teepee | Fast heat and light, boiling water | Lean sticks together in a cone over tinder |
| Log cabin | Cooking, steady coals | Stack sticks crisscross like a small square cabin |
| Lean-to | Wind or rain | Lean kindling against a log or green stick, tinder underneath |
| Star | Saving fuel, burning all night | Lay logs like spokes of a wheel, pushing ends in as they burn |
| Dakota fire hole | Wind, low smoke, efficient cooking | See below |
| Reflector | Warming a shelter | Stack logs or rocks behind the fire to bounce heat toward you |

### Dakota fire hole
1. Dig a hole about 1 foot (30 cm) wide and 1 foot deep for the fire.
2. About 1 foot away on the windward side, dig a second small hole, and connect them with a slanting tunnel so air feeds the fire.
3. Build the fire in the main hole. It burns hot with little smoke, uses little wood, and hides light from view.

Do not dig in peat or heavy roots, where fire can spread underground.

## Choosing fuel
- **Hardwoods** (oak, hickory, maple, ash, beech): burn hot and long, make coals. Best for heat and cooking.
- **Softwoods** (pine, spruce, fir, cedar): light easily and burn fast. Good kindling; they can spark and pop.
- **Seasoned (dry) wood** burns clean. Green wood smokes and burns poorly.
- Prefer **dead standing wood**. Avoid rotten, punky wood that is wet and crumbles.

> DANGER: **Never burn** pressure-treated or painted wood, plywood or particle board, plastic, or poison ivy, oak or sumac. They release poisons. Also avoid oleander and other toxic plants.

## Keep a fire going
- Add fuel when flames drop to coals, before the fire dies.
- Keep pieces touching so they hold heat, with air gaps between them.
- **Bank the coals at night**: push coals together and cover with a layer of ash or a big log. In the morning stir and add kindling.

## Carry fire
Pack a glowing coal into a bundle of dry bark or tinder inside a tin can or a container with air holes. Blow on it gently at your next stop.

## Safety rules
- Keep a bucket of water, a shovel or dirt handy.
- Keep fire at least 10 feet (3 m) from tents, tarps and low branches.
- Do not build fires on dry grass, in strong wind, or under a fire ban.
- **Do not heat river rocks or wet stones**; trapped water can turn to steam and blow them apart.
- Keep children and pets back from the fire.
- Use coals, not flames, for cooking ([[dutch-oven-campfire]]).
- Smoke irritates the lungs; sit upwind and burn dry fuel.

> WARNING: Fire in a closed shelter makes carbon monoxide. See [[heating-home]] for indoor heating safety.

## Putting a fire out: drown, stir, feel
1. Let the wood burn down to ash.
2. **Pour water** over the fire until the hissing stops.
3. **Stir** the ashes and coals with a stick to uncover hidden embers, and pour more water.
4. **Feel** with the back of your hand. The ashes should be cold. If not, repeat.

If you have no water, use dirt, stirring it in with the ashes.

## Related

- Use only if the stove or fireplace and chimney are in **good condition**. Chimneys should be cleaned and inspected every year; soot (creosote) causes chimney fires.

## Seal windows and doors
- **Plastic window film** stretched over the inside of the window frame, or clear plastic sheeting taped around it, creates an insulating air gap.
- **Bubble wrap**: wet the glass slightly and press bubble side against it. It stays in place.

## Walls, floors and ceilings
- Rugs, carpet and cardboard on bare floors give a layer under your feet.
- Hang a blanket "ceiling" in the warm room or use the tent-in-a-room trick ([[heating-home]]).
- Heat rises, so the upstairs is warmer than the basement, but the lower floor may suit a wood stove. Choose based on your heat source.

## Protect water pipes
Pipes freeze when the house falls below freezing, mostly those in outside walls, attics, crawl spaces and garages.
- **Open cabinet doors** under sinks so warm air reaches the pipes.
- Let faucets **drip** (a thin steady trickle) on the coldest nights.
- Wrap exposed pipes in insulation, towels or newspaper.
- **For a long freeze, drain the system:** shut off the main water valve, open all faucets starting with the highest, flush toilets, and drain the water heater (turn off its power or gas first). Pour non-toxic RV antifreeze into toilet bowls and sink traps.
- Store water in a place where it will not freeze, or leave some air space in containers.

> WARNING: Never thaw a frozen pipe with an open flame or torch. It can start a fire. Open the faucet, then warm the pipe slowly with warm towels or a hair dryer when power is available. If a pipe bursts, **shut off the main valve immediately.**

- Heavy wet snow is far heavier than fresh powder. Have a roof rake and pull snow off from the ground.
- **Do not climb a snowy roof.**
- Warning signs of overload: creaking or cracking sounds, sagging ceilings, doors and windows that suddenly jam or will not open. If you see them, get out of the building.

## Keep vents and exits clear
After a heavy snowfall, **dig out furnace, dryer, stove and water-heater exhaust vents**, and exits. A buried vent can fill the house with carbon monoxide.

## People and pets
Everyone should stay in the warm room, with pets. Check older adults and infants often. If the house is too cold to stay in, go to a shelter or a warm friend or relative's home.
